- id: q08033
  sec: s085
  set: 節末
  lv: 2
  kind: 英作
  min: 3
  inst: 日本語の意味になるように、with を使って英文を書きなさい。
  q: 私は窓を開けたまま寝てしまった。
  ans: I fell asleep with the window open.
  alt: [I fell asleep with the window opened., I slept with the window open., I went to sleep with the window open.]
  why: 「〜したまま」は付帯状況の with O C。窓が開いている状態は形容詞 open（または「開けられた」の過去分詞 opened）で表す。with の直後に O、その後ろに C の順になっているかが採点の要点。
  trap: with the window opening とする誤り。窓は自分で何かを開ける側ではない。
