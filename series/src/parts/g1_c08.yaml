  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: ジョーはシャツのそでをまくり上げて皿を洗っていた。<br>Joe was washing the dishes ( his / rolled / sleeves / up / with ).
  words: [his, rolled, sleeves, up, with]
  ans: Joe was washing the dishes with his sleeves rolled up.
  why: 付帯状況の with O C。そでは「まくり上げられている側」なので、C は過去分詞 rolled up。
