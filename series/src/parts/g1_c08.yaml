- id: q08041
  sec: s085
  set: 確認テスト
  lv: 1
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: その犬はしっぽを振りながら私のところへ走ってきた。<br>The dog ran to me ( its / tail / wagging / with ).
