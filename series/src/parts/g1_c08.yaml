  ans: "3"
  why: Because they were very tired の分詞構文。主語 they は主節の the players と同じなので消し、were を being にする。
  trap: ②Been を選ぶ誤り。been は過去分詞で、受動や完了の形に使う。be 動詞の分詞構文は Being。
