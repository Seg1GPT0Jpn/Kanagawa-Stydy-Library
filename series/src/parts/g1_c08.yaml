  ans: "3"
  why: 脚は「組まれている側」なので過去分詞にして with his legs crossed とする。
  trap: 日本語の「脚を組んで」に引かれて crossing を正しいと思う誤り。④reading は was sitting と and で並ぶ進行形の -ing 形で正しい。
