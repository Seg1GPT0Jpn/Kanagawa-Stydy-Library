  ans: "2"
  why: leave O C で「O を C のまま放っておく」。the door is open が成り立つので空所は C で、形容詞の open を置く。
  trap: ③opening を選ぶ誤り。ドアが開いた状態を表すのは形容詞の open で、-ing 形の opening ではこの意味にならない。
- id: q01039
  sec: s011
  set: 確認テスト
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部①〜④のうち、誤りをふくむものを1つ選びなさい。
  q: My grandmother is __still__① __healthily__② and __walks__③ for an hour __every day__④.
  ans: "2"
  why: is の後ろは「祖母がどんな状態か」を表す C。C には形容詞を置くので、healthily ではなく healthy にする。①still（今でも）は副詞、③walks は習慣を表す現在形、④every day は時を表す M で、どれも正しい。
  trap: still の後ろだから副詞と考えて healthily を正しいと思う誤り。still を外すと、is の後ろの C の位置である。
- id: q01040
  sec: s013
  set: 確認テスト
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: 父は私に新しい自転車を買ってくれた。<br>My father ( a / bike / bought / for / me / new ).
  words: [a, bike, bought, for, me, new]
  ans: My father bought a new bike for me.
  why: 与えられた語に for があるので、SVOO ではなく SVO＋for＋人 の形にする。buy は for をとる動詞。
  trap: My father bought me a new bike と並べて for を余らせる誤り。SVOO の形は正しい英語だが、与えられた語を全部使う形にならない。
- id: q01041
  sec: s012
  set: 確認テスト
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部①〜④のうち、誤りをふくむものを1つ選びなさい。
  q: The train __reached at__① Kyoto Station __about__② ten minutes __late__③ __because of__④ the heavy snow.
  ans: "1"
  why: reach は他動詞なので、後ろに O の Kyoto Station を直接置く。①reached at を reached Kyoto Station（または arrived at Kyoto Station）とする。③late は「遅れて」の意味の副詞、④because of は「〜のために」で、どちらも正しい。
  trap: arrive at と混ぜて reach at を正しいと思う誤り。同じ「〜に着く」でも、reach は前置詞をとらない。
- id: q01042
  sec: s014
  set: 確認テスト
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: その歌のおかげで、その歌手は日本中で有名になった。<br>The song ( famous / made / singer / the ) all over Japan.
  words: [famous, made, singer, the]
  ans: The song made the singer famous all over Japan.
  why: 「歌手＝有名」の関係を make O C（O を C にする）で表す。made の後ろに O の the singer、C の famous を置く。
  trap: The song made famous the singer と C を O の前に置く誤り。SVOC は O、C の順に並べる。
- id: q01043
  sec: s015
  set: 確認テスト
  lv: 2
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: (＿) did you talk with after the meeting?
  choices: [Why, When, Who, How]
  ans: "3"
  why: 疑問詞を外すと you talk with ＿ after the meeting で、with の後ろの名詞が欠けた不完全な文。欠けた名詞の代わりになるのは Who。
  trap: after the meeting につられて時の②When を選ぶ誤り。When・Why・How は M にしかならず、with の後ろの名詞を埋められない。
