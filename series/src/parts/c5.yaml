chapters:
- id: c5
  title: 複合関係詞
  lead: who・what・which・when・where・how に -ever が付いた語は、先行詞を自分の中にふくみ、「〜する人は誰でも」のような名詞節と、「誰が〜しても」という譲歩の節の両方をつくります。この章では、同じ whoever や whatever がどちらの働きをしているかを、節を外して文が残るかどうかで見分けます。however の後の語順と no matter＋疑問詞への言い換えは、GMARCH の4択と整序でくり返し問われる点です。
  sections:
  - id: s15
    title: whoever・whatever・whichever
    patterns: [P12]
    body:
    - h: 先行詞をふくむ whoever・whatever・whichever
    - p: what が「もの・こと」という先行詞をふくんでいたように（@s10）、who・what・which に -ever を付けた語も先行詞をふくみます。whoever は anyone who（〜する人は誰でも）、whatever は anything that（〜するものは何でも）と同じ意味です。@e501 では Whoever から Saturday までが文の主語です。こうした -ever の付いた関係詞を<<複合関係詞>>といいます。
      notes:
      - kind: 用語
        term: 複合関係詞
        yomi: ふくごうかんけいし
        text: "who, what, which, when, where, how に -ever が付いた語。先行詞をふくみ、名詞節（〜する人は誰でも）や譲歩の副詞節（誰が〜しても）をつくる。"
    - ex: [e501, e502]
    - p: 先行詞をふくんでいるので、前に名詞を置くことはありません（× anyone whoever wants them）。欠けている語を探す手順は s01 と同じで、@e502 の whoever wants them では wants の主語が欠けています。whichever は「いくつかある中のどれでも」の意味で、選ぶ範囲が決まっているときに使います（Take whichever you like.）。
    - h: whoever か whomever か
    - p: whoever と whomever のどちらを使うかは、直前の語ではなく、節の中での働きで決まります。@e502 では直前に前置詞 to があるので、目的格の whomever を選びたくなるはずです。しかし節の中で whoever は wants の主語です。to の目的語になっているのは whoever wants them という節全体なので、主格の whoever を使います。
    - p: 一方、@e503 の whomever you like では、like の目的語が欠けています。節の中で目的語の働きをしているので whomever になります。s01 の「節の中で何が欠けているか」という問いをそのまま当てはめれば、前置詞があってもなくても迷いません。
      notes:
      - kind: 注意
        text: "whomever はかたい書き言葉。話し言葉では目的語の位置でも whoever を使うことが多い（You can bring whoever you like.）。4択で両方が並んだら節の中の働きで選ぶ。主語の位置に whomever を置くのは、書き言葉でも誤り。"
    - ex: [e503]
    - h: 名詞節か、譲歩の副詞節か
    - p: 複合関係詞の節には、もう1つの使い方があります。@e505 の Whoever comes to the door は、文の主語にも目的語にもなっていません。この節を外しても、don't open it until I get home at five という命令文が残ります。外せる節は副詞の働きをしていて、「誰が来ても」と、どんな場合でも主節が変わらないことを表します。この言い方を<<譲歩>>といいます。
      notes:
      - kind: 用語
        term: 譲歩
        yomi: じょうほ
        text: "「たとえ〜でも」「誰が〜しても」のように、ある場合を認めたうえで、それでも主節の内容は変わらないと述べる言い方。"
      - kind: 注意
        text: "未来のことでも、譲歩の副詞節の中は現在形にする（@e505 の comes）。Whoever will come とはしない。"
    - ex: [e504, e505, e506]
    - p: 見分けるには、節を外してみます。@e504 から Whatever you decide を外すと is fine with me しか残らず、主語がありません。だからこの節は名詞節で、「あなたが決めることなら何でも」と訳します。@e506 は外しても Rina won't change her plan for the summer が残るので副詞節です。訳は「ジャックが何と言っても」となります。
    - p: 譲歩の副詞節は no matter who／what／which で言い換えられます（@e505 → No matter who comes to the door）。名詞節は言い換えられません。× No matter what you decide is fine with me. が誤りなのは、no matter what の節は文の主語になれないからです。
    - table:
        head: ["", 名詞節（外すと文が欠ける）, 譲歩の副詞節（外しても文が残る）]
        rows:
        - [whoever, "{{〜する人は誰でも}}（＝anyone who）", "{{誰が〜しても}}（＝no matter who）"]
        - [whatever, "{{〜するものは何でも}}（＝anything that）", "{{何が・何を〜しても}}（＝no matter what）"]
        - [whichever, "{{〜するものはどれでも}}（＝any one that）", "{{どれが・どれを〜しても}}（＝no matter which）"]
    - h: whatever・whichever＋名詞
    - p: whatever と whichever は、直後に名詞を置いて形容詞のように使うこともできます。これを<<複合関係形容詞>>といいます。@e507 の whatever books you need は「必要な本なら何でも」で、lend の目的語になる名詞節です。@e508 の Whichever から stop までは外しても文が残るので、譲歩の副詞節です。whichever＋名詞は、選ぶ範囲が限られているときに使います。
      notes:
      - kind: 用語
        term: 複合関係形容詞
        yomi: ふくごうかんけいけいようし
        text: "直後の名詞と結びついて節をつくる whatever・whichever。whatever＋名詞＝どんな〜でも、whichever＋名詞＝（限られた中の）どの〜でも。"
    - ex: [e507, e508]
    - check:
      - {q: "[＿] arrives last has to lock the door.", a: Whoever（arrives の主語）}
      - {q: "I'll give this ticket to [＿] wants it.", a: whoever（wants の主語なので whomever は不可）}
      - {q: "[＿] happens tomorrow, I'll call you at nine.", a: Whatever（＝No matter what）}
    examples:
    - id: e501
      en: "[*Whoever* ＿ wants to join the trip on Saturday] must sign up by Thursday."
      ja: 土曜日の遠足に参加したい人は誰でも、木曜日までに申し込まなければならない。
      gloss: [[sign up, 申し込む]]
    - id: e502
      en: "You can give these old comics to [*whoever* ＿ wants them]."
      ja: この古いマンガは、欲しい人なら誰にあげてもよい。
    - id: e503
      en: "You may bring [*whomever* you like ＿] to the school festival in October."
      ja: 10月の学園祭には、好きな人を誰でも連れてきてよい。
    - id: e504
      en: "[*Whatever* you decide ＿] is fine with me."
      ja: あなたが決めることなら何でも、私はかまわない。
    - id: e505
      en: "[*Whoever* ＿ comes to the door], don't open it until I get home at five."
      ja: 誰が玄関に来ても、私が5時に帰るまでドアを開けてはいけない。
    - id: e506
      en: "[*Whatever* Jack says ＿], Rina won't change her plan for the summer."
      ja: ジャックが何と言っても、リナは夏の計画を変えないだろう。
    - id: e507
      en: "Chloe will lend you [*whatever* books you need ＿] for your history report."
      ja: クロエは、あなたの歴史のレポートに必要な本なら何でも貸してくれるだろう。
    - id: e508
      en: "[*Whichever* bus you take ＿ from this stop], you'll reach the stadium before noon."
      ja: このバス停からどのバスに乗っても、正午前にはスタジアムに着く。
    summary:
    - "whoever＝{{anyone who}}、whatever＝{{anything that}}。先行詞を{{ふくむ}}ので、前に名詞を置かない。"
    - "whoever と whomever は{{節の中の働き}}で選ぶ。主語なら {{whoever}}（Give it to whoever wants it.）。"
    - "節を外して文が残れば{{譲歩の副詞節}}で、{{no matter who／what／which}} に言い換えられる。名詞節は no matter で言い換え{{られない}}。"
    - "whatever／whichever の直後に名詞を置く形を{{複合関係形容詞}}という。whichever は選ぶ範囲が{{限られている}}ときに使う。"
  - id: s16
    title: however・whenever・wherever と譲歩
    patterns: [P12]
    body:
    - h: however＋形容詞・副詞＋S＋V
    - p: however を複合関係詞として使うと、「どんなに〜でも」という譲歩の意味になります。このとき however は形容詞や副詞を1語引き連れて、節の先頭に出ます。@e509 は Yuto is tired という文の tired が however の直後に移った形です。残りの Yuto is は、主語・動詞の普通の語順のままです。
    - steps:
      - 元の文を考える。Yuto is tired.／I tried hard.
      - 程度を表す形容詞・副詞（tired, hard）を however の直後に出す。However tired／However hard
      - 残りを主語＋動詞の語順で続ける。However tired Yuto is／However hard I tried
    - ex: [e509, e510]
    - p: 入試でねらわれるのは語順です。@e509 を × However Yuto is tired とすると、tired が however から離れるので誤りになります。疑問文のような倒置もしません（× However tired is Yuto）。量を言うときは however much／many＋名詞の形にし、数えられない名詞には much を使います（However much homework I have, …）。
      notes:
      - kind: 注意
        text: "however の直後に形容詞・副詞を置かない形もある。However you travel to the airport, leave home by eight.（どんな方法で行くにしても、8時までに家を出なさい）。この however は「どんな方法で」の意味。"
    - h: 「しかし」の however との違い
    - p: 文頭の However の直後にコンマがあり、すぐ主語が続くときは、「しかし」という意味の副詞です。@e511 の However, は前の文と逆の内容をつないでいるだけで、節をつくっていません。複合関係詞の however は直後に形容詞・副詞があり、コンマは節が終わったところに来ます（@e509）。コンマの位置と however の直後の語を見れば、区別がつきます。
    - ex: [e511]
    - h: whenever と wherever の2つの意味
    - p: whenever と wherever の後ろには、主語と動詞のそろった完全な文が続きます。関係副詞の when・where と同じで、節の中に欠けた語はありません（@s07）。意味の1つ目は「〜するときはいつでも」「〜するところならどこでも」です。@e512 は every time と同じく「京都に行くたびに」、@e513 は「空いているところならどこにでも」の意味になります。
    - ex: [e512, e513]
    - p: 2つ目は譲歩で、「いつ〜しても」「どこで〜しても」となります。@e514 は「日本のどこにいても」、@e515 は「今夜何時に着いても」の意味で、no matter where／no matter when に言い換えられます。2つの意味は形では区別できないので、主節との関係から決めます。「そのたびに〜する」と言っていれば1つ目、「どんな場合でも結果は変わらない」と言っていれば譲歩です。
    - ex: [e514, e515]
    - h: no matter＋疑問詞と、譲歩の節の may
    - p: 譲歩の意味の複合関係詞は、no matter＋疑問詞で言い換えられます。however は no matter how になり、語順も同じく no matter how＋形容詞・副詞＋S＋V です（@e510 → No matter how hard I tried）。整序問題では no matter how が2語分になるので、並べる語が1つ増えます。この言い換えは副詞節だけのもので、名詞節には使えません（@s15）。
    - table:
        head: [複合関係詞, 譲歩の意味での言い換え]
        rows:
        - [whoever, "{{no matter who}}"]
        - [whatever, "{{no matter what}}"]
        - [whichever, "{{no matter which}}"]
        - [however, "{{no matter how}}（＋形容詞・副詞＋S＋V）"]
        - [whenever, "{{no matter when}}"]
        - [wherever, "{{no matter where}}"]
    - p: 譲歩の節に may を入れることがあります。@e516 の However busy he may be は「どんなに忙しくても」で、この may は「かもしれない」と訳しません。かたい書き言葉の言い方で、ふだんの英語では However busy he is のように現在形を使うほうが普通です。入試には両方の形が出るので、may があっても意味は同じだと分かれば足ります。
      notes:
      - kind: 注意
        text: "no matter how busy he may be のように、no matter＋疑問詞の節でも may を使うことがある。意味は may のない形と同じ。"
    - ex: [e516]
    - check:
      - {q: "[＿] tired you are, brush your teeth before bed.", a: However（＝No matter how）}
      - {q: "[＿] I hear this song, I remember our trip to Okinawa.", a: Whenever（＝Every time）}
      - {q: "Sit [＿] you like. There are plenty of seats.", a: wherever}
    examples:
    - id: e509
      en: "[*However* tired Yuto is ＿], he walks his dog every morning at six."
      ja: どんなに疲れていても、ユウトは毎朝6時に犬を散歩させる。
    - id: e510
      en: "[*However* hard I tried ＿], I couldn't open the jar of jam."
      ja: どんなに頑張っても、私はジャムのびんのふたを開けられなかった。
      gloss: [[jar, （ガラスの）びん]]
    - id: e511
      en: "The café on the third floor was crowded. However, we found two seats by the window."
      ja: 3階のカフェは混んでいた。しかし、私たちは窓際に席を2つ見つけた。
      gloss: [[crowded, 混んでいる]]
    - id: e512
      en: "[*Whenever* Olivia visits Kyoto with her parents], she buys green tea at the same small shop near the station and sends some to her friends in London."
      ja: オリビアは両親と京都に行くたびに、駅の近くの同じ小さな店で緑茶を買い、ロンドンの友人に送る。
    - id: e513
      en: "You can put your bag [*wherever* there is space]."
      ja: かばんは、空いているところならどこに置いてもよい。
    - id: e514
      en: "[*Wherever* you are in Japan], you can watch the final on TV at seven tonight."
      ja: 日本のどこにいても、今夜7時にテレビで決勝戦を見ることができる。
      gloss: [[final, 決勝戦]]
    - id: e515
      en: "[*Whenever* you arrive tonight], I'll still be awake, so just ring the bell."
      ja: 今夜何時に着いても私はまだ起きているから、呼び鈴を鳴らしてくれればいい。
    - id: e516
      en: "[*However* busy he may be ＿], my father reads to my little sister before bed."
      ja: どんなに忙しくても、父は寝る前に妹に本を読んでやる。
    summary:
    - "however は {{however＋形容詞・副詞＋S＋V}} の語順にする。× However Yuto is tired"
    - "文頭の However の直後に{{コンマ}}があれば「しかし」の副詞で、節をつくらない。"
    - "whenever／wherever の後ろは{{完全な文}}。意味は「〜するときはいつでも」と、譲歩の「{{いつ〜しても}}」の2つ。"
    - "譲歩の複合関係詞は {{no matter＋疑問詞}} で言い換えられる（however → {{no matter how}}）。"
    - "譲歩の節の may は{{かたい}}言い方で、「かもしれない」と訳さ{{ない}}。"

problems:
# ---- s15 節末 ----
- id: q5001
  sec: s15
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: (＿) wants to use the music room after school must ask Mr. Mori first.
  choices: [Whoever, Whatever, Whomever, Anyone]
  ans: "1"
  why: 空所から school までが must ask の主語になる名詞節で、節の中では wants の主語が欠けている。人を表し主語の働きをするのは Whoever（＝Anyone who）。
  trap: ④Anyone を選ぶ誤り。Anyone は先行詞をふくまないので、Anyone who wants … と who が要る。
- id: q5002
  sec: s15
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  q: Here are four T-shirts from the trip. You can take (＿) you like.
  choices: [whichever, however, whoever, wherever]
  ans: "1"
  why: 4枚のTシャツという限られた中から「好きなものをどれでも」と言っている。take の目的語になり、節の中で like の目的語が欠けているので whichever。
  trap: ②however を選ぶ誤り。however you like は「好きなやり方で」という副詞の節で、take の目的語にならない。
- id: q5003
  sec: s15
  set: 節末
  lv: 2
  kind: 4択
  min: 1
  q: I'll give this extra concert ticket to (＿) asks me first.
  choices: [whomever, whoever, who, whatever]
  ans: "2"
  why: 節の中で asks の主語が欠けているので主格の whoever。to の目的語は whoever asks me first という節全体である。
  trap: 直前の前置詞 to を見て①whomever を選ぶ誤り。whoever／whomever は直前の語ではなく、節の中の働きで決まる。
- id: q5004
  sec: s15
  set: 節末
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部のうち、誤りをふくむものを1つ選びなさい。
  q: __No matter what__① you decide __is__② fine with me, so __choose__③ the restaurant __for__④ tonight.
  ans: "1"
  why: 下線部から decide までが is の主語になる名詞節。名詞節は no matter what で言い換えられないので、Whatever にする。
  trap: 「何を決めても」と訳せるので①を正しいと思う誤り。主節の主語がないことに気づけば、譲歩の副詞節ではないと分かる。
- id: q5005
  sec: s15
  set: 節末
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: バーベキューには、好きな人を誰でも招待してよい。<br>You can ( invite / like / to / whomever / you ) the barbecue.
  words: [invite, like, to, whomever, you]
  ans: You can invite whomever you like to the barbecue.
  why: invite の目的語に whomever you like（好きな人は誰でも）を置き、to the barbecue を後ろに続ける。節の中で like の目的語が欠けているので whomever を使う。
  trap: invite to whomever you like と to を前に出す誤り。to は the barbecue と結びつく語で、whomever の前には来ない。
- id: q5006
  sec: s15
  set: 節末
  lv: 3
  kind: 和訳
  min: 3
  inst: 下線部①②を和訳しなさい。
  q: __Whatever Rina says about the weather__① is usually right, but __whatever she says__②, her little brother never takes an umbrella.
  ans: ① リナが天気について言うことは（何でも）　② 彼女が何と言っても
  alt: [② 彼女がどんなことを言おうと, ② たとえ彼女が何を言っても]
  why: ①は is の主語になる名詞節で「〜することは何でも」。②は外しても her little brother never takes an umbrella が残る譲歩の副詞節で「何と言っても」。①を「何と言っても」、②を「言うことは」と訳したら、それぞれ誤り。
  trap: 同じ whatever なので①②を同じ訳にする誤り。節を外して文が残るかどうかを確かめないと、名詞節と副詞節を取り違える。
# ---- s16 節末 ----
- id: q5007
  sec: s16
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: (＿) I visit my aunt in Sendai, she takes me to a sushi shop near the station.
  choices: [Whenever, Whatever, Whoever, Which]
  ans: "1"
  why: I visit my aunt in Sendai は主語・動詞・目的語のそろった完全な文。欠けた語がないので、関係代名詞ではなく whenever（〜するときはいつでも）が入る。
  trap: ②Whatever を選ぶ誤り。whatever は節の中で主語や目的語の代わりをするので、visit の目的語 my aunt がすでにある文には入らない。
- id: q5008
  sec: s16
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  q: (＿) hard Chloe practiced, she couldn't beat her older brother at table tennis.
  choices: [However, Whatever, Whenever, No matter]
  ans: "1"
  why: 空所の直後に副詞 hard があり、その後に Chloe practiced が続く。however＋副詞＋S＋V で「どんなに〜しても」。
  trap: ④No matter を選ぶ誤り。言い換えるなら No matter how hard と how が要る。
- id: q5009
  sec: s16
  set: 節末
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部のうち、誤りをふくむものを1つ選びなさい。
  q: __However__① __Olivia is busy__②, she __always__③ calls her grandmother __on__④ Sundays.
  ans: "2"
  why: 「どんなに忙しくても」は however の直後に形容詞を置き、However busy Olivia is とする。busy が however から離れているので誤り。
  trap: 日本語の「どんなに／彼女が忙しくても」の順に引かれて、however の後に S＋V をそのまま置く誤り。
- id: q5010
  sec: s16
  set: 節末
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: どんなに速く走っても、9時の電車には間に合わないだろう。<br>( fast / however / run / you ), you won't catch the nine o'clock train.
  words: [fast, however, run, you]
  ans: However fast you run, you won't catch the nine o'clock train.
  why: 副詞 fast を however の直後に置き、その後を you run の普通の語順にする。
  trap: However you run fast と、副詞を動詞の後ろに残す誤り。however は程度を表す語を引き連れて節の先頭に出る。
- id: q5011
  sec: s16
  set: 節末
  lv: 2
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: No matter (＿) you stand in this park, you can see Mt. Fuji on a clear day.
  choices: [where, wherever, which, what]
  ans: "1"
  why: you stand in this park は欠けた語のない完全な文なので、場所を表す where が入る。No matter where＝Wherever（どこに立っても）。
  trap: ②wherever を選ぶ誤り。no matter の後には疑問詞を置き、-ever の語は置かない。
- id: q5012
  sec: s16
  set: 節末
  lv: 3
  kind: 英作
  min: 3
  inst: however を使って、日本語を英語に直しなさい。
  q: どんなにたくさん宿題があっても、ジャックは毎晩10時に寝る。
  ans: However much homework Jack has, he goes to bed at ten every night.
  alt: ["Jack goes to bed at ten every night, however much homework he has.", "However much homework Jack has, he goes to bed at ten o'clock every night."]
  why: homework は数えられない名詞なので however much＋名詞＋S＋V にする。however much homework を節の先頭にまとめ、主節は現在形で習慣を表す。
  trap: However many homeworks や However Jack has much homework とする誤り。homework は複数形にならず、much homework は however の直後にまとめて置く。
# ---- 章末 ----
- id: q5013
  sec: s15
  set: 章末
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部のうち、誤りをふくむものを1つ選びなさい。
  q: You can __give__① this map to __whomever__② __needs__③ it __on__④ the hike tomorrow.
  ans: "2"
  why: 節の中で needs の主語が欠けているので、主格の whoever にする。to の目的語は whoever needs it という節全体である。
  trap: 前置詞 to の直後なので目的格が正しいと考える誤り。複合関係詞の格は、節の中での働きで決まる。
- id: q5014
  sec: s16
  set: 章末
  lv: 2
  kind: 正誤
  min: 1
  q: __Wherever__① you __will go__② in Hokkaido next month, __take__③ a warm jacket __with__④ you.
  ans: "2"
  why: 来月のことでも、譲歩の副詞節の中は現在形にする。Wherever you go in Hokkaido next month とする。
  trap: next month があるので will を正しいと思う誤り。時・条件の副詞節と同じく、譲歩の副詞節でも未来のことを現在形で表す。
- id: q5015
  sec: s15
  set: 章末
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: どちらの道を選んでも、駅までは15分ほどかかる。<br>( choose / road / whichever / you ), it takes about fifteen minutes to get to the station.
  words: [choose, road, whichever, you]
  ans: Whichever road you choose, it takes about fifteen minutes to get to the station.
  why: whichever＋名詞（複合関係形容詞）の whichever road を節の先頭に置き、you choose を続ける。節の中で choose の目的語が欠けている。
  trap: Whichever you choose road と、名詞を後ろに回す誤り。whichever＋名詞は1つのまとまりとして節の先頭に出る。
- id: q5016
  sec: s16
  set: 章末
  lv: 3
  kind: 整序
  min: 2
  q: どんなに簡単に見えても、その問題は解くのに時間がかかるだろう。<br>( easy / however / look / may / question / the ), it will take you some time to solve.
  words: [easy, however, look, may, question, the]
  ans: However easy the question may look, it will take you some time to solve.
  why: 形容詞 easy を however の直後に置き、the question may look と主語＋助動詞＋動詞の語順で続ける。この may は譲歩の節に入るもので「かもしれない」の意味ではない。
  trap: However the question may look easy と easy を後ろに残す誤り。look easy の easy も however の直後に出る。
- id: q5017
  sec: s15
  set: 章末
  lv: 2
  kind: 読解
  min: 4
  inst: 次の英文を読み、問いの答えとして最も適切なものを1つ選びなさい。
  q: "Our school library has a new rule this term. Whoever borrows a book must return it within two weeks. If you return a book late, you cannot borrow anything for one week, however good your reason is. Mr. Mori, the librarian, says the rule is fair. 'Take whatever books you like, and read them wherever you want,' he says. 'Just bring them back on time.' Last month, Olivia returned three books one day late, so she could not borrow the new mystery novel she wanted. Now she writes the return date in her notebook.<br>問い：本文の内容に合うものはどれか。"
  choices:
  - Students can keep a book for a month if they have a good reason.
  - A student who returns a book late cannot borrow books for one week.
  - Mr. Mori says students must read library books in the library.
  - Olivia borrowed the mystery novel because she returned her books early.
  ans: "2"
  why: 2文目と3文目に、返却が遅れると1週間何も借りられないとある。however good your reason is は「理由がどんなによくても」で、①の内容を打ち消している。
  trap: however good your reason is を「理由がよければ」と条件の意味に読んで①を選ぶ誤り。however は「どんなに〜でも」の譲歩を表す。
- id: q5018
  sec: s16
  set: 章末
  lv: 2
  kind: 読解
  min: 4
  q: "My grandmother lives alone in a small town by the sea. Whenever I visit her, we cook fish together in her kitchen. She does not use a smartphone, so I write her a letter every month. 'Whatever you write about is interesting to me,' she always says. Last winter, I could not visit her because of heavy snow. However hard it snowed, the post office kept working, and my letters arrived on time.<br>問い：本文の内容に合うものはどれか。"
  choices:
  - The writer and the grandmother cook fish together on every visit.
  - The grandmother sends the writer an email every month.
  - The grandmother only wants letters about the sea.
  - The heavy snow stopped the writer's letters last winter.
  ans: "1"
  why: Whenever I visit her, we cook fish together は「訪ねるたびに魚を料理する」で①と合う。④は However hard it snowed（どんなに雪が降っても）手紙は届いたので誤り。
  trap: Whatever you write about を「海について書いたこと」と結びつけて③を選ぶ誤り。whatever は「何について書いても」で、話題を限っていない。
- id: q5019
  sec: s15
  set: 章末
  lv: 2
  kind: 読解
  min: 4
  q: "Yuto's soccer club practices on the school field every Tuesday and Friday. The coach has one rule: whoever arrives late must run three laps of the field before joining practice. However, the coach always listens first. Last Friday, Yuto was twenty minutes late because his train stopped between two stations. He gave the coach a note from the station staff, so he did not have to run. 'Whatever the reason is, tell me,' the coach says. 'Then I'll decide.'<br>問い：先週の金曜日、ユウトがグラウンドを走らなくてよかったのはなぜか。"
  choices:
  - He arrived at practice before it started.
  - He gave the coach a note that explained the train problem.
  - The coach's rule is only for Tuesday practice.
  - The coach did not see him arrive late.
  ans: "2"
  why: 5文目に、駅員からの書面をコーチに渡したので走らなくてよかったとある。whoever arrives late は「遅れて来た人は誰でも」で、規則そのものは毎回の練習に当てはまる。
  trap: However, the coach always listens first. の However を「どんなに〜でも」と読み、規則に例外がないと考える誤り。直後にコンマがあるので「しかし」の意味。
- id: q5020
  sec: s16
  set: 章末
  lv: 2
  kind: 和訳
  min: 3
  inst: 次の英文を和訳しなさい。
  q: Whenever you get lost in the city, call me, and I'll come and find you wherever you are.
  ans: 町で道に迷ったときはいつでも電話して。あなたがどこにいても見つけに行くから。
  alt: [街で迷子になったらいつでも電話してね。どこにいても私が見つけに行くよ。, 町で道に迷うたびに私に電話しなさい。そうすれば、あなたがどこにいても見つけに行こう。]
  why: Whenever は「〜するときはいつでも」、wherever you are は譲歩で「どこにいても」。call me, and … は「電話して。そうすれば〜」の関係を訳に出す。
  trap: wherever you are を「あなたがいるところへ」とだけ訳し、譲歩の「どこにいても」を落とす誤り。どんな場所でも結果が変わらないという意味まで訳す。
