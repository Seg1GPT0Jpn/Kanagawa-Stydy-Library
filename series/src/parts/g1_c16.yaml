  choices: [we, our, ours, us]
  ans: "4"
  why: 前置詞 with の後ろなので、代名詞は目的格の us を使う。
  trap: ①we を選ぶ誤り。日本語の「私たちと」につられやすいが、we は S の位置で使う形で、前置詞の後ろには置かない。
