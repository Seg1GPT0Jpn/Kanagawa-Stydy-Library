  inst: 日本語の意味になるように、（　）に適切な語を1語入れなさい。
  q: この机は木でできている。<br>This desk is made (＿) wood.
  ans: of
  why: 机を見れば木でできていることが分かる。見て材料が分かるときは be made of を使う。
  trap: from を書く誤り。from は豆腐やチーズのように原料の形が変わって見えないときに使う。机は木のままなので of。
- id: q16020
  sec: s163
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: Are you (＿) or against the plan to change our school uniform?
  choices: [of, to, for, at]
  ans: "3"
  why: against（〜に反対して）と or で並んでいるので、反対の意味の「〜に賛成して」を表す for が入る。
  trap: ②to を選ぶ誤り。「〜に」という日本語につられやすいが、to には「賛成して」の意味はない。賛成は for で表す。
