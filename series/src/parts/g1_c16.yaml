  inst: 日本語の意味になるように、（　）に適切な語を1語入れなさい。
  q: このレポートは金曜日までに出してください。<br>Please hand in this report (＿) Friday.
  ans: by
  why: 「出す」は1回で終わる動作で、「金曜日までには」と期限を表すので by。
  trap: until を書く誤り。until は「〜までずっと」で、続く動作に使う。提出のような1回の動作の期限には by を使う。before を書くのも誤り。before Friday は「金曜日より前に」で、金曜日をふくまないので「金曜日までに」とは意味がずれる。
