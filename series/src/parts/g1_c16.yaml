- id: q16002
  sec: s161
  set: 前提
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: Thank you for (＿) me with my homework.
  choices: [help, helping, to help, helped]
  ans: "2"
  why: 前置詞 for の後ろに動詞を置くときは、動名詞にする。Thank you for helping me で「手伝ってくれてありがとう」。
  trap: ③to help を選ぶ誤り。for の後ろは前置詞の後ろなので、不定詞ではなく動名詞を置く。
  ref: s071
- id: q16003
  sec: s161
  set: 前提
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: I usually leave home (＿) seven thirty.
  choices: [in, "on", at, for]
  ans: "3"
  why: seven thirty（7時30分）は時刻。時刻の前には at を置く。
  trap: ①in を選ぶ誤り。in は in the morning・in July のように幅のある期間に使い、時刻には使わない。
# ---- s161 節末 ----
- id: q16004
  sec: s161
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: My grandfather usually takes a walk (＿) the morning.
  choices: [at, "on", in, for]
  ans: "3"
  why: 曜日や日付の付かない「朝に」は in the morning。
  trap: ②on を選ぶ誤り。on を使うのは on Sunday morning のように特定の日の朝を言うときで、ただの「朝に」は in the morning。
- id: q16005
  sec: s161
  set: 節末
  lv: 1
  kind: 補充
  min: 1
  inst: 日本語の意味になるように、（　）に d で始まる適切な語を1語入れなさい。
  q: 冬休みの間に、私は本を10冊読んだ。<br>I read ten books (＿) the winter vacation.
  ans: during
  why: the winter vacation は特定の期間を表す名詞。その期間の「間に」を表す前置詞は during。
  trap: for を考える誤り。for は for two weeks のように数で表す長さの前に置き、the winter vacation のような期間の名前の前には置かない。
- id: q16006
  sec: s161
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: I waited for Rina at the station (＿) six, but she didn't come.
  choices: [by, for, in, until]
  ans: "4"
  why: wait（待つ）は続く動作。「6時までずっと待った」を表すのは until。
  trap: ①by を選ぶ誤り。by は「〜までには」と期限を表し、finish・return のような1回で終わる動作と使う。待つことのように続く動作には until を使う。
- id: q16007
  sec: s161
  set: 節末
  lv: 1
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: 1週間以内にこの本を返してください。<br>Please ( a / book / return / this / week / within ).
  words: [a, book, return, this, week, within]
  ans: Please return this book within a week.
  why: Please の後ろに動詞の原形 return、O の this book を続け、最後に「1週間以内に」を表す within a week を置く。
  trap: Please within a week return this book. と、within a week を please の直後に置く誤り。日本語の「1週間以内に」が先に来る語順につられやすいが、時を表す M の within a week は、動詞と O（return this book）の後ろに置く。
- id: q16008
  sec: s161
  set: 節末
  lv: 2
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: I was so sleepy that I fell asleep twice (＿) the long meeting yesterday.
  choices: [during, for, while, by]
  ans: "1"
  why: the long meeting は特定の期間を表す名詞。「会議の間に（2度）」と、その期間のある時を表すのは前置詞の during。
  trap: ③while を選ぶ誤り。while は接続詞で、後ろに S＋V を置く。後ろが名詞だけなら前置詞の during を使う。
- id: q16009
  sec: s161
  set: 節末
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部①〜④のうち、誤りをふくむものを1つ選びなさい。
  q: My cousin arrived __at__① the airport __on__② the morning of July 3 and stayed with us __during__③ two weeks __in__④ the summer.
  ans: "3"
  why: two weeks は数で表す長さなので、during ではなく for を使い、for two weeks とする。①at the airport は地点、②on the morning of July 3 は特定の日の朝、④in the summer は季節で、どれも正しい。
  trap: ②on を誤りと考える誤り。ただの「朝に」は in the morning だが、日付が付いて特定の日の朝になると on を使う。
- id: q16010
  sec: s161
  set: 節末
  lv: 2
  kind: 和訳
  min: 3
  inst: 次の英文を日本語に訳しなさい。
  q: The new library in our town will open in two months.
  ans: 私たちの町の新しい図書館は、2か月後に開館する。
  alt: [町の新しい図書館は、2か月したらオープンする。, 私たちの町にできる新しい図書館は、2か月後に開く。]
  why: in our town は library を説明する形容詞の働き。in two months は未来の文で「今から2か月後に」を表す。この2点が訳に出ていれば正解。
  trap: in two months を「2か月以内に」と訳す誤り。「〜以内に」は within で表す。
# ---- s162 節末 ----
- id: q16011
  sec: s162
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: There is a big map of Japan (＿) the wall of our classroom.
  choices: ["in", "on", at, between]
  ans: "2"
  why: 地図は壁の表面に接して付いているので on を使う。on は机の上だけでなく、壁や天井に付いているものにも使う。
  trap: ①in を選ぶ誤り。日本語の「壁に」から位置を考えずに選ぶと迷う。in は空間の中を表し、壁の表面に付いているものには on を使う。
- id: q16012
  sec: s162
  set: 節末
  lv: 1
  kind: 補充
  min: 1
  inst: 日本語の意味になるように、（　）に適切な語を1語入れなさい。
  q: その郵便局は銀行と書店の間にある。<br>The post office is (＿) the bank and the bookstore.
  ans: between
  why: 「A と B の間に」と2つの間を表すのは between A and B。
  trap: among を書く誤り。among は3つ以上の集まりの中に使う。and で2つを結んでいるので between。
- id: q16013
  sec: s162
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: 日本語の意味になるように、（　）に入る最も適切なものを1つ選びなさい。
  q: 川沿いに桜の木がたくさん並んでいる。<br>There are many cherry trees (＿) the river.
  choices: [along, across, through, among]
  ans: "1"
  why: 「川沿いに」は、細長い川に沿っていることを表すので along。
  trap: ②across を選ぶ誤り。across は「横切って・向こう側に」で、across the river なら「川の向こう岸に」になり、「川沿いに」にはならない。
- id: q16014
  sec: s162
  set: 節末
  lv: 1
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: その古い家は、高い木々の中に建っている。<br>The old house ( among / stands / tall / the / trees ).
  words: [among, stands, tall, the, trees]
  ans: The old house stands among the tall trees.
  why: S の The old house の後ろに V の stands を置き、「高い木々の中に」を表す among the tall trees を続ける。たくさんの木の集まりの中なので among。
  trap: 日本語の語順につられて stands を文の最後に置く誤り。英語では V の stands を S のすぐ後ろに置き、場所を表す among the tall trees はその後ろに続ける。
- id: q16015
  sec: s162
  set: 節末
  lv: 2
  kind: 4択
  min: 1
  inst: 日本語の意味になるように、（　）に入る最も適切なものを1つ選びなさい。
  q: そのネコは塀を飛び越えて逃げていった。<br>The cat jumped (＿) the fence and ran away.
  choices: [through, above, "on", over]
  ans: "4"
  why: 「飛び越えて」は、塀の上を越えて向こう側へ動くことなので over を使う。
  trap: ②above を選ぶ誤り。above は「〜より高い所に」という位置を表し、「越えて向こうへ動く」意味はない。越える動きには over を使う。
- id: q16016
  sec: s162
  set: 節末
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部①〜④のうち、誤りをふくむものを1つ選びなさい。
  q: My sister is popular __between__① her classmates, and she always sits __between__② Saki and Nana __in__③ the classroom __at__④ lunchtime.
  ans: "1"
  why: her classmates はクラスの仲間の集まりなので、「〜の間で人気がある」は among を使い、popular among her classmates とする。②は Saki と Nana の2人の間なので between で正しい。③in the classroom は空間の中、④at lunchtime は時の点で、どちらも正しい。
  trap: ②between を誤りと考える誤り。2人の間に座るので between が正しい。同じ between でも、後ろが2つか、集まりかで正誤が分かれる。
- id: q16017
  sec: s162
  set: 節末
  lv: 2
  kind: 和訳
  min: 3
  inst: 次の英文を日本語に訳しなさい。
  q: There is an old stone bridge over the river near my school.
  ans: 学校の近くの川に、古い石の橋がかかっている。
  alt: [私の学校の近くの川の上に、古い石の橋がある。, 学校のそばを流れる川には、古い石橋がかかっている。]
  why: over the river は「川の上をまたいで」を表し、bridge を説明する。near my school は river を説明する。「川にかかっている」「川の上にある」のどちらでも、橋が川をまたいでいる意味が出ていれば正解。
  trap: over を「〜を越えて向こうへ」と動きで訳し、「川を越えて古い石の橋がある」とする誤り。ここでは橋の位置を表し、川の上にまたがっていることを言う。
