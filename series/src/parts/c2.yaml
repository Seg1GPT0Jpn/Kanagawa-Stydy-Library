chapters:
- id: c2
  title: 関係副詞
  lead: 第1章の関係代名詞は、関係詞節の中で主語や目的語の代わりをしました。この章で学ぶ関係副詞は、節の中で「そこで」「その時に」のような副詞の代わりをします。どちらを使うかは先行詞の意味ではなく、後ろの節が完全な文か不完全な文かで決まる、というのがこの章の軸です。
  sections:
  - id: s07
    title: 場所・時を表す where と when
    patterns: [P5]
    body:
    - h: 場所や時を説明する関係副詞
    - p: 「祖母がパン屋を営んでいる町」を英語にするとき、the town の後ろに説明の節を置くところまでは関係代名詞と同じです。違うのは節の中身で、もとの文 His grandmother runs a bakery in the town. の in the town は、主語でも目的語でもなく「その町で」という場所を表す副詞のまとまりです。このまとまりの代わりをして節を始める語を<<関係副詞>>といい、場所なら where を使います（@e201）。
      notes:
      - {kind: 用語, term: 関係副詞, yomi: かんけいふくし, text: 先行詞を後ろから説明する節をつくり、その節の中で場所・時・理由・方法を表す副詞の働きをする語。where, when, why, how の4つ。}
    - ex: [e201, e202]
    - p: 時を表す名詞の後ろでは when を使います。@e202 の節 we moved to Kobe は、主語 we と動詞 moved がそろっていて、何も欠けていません。もとの文の in that year（その年に）にあたる副詞の部分を、when が受け持っているからです。関係副詞の節は、関係代名詞の節と違って欠けた位置がなく、そのままで文として成り立ちます。本書で関係副詞の節に ＿ を書かないのは、このためです。
    - h: 関係副詞は「前置詞＋which」で言いかえられる
    - p: where と when は副詞のまとまりを丸ごと受けるので、前置詞と which の組み合わせ（@s06）で言いかえられます。@e203 の where は in which、@e204 の when は on which と同じ意味です。どの前置詞を使うかは、もとの文で先行詞の前に付く前置詞で決まる。in the park なら in which、on Friday なら on which になります。
      notes:
      - {kind: 注意, text: 時を表す先行詞の後ろでは、when の代わりに that を使うこともある（the day that we met）。}
    - ex: [e203, e204]
    - table:
        head: ["", 先行詞の例, 関係副詞, 前置詞＋which]
        rows:
        - [場所, "the town, the room, the park", "{{where}}", "{{in / at / on which}}"]
        - [時, "the day, the year, the time", "{{when}}", "{{on / in / at which}}"]
    - h: 先行詞や関係副詞が省かれる形
    - p: 関係副詞の文では、先行詞か関係副詞のどちらかが省かれることがよくあります。@e205 では先行詞の the place が省かれ、where から始まる節が「〜する場所」という意味で is の後ろに置かれている。when も同じ使い方ができ、@e206 の when 節は「〜する時」を表します。先行詞 the time を補って読めば、意味はすぐにとれるはずです。
      notes:
      - {kind: 参照, text: コンマの付いた「, where」「, when」は @s13 で扱う。}
    - ex: [e205, e206]
    - p: 反対に、先行詞を残して関係副詞を省くこともあります。@e207 は the day の後ろの when が省かれた形で、名詞の直後に主語と動詞がいきなり続きます。the day, the year, the time などの時の名詞の後ろでは、この省略がよく起こる。where の省略はそれより少なく、the place や somewhere などの後ろでおもに見られます。
    - ex: [e207]
    - check:
      - {q: "the café [＿] my sister works on weekends", a: where}
      - {q: "the month [＿] the new station opened", a: when}
      - {q: "the room [in ＿] we practice the piano", a: which}
    examples:
    - id: e201
      en: Haruto visited the small town [*where* his grandmother runs a bakery].
      ja: ハルトは、祖母がパン屋を営んでいる小さな町を訪れた。
      gloss: [[run, （店を）営む]]
    - id: e202
      en: 2019 was the year [*when* we moved to Kobe].
      ja: 2019年は、私たちが神戸に引っ越した年だ。
    - id: e203
      en: The park [*where* we play soccer after school] has two new benches and a water fountain near the gate.
      ja: 放課後に私たちがサッカーをする公園には、新しいベンチが2つと、門の近くに水飲み場がある。
      gloss: [[water fountain, 水飲み場]]
    - id: e204
      en: Friday is the day [*when* the school library stays open until seven].
      ja: 金曜日は、学校の図書館が7時まで開いている日だ。
    - id: e205
      en: This bench is [*where* Sofia waits for her bus every morning].
      ja: このベンチは、ソフィアが毎朝バスを待つ場所だ。
    - id: e206
      en: Lunchtime is [*when* the school store gets most crowded].
      ja: 昼休みは、学校の売店がいちばん混む時間だ。
      gloss: [[crowded, 混んだ]]
    - id: e207
      en: I still remember the day [we got our first dog].
      ja: 私は、うちで初めて犬を飼った日を今でも覚えている。
    summary:
    - 場所を表す先行詞の後ろで、節の中の「そこで」にあたる副詞の代わりをする → {{where}}
    - 時を表す先行詞の後ろで、「その時に」にあたる副詞の代わりをする → {{when}}
    - 関係副詞の後ろの節は、主語や目的語が欠けていない{{完全な文}}になる。
    - where は{{in / at / on which}}、when は{{on / in / at which}}で言いかえられる。
    - 先行詞が省かれると、where 節は「{{〜する場所}}」、when 節は「{{〜する時}}」という意味になる。
  - id: s08
    title: 理由・方法を表す why と how
    patterns: [P5]
    body:
    - h: 理由を表す why
    - p: 関係副詞 why の先行詞になるのは、ほぼ the reason に限られます。@e208 の節 Riku missed the first train today は主語・動詞・目的語がそろった完全な文で、もとの文の for that reason（その理由で）にあたる部分を why が受けています。そのため why は for which でも言いかえられる。where や when と同じく、副詞のまとまりを受ける語だからです。
    - ex: [e208]
    - p: the reason why の形では、the reason と why のどちらか一方がよく省かれます。@e209 は why を省いた形、@e210 は the reason を省いた形です。why の代わりに that を使った the reason that … も使われます。@e210 の That's why … は、先行詞が省かれた why 節が is の後ろに置かれた形で、「だから〜」という意味になります。
    - ex: [e209, e210]
    - p: That's why … と That's because … は、理由と結果の向きが逆になります。@e210 では「バスの故障」が理由で、why 節の「30分遅れた」が結果です。That's because … なら、because の後ろに理由がきます。前の文が理由なのか結果なのかを確かめてから訳すと、取り違えずにすみます。
      notes:
      - {kind: 注意, text: "That's why A. は「だから A」（前の内容が理由、A が結果）。That's because A. は「それは A だからだ」（A が理由）。"}
    - h: 方法を表す how と the way
    - p: 「〜するやり方」を表すときは、関係副詞 how を使います。ただし、先行詞 the way と how を並べた the way how という形は、古い英語には見られるものの、今の英語では使いません。入試の正誤問題でも誤りとして扱われます。the way か how のどちらか一方だけを使う、と覚えておけば迷いません（@e211、@e212）。
    - ex: [e211, e212]
    - p: the way の後ろには、that や in which を置くこともできます。@e213 の the way in which はやや改まった書き言葉で、the way that は話し言葉でも使われます。言いかえの形を並べると次の表のようになり、このうち使えないのは the way how の1つだけです。
    - ex: [e213]
    - table:
        head: [形, 使えるか, 例]
        rows:
        - [the way S V, "{{○}}", the way she talks]
        - [how S V, "{{○}}", how she talks]
        - [the way that S V／the way in which S V, "{{○}}", the way in which she talks]
        - [the way how S V, "{{×}}", 使わない]
    - check:
      - {q: "I don't know the reason [＿] the shop closed early today.", a: why（that も可。省略もできる）}
      - {q: "Please tell me [＿] you made this cake so soft.（1語）", a: how}
      - {q: "This is the way [＿ ＿] he fixed the bike.（2語）", a: in which}
    examples:
    - id: e208
      en: Nobody knows the reason [*why* Riku missed the first train today].
      ja: 今日リクが始発電車に乗り遅れた理由は、だれも知らない。
    - id: e209
      en: The reason [the soccer game was canceled] was the heavy rain.
      ja: サッカーの試合が中止になった理由は、大雨だった。
    - id: e210
      en: The bus broke down near the bridge. That's [*why* we were thirty minutes late].
      ja: バスが橋の近くで故障した。だから私たちは30分遅れたのだ。
      gloss: [[break down, 故障する]]
    - id: e211
      en: This is [*how* Mr. Sato makes curry for forty students in one hour].
      ja: これが、佐藤さんが1時間で40人分のカレーを作る方法だ。
    - id: e212
      en: I like the way [Ms. Brown explains grammar with simple pictures].
      ja: 私は、ブラウン先生が簡単な絵を使って文法を説明するやり方が好きだ。
    - id: e213
      en: After the first test in April, Grace changed the way [*in which* she studies at home].
      ja: 4月の最初のテストの後、グレースは家での勉強のやり方を変えた。
    summary:
    - 理由を表す the reason の後ろ → {{why}}（{{for which}} や that でも言いかえられる）
    - the reason why は、{{the reason}}か{{why}}のどちらかを省くことが多い。
    - 方法は{{the way}} S V か{{how}} S V で表し、{{the way how}}とは言わない。
    - the way の後ろには{{that}}や{{in which}}も置ける。
    - That's why … は「{{だから}}〜」、That's because … は「それは〜{{だからだ}}」。
  - id: s09
    title: 関係副詞か、関係代名詞か
    patterns: [P4]
    body:
    - h: 先行詞の意味だけでは決まらない
    - p: 「先行詞が場所なら where」と覚えていると、@e214 で間違えます。先行詞 the museum は場所ですが、節の中を見ると visited の目的語がありません。visit は「〜を訪れる」という意味で、後ろに目的語が必要な動詞です。欠けた目的語の代わりになれるのは関係代名詞の which（または that）で、副詞の働きしかしない where には無理です。@e215 も、stands の主語が欠けているので which が入ります。
    - ex: [e214, e215]
    - p: 反対に、場所や時の名詞でなくても where が入ることがあります。@e216 の先行詞 a situation は「状況」で、場所ではありません。それでも節 you have to choose between two friends は完全な文なので、関係副詞の where が入ります。situation（状況）、case（場合）、point（段階）なども、「その中で」という意味の where で説明されることがある名詞です。
    - ex: [e216]
    - h: 後ろが完全な文か、不完全な文か
    - p: 関係副詞か関係代名詞かは、先行詞ではなく、関係詞の後ろの節で決めます。これは @s01 の2つ目の問い「節の中で何が欠けているか」と同じ考え方です。節の中で主語も目的語もそろっていれば完全な文、主語か目的語（前置詞の目的語もふくむ）が欠けていれば不完全な文と考え、次の順に確かめます。
    - steps:
      - 関係詞の後ろの節だけを取り出す。
      - 動詞が目的語を必要とする動詞か、前置詞の後ろに名詞があるかを確かめる。
      - 主語も目的語も欠けていなければ（完全な文）→ where / when / why / how、または前置詞＋which。
      - 主語か目的語が欠けていれば（不完全な文）→ which / that（先行詞が人なら who / whom / that）。
    - ex: [e217, e218, e219]
    - p: 同じ the house でも、@e217 と @e218 では入る語が違います。@e217 の節 my uncle lived until he was twenty は、live が目的語をとらない動詞なので完全な文で、where が入る。@e218 の節 my uncle built ＿ by himself は built の目的語が欠けているので which です。
      notes:
      - {kind: 注意, text: the place where we stayed を which で書くなら、前置詞が必要になる（the place which we stayed at ＿／the place at which we stayed）。}
    - p: 前置詞が節の最後に残る形にも気をつけます。@e219 の節 Grace comes from ＿ は、from の後ろの名詞が欠けた不完全な文です。この from の目的語の代わりをしているのが which です。前置詞を前に出して from which Grace comes にすると、後ろは完全な文になります（@s06）。
    - h: 時や理由の名詞でも同じ手順で決める
    - p: 時や理由の先行詞でも、判断の手順は変わりません。@e220 の先行詞 the three days は時を表しますが、spent の目的語が欠けているので which（または that）が入ります。@e221 の the reason も、gave の目的語が欠けているので why ではなく that か which です。正誤問題で場所・時・理由の名詞の後ろに where・when・why を見つけたら、後ろの節に欠けた語がないかを確かめます。
    - ex: [e220, e221]
    - check:
      - {q: "the restaurant [＿] we had dinner last night", a: where（in which / at which も可）}
      - {q: "the restaurant [＿] my aunt told me about", a: which／that（省略も可）}
      - {q: "the year [＿] I will never forget", a: which／that（省略も可）}
      - {q: "the year [＿] I started high school", a: when（in which も可）}
    examples:
    - id: e214
      en: The museum [*which* we visited ＿ on our school trip] had a real train from 1872.
      ja: 修学旅行で私たちが訪れた博物館には、1872年の本物の列車があった。
    - id: e215
      en: We stayed at a hotel [*which* ＿ stands right next to the station].
      ja: 私たちは、駅のすぐ隣に建っているホテルに泊まった。
    - id: e216
      en: Sometimes you are in a situation [*where* you have to choose between two friends].
      ja: 2人の友達のどちらかを選ばなければならない状況になることもある。
      gloss: [[situation, 状況]]
    - id: e217
      en: That is the house [*where* my uncle lived until he was twenty].
      ja: あれは、おじが20歳になるまで住んでいた家だ。
    - id: e218
      en: That is the house [*which* my uncle built ＿ by himself].
      ja: あれは、おじが自分で建てた家だ。
    - id: e219
      en: The town [*which* Grace comes from ＿] is famous for its apples.
      ja: グレースの出身の町は、リンゴで有名だ。
    - id: e220
      en: We will never forget the three days [*which* we spent ＿ at the camp in Nagano last August].
      ja: 私たちは、去年の8月に長野のキャンプで過ごした3日間を決して忘れないだろう。
    - id: e221
      en: The reason [*that* Riku gave ＿ for being late on Monday morning] sounded a little strange to our teacher, so she called his mother after school.
      ja: リクが月曜の朝の遅刻について述べた理由は先生には少し妙に聞こえたので、先生は放課後に彼の母親に電話をした。
    summary:
    - 関係副詞か関係代名詞かは、先行詞ではなく関係詞の{{後ろの節}}で決める。
    - 後ろが{{完全な文}} → where / when / why / how、または{{前置詞＋which}}
    - 後ろが{{不完全な文}}（主語や目的語が欠ける） → {{which／that}}
    - 場所の名詞でも、節の中で visit などの{{目的語}}が欠けていれば where ではなく which になる。
    - the town which she comes from では、節の最後の{{from}}の目的語が欠けている。

problems:
# ---------- s07 節末 ----------
- id: q2001
  sec: s07
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: The library (＿) I study on Saturdays opens at nine.
  choices: [which, where, when, what]
  ans: "2"
  why: 節 I study on Saturdays は主語と動詞がそろった完全な文で、「その図書館で」という場所の副詞が抜けている。場所の副詞の代わりをするのは where。
  trap: 先行詞 the library が物なので①which を選びやすい。しかし which は節の中の主語か目的語の代わりなので、何も欠けていない I study on Saturdays の前には置けない。
- id: q2002
  sec: s07
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  q: I'll never forget the summer (＿) we went camping by the lake with our grandfather.
  choices: [where, which, when, who]
  ans: "3"
  why: 先行詞 the summer は時を表し、節 we went camping … は完全な文。「その夏に」という時の副詞の代わりをするのは when。
  trap: by the lake という場所の語句に目が行き①where を選ぶ誤り。where か when かを決めるのは節の中の語ではなく、先行詞 the summer が時を表すことである。
- id: q2003
  sec: s07
  set: 節末
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: 私たちがこの町に引っ越してきた年を覚えていますか。<br>Do you remember ( moved / the / to / we / when / year ) this town?
  words: [moved, the, to, we, when, year]
  ans: Do you remember the year when we moved to this town?
  why: 先行詞 the year の直後に when を置き、その後に完全な文 we moved to this town を続ける。when は in that year の代わりをしている。
  trap: Do you remember when we moved to the year … のように、when を remember の直後に置いてしまう誤り。year が余り、文が成り立たなくなる。
- id: q2004
  sec: s07
  set: 節末
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部のうち、誤りを含むものを1つ選びなさい。
  q: I remember the morning __where__① the first snow of the year __fell__② and my sister __ran__③ outside __to make__④ a snowman.
  choices: [①, ②, ③, ④]
  ans: "1"
  why: 先行詞 the morning は時を表すので、where ではなく when を使う。節 the first snow of the year fell … は完全な文なので、関係代名詞にもならない。
  trap: ④to make を「〜するために」ではおかしいと考えて選ぶ誤り。ran outside to make a snowman は「雪だるまを作るために外へ走って出た」で正しい。
- id: q2005
  sec: s07
  set: 節末
  lv: 3
  kind: 和訳
  min: 3
  inst: 次の英文の下線部を日本語に訳しなさい。
  q: __The year I spent in Canada was when I first became interested in foreign languages.__①
  ans: 私がカナダで過ごした1年は、私が初めて外国語に興味を持った時期だった。
  alt: [カナダで過ごした1年間は、私が初めて外国語に興味を持ったときだった。]
  why: The year の後ろには which／that が省かれ、spent の目的語が欠けている（「過ごした1年」）。was の後ろの when 節は先行詞 the time が省かれた形で「〜した時期」と訳す。この2点がとれていれば可。
  trap: The year の後ろに when が省かれたと考えて「私がカナダで過ごした年に」と副詞のように訳す誤り。spent の目的語がないので、The year は節の中で目的語の位置にある。
- id: q2006
  sec: s07
  set: 節末
  lv: 2
  kind: 読解
  min: 4
  inst: 次の英文を読んで、問いの答えとして最も適切なものを1つ選びなさい。
  q: "Last October, Haruto's class went on a three-day trip to Nagasaki. On the first day, they visited a hill where an old church stands. Haruto liked the second day better. That was the day when they took a small boat around the bay. The guide showed them the place where ships from other countries arrived long ago. On the last day, it rained, so they spent the morning in a museum. In his diary, Haruto wrote, “The second day was when I learned the most.”<br>問　What did Haruto's class do on the day Haruto liked best?"
  choices: [They visited an old church on a hill., They went around the bay by boat., They stayed in a museum because of the rain., They went to Nagasaki Station to meet the guide.]
  ans: "2"
  why: Haruto liked the second day better. That was the day when they took a small boat around the bay. とあり、2日目に船で湾を回った。the day when … が「〜した日」を表す。
  trap: 本文の最初に出てくる a hill where an old church stands に引かれて①を選ぶ誤り。教会を訪れたのは1日目で、ハルトがより気に入ったのは2日目である。

# ---------- s08 節末 ----------
- id: q2007
  sec: s08
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: Can you tell me the reason (＿) you didn't come to practice yesterday?
  choices: [why, how, where, which]
  ans: "1"
  why: 先行詞 the reason の後ろに完全な文 you didn't come to practice yesterday が続く。理由を表す関係副詞は why。
  trap: 先行詞が物（the reason）なので④which を選ぶ誤り。which は節の中で主語か目的語の代わりをするが、この節には欠けている語がない。
- id: q2008
  sec: s08
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  q: This is (＿) I make rice balls in only five minutes.
  choices: [the way how, how, which, what]
  ans: "2"
  why: 「これが〜するやり方だ」は This is how S V。how の後ろの I make rice balls … は完全な文。
  trap: ①the way how を選ぶ誤り。今の英語では the way と how を並べず、the way か how の一方だけを使う。
- id: q2009
  sec: s08
  set: 節末
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: 母のカレーの作り方は、祖母の作り方とは違う。<br>( curry / makes / mother / my / the / way ) is different from my grandmother's.
  words: [curry, makes, mother, my, the, way]
  ans: The way my mother makes curry is different from my grandmother's.
  why: 「母がカレーを作るやり方」は the way の後ろに完全な文 my mother makes curry を続ける。how がないので the way S V の形にする。
  trap: 「やり方」に how が必要だと考え、語が足りないと迷う誤り。the way の後ろの how は使わないので、与えられた語だけで文ができる。
- id: q2010
  sec: s08
  set: 節末
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部のうち、誤りを含むものを1つ選びなさい。
  q: My grandfather __grows__① such sweet tomatoes __in__② his small garden, and I want to learn __the way how__③ he __does__④ it.
  choices: [①, ②, ③, ④]
  ans: "3"
  why: the way how は使わない。the way he does it か how he does it に直す。
  trap: ④does を「grows でなければおかしい」と考えて選ぶ誤り。does it は前の grows such sweet tomatoes を言いかえた代動詞で正しい。
- id: q2011
  sec: s08
  set: 節末
  lv: 2
  kind: 英作
  min: 3
  inst: 次の日本語を英語にしなさい。ただし why を使うこと。
  q: バスが来なかった。だから私たちは駅まで歩いた。
  ans: The bus didn't come. That's why we walked to the station.
  alt: [The bus did not come. That is why we walked to the station., The bus didn't come. This is why we walked to the station.]
  why: 「だから〜」は That's why S V で表す。前の文（バスが来なかった）が理由、why 節（駅まで歩いた）が結果になる向きで書けていれば可。
  trap: That's because we walked to the station. と書く誤り。because の後ろには理由がくるので、「それは駅まで歩いたからだ」と逆の意味になる。
- id: q2012
  sec: s08
  set: 節末
  lv: 3
  kind: 読解
  min: 4
  inst: 次の英文を読んで、問いの答えとして最も適切なものを1つ選びなさい。
  q: "Ms. Brown, an English teacher, made a new rule this year. Before each lesson, students put their phones in a box by the door. Many students asked her the reason why she made the rule. She said that students cannot focus well when their phones are on their desks. At first, nobody liked it. But after a month, Riku said, “I like the way we talk in class now. We really listen to each other.” That is why Ms. Brown plans to keep the rule next year.<br>問　Why does Ms. Brown plan to keep the rule next year?"
  choices: [Because students asked her to buy a new box., Because students now listen to each other better in class., Because Riku forgot his phone in the box., Because other teachers asked her to keep it.]
  ans: "2"
  why: 最後の That is why … の That は、直前のリクの発言（授業で互いの話をよく聞くようになった）を指す。それが理由で、ルールを続ける。
  trap: That is why を読み飛ばし、本文中の asked her the reason の asked に引かれて①や④を選ぶ誤り。生徒が頼んだのはルールの理由の説明である。

# ---------- s09 節末 ----------
- id: q2013
  sec: s09
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: The museum (＿) we visited last Sunday has a big dinosaur model.
  choices: [where, which, when, what]
  ans: "2"
  why: visit は目的語が必要な動詞で、節 we visited last Sunday では visited の目的語が欠けている。欠けた目的語の代わりをするのは which。
  trap: 先行詞 the museum が場所なので①where を選ぶ誤り。where は副詞の代わりなので、目的語が欠けた不完全な文の前には置けない。
- id: q2014
  sec: s09
  set: 節末
  lv: 2
  kind: 4択
  min: 1
  q: This is the town (＿) Sofia lived for three years before she moved to Tokyo.
  choices: [which, where, what, that]
  ans: "2"
  why: live は目的語をとらない動詞なので、節 Sofia lived for three years は完全な文。「その町に」という場所の副詞の代わりをする where が入る。
  trap: q2013 と同じく「場所の名詞の後ろは where か which か」で迷い、①which を選ぶ誤り。which にするなら the town which Sofia lived in のように前置詞が必要になる。
- id: q2015
  sec: s09
  set: 節末
  lv: 2
  kind: 4択
  min: 1
  q: The day (＿) my grandparents chose for their party was a Sunday in May.
  choices: [when, on which, which, where]
  ans: "3"
  why: choose は目的語が必要な動詞で、節 my grandparents chose for their party では chose の目的語が欠けている。目的語の代わりをするのは which。
  trap: 先行詞 the day が時なので①when や②on which を選ぶ誤り。どちらも後ろに完全な文が必要で、chose の目的語が欠けたこの節には合わない。
- id: q2016
  sec: s09
  set: 節末
  lv: 2
  kind: 4択
  min: 1
  q: The village (＿) my grandmother often talks about is in the mountains of Nagano.
  choices: [where, which, about which, when]
  ans: "2"
  why: 節の最後の about の後ろに名詞がなく、前置詞の目的語が欠けた不完全な文になっている。欠けた目的語の代わりをするのは which。
  trap: ③about which を選ぶ誤り。about which にすると about が節の最後にも残り、about が2回になってしまう。
- id: q2017
  sec: s09
  set: 節末
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部のうち、誤りを含むものを1つ選びなさい。
  q: The beach __where__① we swam every morning was near the hotel __where__② we chose for our trip, so we __walked__③ there __in five minutes__④.
  choices: [①, ②, ③, ④]
  ans: "2"
  why: 節 we chose for our trip では chose の目的語が欠けている。目的語の代わりになる which（または that）に直す。
  trap: ①where も同じ形なので両方を疑い、①を選ぶ誤り。swim は目的語をとらないので、we swam every morning は完全な文で where が正しい。
- id: q2018
  sec: s09
  set: 節末
  lv: 3
  kind: 正誤
  min: 1
  q: When you are in a situation __which__① you cannot find your bag on a train, you should __tell__② a station worker __about__③ it soon. The reason __that__④ I know this is that it happened to me last year.
  choices: [①, ②, ③, ④]
  ans: "1"
  why: 節 you cannot find your bag on a train は完全な文なので、which ではなく where（または in which）を使う。situation は場所ではないが、「その状況の中で」という意味の where で説明できる。
  trap: ④that を「reason の後ろは why」と考えて選ぶ誤り。the reason that I know this の that は why の代わりに使える形で正しい。
- id: q2019
  sec: s09
  set: 節末
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: これは、私の父が若いころに働いていた工場だ。<br>This is the factory ( father / in / my / when / which / worked ) he was young.
  words: [father, in, my, when, which, worked]
  ans: This is the factory in which my father worked when he was young.
  alt: [This is the factory which my father worked in when he was young.]
  why: work は目的語をとらないので、関係代名詞を使うなら前置詞 in が必要になる。in which を前に出せば後ろは完全な文 my father worked。when は「若いころに」をつくる接続詞として使う。
  trap: when を関係副詞と考えて the factory when my father worked … と並べる誤り。factory は時を表さず、when の後ろに he was young を置く場所がなくなる。
- id: q2020
  sec: s09
  set: 節末
  lv: 3
  kind: 和訳
  min: 3
  inst: 次の英文の下線部を日本語に訳しなさい。
  q: __The hall where the concert was held was much smaller than the one which we had seen in the photos on the website.__①
  ans: コンサートが開かれたホールは、私たちがウェブサイトの写真で見たホールよりもずっと小さかった。
  alt: [そのコンサートが行われた会場は、私たちがウェブサイトの写真で見ていたものよりずっと小さかった。]
  why: where 節（コンサートが開かれた）は The hall を、which 節（私たちが写真で見た）は the one（＝the hall）を説明する。主語 The hall … held に対する動詞が2つ目の was であることがとれていれば可。
  trap: was held was の was が2つ続くところで迷い、「コンサートはホールで開かれ、それは小さかった」と2つの文に分けて訳す誤り。where から held までが The hall を説明する関係詞節である。

