  alt: [会議に出ていた人はみな、その計画に賛成した。]
  why: no one の後ろの but は that … not の意味の関係代名詞で、agreed の主語の働き。There was no one that did not agree with the plan. と同じ。二重否定が「全員賛成した」という意味で訳に出ていれば正解。古風な表現。
  trap: but を「しかし」と読み、「会議にはだれもいなかったが、計画に賛成した」と訳す誤り。後ろに主語のない agreed が続くことから、関係代名詞の but だと分かる。
- id: q6011
