  ans: is
  why: 比較級 more water の後ろの than が節の主語の働きをしている。主語の water は数えられない名詞なので is。
  trap: than の後に主語がないと感じて it is と2語を入れたくなる。than 自体が主語なので、than it is needed は誤り。
- id: q6010
  sec: s18
