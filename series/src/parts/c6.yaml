  why: As is often the case with A は「A にはよくあることだが」。as は後ろの主節の内容を受け、is の主語になっている。文頭に置けるのは as。
  trap: 前の内容を受ける which（@s14）と混同して②を選ぶ誤り。which で内容を受けるのは , which … の形で文の後ろに置く場合で、文頭には置けない。
- id: q6009
