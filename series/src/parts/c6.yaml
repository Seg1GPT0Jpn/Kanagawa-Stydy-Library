  kind: 読解
  min: 4
  inst: 次の英文を読み、問いの答えとして最も適切なものを1つ選びなさい。
  q: "Last Sunday, Saki went to a small concert in the park. Before it started, she saw a woman with a violin who she thought was her old piano teacher. Saki waved, but the woman did not wave back. After the concert, Saki talked to her and learned that she was the teacher's younger sister. The two sisters looked so alike that even their friends sometimes confused them. The sister gave Saki a ticket for her next concert in December.<br>問い：Who was the woman with the violin?"
  choices: [Saki's old piano teacher., The younger sister of Saki's old piano teacher., A friend of Saki's mother., Saki's own sister.]
  ans: "2"
  why: who she thought was her old piano teacher は「サキがピアノの先生だと思った」という意味で、実際は4文目にある通り先生の妹だった。
  trap: 連鎖関係詞節の she thought を読み落とし、「昔のピアノの先生であるバイオリンの女性」と取って①を選ぶ誤り。
- id: q6025
  sec: s18
  set: 章末
  lv: 3
  kind: 読解
  min: 4
  inst: 次の英文を読み、問いの答えとして最も適切なものを1つ選びなさい。
  q: "Ms. Kimura's cooking club held a curry party for the first-year students in May. As is often the case with first events, the club made a few mistakes. They cooked far more rice than was needed, because more students had said they would come than actually came. Only twenty of the thirty-five students who had signed up showed up. The next day, the club gave the extra rice to the soccer team, and the players ate all of it in ten minutes.<br>問い：Which of the following is true?"
  choices: [More students came than the club had expected., The club cooked too much rice for the party., Thirty-five students came to the party., The soccer team cooked the rice for the club.]
  ans: "2"
  why: far more rice than was needed は「必要な量よりはるかに多くのご飯」。than が was needed の主語の働きをしている。35人の申し込みに対し20人しか来なかったので、ご飯が余った。
  trap: more students had said they would come than actually came の more students に引かれて①を選ぶ誤り。than 以下と比べると、来ると言った人数のほうが多く、実際に来た人数は少ない。
