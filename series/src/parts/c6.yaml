  sec: s19
  set: 章末
  lv: 2
  kind: 読解
  min: 4
  inst: 次の英文を読み、問いの答えとして最も適切なものを1つ選びなさい。
  q: "Dr. Patel works at a hospital in Yokohama. Last week a boy came to her office who had hurt his arm while playing basketball. He was one of the players who were practicing for the city tournament on Saturday. The X-ray showed no broken bones, but Dr. Patel told him to rest for a week. Of all the players on his team, he was the only one who was going to miss the tournament, and he looked very sad.<br>問い：Why did the boy look sad?"
  choices: [His arm was broken., He was the only player on his team who could not play in the tournament., All the players on his team had hurt their arms., Dr. Patel could not see him that day.]
  ans: "2"
  why: 最後の文の the only one who was going to miss the tournament から、チームで大会に出られないのは彼1人だったと分かる。2文目の who had hurt his arm は外置された関係詞節で、a boy を説明している。
  trap: 2文目の who 節を直前の her office に結びつけて読むと、けがをしたのがだれか分からなくなる。who は人を受けるので、離れた a boy が先行詞になる。
