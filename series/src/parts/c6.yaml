  inst: 次の英文を読み、問いの答えとして最も適切なものを1つ選びなさい。
  q: "The volunteers who clean the beach near our school meet on the first Sunday of every month. Last month, a woman joined them who had just moved to the town from Osaka. She brought a large bag of gloves that her old group had given her. The gloves, which were bright yellow, were easy to see on the sand. By noon, the group had collected forty bags of trash, more than they had ever collected before.<br>問い：What did the woman bring?"
  choices: [Forty bags of trash., Gloves from the group she had belonged to before., A map of the town from Osaka., Yellow sand for the beach.]
  ans: "2"
  why: a bag of gloves that her old group had given her の that 節は gloves を説明しており、以前のグループからもらった手袋を持ってきたことが分かる。
  trap: 2文目の a woman joined them who had just moved … の who 節が them を説明すると誤読すると、だれが何をしたかが混乱する。who は離れた a woman を受けている。
