chapters:
- id: c4
  title: 非制限用法
  lead: これまでの章で見てきた関係詞節は、主に先行詞が「どの〜か」を絞りこむ働きをしていました。この章では、先行詞の後ろにコンマを置いて、すでに決まっているものに情報を付け足す使い方を学びます。コンマ1つで文の意味も使える語も変わるため、入試では正誤問題と和訳でくり返し問われます。
  sections:
  - id: s13
    title: コンマの付いた関係詞節
    patterns: [P8]
    body:
    - h: コンマ1つで意味が変わる
    - p: "@s01 では、関係代名詞を決める3つ目の問いとして「先行詞の直後にコンマがあるか」を挙げました。@e401 と @e402 は、コンマがあるかないかだけが違う文です。コンマのない @e401 の関係詞節は、おばの娘たちの中から「病院で働いている娘」を選び出しています。病院で働いていない娘が、ほかにいるかもしれません。"
    - ex: [e401, e402]
    - p: 一方、コンマのある @e402 は、まず「おばには娘が2人いる」と言い切り、その2人について「病院で働いている」という情報を付け足しています。娘は2人だけで、2人とも病院で働いているという意味です。@e401 のように先行詞を絞りこむ使い方を<<制限用法>>、@e402 のように絞りこまずに説明を付け足す使い方を<<非制限用法>>といいます。
      notes:
      - kind: 用語
        term: 制限用法
        yomi: せいげんようほう
        text: "コンマを付けずに関係詞節を置き、先行詞が「どの〜か」を絞りこむ使い方。限定用法ともいう。"
      - kind: 用語
        term: 非制限用法
        yomi: ひせいげんようほう
        text: "先行詞の後ろにコンマを置き、すでに決まっている先行詞に情報を付け足す使い方。継続用法ともいう。"
    - p: 非制限用法の関係詞節は、前から順に「〜で、その人は…」「〜が、それは…」と訳すと、付け足しの感じが出ます。@e402 を「病院で働いている2人の娘がいる」と後ろから訳すと、@e401 と区別がつきません。入試の和訳では、娘がほかにもいると読める訳は減点されます。
    - h: 先行詞が1つに決まっているとき
    - p: 固有名詞や my father のように、聞き手にとって指すものが1つに決まっている名詞は、関係詞節で絞りこむ余地がありません。だから、関係詞節を付けるときは非制限用法にします（@e403〜@e405）。金沢という町は1つしかないので、@e403 のコンマを外して Kanazawa which … とすると誤りです。
      notes:
      - kind: 注意
        text: "固有名詞でも、同じものの「ある時期の姿」を選び出すときは the を付けて制限用法にできる。例：the Kanazawa that my grandmother knew as a child（祖母が子どものころに知っていた金沢）。"
    - ex: [e403, e404, e405]
    - p: "@e404 と @e405 のように関係詞節が文の途中に入るときは、節の前と後ろの両方にコンマを打つのが決まりです。節を外すと Ms. Garcia comes from Mexico. という文が残り、主語と動詞の骨組みが見えます。和訳では、@e404 のように「私たちに英語を教えているガルシア先生は」と名詞の前に置いたほうが自然な場合もあります。先行詞が1つに決まっているので、こう訳しても意味は変わりません。"
    - h: 非制限用法で使えない形
    - p: 非制限用法では that を使いません。×Ms. Garcia, that teaches us English, comes from Mexico. は誤りです。that は先行詞を絞りこむ制限用法のための語、と考えると覚えやすくなります。what は先行詞をふくむ語なので（@s10）、そもそも先行詞の後ろのコンマに続けることはできません。入試の正誤問題では、コンマの直後の that がよく誤りの箇所になります。
      notes:
      - kind: 注意
        text: "古い文学作品には、コンマの後ろに that を置いた例がまれにある。現代の英語では使わず、入試では誤りになる。"
    - p: 目的格の関係代名詞は、制限用法なら省略できました（@s03）。非制限用法では省略できません。@e406 から which を消すと Sota's bike, he bought in April, … となり、コンマの間にいきなり「主語＋動詞」が現れて、前の名詞とのつながりが分からなくなります。非制限用法では、関係代名詞が「ここから先行詞の説明が始まる」と知らせるただ1つの目印なのです。
    - ex: [e406]
    - table:
        head: ["", 制限用法, 非制限用法]
        rows:
        - [先行詞の後ろのコンマ, なし, "{{あり}}"]
        - [働き, 先行詞を絞りこむ, "{{情報を付け足す}}"]
        - [that, 使える, "{{使えない}}"]
        - [目的格の省略, できる（@s03）, "{{できない}}"]
        - [訳し方, 後ろから「〜する…」, "{{前から}}「…で、それは〜」"]
    - h: ", where と , when"
    - p: 関係副詞の where と when にも非制限用法があります（@e407、@e408）。which との使い分けは @s07 と同じで、コンマの後ろの形で決まります。欠けたところのない完全な文なら where / when、目的語などが欠けた不完全な文なら which です。
      notes:
      - kind: 注意
        text: "関係副詞のうち why と how には非制限用法がない。コンマの後ろに続けられる関係副詞は where と when だけである。"
    - ex: [e407, e408]
    - p: "@e407 の his mother opened a small bakery は完全な文なので where を使います。一方、@e403 の we had never visited before は visited の目的語が欠けているので、同じ地名の後ろでも which でした。@e408 の , when は「そしてそのときには」と前から訳すと、時間の流れどおりに読めます。"
    - check:
      - {q: "My grandfather, [＿] lives alone in Akita, sends us rice every fall.", a: who}
      - {q: "This bag, [＿] I bought in Kobe, is already broken.", a: which（省略できない）}
      - {q: "We went to the zoo on Sunday, [＿] it was very crowded.", a: where}
    examples:
    - id: e401
      en: My aunt has two daughters [*who* ＿ work at a hospital].
      ja: おばには病院で働いている娘が2人いる。
    - id: e402
      en: My aunt has two daughters, [*who* ＿ work at a hospital].
      ja: おばには娘が2人いて、2人とも病院で働いている。
    - id: e403
      en: Last summer my family went to Kanazawa, [*which* we had never visited ＿ before].
      ja: 去年の夏、家族で金沢へ行ったが、そこはそれまで一度も訪れたことのない町だった。
    - id: e404
      en: Ms. Garcia, [*who* ＿ teaches us English], comes from Mexico.
      ja: 私たちに英語を教えているガルシア先生は、メキシコの出身だ。
    - id: e405
      en: My father, [*who* ＿ usually takes the 7:10 train], missed it this morning because of the heavy snow.
      ja: 父はいつも7時10分の電車に乗るのだが、今朝は大雪のせいで乗り遅れた。
    - id: e406
      en: Sota's bike, [*which* he bought ＿ in April], already has a flat tire.
      ja: ソウタの自転車は4月に買ったものだが、もうタイヤがパンクしている。
      gloss: [[flat tire, パンクしたタイヤ]]
    - id: e407
      en: Kaito's family moved to Sendai, [*where* his mother opened a small bakery].
      ja: カイトの家族は仙台に引っ越し、そこで母親が小さなパン屋を開いた。
    - id: e408
      en: We finally got to the hotel at 11:30 at night, [*when* the restaurant on the first floor had already closed].
      ja: 私たちがやっとホテルに着いたのは夜の11時半で、そのときには1階のレストランはもう閉まっていた。
    summary:
    - コンマのない関係詞節は先行詞を{{絞りこみ}}（制限用法）、コンマのある関係詞節は決まっている先行詞に情報を{{付け足す}}（非制限用法）。
    - My aunt has two daughters, who … は、娘が{{2人だけ}}いることを表す。コンマがなければ、ほかにも娘がいる可能性が残る。
    - 固有名詞や my father のように1つに決まる先行詞には、{{非制限用法}}で関係詞節を付ける。
    - 非制限用法では{{that}}を使わず、目的格の関係代名詞も{{省略できない}}。
    - コンマの後ろが完全な文なら{{, where／, when}}、不完全な文なら{{, which}}を使う。
  - id: s14
    title: 前の文の内容を受ける which と、数の表現＋of which
    patterns: [P9, P11]
    body:
    - h: ", which が前の内容全体を受ける"
    - p: 非制限用法の which の先行詞は、名詞とは限りません。@e409 の which が受けているのは、直前の his report ではなく、「トムがレポートを書き終えたと言った」という前の部分全体です。レポートそのものが「本当ではない」というのはおかしいので、意味から考えても、先行詞は名詞ではないと分かります。
    - ex: [e409, e410]
    - p: 前の内容をひとまとまりの「こと」として受けるので、which の後ろの動詞は単数の形になります（@e409 の was、@e410 の meant）。@e409 は Tom said he had finished his report, but that was not true. と言いかえられ、「それは」「そのため」と前から訳します。この使い方ができるのはコンマの付いた which だけで、that や what にはありません。
      notes:
      - kind: 参照
        text: "前の文の内容を受ける語には、as もある（@s18）。"
    - h: 直前の名詞か、前の内容全体か
    - p: "@e411 と @e412 は、前半がまったく同じ文です。違いは関係詞節の中身にあります。@e411 では used の目的語が欠けていて、which は「辞書」を指します。"
    - ex: [e411, e412]
    - p: "@e412 の was very kind of her は「彼女は親切だった」という意味です。辞書が親切だというのはおかしいので、which は「辞書を貸してくれたこと」を指しています。which の先行詞は、候補を節の中に戻して意味が通るかで確かめるのが確実です。入試の和訳や内容一致では、前の内容を受ける which を直前の名詞と取り違える誤りがよく狙われます。"
    - h: 数の表現＋of whom / of which
    - p: 「いとこが3人いて、そのうち2人は」のように、先行詞の一部や全部について説明を付け足すときは、two of whom のように「数の表現＋of＋関係代名詞」を節の先頭に置きます（@e413〜@e415）。先行詞が人なら whom、人以外なら which を使います。前置詞 of の直後なので、主格の who ではなく目的格の whom になります（@s06）。
    - ex: [e413, e414, e415]
    - p: of の前に置ける主な語を表にしました。数を表す語なら、two や three のほかに half（半分）や one も使えます。節の中の動詞の数は、@e414 の come のように、指している人や物の数に合わせます。one of which の後ろなら動詞は単数になる、という具合です。
    - table:
        head: ["", 人, 人以外]
        rows:
        - [いくつか, "some of {{whom}}", "some of {{which}}"]
        - [ほとんど, most of whom, most of which]
        - [2つとも・2人とも, both of whom, both of which]
        - [どれも〜ない, none of whom, none of which]
        - [数（2つ・3人など）, two of whom, three of which]
    - p: よくある誤りは、whom や which の代わりに them を入れることです。×I have three cousins, two of them live in Canada. では、コンマの前後の2つの文が、接続詞なしでコンマだけでつながっています。英語で2つの文を1つにするには、and などの接続詞か関係詞が要ります。them を使うなら、@e416 のように and を入れれば正しい文になり、@e413 と同じ意味です。
      notes:
      - kind: 注意
        text: "コンマだけで2つの文をつなぐ書き方は、くだけた文章で見かけることもある。入試の正誤問題や英作文では誤りとされる。"
    - ex: [e416]
    - check:
      - {q: "The bus was 30 minutes late, [＿] made us late for class.", a: which}
      - {q: "I have four uncles, two of [＿] are teachers.", a: whom}
      - {q: "We picked 50 apples, some of [＿] were too small to eat.", a: which}
    examples:
    - id: e409
      en: Tom said he had finished his report, [*which* ＿ was not true].
      ja: トムはレポートを書き終えたと言ったが、それは本当ではなかった。
    - id: e410
      en: It rained hard all day on Sunday, [*which* ＿ meant that our baseball game was put off until the next weekend].
      ja: 日曜日は一日中強い雨が降り、そのため野球の試合は次の週末に延期になった。
      gloss: [[put off, 延期する]]
    - id: e411
      en: Ayaka lent me her dictionary, [*which* I used ＿ for my English homework].
      ja: アヤカが辞書を貸してくれて、私はその辞書を英語の宿題に使った。
    - id: e412
      en: Ayaka lent me her dictionary, [*which* ＿ was very kind of her].
      ja: アヤカは私に辞書を貸してくれたが、それはとても親切なことだった。
    - id: e413
      en: I have three cousins, [two of *whom* live in Canada].
      ja: 私にはいとこが3人いて、そのうち2人はカナダに住んでいる。
    - id: e414
      en: There are 32 students in our class, [most of *whom* come to school by bike].
      ja: 私たちのクラスには生徒が32人いて、そのほとんどが自転車で通学している。
    - id: e415
      en: Kaito bought two used guitars last year, [both of *which* need new strings now].
      ja: カイトは去年中古のギターを2本買ったが、今はどちらも新しい弦に替える必要がある。
      gloss: [[used, 中古の], [string, 弦]]
    - id: e416
      en: I have three cousins, and two of them live in Canada.
      ja: 私にはいとこが3人いて、そのうち2人はカナダに住んでいる。
    summary:
    - 非制限用法の which は、名詞だけでなく前の{{文・節の内容全体}}を受けることができる。このとき後ろの動詞は{{単数}}の形になる。
    - which が何を指すかは、節の中の{{意味}}から決める。直前の名詞を指すとは限らない。
    - 数の表現＋of＋関係代名詞：先行詞が人なら{{whom}}、人以外なら{{which}}（some of which、most of whom、both of which）。
    - "×three cousins, two of them live … はコンマだけで2文をつないでいるので誤り。{{and}} two of them … か、two of {{whom}} … にする。"

problems:
# s13 節末
- id: q4001
  sec: s13
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: My grandmother, (＿) is 82 years old, still swims twice a week.
  choices: [that, who, which, whose]
  ans: "2"
  why: 先行詞 My grandmother は人で、節の中で is の主語が欠けている。コンマがあるので非制限用法になり、that は使えない。残るのは who。
  trap: 人・主語の欠けた関係詞節なので①that も入ると考えやすい。しかし that は非制限用法では使わない。
- id: q4002
  sec: s13
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  q: Last year Lucy stayed in Okinawa, (＿) she learned to dive.
  choices: [which, where, when, that]
  ans: "2"
  why: コンマの後ろの she learned to dive は主語も目的語もそろった完全な文。場所の Okinawa を受けて「そしてそこで」とつなぐ where が入る。
  trap: 先行詞が地名なので①which を選ぶ誤り。which は節の中で主語か目的語が欠けているときにしか使えない（@e403 と比べる）。
- id: q4003
  sec: s13
  set: 節末
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部①〜④のうち、誤りを含むものを1つ選びなさい。
  q: Kaito's older brother, __that__① works __at__② a hotel in Kobe, __is coming__③ home __during__④ the winter holidays.
  ans: "1"
  why: 先行詞の後ろにコンマがある非制限用法なので that は使えない。人・主語が欠けているので who にする。
  trap: 「人の先行詞には that も使える」という s01 の表だけで判断し、①を正しいと見てしまう。表の3つ目の問い（コンマがあるか）を落としている。
- id: q4004
  sec: s13
  set: 節末
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: 私は傘を電車に置き忘れた。その傘は先月母が買ってくれたものだ。<br>I left my umbrella, ( bought / for / me / mother / my / which ) last month, on the train.
  words: [bought, for, me, mother, my, which]
  ans: I left my umbrella, which my mother bought for me last month, on the train.
  why: 先行詞 my umbrella の後ろにコンマがあるので、非制限用法の which で節を始める。節の中は my mother bought ＿ for me で、bought の目的語が欠けている。
  trap: 制限用法と同じつもりで which を省き、my mother bought for me … と並べようとする誤り。非制限用法では目的格の関係代名詞も省略できないので、which が余る形にはならない。
- id: q4005
  sec: s13
  set: 節末
  lv: 2
  kind: 和訳
  min: 3
  inst: 次の英文を日本語に訳しなさい。
  q: My uncle has two sons, who both play soccer for their high school team.
  ans: おじには息子が2人いて、2人とも高校のチームでサッカーをしている。
  alt: [おじには息子が2人おり、その2人はどちらも高校のサッカー部でプレーしている。]
  why: コンマがあるので、息子は2人だけで、その2人について情報を付け足していると読む。「息子が2人いて、2人とも〜」と前から訳せているかが採点の要点。
  trap: 「高校のチームでサッカーをしている息子が2人いる」と後ろから訳すと、ほかにも息子がいるように読める。コンマのない文の訳になってしまう。
- id: q4006
  sec: s13
  set: 節末
  lv: 3
  kind: 読解
  min: 4
  inst: 次の英文を読み、内容に合うものを1つ選びなさい。
  q: "Hi Mom,<br>I arrived in Matsumoto on Friday. My host family, the Itos, live near the station. Mr. Ito, who works at a bank, drives me to school every morning. The Itos have two daughters, who both study in Tokyo, so their rooms are empty during the week. Yesterday we went to the castle, where I took a lot of pictures. In the evening we had dinner at a soba restaurant, which Mrs. Ito's brother runs. I'll write again soon.<br>Love,<br>Lucy"
  choices:
  - The Itos have three or more daughters.
  - All of the Itos' daughters study in Tokyo.
  - Mr. Ito took Lucy to a bank on Friday.
  - Mrs. Ito runs a soba restaurant.
  ans: "2"
  why: The Itos have two daughters, who both study in Tokyo はコンマのある非制限用法なので、娘は2人だけで、その2人とも東京で学んでいる。だから「娘は全員東京で学んでいる」が正しい。
  trap: コンマを読み落として「東京で学ぶ娘が2人いる（ほかにもいるかもしれない）」と考え、①を選ぶ。④は which Mrs. Ito's brother runs の主語を取り違えている。
# s14 節末
- id: q4007
  sec: s14
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: Ayaka didn't come to practice yesterday, (＿) surprised everyone on the team.
  choices: [that, what, which, who]
  ans: "3"
  why: チームのみんなを驚かせたのは「アヤカが昨日練習に来なかったこと」という前の内容全体。前の内容を受けられるのはコンマの付いた which。
  trap: 直前の yesterday や Ayaka を先行詞と考え、④who を選ぶ誤り。驚かせたのは人ではなく、来なかったという出来事である。
- id: q4008
  sec: s14
  set: 節末
  lv: 2
  kind: 4択
  min: 1
  q: Our club has 18 members, most of (＿) are first-year students.
  choices: [them, who, whom, which]
  ans: "3"
  why: 先行詞 18 members は人で、前置詞 of の直後なので目的格の whom。most of whom で「そのほとんどは」となる。
  trap: ①them を選ぶ誤り。them にすると Our club has 18 members と most of them are … の2文が接続詞なしでつながり、文として成り立たない。
- id: q4009
  sec: s14
  set: 節末
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部①〜④のうち、誤りを含むものを1つ選びなさい。
  q: Ms. Garcia __gave__① us four handouts __for__② the test, __two of them__③ __were__④ about the history of Yokohama.
  ans: "3"
  why: two of them のままだと、前の文と後ろの文がコンマだけでつながってしまう。関係代名詞を使って two of which にする（and two of them でもよいが、下線部だけでは and を足せない）。
  trap: two of them は「そのうち2枚」という意味が通るので正しいと思いこむ。意味ではなく、2つの文をつなぐ語があるかで判断する。
- id: q4010
  sec: s14
  set: 節末
  lv: 1
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: トムは電車に乗り遅れ、そのせいで会議に遅刻した。<br>Tom missed the train, ( for / him / late / made / which ) the meeting.
  words: [for, him, late, made, which]
  ans: Tom missed the train, which made him late for the meeting.
  why: which は「電車に乗り遅れたこと」という前の内容全体を受け、made の主語になる。make ＋人＋形容詞で「人を〜にする」。
  trap: which を the train だけを指すと考えると、「電車が彼を遅刻させた」と読んでしまう。遅刻の原因は電車ではなく、乗り遅れたことである。
- id: q4011
  sec: s14
  set: 節末
  lv: 2
  kind: 和訳
  min: 3
  inst: 次の英文を日本語に訳しなさい。
  q: My sister passed her driving test on the first try, which made my parents very happy.
  ans: 姉は運転免許の試験に一度で合格し、そのことで両親はとても喜んだ。
  alt: [妹は運転免許の試験に1回目で受かり、それを両親はとても喜んだ。]
  why: which は「一度で試験に合格したこと」を受けている。「そのことで」「それで」のように前の内容全体を指す訳になっていれば正解。sister は姉・妹のどちらでもよい。
  trap: which を直前の the first try や her driving test と考え、「その試験が両親を喜ばせた」と訳す誤り。
- id: q4012
  sec: s14
  set: 節末
  lv: 3
  kind: 読解
  min: 4
  inst: 次の英文を読み、内容に合うものを1つ選びなさい。
  q: In May, Sota's school started a new rule. Students put their phones in a box before lunch and get them back after lunch, which many students did not like at first. Sota's class has 35 students, about half of whom now say they talk with their friends more. Sota found that he finished lunch much faster, which gave him time to practice the guitar. He also borrowed six books from the library, three of which he has already read.
  choices:
  - Most students liked the new rule from the beginning.
  - About half of Sota's class still do not like the rule.
  - Eating lunch more quickly gave Sota time to practice the guitar.
  - Sota has read all six books from the library.
  ans: "3"
  why: he finished lunch much faster, which gave him time to practice the guitar の which は「昼食を早く食べ終えたこと」を受ける。それがギターを練習する時間を生んだ、という内容が③と合う。
  trap: about half of whom の後ろを読み飛ばし、②を選ぶ。半数が言っているのは「友だちと話すことが増えた」で、ルールが嫌いだとは書かれていない。
# 章末
- id: q4013
  sec: s13
  set: 章末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: This guitar, (＿) my uncle gave me ten years ago, still sounds great.
  choices: [that, where, which, what]
  ans: "3"
  why: 先行詞 This guitar は人以外で、節の中では gave me の後ろの目的語が欠けている。コンマがあるので that は使えず、which が入る。
  trap: 目的語が欠けていることには気づいても、①that を選ぶ誤り。コンマの後ろでは that は使えない。
- id: q4014
  sec: s14
  set: 章末
  lv: 2
  kind: 4択
  min: 1
  q: The museum has about 500 old photos, many of (＿) were taken by local people.
  choices: [them, that, which, whom]
  ans: "3"
  why: 先行詞 500 old photos は人以外で、前置詞 of の後ろなので which。many of which で「そのうちの多くは」。
  trap: ①them を選ぶと、The museum has … と many of them were … の2文が接続詞なしでつながる。意味が通っても文の形として誤り。
- id: q4015
  sec: s13
  set: 章末
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部①〜④のうち、誤りを含むものを1つ選びなさい。
  q: Lucy's family __moved__① to Nagano, __which__② they __opened__③ a small café __near__④ the lake.
  ans: "2"
  why: コンマの後ろの they opened a small café は主語も目的語もそろった完全な文。which ではなく、場所を受ける where にする。
  trap: 先行詞 Nagano が地名なので which も使えると考える誤り。which を使うのは、節の中で主語や目的語が欠けているときだけである。
- id: q4016
  sec: s14
  set: 章末
  lv: 2
  kind: 正誤
  min: 1
  q: My grandfather, __who__① __is__② 75, started __learning__③ English last year, __that__④ surprised all of us.
  ans: "4"
  why: 驚かせたのは「祖父が去年英語を習い始めたこと」という前の内容全体。前の内容を受けるのはコンマの付いた which で、that は使えない。
  trap: ①who に目が行き、④を見落とす。①は人・主語が欠けた非制限用法なので正しい。
- id: q4017
  sec: s14
  set: 章末
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: 姉はスカーフを3枚持っていて、そのうち2枚は祖母が作ったものだ。<br>My sister has three scarves, two ( by / grandmother / made / of / our / were / which ).
  words: [by, grandmother, made, of, our, were, which]
  ans: My sister has three scarves, two of which were made by our grandmother.
  why: 先行詞 three scarves は人以外なので、two of which で「そのうち2枚は」とする。節の中は受け身の were made by our grandmother。
  trap: of の後ろに whom を考えて迷う誤り。whom は先行詞が人のときだけで、スカーフには which を使う。
- id: q4018
  sec: s14
  set: 章末
  lv: 3
  kind: 整序
  min: 2
  q: ガルシア先生には息子が2人いて、2人とも医者になったが、先生はそのことをとても誇りに思っている。<br>Ms. Garcia has two sons, ( became / both / doctors / her / made / of / proud / very / which / whom ).
  words: [became, both, doctors, her, made, of, proud, very, which, whom]
  ans: Ms. Garcia has two sons, both of whom became doctors, which made her very proud.
  why: 息子2人については both of whom became doctors、それを誇りに思ったことは「2人とも医者になったこと」全体を受ける , which made her very proud で表す。人を受ける whom と、内容を受ける which を使い分ける。
  trap: both of which became doctors と並べる誤り。sons は人なので of の後ろは whom になり、which は後半の「そのこと」を受ける側に回る。
- id: q4019
  sec: s14
  set: 章末
  lv: 2
  kind: 読解
  min: 4
  inst: 次の英文を読み、質問の答えとして最も適切なものを1つ選びなさい。
  q: "Tom joined the cooking club in April. The club has twelve members, most of whom had never cooked before. Their teacher, who runs a restaurant in town, visits every Friday. Last month the club made curry at a care home near the school, where about 40 older people live. Some of the members cut their fingers while they were cutting vegetables, which made the teacher a little worried. However, everyone enjoyed the curry, and the club plans to cook there again in December.<br>Question: What made the teacher a little worried?"
  choices:
  - The club cooked for about 40 people.
  - Some members cut their fingers while cooking.
  - Most members had never cooked before.
  - The curry was not very good.
  ans: "2"
  why: ", which made the teacher a little worried の which は、直前の「何人かの部員が野菜を切っていて指を切ったこと」全体を受けている。"
  trap: ③を選ぶ誤り。部員の多くが料理をしたことがなかったのは本文にあるが、先生を心配させた内容として which が受けているのは、すぐ前の指を切った出来事である。
- id: q4020
  sec: s14
  set: 章末
  lv: 2
  kind: 補充
  min: 1
  inst: 2つの文がほぼ同じ意味になるように、空所に1語ずつ入れなさい。
  q: I have two older brothers, and both of them live in Osaka.<br>= I have two older brothers, (＿)(＿)(＿) live in Osaka.
  ans: both of whom
  why: and both of them を関係代名詞で言いかえると both of whom になる。brothers は人で、of の後ろなので目的格の whom。
  trap: 空所の数に合わせて both of who と書く誤り。前置詞 of の直後に主格の who は置かない。
