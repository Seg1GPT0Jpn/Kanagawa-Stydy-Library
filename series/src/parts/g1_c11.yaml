- id: q11042
  sec: s101
  set: 確認テスト
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: The woman (＿) is talking with Mr. Shimizu is my aunt.
  choices: [who, which, whose, what]
  ans: "1"
  why: 先行詞 The woman は人で、節の中では is talking の主語が欠けている。人・主語が欠けるときは who。文全体の動詞は後ろの is。
  trap: ③whose を選ぶ誤り。whose の後ろには名詞が要るが、空所の直後は is talking で名詞がない。
- id: q11043
  sec: s074
  set: 確認テスト
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部①〜④のうち、誤りをふくむものを1つ選びなさい。
  q: We __are__① all looking forward to __meet__② you __at__③ the party __next__④ Saturday.
  ans: "2"
  why: look forward to の to は前置詞なので、後ろは動名詞にする。②を meeting にする。
  trap: to の後ろだから原形でよいと考えて、②を正しいと判断する誤り。look forward to の to は不定詞の to ではない。
