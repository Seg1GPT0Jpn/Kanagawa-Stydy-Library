# 単元11「比較」（s111〜s115）。例文 e1101〜、問題 q11001〜。
chapters:
- id: c11
  title: 比較
  lead: この単元では、2つ以上のものを比べる言い方を学びます。as ～ as・比較級・最上級の形と意味を確かめたうえで、「何と何を比べているのか」をそろえる見方を身につけ、最上級の言いかえ、the＋比較級, the＋比較級、no longer・no more than などの決まった言い方まで、4択・正誤・整序で正しい形を選べるようになります。
  intro: 中学では、tall－taller－tallest のように形容詞・副詞の形を変えて比べることと、as tall as（同じくらい背が高い）を学びました。長い語は more・most を前に置き、good－better－best のように形が大きく変わる語もあります。比較の文では、形容詞が C になるのか、副詞が M になるのか（@s011）を見分け、than・as の後ろには節が続くもとの形を考えます。この単元を始める前に、上巻の単元1（文型）と単元9（接続詞）を見直しておくと読みやすくなります。
  sections:
  - id: s111
    title: "原級の比較と倍数"
    aim: as ～ as・not as ～ as・倍数・as ～ as possible の形と意味を区別し、as と as の間に入る形を判断できるようになる。
    body:
    - h: as ～ as は「同じくらい」
    - p: 2つのものが同じ程度であることを言うときは、as＋形容詞・副詞の<<原級>>＋as の形を使います。原級とは、-er や -est を付けていない、辞書に載っている元の形のことです。@e1101 では、「ピーターの背の高さ」と「父親の背の高さ」が同じくらいだと言っています。as と as の間には、tall のような形容詞か、fast のような副詞の原級を置き、taller のような形は置きません。
      notes:
      - kind: 用語
        term: 原級
        yomi: げんきゅう
        text: 形容詞・副詞の、-er・-est を付けたり more・most を前に置いたりしていない元の形（tall・fast・useful など）。as ～ as の間に置く。
    - p: 後ろの as は接続詞と同じ働きをし、もとは後ろに S＋V のある節が続きます。@e1102 では［as it looks］（見た目）が節になっています。前と同じ部分は省くのがふつうで、@e1101 の as his father は as his father is (tall) を短くした形です。
      notes:
      - kind: 注意
        text: "比べる相手が代名詞のとき、文法どおりの形は as I am（または as I）。話し言葉では as me もよく使う。as I do・as I can のように、前の動詞に合わせた形を残すこともある。"
    - h: not as ～ as は「〜ほど…ない」
    - p: as ～ as を否定すると、「同じくらいではない」ではなく、「B ほど〜ない」と、A のほうが程度が低いという意味になります（@e1102）。This bag is not as heavy as it looks. は「見た目ほど重くない」、つまり見た目より軽いということです。否定文では、前の as の代わりに so を使って not so ～ as とすることもあります。
    - ex: [e1101, e1102]
    - h: 倍数は X times as ～ as
    - p: 「B の3倍〜」と言うときは、as ～ as の前に three times を置きます（@e1103）。2倍は twice、半分は half を使います。名詞の量や数を比べるときは、名詞を as と as の間に入れて、as much＋数えられない名詞＋as、as many＋数えられる名詞の複数形＋as の形にします（@e1104）。
      notes:
      - kind: 注意
        text: "2倍は twice as ～ as がふつう。two times as ～ as も使われるが、twice times とはしない。倍数の語は as の前に置き、as three times large as のように as の間には入れない。"
    - table:
        head: [言い方, 形, 意味]
        rows:
        - [同じくらい, as＋原級＋as B, "B と{{同じくらい}}〜"]
        - [〜ほどではない, not as（so）＋原級＋as B, "B {{ほど}}〜ない"]
        - [倍数, X times as＋原級＋as B, B の X 倍〜]
        - [2倍・半分, "{{twice}}／half as＋原級＋as B", B の2倍・半分〜]
        - [できるだけ, as＋原級＋as possible, "{{できるだけ}}〜"]
    - ex: [e1103, e1104]
    - h: as ～ as possible と as ～ as S can
    - p: 「できるだけ〜」は as＋原級＋as possible で表します（@e1105）。possible の代わりに S can を使うこともでき、そのときは主語と時制を文に合わせます。@e1106 は過去の話なので、can ではなく could になります。
    - ex: [e1105, e1106]
    - check:
      - q: "My cat is (＿) heavy as my dog.（同じくらい重い）"
        a: as
      - q: "My uncle is (＿) as old as my cousin.（2倍の年齢）"
        a: twice
      - q: "Please come back as early as (＿).（できるだけ早く）"
        a: possible
    examples:
    - id: e1101
      en: "Peter is *as* tall *as* his father."
      ja: ピーターは父親と同じくらいの背の高さだ。
    - id: e1102
      en: "This bag is *not as* heavy [*as* it looks]."
      ja: このかばんは見た目ほど重くない。
    - id: e1103
      en: "Our new gym is *three times as* large *as* the old gym."
      ja: 新しい体育館は、古い体育館の3倍の広さだ。
    - id: e1104
      en: "My brother eats *twice as* much rice [*as* I do]."
      ja: 兄は私の2倍の量のご飯を食べる。
    - id: e1105
      en: "Please send me the photos *as* soon *as possible*."
      ja: できるだけ早く写真を送ってください。
    - id: e1106
      en: "Kazu ran *as* fast [*as* he could] to catch the 7:40 bus."
      ja: カズは7時40分のバスに間に合うように、できるだけ速く走った。
    worked:
    - q: 日本語の意味になるように（　）内の語を並べかえなさい。<br>この湖は、あの池の5倍の広さがある。<br>This lake is ( as / as / five / large / times ) that pond.
      steps:
      - 「〜の5倍の広さ」は倍数なので、X times as＋原級＋as の形を使う。
      - 倍数の five times を先に置き、その後ろに as large as を続ける。as と as の間には原級の large を置く。
      - 比べている2つは This lake と that pond で、どちらも広さを比べる場所としてそろっている。This lake is five times as large as that pond. となる。
      ans: This lake is five times as large as that pond.
      point: 倍数は as ～ as の前に置く。as five times large as のように as の間に入れない。
    - q: "（　）に入る最も適切なものを1つ選びなさい。<br>Amy has read as (＿) books as her sister this year."
      choices: [much, many, more, most]
      steps:
      - 空所は as と as の間。as ～ as の間には原級を置くので、more と most は入らない。
      - 空所の後ろに名詞 books がある。名詞の数や量を比べるときは、as many／much＋名詞＋as の形にする。
      - books は数えられる名詞の複数形なので many を選ぶ。much は money・water のような数えられない名詞に使う。
      ans: "2"
      point: as ～ as の間には原級。名詞が入るときは、数えられる名詞の複数形なら many、数えられない名詞なら much を名詞の前に置く。
    summary:
    - 「B と同じくらい〜」は as＋{{原級}}＋as B。
    - not as（so）～ as B は「B {{ほど}}〜ない」。
    - 倍数は X times を as ～ as の{{前}}に置く。2倍は {{twice}}、半分は half。
    - 「できるだけ〜」は as ～ as {{possible}}、または as ～ as S {{can}}（過去なら could）。
  - id: s112
    title: "比較級・最上級と、比べる2つをそろえる"
    aim: 比較級・最上級を正しく作って強め方を選び、比べる2つが同じ種類にそろっているかを確かめて that of／those of を使えるようになる。
    body:
    - h: 比較級と最上級の作り方
    - p: 2つを比べて「B より〜」と言うときは<<比較級>>＋than を、3つ以上の中で「いちばん〜」と言うときは the＋<<最上級>>を使います。短い語は -er・-est を付け（@e1107）、長い語は more・most を前に置きます（@e1108）。
      notes:
      - kind: 用語
        term: 比較級
        yomi: ひかくきゅう
        text: 形容詞・副詞に -er を付けるか、more を前に置いた形（taller・more useful など）。2つを比べて「より〜」を表し、than と組み合わせる。
      - kind: 用語
        term: 最上級
        yomi: さいじょうきゅう
        text: 形容詞・副詞に -est を付けるか、most を前に置いた形（tallest・most useful など）。3つ以上の中で「いちばん〜」を表し、ふつう the を付ける。
    - table:
        head: [語の形, 作り方, 例]
        rows:
        - [1音節の語, -er／-est, tall－taller－tallest]
        - [-e で終わる語, -r／-st, large－larger－largest]
        - [短い母音＋子音字1つで終わる語, 子音字を重ねて -er／-est, "big－{{bigger}}－biggest"]
        - [子音字＋y で終わる語, y を i にかえて -er／-est, "easy－{{easier}}－easiest"]
        - [2音節の多くの語・3音節以上の語・-ly の副詞, more／most, "useful－{{more useful}}－most useful"]
        - [形が変わる語, 不規則, "good／well－{{better}}－best　bad－{{worse}}－worst　many／much－more－most　little－less－least"]
    - p: この表には例外もあります。2音節でも、happy・early のように子音字＋y で終わる語は happier・earlier とします（early は -ly で終わる副詞でもありますが、more early とはしません）。1音節でも、tired・bored のように過去分詞からできた形容詞は more tired のように more を使います。quiet・simple のように、どちらの形も使う2音節の語もあります。
    - ex: [e1107, e1108]
    - h: than の後ろと、最上級の in・of
    - p: than も as と同じく、後ろに節が来る形がもとです。@e1107 の than her mother は than her mother does（gets up）を短くした形です。最上級では、「どの中でいちばんか」を in か of で示します。in の後ろには場所や集団を表す語（in my class・in Japan）、of の後ろには比べる仲間を表す複数の語句（of the four children・of all）を置きます（@e1109）。
      notes:
      - kind: 注意
        text: "the hottest day of the year のように、ある期間の中でいちばんと言うときは、単数の名詞でも of を使う。副詞の最上級（Kenta runs fastest.）や、同じものの中で比べるとき（The lake is deepest here.）は、the を付けないこともある。"
    - ex: [e1109]
    - h: 比較級・最上級を強める語
    - p: 比較級を「ずっと〜」と強めるときは、much・far・even・a lot を前に置きます（@e1110）。very は原級を強める語なので、very lighter とは言いません。ただし、very much lighter のように much をさらに強める very は使えます。最上級を強めるときは、by far the best のように by far を the の前に置くか、the very best のように very を the の後ろに置きます。
      notes:
      - kind: 注意
        text: "数えられる名詞の複数形が続く more は、many more books のように many で強める。much more books とはしない。"
    - ex: [e1110]
    - h: 比べる2つをそろえる
    - p: 比較の文では、比べる2つが同じ種類のものでなければなりません。@e1111 で比べているのは「この町の人口」と「私の故郷の人口」です。than my hometown とすると、人口と町を比べることになってしまいます。そこで、くり返しになる the population を that で受けて than that of my hometown とします。比べるものが複数なら those を使います（@e1112）。
    - p: 前置詞もそろえます。@e1113 は「京都では」と「札幌では」を比べているので、than の後ろにも in を残して than in Sapporo とします。比較の問題は、次の手順で考えます。
    - label: 比較の手順
      steps:
      - 比べている2つは何かを確かめる。同じ種類のもの（人口と人口、耳と耳）にそろっているか。
      - as ～ as・than・the＋in／of のどれがあるかを見て、原級・比較級・最上級のどれを使うかを決める。
      - 強める語（much か very か）や名詞の数（that か those か）など、ほかの手がかりを確かめる。
    - ex: [e1111, e1112, e1113]
    - check:
      - q: "This question is (＿) more difficult than the first question.（very／much）"
        a: much
      - q: "The climate of Nagano is cooler than (＿) of Tokyo."
        a: that
      - q: "This is the tallest building (＿) our city.（in／of）"
        a: in
    examples:
    - id: e1107
      en: "Yuna gets up *earlier than* her mother on weekdays."
      ja: ユナは平日、母親より早く起きる。
    - id: e1108
      en: "This dictionary is *more useful than* my old dictionary."
      ja: この辞書は、私の古い辞書より役に立つ。
    - id: e1109
      en: "Amy is *the youngest of* the four children in her family."
      ja: エイミーは、家の4人の子どもの中でいちばん年下だ。
    - id: e1110
      en: "The new tablet is *much lighter than* my old tablet."
      ja: 新しいタブレットは、私の古いタブレットよりずっと軽い。
    - id: e1111
      en: "The population of this town is larger than *that* of my hometown."
      ja: この町の人口は、私の故郷の人口より多い。
      gloss:
      - [population, 人口]
    - id: e1112
      en: "The ears of a rabbit are longer than *those* of a cat."
      ja: ウサギの耳はネコの耳より長い。
    - id: e1113
      en: "In summer it is hotter *in* Kyoto than *in* Sapporo."
      ja: 夏は、札幌より京都のほうが暑い。
    worked:
    - q: "（　）に入る最も適切なものを1つ選びなさい。<br>This new bike is (＿) lighter than my old bike."
      choices: [very, much, more, so]
      steps:
      - 比較の手順①：比べている2つは This new bike と my old bike で、自転車どうしでそろっている。
      - 手順②：空所の後ろに lighter と than があるので比較級の文。空所には比較級を強める語が入る。
      - 手順③：very と so は原級を強める語で、比較級の前には置かない。more は、lighter がすでに比較級なので重ねられない。much を選ぶ。
      ans: "2"
      point: 比較級を強めるのは much・far・even・a lot。very lighter・more lighter はどちらも誤り。
    - q: 下線部①〜④のうち、誤りをふくむものを1つ選びなさい。<br>The price __of__① this jacket is __much__② __higher__③ than __the jacket__④ at the station shop.
      steps:
      - 比較の手順①：比べている2つを確かめる。前は The price of this jacket（値段）、than の後ろは the jacket（ジャケット）で、値段と物を比べていてそろっていない。
      - くり返しになる the price を that で受けて、than that of the jacket とする。④が誤り。
      - ①price of、②比較級を強める much は正しい。③は、price（値段）の高い・安いは high・low で表すので higher で正しい。
      ans: ④（the jacket → that of the jacket）
      point: than の前後で比べるものをそろえる。単数や数えられない名詞のくり返しは that of、複数なら those of で受ける。
    summary:
    - 短い語は -er／-est、長い語は {{more}}／{{most}} で比較級・最上級をつくる。
    - 最上級の範囲は、場所・集団なら {{in}}、複数の仲間なら {{of}} で示す。
    - 比較級を強めるのは {{much}}・far・even・a lot。比較級の直前に {{very}} は置かない。
    - 比べる2つをそろえるため、くり返しの名詞を単数なら {{that}}、複数なら {{those}} で受ける。
  - id: s113
    title: "最上級の意味を原級・比較級で表す"
    aim: 最上級の内容を No other ～・any other ～・Nothing ～ の形で言いかえ、other の後ろの名詞の数と、other が要るかどうかを判断できるようになる。
    body:
    - h: 「いちばん」を4つの形で言う
    - p: 「琵琶湖は日本でいちばん大きな湖だ」は、最上級だけでなく原級や比較級でも表せます。@e1114 の最上級の文を、「日本のほかのどの湖も琵琶湖ほど大きくない」（@e1115）、「日本のほかのどの湖も琵琶湖より大きくない」（@e1116）、「琵琶湖は日本のほかのどの湖よりも大きい」（@e1117）と言いかえても、伝える事実は同じです。
    - ex: [e1114, e1115, e1116, e1117]
    - table:
        head: [形, 意味]
        rows:
        - [A is the＋最上級＋in／of ～, A は〜の中でいちばん…]
        - ["{{No other}}＋単数名詞＋V＋as＋原級＋as A", ほかのどの〜も A ほど…ない]
        - [No other＋単数名詞＋V＋比較級＋than A, ほかのどの〜も A より…ない]
        - ["A is＋比較級＋than {{any other}}＋単数名詞", A はほかのどの〜よりも…]
    - h: other の後ろは単数名詞
    - p: No other と any other の後ろには、lake のように数えられる名詞の単数形を置きます。any other lake は「ほかのどの1つの湖と比べても」という意味だからです。No other で始まる文では、主語が単数なので、動詞も is・runs のように単数の主語に合わせた形にします。ただし、all the other lakes（ほかのすべての湖）のように all the other を使うときは複数形にします。
      notes:
      - kind: 注意
        text: "No other lakes are … のように複数形で言うこともあるが、最上級の言いかえでは「No other＋単数名詞＋単数の動詞（is・runs など）」の形を使う。"
    - p: other を付けるのは、主語がその仲間に入っているからです。琵琶湖は「日本の湖」の1つなので、any lake in Japan とすると、琵琶湖が琵琶湖自身とも比べられることになってしまいます。主語が仲間に入っていないときは other を付けません。富士山は韓国の山ではないので、「富士山は韓国のどの山よりも高い」は Mt. Fuji is higher than any mountain in Korea. となります。
    - h: Nothing・anyone else を使う形
    - p: 人や物を特定せずに「〜ほど…なものはない」と言うときは、Nothing・No one を主語にして、as ～ as か比較級＋than を続けます（@e1118）。比較級＋than anyone else・anything else は「ほかのだれ（何）よりも」という意味で、else の後ろには名詞を置きません（@e1119）。
    - ex: [e1118, e1119]
    - check:
      - q: "My father is the oldest member of the team. ＝ No other (＿) of the team is as old as my father."
        a: member
      - q: "Nothing makes my little sister (＿) than ice cream.（happy）"
        a: happier
    examples:
    - id: e1114
      en: "Lake Biwa is *the largest* lake in Japan."
      ja: 琵琶湖は日本でいちばん大きな湖だ。
    - id: e1115
      en: "*No other* lake in Japan is *as* large *as* Lake Biwa."
      ja: 日本のほかのどの湖も、琵琶湖ほど大きくない。
    - id: e1116
      en: "*No other* lake in Japan is *larger than* Lake Biwa."
      ja: 日本のほかのどの湖も、琵琶湖より大きくない。
    - id: e1117
      en: "Lake Biwa is *larger than any other* lake in Japan."
      ja: 琵琶湖は、日本のほかのどの湖よりも大きい。
    - id: e1118
      en: "*Nothing* is *more* important to my grandfather *than* his garden."
      ja: 祖父にとって、庭ほど大切なものはない。
    - id: e1119
      en: "Kazu sings *better than anyone else* in our club."
      ja: カズは部の中で、ほかのだれよりも歌がうまい。
    worked:
    - q: 2つの文がほぼ同じ意味になるように、（　）に適切な語を1語ずつ入れなさい。<br>This is the oldest temple in our city.<br>＝ (＿) (＿) temple in our city is as old as this temple.
      steps:
      - 上の文は最上級で「この寺は市でいちばん古い」。下の文は as old as this temple と原級の形なので、「ほかのどの寺もこの寺ほど古くない」と言いかえる。
      - 「ほかのどの〜も…ない」は No other＋単数名詞。空所の後ろの temple は単数形なので、No other temple となる。
      - 文の頭なので No は大文字で書き始める。動詞が is であることも、単数名詞の主語と合っている。
      ans: No other
      point: 最上級は「No other＋単数名詞＋V＋as 原級 as」で言いかえられる（V は is・runs など、単数の主語に合わせる）。No と other を組で覚える。
    - q: 下線部①〜④のうち、誤りをふくむものを1つ選びなさい。<br>Mr. Shimizu __has taught__① __at__② this school __longer__③ than __any other teachers__④.
      steps:
      - 比較の手順①：清水先生と比べているのは、この学校のほかの先生。清水先生も先生の仲間に入っているので other が要る。
      - 手順②：longer than があるので比較級の文。比較級＋than any other で「ほかのどの先生よりも長く」を表している。
      - 手順③：any other の後ろは単数名詞なので、④を any other teacher にする。①has taught（今までずっと教えている）、②teach at、③比較級 longer は正しい。
      ans: ④（any other teachers → any other teacher）
      point: 比較級＋than any other の後ろは単数名詞。「ほかの先生たち」と考えて複数形にしやすい。
    summary:
    - 最上級は「{{No other}}＋単数名詞＋V＋as 原級 as」「No other＋単数名詞＋V＋比較級 than」で言いかえられる（V は is・runs など）。
    - 「比較級＋than {{any other}}＋{{単数}}名詞」で「ほかのどの〜よりも」。
    - 主語がその仲間に入っていないときは、any の後ろに {{other}} を付けない。
    - 「〜ほど…なものはない」は {{Nothing}} is 比較級 than ～。
  - id: s114
    title: "the＋比較級, the＋比較級 など"
    aim: the＋比較級, the＋比較級 の語順、比較級 and 比較級、the＋比較級 of the two を、意味と形の両方から使い分けられるようになる。
    body:
    - h: 「〜すればするほど…」
    - p: 「〜すればするほど、ますます…」は、The＋比較級＋S V, the＋比較級＋S V. の形で表します（@e1120）。もとの文は We climbed high. と It became cold. で、それぞれの比較級を the と一緒に節の頭に出しています。前半が「〜すれば」と条件を表し、後半が主節にあたります。
      notes:
      - kind: 注意
        text: "前半は条件の副詞節（@s023）に近いので、未来のことでもふつう現在形で表す。The sooner you leave, the earlier you will arrive. のように、will は後半に置く。"
    - p: 比較級の後ろに名詞があるときは、名詞も一緒に前に出します（@e1121）。もとの文は You read many books. なので、The more books you read となり、The more you read books とは言いません。the＋比較級の後ろには、比較級と結びついた名詞まで置いてから S V を続けます。little の比較級 less も同じ形で使い、The less you sleep, the more tired you feel.（睡眠が少ないほど疲れを感じる）のように言います。
    - ex: [e1120, e1121]
    - h: 比較級 and 比較級
    - p: 「ますます〜、だんだん〜」と変化が続くことは、比較級 and 比較級で表します（@e1122）。get・become などの「〜になる」の動詞や、進行形と一緒によく使います。more を使う長い語は、more and more popular のように、more and more の後ろに原級を1つだけ置きます（@e1123）。more popular and more popular とはしません。
    - ex: [e1122, e1123]
    - h: the＋比較級 of the two
    - p: 比較級にはふつう the を付けませんが、「2つ（2人）のうちで、より〜なほう」とどちらかを指すときは、the＋比較級 of the two とします（@e1124）。2つの中で1つに決まるので the が付きます。3つ以上の中から選ぶなら最上級を使います。
      notes:
      - kind: 注意
        text: "話し言葉では the tallest of the two と最上級を使うこともあるが、入試では the＋比較級 を選ぶ。また、is の後ろの C の位置では、Yuna is taller.（the のない比較級）もふつうに使う。the が欠かせないのは、the taller one・bought the cheaper のように名詞の位置に置くとき。"
    - table:
        head: [形, 意味]
        rows:
        - ["The＋比較級＋S V, the＋比較級＋S V", "〜すればする{{ほど}}…"]
        - [比較級 and 比較級, "{{ますます}}〜、だんだん〜"]
        - [more and more＋原級, ますます〜（長い語）]
        - [the＋比較級＋of the two, "2つのうちの{{〜なほう}}"]
    - ex: [e1124]
    - check:
      - q: "The (＿) you start, the earlier you'll finish.（soon）"
        a: sooner
      - q: "It is getting (＿) and (＿).（dark）"
        a: darker／darker
      - q: "Of the two bags, this bag is the (＿).（cheap）"
        a: cheaper
    examples:
    - id: e1120
      en: "*The higher* we climbed, *the colder* it became."
      ja: 高く登れば登るほど、寒くなった。
    - id: e1121
      en: "*The more* books you read, *the more* words you will learn."
      ja: 本を多く読めば読むほど、覚える単語も多くなる。
    - id: e1122
      en: "It is getting *warmer and warmer* day by day."
      ja: 日ごとにだんだん暖かくなっている。
    - id: e1123
      en: "Cycling is becoming *more and more* popular among older people in this town."
      ja: この町では、自転車に乗ることが年配の人の間でますます人気になっている。
    - id: e1124
      en: "Of the two sisters, Yuna is *the taller*."
      ja: 2人の姉妹のうち、ユナのほうが背が高い。
    worked:
    - q: 日本語の意味になるように（　）内の語を並べかえなさい。文頭に来る語も小文字で示してある。<br>早く家を出れば出るほど、早く学校に着く。<br>( leave / sooner / the / you / home ), the earlier you will get to school.
      steps:
      - 「〜すればするほど…」なので、The＋比較級＋S V, the＋比較級＋S V の形を使う。後半は the earlier you will get to school とすでにできている。
      - 前半のもとの文は You leave home soon.。比較級 sooner を the と一緒に節の頭に出す。
      - 残りの you leave home をふつうの S V の語順で続け、The sooner you leave home とする。前半は条件を表すので、will を置かない形で合っている。
      ans: The sooner you leave home, the earlier you will get to school.
      point: the＋比較級を節の頭に出したら、残りはふつうの S V の語順で続ける。
    - q: "（　）に入る最も適切なものを1つ選びなさい。<br>I looked at two bags in the shop and bought (＿) of the two."
      choices: [cheaper, the cheaper, the cheapest, cheapest]
      steps:
      - 比較の手順①：比べているのは、店で見た2つのかばん。
      - 手順②：of the two（2つのうちで）があり、比べるのは2つだけなので最上級は使わない。the cheapest と cheapest は外れる。
      - 手順③：空所は bought の O で、「2つのうちの安いほう」と1つに決まるので the を付ける。the cheaper を選ぶ。
      ans: "2"
      point: 2つのうちの「〜なほう」は the＋比較級 of the two。比較級に the を付ける数少ない形。
    summary:
    - 「〜すればするほど…」は {{The}}＋比較級＋S V, the＋比較級＋S V。
    - 比較級と結びついた名詞は一緒に前に出す（The more {{books}} you read）。
    - 「ますます〜」は比較級 {{and}} 比較級。長い語は {{more and more}}＋原級。
    - 2つのうちの「〜なほう」は {{the}}＋比較級 of the two。
  - id: s115
    title: "比較の決まった言い方"
    aim: than の代わりに to を使う比較、no longer、not so much A as B、no more than・no less than、A is no more B than C is D の意味と形が分かるようになる。
    body:
    - h: than ではなく to を使う比較
    - p: superior（すぐれた）・inferior（劣った）・senior（年上の、立場が上の）・junior（年下の）は、それ自体が「より〜」という比較の意味をもつ語で、比べる相手を than ではなく to で示します（@e1125）。prefer A to B（B より A を好む）も to を使います（@e1126）。prefer の A と B には、名詞か動名詞を置きます。
      notes:
      - kind: 注意
        text: "superior・inferior はすでに比較の意味をふくむので、more superior とはしない。「はるかにすぐれている」は far superior to のように far・much で強める。"
    - ex: [e1125, e1126]
    - h: no longer と not so much A as B
    - p: no longer は「もはや〜ない」という意味で、以前はそうだったが今は違うことを表します（@e1127）。一般動詞の前、be 動詞や助動詞の後ろに置きます。not ～ any longer でも同じ意味を表せます。not so much A as B は「A というよりむしろ B」で、A よりも B のほうが当たっていることを言います（@e1128）。B rather than A と言いかえられます。
    - ex: [e1127, e1128]
    - h: no more than と no less than
    - p: no は「差がゼロ」であることを表します。no more than 800 yen は「800円より多いことは少しもない」、つまり「たった800円」で、少ないという気持ちを表し、only と同じ意味になります（@e1129）。no less than two hours は「2時間より少ないことは少しもない」、つまり「2時間も」で、多いという気持ちを表し、as many as・as much as と同じ意味になります（@e1130）。
    - table:
        head: [言い方, 意味, 言いかえ]
        rows:
        - [no more than ～, "{{たった}}〜（少ないという気持ち）", only]
        - [no less than ～, "〜{{も}}（多いという気持ち）", as many／much as]
        - [not more than ～, 多くても〜, at most]
        - [not less than ～, 少なくとも〜, at least]
      notes:
      - kind: 注意
        text: "not more than・not less than は、話し手の気持ちをふくまず、上限・下限を言うだけ。no と not の違いで意味が変わる。"
    - ex: [e1129, e1130]
    - h: A is no more B than C is D（クジラの文）
    - p: A is no more B than C is D は、「A が B でないのは、C が D でないのと同じだ」という意味です（@e1131）。than の後ろには、だれが見てもありえないこと（ネズミが鳥だ）を置き、「それと同じくらい、A が B だというのもありえない」と強く打ち消します。D が B と同じときは省略するので、@e1131 の than a mouse is は than a mouse is a bird を短くした形です。クジラを例にして説明されることが多いので、クジラの文とも呼ばれます。
    - p: 訳すときは、「C が D でないのと同様に、A は B ではない」と、than の後ろから訳すと意味をとりやすくなります。A is not B any more than C is D も同じ意味です。no more を「もう〜ない」と読まないように、後ろの than を見つけてから意味を決めます。
    - ex: [e1131]
    - check:
      - q: "My grandmother (＿) (＿) drives a car.（もう運転しない）"
        a: no longer
      - q: "I prefer summer (＿) winter."
        a: to
      - q: "There were no (＿) than ten people at the meeting.（たった10人）"
        a: more
    examples:
    - id: e1125
      en: "This new printer is *superior to* the old printer in speed."
      ja: この新しいプリンターは、速さの点で古いプリンターよりすぐれている。
      gloss:
      - [superior, すぐれた]
    - id: e1126
      en: "Peter *prefers* walking *to* taking the bus."
      ja: ピーターはバスに乗るより歩くほうが好きだ。
    - id: e1127
      en: "Mr. Shimizu *no longer* works at this school."
      ja: 清水先生は、もうこの学校では働いていない。
    - id: e1128
      en: "Ms. Lewis is *not so much* a teacher *as* a friend to us."
      ja: ルイス先生は、私たちにとって先生というよりむしろ友達だ。
    - id: e1129
      en: "The concert ticket cost *no more than* 800 yen."
      ja: そのコンサートのチケットはたった800円だった。
    - id: e1130
      en: "We waited in line for *no less than* two hours."
      ja: 私たちは2時間も列に並んで待った。
    - id: e1131
      en: "A bat is *no more* a bird *than* a mouse is."
      ja: コウモリが鳥でないのは、ネズミが鳥でないのと同じだ。
      gloss:
      - [bat, コウモリ]
    worked:
    - q: "（　）に入る最も適切なものを1つ選びなさい。<br>This new camera is superior (＿) the camera I bought three years ago."
      choices: [than, to, for, as]
      steps:
      - 比較の手順①：比べているのは This new camera と the camera I bought three years ago で、カメラどうしでそろっている。
      - 手順②：superior は「よりすぐれた」という比較の意味をもつ語だが、-er の付いた比較級ではない。
      - superior は比べる相手を than ではなく to で示す。to を選ぶ。
      ans: "2"
      point: superior・inferior・senior・junior と prefer A to B は、than ではなく to。「すぐれた」の意味から than を選びやすい。
    - q: "（　）に入る最も適切なものを1つ選びなさい。<br>My uncle is not so much a cook (＿) an artist."
      choices: [than, but, as, to]
      steps:
      - 空所の前に not so much a cook がある。not so much A as B（A というよりむしろ B）の形が考えられる。
      - not so much と組むのは as。than は比較級と、but は not A but B の形で使い、so much と一緒には使わない。
      - 「おじは料理人というよりむしろ芸術家だ」となり、意味も通る。as を選ぶ。
      ans: "3"
      point: not so much A as B は「A というよりむしろ B」で、B のほうに重点がある。not A but B と混ぜて but を選びやすい。
    summary:
    - superior・inferior・prefer A to B は、than ではなく {{to}} で比べる相手を示す。
    - no longer は「{{もはや}}〜ない」、not so much A as B は「A というよりむしろ {{B}}」。
    - no more than は「たった」（＝{{only}}）、no less than は「〜も」（＝as many／much as）。
    - A is no more B than C is D は「A が B でないのは、C が D {{でない}}のと同じ」。
problems:
# ---- 前提チェック ----
- id: q11001
  sec: s111
  set: 前提
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: This box is (＿) than that box.
  choices: [heavy, heavier, heaviest, more heavy]
  ans: "2"
  why: than があるので比較級を選ぶ。heavy は子音字＋y で終わるので、y を i にかえて heavier とする。
  trap: ④more heavy を選ぶ誤り。heavy のような短い語は -er を付けて比較級にする。
  ref: s112
- id: q11002
  sec: s111
  set: 前提
  lv: 1
  kind: 補充
  min: 1
  inst: （　）内の語を適切な形にして1語で入れなさい。
  q: This is the (＿) park in our city. (big)
  ans: biggest
  why: the と in our city（市の中で）があるので最上級。big は短い母音＋子音字1つで終わるので、g を重ねて biggest とする。
  trap: bigest と書く誤り。hot－hottest と同じく、子音字を重ねてから -est を付ける。
  ref: s112
- id: q11003
  sec: s111
  set: 前提
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: Amy can swim as (＿) as her sister.
  choices: [fast, faster, fastest, more fast]
  ans: "1"
  why: as ～ as（同じくらい）の間には原級を置く。fast を選ぶ。
  trap: ②faster を選ぶ誤り。比べる文なので比較級にしたくなるが、as と as の間は -er を付けない元の形。
# ---- s111 節末 ----
- id: q11004
  sec: s111
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: This test was not (＿) difficult as the last test, so I finished it early.
  choices: [as, more, very, than]
  ans: "1"
  why: 後ろに difficult as the last test があるので、not as ～ as（〜ほど…ない）の形。「前のテストほど難しくなかったので早く終わった」と意味も通る。
  trap: ④than を選ぶ誤り。than は比較級（more difficult）と組むので、原級 difficult の前には置けない。
- id: q11005
  sec: s111
  set: 節末
  lv: 1
  kind: 補充
  min: 1
  inst: 日本語の意味になるように、（　）に適切な1語を入れなさい。
  q: この橋はあの橋の2倍の長さだ。<br>This bridge is (＿) as long as that bridge.
  ans: twice
  why: 「2倍」は twice を as ～ as の前に置く。空所は1つなので、2語の two times は入らない。
  trap: double を入れる誤り。倍数を as ～ as の前に置く形では、2倍は twice を使う。
- id: q11006
  sec: s111
  set: 節末
  lv: 1
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: ルイス先生はできるだけていねいに自分の名前を書いた。<br>Ms. Lewis wrote her name ( as / as / carefully / could / she ).
  words: [as, as, carefully, could, she]
  ans: Ms. Lewis wrote her name as carefully as she could.
  why: 「できるだけ〜」は as＋原級＋as S can。過去の文なので can が could になり、as carefully as she could となる。
  trap: as carefully she could as のように、as の位置を崩す誤り。as と as の間に原級を置き、後ろの as の後ろに she could を続ける。
- id: q11007
  sec: s111
  set: 節末
  lv: 2
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: I don't have as (＿) free time as my sister does.
  choices: [many, much, more, most]
  ans: "2"
  why: as と as の間には原級を置くので、more・most は入らない。time（時間）は数えられない名詞なので、as much time as の形にする。
  trap: ①many を選ぶ誤り。名詞を as ～ as の間に入れることには気づいても、time が数えられない名詞であることを見落とす。
- id: q11008
  sec: s111
  set: 節末
  lv: 2
  kind: 和訳
  min: 3
  inst: 次の英文を日本語に訳しなさい。
  q: This summer was not as hot as last summer.
  ans: 今年の夏は、去年の夏ほど暑くなかった。
  alt:
  - 今年の夏は去年ほど暑くなかった。
  why: not as ～ as は「〜ほど…ない」。This summer（今年の夏）と last summer（去年の夏）で、夏と夏を比べている。「〜ほど暑くなかった」と訳せていれば可。
  trap: 「今年の夏は去年の夏と同じくらい暑くはなかった」と訳す誤り。日本語として意味があいまいになる。not as ～ as は「同じではない」ではなく「〜ほど…ない」で、今年のほうが暑くなかったことを言う。
- id: q11009
  sec: s111
  set: 節末
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部①〜④のうち、誤りをふくむものを1つ選びなさい。
  q: This river __is__① about __four times__② as __longer__③ as __the river__④ near my house.
  ans: "3"
  why: as ～ as の間には原級を置くので、③longer を long にする。②four times は as の前に置いた倍数で正しく、④も川と川を比べていてそろっている。
  trap: ②four times を選び、four times longer than にすべきだと考える誤り。four times は as ～ as の前に置ける。誤りは as の間の比較級。
# ---- s112 節末 ----
- id: q11010
  sec: s112
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: This is the (＿) pizza I have ever eaten.
  choices: [good, better, best, well]
  ans: "3"
  why: the と I have ever eaten（今までに食べた中で）があるので最上級。good の最上級は best。
  trap: ②better を選ぶ誤り。better は比較級なので than と組む。前に the があり、than がないので最上級。
