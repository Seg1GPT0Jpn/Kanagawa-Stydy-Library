  ans: 近藤先生が明日学校にいるかどうか、知っていますか。
  alt:
  - 明日、近藤先生が学校にいるかどうか知っていますか。
  why: if の節は know の目的語になる名詞節で、「〜かどうか」と訳す。節の中に will があることも、名詞節だと見分ける手がかりになる。
  trap: 「もし近藤先生が明日学校にいるなら」と条件に訳す誤り。条件の副詞節なら will be ではなく is になる。
- id: q02028
  sec: s021
  set: 確認テスト
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: My father (＿) his old car last year, and now he goes to work by bike.
  choices:
  - sold
  - sells
  - is selling
  - will sell
  ans: '1'
  why: last year（去年）は過去の時を表すので過去形 sold。and の後ろの now he goes は今の習慣で、前半とは時が違う。
  trap: 後半の goes に合わせて sells を選ぶ誤り。1つの文の中でも、部分ごとに時を表す語句を確かめる。
- id: q02029
  sec: s022
  set: 確認テスト
  lv: 1
  kind: 補充
  min: 1
  inst: （　）内の動詞を適切な形に変えなさい（2語以上になる場合もある）。
  q: Ryan can't talk now. He (＿) dinner in the kitchen.（cook）
  ans: is cooking
  why: now（今）話せない理由なので、今まさに料理している途中のこと。現在進行形 is cooking にする。
  trap: cooks と現在形にする誤り。現在形は「（ふだん）料理をする」という習慣の意味になる。
- id: q02030
  sec: s023
  set: 確認テスト
  lv: 2
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: Please send me a message as soon as you (＿) at the station.
  choices:
  - arriving
  - will arrive
  - arrived
  - arrive
  ans: '4'
  why: as soon as（〜するとすぐに）は時を表す語で、as soon as you ＿ at the station は副詞節。中は未来のことでも現在形 arrive。
  trap: as soon as が時を表す副詞節をつくると気づかず、これから先のことなので will arrive を選ぶ誤り。
- id: q02031
  sec: s022
  set: 確認テスト
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部①〜④のうち、誤りをふくむものを1つ選びなさい。
  q: We __are needing__① more chairs for the meeting, so Sam __is bringing__② some __from__③ the classroom __next door__④.
  ans: '1'
  why: need（必要としている）は状態動詞なので進行形にしない。are needing を need にする。②is bringing は今運んでいる途中の動作で正しい。
  trap: 「必要としている」の「〜ている」から進行形を正しいと思う誤り。
- id: q02032
  sec: s021
  set: 確認テスト
  lv: 1
  kind: 補充
  min: 1
  inst: （　）内の動詞を適切な形に変えなさい（2語以上になる場合もある）。
  q: My brother (＿) his phone on the way home yesterday.（drop）
  ans: dropped
  why: yesterday は過去の時を表すので過去形。drop は「短い母音＋子音字1つ」で終わるので、p を重ねて -ed を付ける。
  trap: droped と子音字を重ねずに書く誤り。
- id: q02033
  sec: s023
  set: 確認テスト
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: コンサートが何時に始まるか知っていますか。<br>Do you know ( concert / start / the / time / what / will )?
  words:
  - concert
  - start
  - the
  - time
  - what
  - will
  ans: Do you know what time the concert will start?
  why: what time the concert will start は know の O になる名詞節。what time をひとかたまりにして節の頭に置き、その後ろは S＋V の語順。名詞節なので未来のことに will を使う。
  trap: Do you know what time will the concert start? と疑問文の語順にする誤り。
- id: q02034
  sec: s022
  set: 確認テスト
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: I (＿) what you mean, but I don't agree with you.
  choices:
  - understanding
  - am understanding
  - understand
  - understands
  ans: '3'
  why: understand（分かっている）は状態動詞なので進行形にしない。主語は I なので -s は付かない。
  trap: 「分かっている」の「〜ている」から am understanding を選ぶ誤り。
- id: q02035
  sec: s021
  set: 確認テスト
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部①〜④のうち、誤りをふくむものを1つ選びなさい。
  q: Last Sunday Emi __got__① up early, __made__② sandwiches, and __went__③ to the zoo with her friends. They __see__④ a baby elephant there.
  ans: '4'
  why: Last Sunday（この前の日曜日）の話が2つ目の文にも続いているので、see も過去形 saw にする。①②③は過去形で正しい。
  trap: 文が2つに分かれているため、2つ目の文の時を確かめ忘れる誤り。前の文から続く話なら、同じ過去の時のことである。
- id: q02036
  sec: s012
  set: 確認テスト
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: Your plan sounds (＿). Can you tell me more about it?
  choices:
  - interested
  - interestingly
  - interest
  - interesting
  ans: '4'
  why: sound は SVC の文型をとり、「〜に聞こえる・思える」の意味。C には形容詞を置き、「計画がおもしろい」の関係なので interesting。
  trap: 動詞の後ろだから副詞と考えて interestingly を選ぶ誤り。C（補語）になれるのは名詞か形容詞で、副詞は C にならない。
- id: q02037
  sec: s014
  set: 確認テスト
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: 私たちはその新しい規則をとても不公平だと思った。<br>We ( found / new / rule / the / unfair / very ).
  words:
  - found
  - new
  - rule
  - the
  - unfair
  - very
  ans: We found the new rule very unfair.
  why: find O C で「O が C だと思う・分かる」。O＝the new rule、C＝very unfair で、「規則＝不公平」の関係がある。
  trap: We found very unfair the new rule と C を先に置く誤り。SVOC では O の後ろに C を置く。
