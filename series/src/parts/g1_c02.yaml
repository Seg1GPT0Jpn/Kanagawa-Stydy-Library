# 単元2「時制」（s021〜s023）。例文 e0201〜、問題 q02001〜。
chapters:
- id: c02
  title: 時制
  lead: この単元では、動詞の形で「いつの話か」を表すしくみを学びます。現在形・過去形・進行形・未来の表し方を時の手がかりから選び分け、when や if の節の中で現在形を使うか will を使うかを判断できるようになります。
  intro: 中学では、be 動詞（am・is・are）と一般動詞の現在形・過去形、「be 動詞＋-ing 形」の進行形、未来を表す will と be going to を学びました。主語が3人称単数（he・she・it など）の現在の文では、一般動詞に -s を付けます。過去形は play → played のように -ed を付けるのが基本ですが、go → went のように形が変わる動詞もあります。この単元では、これらの形を「いつの話か」という手がかりから選び分けます。
  sections:
  - id: s021
    title: 現在形と過去形
    aim: 時を表す語句を手がかりに現在形と過去形を選び、正しい形で書けるようになる。
    body:
    - h: 現在形は「今この瞬間」だけではない
    - p: 日本語では「父は毎朝新聞を読む」「クモには脚が8本ある」のように、ふだんくり返すことも、いつも変わらない事実も、同じ形で言います。英語では、こうしたことを現在形で表します。現在形が表すのは「今この瞬間の動作」ではなく、今をはさんで前からも後にも続いている習慣・事実・状態です（@e0201、@e0202）。
      notes:
      - kind: 注意
        text: 「今まさに〜している」という、その場で進んでいる動作は現在形ではなく進行形で表す（@s022）。I read the newspaper. は「（ふだん）新聞を読む」という習慣の意味になる。
    - ex:
      - e0201
      - e0202
      - e0203
    - p: '@e0203 の lives は今の住まい（状態）、walks は毎日くり返すこと（習慣）です。日本語では「住んでいて」「通っている」と「〜ている」の形になりますが、英語は現在形です。主語が3人称単数（he・she・it や、my cousin のように1人・1つを表す名詞）のとき、現在形の動詞には -s か -es が付きます。'
      notes:
      - kind: 参照
        text: 動詞は文の要素の V にあたる（@s011）。英語では V の形で「いつの話か」を表す。
    - h: 過去形は「もう終わった出来事」
    - p: 過去形は、過去のある時に起きて、もう終わった出来事を表します（@e0204）。this morning（今朝）は「今日」の一部ですが、話している時点で終わっていれば過去形を使います。過去形は1回の出来事だけでなく、@e0205 のように過去にくり返していた習慣も表せます。
    - ex:
      - e0204
      - e0205
    - p: 現在形か過去形かを決めるとき、最初に探すのは時を表す語句です。every morning・usually・on Sundays は現在形、yesterday・last week・two years ago・in 2020 は過去形の手がかりになります。こうした語句は文の要素では M（修飾語）にあたり、文型には数えませんが、時制を決める手がかりになります。@e0205 の［When I was ten］のように、S＋V をふくむ節が時を表すこともあります。
    - h: 動詞の形の作り方
    - p: 3人称単数現在の -s と過去形の -ed には、つづりの規則があります。不規則動詞は1つずつ覚えますが、入試に出るのは go・buy・catch・take などの基本の動詞がほとんどです。下の表で、赤字を隠して言えるか確かめます。
    - table:
        head:
        - 元の形の終わり
        - 3人称単数現在
        - 過去形
        - 例
        rows:
        - - ふつうの動詞
          - -s
          - -ed
          - play → {{plays}}／{{played}}
        - - s・sh・ch・x
          - -es
          - -ed
          - watch → {{watches}}／{{watched}}
        - - 子音字＋y
          - y を i に変えて -es
          - y を i に変えて -ed
          - study → {{studies}}／{{studied}}
        - - e
          - -s
          - -d だけ
          - live → {{lives}}／{{lived}}
        - - 短い母音＋子音字1つ（stop・plan・drop）
          - -s
          - 子音字を重ねて -ed
          - stop → {{stops}}／{{stopped}}
        - - 不規則動詞
          - -s・-es（have → has、go → goes）
          - 形が変わる
          - buy → {{bought}}、catch → {{caught}}、go → {{went}}
    - check:
      - q: My sister (＿) the dishes every evening.（wash）
        a: washes
      - q: We (＿) a big fish in the lake last summer.（catch）
        a: caught
    examples:
    - id: e0201
      en: My father *reads* the newspaper on the train every morning.
      ja: 父は毎朝、電車の中で新聞を読む。
    - id: e0202
      en: A spider *has* eight legs.
      ja: クモには脚が8本ある。
      gloss:
      - - spider
        - クモ
    - id: e0203
      en: My cousin *lives* near the station and *walks* to school.
      ja: いとこは駅の近くに住んでいて、歩いて学校へ通っている。
    - id: e0204
      en: We *missed* the 7:40 bus this morning, so we *took* a taxi to school.
      ja: 私たちは今朝7時40分のバスに乗り遅れたので、タクシーで学校へ行った。
      gloss:
      - - miss
        - （乗り物に）乗り遅れる
    - id: e0205
      en: '[When I was ten], I *swam* in the river near my grandparents'' house every summer.'
      ja: 10歳のころ、私は毎年夏に祖父母の家の近くの川で泳いだ。
    worked:
    - q: 次の英文の（ ）内の動詞を適切な形にしなさい。<br>My brother (study) math in the library every Saturday.
      steps:
      - 空所は文の V（動詞）にあたる。まず時を表す語句を探すと、文の終わりに every Saturday（毎週土曜日に）がある。
      - every Saturday は毎週くり返すこと、つまり習慣を表すので、現在形を使う。
      - 主語 My brother は3人称単数なので -s を付ける。study は「子音字＋y」で終わるので、y を i に変えて -es を付ける。
      ans: studies
      point: 時を表す語句 → 現在か過去か → 主語の人称と数、の順に確かめる。studys と書く誤りが多い。
    - q: The bakery near our station (＿) at seven every morning, so I often buy bread there on my way to school.
      choices:
      - opens
      - is opening
      - opened
      - open
      steps:
      - 空所は主語 The bakery near our station に対する V。後ろの so 以下は I often buy（現在形）なので、今の話だと分かる。
      - 時を表す語句は every morning。毎朝くり返す決まった開店時間なので、習慣を表す現在形を選ぶ。
      - is opening は「今まさに開けているところ」か一時的なことを表すので、毎朝の決まりには合わない。opened は過去形で、後ろの often buy と時がずれる。open は3人称単数の -s がない。
      ans: '1'
      point: 「毎朝7時に開いている」と日本語で考えると進行形を選びたくなる。くり返しの習慣は現在形で表す。
    summary:
    - 現在形は、今の{{習慣}}や、いつも変わらない{{事実}}・状態を表す。「今まさに〜している」は{{進行形}}で表す。
    - 過去形は、過去のある時に起きて{{終わった}}出来事や、過去の習慣を表す。
    - every morning・usually は{{現在形}}、yesterday・last week・～ ago は{{過去形}}の手がかり。
    - study → {{studies}}／{{studied}}　stop → {{stopped}}　buy → {{bought}}
  - id: s022
    title: 進行形と状態動詞
    aim: 動作動詞と状態動詞を区別し、進行形にできる動詞とできない動詞を見分けられるようになる。
    body:
    - h: 進行形は「その時、動作の途中」
    - p: 進行形は「be 動詞＋-ing 形」で、ある時に動作が途中であることを表します。現在進行形は今まさに進んでいる動作（@e0206）、過去進行形は過去のある時に途中だった動作です（@e0207）。@e0207 では、電話がかかってきた時点で、シャワーはまだ終わっていません。
    - ex:
      - e0206
      - e0207
    - h: 進行形にしない動詞（状態動詞）
    - p: 動詞には、始まりと終わりがある動作を表す<<動作動詞>>と、ある状態が続いていることを表す<<状態動詞>>があります。状態動詞は、それだけで「続いている」という意味をもつので、ふつう進行形にしません。know（知っている）、belong to（〜のものだ）、resemble（似ている）は、日本語では「〜している」と訳しても、英語では現在形です（@e0208〜@e0210）。
      notes:
      - kind: 用語
        term: 動作動詞
        yomi: どうさどうし
        text: run・eat・write のように、始まりと終わりがある動作を表す動詞。進行形にして「〜している途中だ」と言える。
      - kind: 用語
        term: 状態動詞
        yomi: じょうたいどうし
        text: know・like・have（持っている）・resemble のように、ある状態が続いていることを表す動詞。ふつう進行形にしない。
    - ex:
      - e0208
      - e0209
      - e0210
    - p: 日本語の「〜している」につられて進行形を選ぶのが、この節でいちばん多い誤りです。迷ったら「〜しているところだ（途中だ）」と言いかえてみます。「知っているところだ」「似ているところだ」とは言えないので、know や resemble は進行形にしません。主な状態動詞を表で確かめます。
      notes:
      - kind: 注意
        text: 話し言葉では I am loving this song. のように、状態動詞を進行形にして気持ちの強さを表すこともある。ただし入試の文法問題では、状態動詞は進行形にしない形を選ぶ。
    - table:
        head:
        - 分類
        - 動詞の例
        - 意味
        rows:
        - - 心の状態
          - know, understand, believe, like, love, want, need
          - '{{知っている}}、分かっている、好きだ、必要としている'
        - - 所有・関係
          - have（持っている）, own, belong to, resemble, contain
          - 持っている、{{〜のものだ}}、{{似ている}}、ふくんでいる
        - - 感覚
          - see, hear, smell, taste
          - 見える、聞こえる、においがする、味がする
    - p: 同じ動詞でも、意味によって動作動詞になることがあります。have は「持っている」なら状態動詞ですが、「食べる・過ごす」の意味では動作動詞なので、@e0211 のように進行形にできます。think も「〜と思う（意見）」なら状態ですが、「考えている（頭を働かせている）」なら I am thinking about it. のように進行形にできます。
      notes:
      - kind: 注意
        text: live は「住んでいる」という状態だが、I am living with my aunt this year. のように、一時的に住んでいることは進行形で表せる。
    - ex:
      - e0211
    - check:
      - q: I (＿) the boy in the red cap.（know）
        a: know
      - q: Look. My dog (＿) under the table.（sleep）
        a: is sleeping
    - h: 現在進行形で、決まっている予定を表す
    - p: 現在進行形に next weekend や tomorrow のような未来の時を表す語句を付けると、「〜することになっている」という予定を表します（@e0212）。切符を買った、約束をした、のように準備が進んでいる予定に使います。未来の表し方は、次の節（@s023）で will・be going to と比べます。
    - ex:
      - e0212
    examples:
    - id: e0206
      en: Look. Sam *is carrying* three big boxes up the stairs.
      ja: 見て。サムが大きな箱を3つ、階段の上へ運んでいる。
    - id: e0207
      en: I *was taking* a shower [when you called me last night].
      ja: 昨夜あなたが電話をくれたとき、私はシャワーを浴びていた。
    - id: e0208
      en: Ms. Hill *knows* the names of all 38 students in our class.
      ja: ヒル先生は、私たちのクラスの38人全員の名前を知っている。
    - id: e0209
      en: This old umbrella *belongs* to my grandmother.
      ja: この古い傘は祖母のものだ。
      gloss:
      - - belong to
        - 〜のものだ
    - id: e0210
      en: Nao *resembles* her aunt more than her mother.
      ja: ナオは母親よりもおばに似ている。
      gloss:
      - - resemble
        - 〜に似ている
    - id: e0211
      en: Mr. Kondo *is having* lunch now, so please call back at one.
      ja: 近藤先生は今昼食をとっているので、1時にかけ直してください。
    - id: e0212
      en: We *are visiting* our grandparents in Akita next weekend.
      ja: 私たちは来週末、秋田の祖父母を訪ねることになっている。
    worked:
    - q: I (＿) your sister well. We are in the same tennis club.
      choices:
      - know
      - am knowing
      - knowing
      - knows
      steps:
      - 空所は主語 I に対する V。後ろの文が現在形（are）なので、今の話だと分かる。
      - 日本語にすると「よく知っている」と「〜ている」の形になるが、know は「知っている」という状態を表す状態動詞なので、進行形にしない。
      - 主語は I なので -s は付かない。knowing だけでは V にならない。よって know を選ぶ。
      ans: '1'
      point: 「〜している」と訳せても、状態動詞は現在形で表す。「知っているところだ」と言えるかで確かめる。
    - q: 次の英文の下線部①〜④のうち、誤りをふくむものを1つ選びなさい。<br>My sister and I __are__① very different. I __am resembling__② our father, but my sister __looks__③ like __our__④ mother.
      steps:
      - 下線部を1つずつ確かめる。①are は主語 My sister and I（2人なので複数）に合っている。
      - ②の resemble は「似ている」という状態を表す状態動詞なので、進行形にしない。主語は I なので resemble とする。
      - ③looks like（〜のように見える）は今の様子を表す現在形で正しい。④our は「私」と姉（妹）の2人の母を指すので正しい。
      ans: '2'
      point: 日本語の「似ている」につられて進行形にしない。resemble は他動詞なので、resemble to としないことにも気をつける（@s012）。
    summary:
    - 進行形「be 動詞＋-ing 形」は、ある時に動作が{{途中}}であることを表す。
    - know・belong to・resemble などの{{状態動詞}}は、ふつう進行形に{{しない}}。
    - have は「持っている」なら状態動詞、「{{食べる}}」の意味なら進行形にできる。
    - 現在進行形＋未来の時を表す語句で、決まっている{{予定}}を表す。
  - id: s023
    title: 未来の表し方と、時・条件の副詞節
    aim: will・be going to・現在進行形を使い分け、when・if の節が副詞節か名詞節かで中の時制を決められるようになる。
    body:
    - h: will・be going to・現在進行形
    - p: 英語の動詞には、現在形・過去形のような「未来形」という変化形がありません。未来のことは、will や be going to を動詞の前に置いて表します。will は「〜だろう」という予想のほか、話しているその場で決めたことにも使います（@e0213）。be going to は、今見えている様子から「〜しそうだ」と言うときや（@e0214）、前から決めていたことを言うときに使います（@e0215）。
    - ex:
      - e0213
      - e0214
      - e0215
    - p: 前の節で見た現在進行形は、日時まで決まっている予定を表します（@e0212）。3つの形は意味が重なる部分も大きく、予想を表すときは will と be going to のどちらも使える場面がよくあります。入試の4択では、will と be going to の細かい違いより、次に見る「節の中の時制」がよく問われます。
      notes:
      - kind: 注意
        text: will の後ろも be going to の to の後ろも、動詞は原形。will going to や is going to snows は誤り。
    - table:
        head:
        - 形
        - 主な使い方
        - 例
        rows:
        - - will＋原形
          - 予想、{{その場で決めた}}こと
          - I will carry it for you.
        - - be going to＋原形
          - '{{前から決めていた}}こと、今の様子からの予想'
          - It is going to rain soon.
        - - 現在進行形
          - 日時の決まった{{予定}}
          - We are visiting them next weekend.
    - h: 時・条件を表す副詞節の中は現在形
    - p: '@e0216 は、［When Ryan arrives］と we will start the meeting の2つの部分からできています。文の骨組み（S・V）をつくる we will start the meeting を<<主節>>、when や if などで始まり、主節にくっつく［ ］の部分を<<従属節>>といいます。［When Ryan arrives］は「いつ始めるか」を表し、文の中で M（修飾語）の働きをしています。副詞の働きをするこうした節を<<副詞節>>といいます。'
      notes:
      - kind: 用語
        term: 主節
        yomi: しゅせつ
        text: 文の骨組み（S・V）をつくる節。when・if などで始まる節がくっつく相手。
      - kind: 用語
        term: 従属節
        yomi: じゅうぞくせつ
        text: when・if・because などで始まり、主節にくっついて文の一部になる節。本書では［ ］で示す。
      - kind: 用語
        term: 副詞節
        yomi: ふくしせつ
        text: 文の中で副詞の働き（M）をする節。時・条件・理由などを表す。外しても文の骨組みが残る。
    - p: 時（when・after・before・until・as soon as）や条件（if・unless）を表す副詞節の中では、未来のことでも will を使わず、現在形で表します（@e0216、@e0217）。未来の話であることは主節の will で分かるので、副詞節の中は現在形にする、と覚えておきます。
      notes:
      - kind: 注意
        text: if 節の中でも、If you will help me（手伝ってくださるなら）のように will が相手の「意志」を表すときは will を使う。この形は入試演習編で扱う。
    - ex:
      - e0216
      - e0217
    - h: 名詞節の if・when の中は will を使う
    - p: 同じ if・when でも、文の中で O（目的語）などになるときは別です。@e0218 の［when Sam will come back］は know の目的語で、「サムがいつ戻ってくるか」という意味です。名詞と同じ働き（S・O・C）をする節を<<名詞節>>といいます。名詞節の中では、未来のことは will を使って表します（@e0219）。
      notes:
      - kind: 用語
        term: 名詞節
        yomi: めいしせつ
        text: 文の中で名詞の働き（S・O・C）をする節。if（〜かどうか）・when（いつ〜か）・that などで始まる。
      - kind: 参照
        text: 名詞節・副詞節と、名詞を後ろから説明する節は、単元9でまとめて表にする（@s092）。
    - ex:
      - e0218
      - e0219
    - p: 副詞節か名詞節かは、節の働きと訳し方で見分けます。know・ask・wonder・tell me などの目的語になっていて、「何を知らないのか」の答えにあたる節は名詞節です。訳すと、名詞節の if は「〜かどうか」、when は「いつ〜か」になります。副詞節の if は「もし〜なら」、when は「〜するとき・〜したら」です。
    - table:
        head:
        - ''
        - 副詞節
        - 名詞節
        rows:
        - - 文の中の働き
          - M（外しても文の骨組みが残る）
          - S・O・C（know・ask・wonder などの O が多い）
        - - if の意味
          - '{{もし〜なら}}'
          - '{{〜かどうか}}'
        - - when の意味
          - '{{〜するとき}}'
          - '{{いつ〜か}}'
        - - 未来のことの形
          - '{{現在形}}'
          - '{{will＋原形}}'
    - label: 時制の手順
      steps:
      - 時を表す語句（tomorrow・next week・yesterday など）を探す。
      - いつの話か（今か、過去か、未来か）を決める。単元3では、これを「基準の時」と呼んで考える（@s031）。
      - 空所のある節が副詞節か名詞節かを確かめる。副詞節なら未来のことでも現在形、名詞節なら will を使う。
    - check:
      - q: We will go out after the rain (＿).（stop）
        a: stops
      - q: I wonder if my brother (＿) me tomorrow.（call）
        a: will call
    examples:
    - id: e0213
      en: That bag looks heavy. I *will carry* it for you.
      ja: そのかばん、重そうだね。私が持ってあげるよ。
    - id: e0214
      en: Look at those black clouds. It *is going to rain* soon.
      ja: あの黒い雲を見て。もうすぐ雨が降りそうだ。
    - id: e0215
      en: Emi *is going to study* in Canada next summer, so she practices English every day.
      ja: エミは来年の夏にカナダで勉強するつもりなので、毎日英語を練習している。
    - id: e0216
      en: '[*When* Ryan *arrives*], we *will start* the meeting.'
      ja: ライアンが着いたら、会議を始めます。
    - id: e0217
      en: '[*If* it *rains* tomorrow], we *will have* the sports day next Monday.'
      ja: 明日雨が降ったら、運動会は来週の月曜日に行う。
    - id: e0218
      en: I don't know [*when* Sam *will come* back].
      ja: サムがいつ戻ってくるのか、私は知らない。
    - id: e0219
      en: Nao wants to know [*if* the shop *will be* open on New Year's Day].
      ja: ナオは、その店が元日に開いているかどうかを知りたがっている。
      gloss:
      - - New Year's Day
        - 元日
    worked:
    - q: We will start dinner when Dad (＿) home.
      choices:
      - comes
      - will come
      - came
      - coming
      steps:
      - 空所は when の後ろの節の V。主語は Dad（3人称単数）。
      - 時を表す語句を探す。主節 We will start dinner の will から、これから先（未来）の話だと分かる。
      - when Dad ＿ home は「父が帰ってきたら」という時を表す副詞節で、主節に対して M の働きをしている。副詞節の中は未来のことでも現在形なので、comes を選ぶ。
      ans: '1'
      point: 未来の話だからと will come を選ぶ誤りが多い。時・条件の副詞節の中は現在形で、未来であることは主節の will が表す。
    - q: I don't know if Mr. Kondo (＿) us to the museum next Friday.
      choices:
      - takes
      - will take
      - took
      - taking
      steps:
      - 空所は if の後ろの節の V。時を表す語句は next Friday で、未来の話。
      - if の節が文の中で何をしているかを確かめる。I don't know の後ろで「何を知らないのか」にあたり、know の目的語（O）になっている。つまり名詞節で、if は「〜かどうか」の意味。
      - 名詞節の中では未来のことを will で表すので、will take を選ぶ。took は過去で next Friday に合わず、taking だけでは V にならない。
      ans: '2'
      point: if を見たらすぐ現在形を選ぶのではなく、副詞節（もし〜なら）か名詞節（〜かどうか）かを先に確かめる。
    summary:
    - will は予想や{{その場で決めた}}こと、be going to は{{前から決めていた}}ことや今の様子からの予想を表す。
    - 時・条件を表す{{副詞節}}の中では、未来のことでも{{現在形}}を使う。
    - know・wonder などの目的語になる if・when の節は{{名詞節}}で、未来のことは{{will}}で表す。
    - if の意味：副詞節は「{{もし〜なら}}」、名詞節は「{{〜かどうか}}」
