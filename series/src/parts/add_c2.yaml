chapters:
- id: c2
  sections:
  - id: s07
    worked:
    - q: "Haruto showed us the beach (＿) he caught a big fish last summer."
      choices: [which, where, when, what]
      steps:
      - 先行詞を確かめる。(＿) の直前の the beach は場所を表す名詞。ただし、これだけではまだ決めない。
      - 後ろの節 he caught a big fish last summer で欠けているものを探す。主語 he、動詞 caught（catch「〜をつかまえる」）、caught の目的語 a big fish がそろっていて、何も欠けていない完全な文。
      - 先行詞の直後にコンマはない。完全な文の前に置けるのは関係副詞で、先行詞が場所なので where を選ぶ。
      ans: "2"
      point: which は節の中で主語や目的語の代わりをする語なので、目的語 a big fish までそろった節の前には置けない。先行詞が場所かどうかを見る前に、後ろの節が完全な文かを確かめる。
    - q: "The hospital (＿) Riku was born in 2009 is next to a big park."
      choices: [when, which, in which, on which]
      steps:
      - 先行詞を確かめる。The hospital は場所を表す名詞。節の中の in 2009 は時の語句だが、先行詞ではない。
      - 後ろの節 Riku was born in 2009 は、主語 Riku と動詞 was born がそろい、何も欠けていない完全な文。完全な文の前に which だけを置くことはできない。
      - 関係副詞なら where が入るが、選択肢にない。where は「前置詞＋which」で言いかえられる。もとの文は Riku was born in the hospital.（at the hospital とも言う）で、on は使わないので in which を選ぶ。
      ans: "3"
      point: where か when かは先行詞の意味で決まり、節の中の時の語句（in 2009）では決まらない。前置詞＋which の前置詞は、もとの文で先行詞の前に付く前置詞を使う。
  - id: s08
    worked:
    - q: "Mr. Ishii told us the reason (＿) the swimming pool was closed last week."
      choices: [why, how, which, where]
      steps:
      - 先行詞を確かめる。(＿) の直前の the reason は「理由」を表す名詞。
      - 後ろの節 the swimming pool was closed last week で欠けているものを探す。主語 the swimming pool と動詞 was closed（閉められた）がそろっている。受け身の文なので、closed の後ろに目的語がなくても欠けてはいない。何も欠けていない完全な文。
      - 完全な文の前に置けるのは関係副詞。先行詞が the reason なので why を選ぶ（that でもよく、省略もできる）。
      ans: "1"
      point: which を選べるのは、節の中で主語や目的語などが欠けているときだけ。受け身の文は動詞の後ろに目的語がないように見えても、完全な文である。
    - q: 電車が止まっていた。だから、母が車で学校まで送ってくれた。<br>The trains were not running this morning. (＿) my mother drove me to school.
      choices: [That's because, That's why, That's where, That's what]
      steps:
      - 日本語で2つの文の関係を確かめる。「電車が止まっていた」が理由で、「母が車で送ってくれた」が結果。
      - That's why の後ろには結果が、That's because の後ろには理由がくる。(＿) の後ろは結果なので That's why が合う。
      - why の後ろの my mother drove me to school は、drove の目的語 me もある完全な文。先行詞 the reason が省かれた why 節である。what は欠けた語の代わりをするので、この完全な文の前には置けない。
      ans: "2"
      point: That's because を入れると「それは母が車で送ってくれたからだ」となり、理由と結果が逆になる。前の文が理由なのか結果なのかを先に決めてから選ぶ。
  - id: s09
    worked:
    - q: "The temple (＿) we saw from the train window was built about 400 years ago."
      choices: [where, which, when, who]
      steps:
      - 先行詞を確かめる。The temple は場所を表す名詞なので where に見えるが、ここではまだ決めない。
      - 関係詞の後ろの節 we saw from the train window だけを取り出す。saw（see「〜を見る」）は目的語が必要な動詞なのに、saw の後ろに「何を」がない。from the train window は「電車の窓から」という副詞のまとまりで、目的語ではない。
      - 目的語が欠けた不完全な文なので関係代名詞を使う。先行詞は人以外なので which を選ぶ（that でもよく、省略もできる）。
      ans: "2"
      point: 文全体の動詞は was built。「場所の名詞なら where」と決めず、後ろの節で目的語が欠けていないかを確かめる。
    - q: "The small island (＿) Mr. Ishii grew up on has only one bus stop."
      choices: [where, on which, which, when]
      steps:
      - 先行詞 The small island は場所を表す名詞。関係詞の後ろの節 Mr. Ishii grew up on を取り出す。
      - 節の最後の on の後ろに名詞がない。grow up（育つ）は目的語をとらないが、前置詞 on の目的語が欠けているので不完全な文になる。
      - 欠けた前置詞の目的語の代わりをするのは which。where を入れると節の最後の on が余り、on which を入れると on が2回になる。
      - 文全体の動詞は has。［which Mr. Ishii grew up on］を外すと The small island has only one bus stop. が残る。
      ans: "3"
      point: 前置詞が節の最後に残っていたら、その前置詞の後ろが欠けていないかを確かめる。on がなければ、the island where Mr. Ishii grew up のように where が正しくなる。
problems:
- id: q2201
  sec: s07
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: This is the station (＿) Grace changes trains on her way to school.
  choices: [which, when, where, who]
  ans: "3"
  why: 節 Grace changes trains on her way to school は、changes の目的語 trains もそろった完全な文。場所を表す先行詞 the station の後ろで「その駅で」という副詞の代わりをするのは where。
  trap: 先行詞 the station が物なので①which を選ぶ誤り。which は節の中で欠けた主語や目的語の代わりをする語で、trains で目的語がそろった節の前には置けない。
- id: q2202
  sec: s07
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  q: June is the month (＿) it rains almost every day in this town.
  choices: [where, which, when, whose]
  ans: "3"
  why: 節 it rains almost every day in this town は、主語 it と動詞 rains がそろった完全な文。先行詞 the month は時を表すので、「その月に」という副詞の代わりをする when が入る。
  trap: 節の最後の in this town に引かれて①where を選ぶ誤り。where か when かは先行詞 the month で決まり、節の中の場所の語句では決まらない。
- id: q2203
  sec: s07
  set: 節末
  lv: 1
  kind: 補充
  min: 1
  inst: （　）に適切な1語を入れなさい。
  q: Owen showed me the classroom (＿) his father studied thirty years ago.
  ans: where
  why: 節 his father studied thirty years ago は、主語 his father と動詞 studied がそろった完全な文（ここの study は「勉強する」で、目的語をとっていない）。先行詞 the classroom は場所なので where。
  trap: thirty years ago という時の語句に引かれて when を入れる誤り。先行詞は the classroom で、時ではなく場所を表す。
- id: q2204
  sec: s07
  set: 節末
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部のうち、誤りを含むものを1つ選びなさい。
  q: Kana __still__① remembers the afternoon __where__② she __won__③ her first tennis match __at__④ the city park.
  choices: [①, ②, ③, ④]
  ans: "2"
  why: 先行詞 the afternoon は時を表す。節 she won her first tennis match at the city park は won の目的語もある完全な文なので、時の副詞の代わりをする when に直す。
  trap: at the city park という場所の語句に引かれて、②where は正しいと考える誤り。where か when かは、節の中の語句ではなく先行詞 the afternoon で決まる。
- id: q2205
  sec: s07
  set: 節末
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: 金曜日は、私たちが体育館でバスケットボールをする日だ。<br>Friday is ( day / on / play / the / we / which ) basketball in the gym.
  words: [day, "on", play, the, we, which]
  ans: Friday is the day on which we play basketball in the gym.
  why: 節 we play basketball in the gym は完全な文なので、関係副詞 when の代わりに「前置詞＋which」を使う。もとの文は we play basketball on Friday で、曜日の前の前置詞 on を which の前に置く。
  trap: the day which we play … と which を day の直後に置き、on が余って困る誤り。which だけでは完全な文の前に置けないので、on とひとまとまりにして on which とする。
- id: q2206
  sec: s08
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: Haruto told me the reason (＿) he joined the cooking club.
  choices: [how, which, why, where]
  ans: "3"
  why: 節 he joined the cooking club は、joined の目的語 the cooking club もそろった完全な文。先行詞 the reason の後ろで理由を表す関係副詞は why。
  trap: 先行詞 the reason が物なので②which を選ぶ誤り。which は欠けた主語や目的語の代わりをする語で、何も欠けていない節の前には置けない。
- id: q2207
  sec: s08
  set: 節末
  lv: 1
  kind: 補充
  min: 1
  inst: 日本語の意味になるように、（　）に適切な1語を入れなさい。
  q: これが、祖母が着物をたたむやり方だ。<br>This is (＿) my grandmother folds her kimono.
  ans: how
  why: 「〜するやり方」は how S V で表す。how の後ろの my grandmother folds her kimono は、folds の目的語 her kimono もある完全な文。
  trap: 「やり方」から the way を思いつき、1語にするために way だけを入れる誤り。This is way … とは言えない。1語なら how、2語なら the way になる。
- id: q2208
  sec: s08
  set: 節末
  lv: 1
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: 天気予報では、午後に雨が降るそうだ。だから私は傘を持ってきた。<br>The weather report says it will rain this afternoon. That's ( brought / I / my / umbrella / why ).
  words: [brought, I, my, umbrella, why]
  ans: The weather report says it will rain this afternoon. That's why I brought my umbrella.
  why: 「だから〜」は That's why S V。前の文（雨が降る）が理由で、why の後ろに結果（傘を持ってきた）を完全な文 I brought my umbrella の形で続ける。
  trap: That's my umbrella why I brought … のように、my umbrella を That's の直後に置く誤り。「だから」の意味にならず、文も成り立たない。why のすぐ後ろに主語 I を置く。
- id: q2209
  sec: s08
  set: 節末
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部のうち、誤りを含むものを1つ選びなさい。
  q: __The reason which__① Sofia missed the club meeting __on__② Tuesday __was__③ that she __had__④ a bad cold.
  choices: [①, ②, ③, ④]
  ans: "1"
  why: 節 Sofia missed the club meeting on Tuesday は、missed の目的語 the club meeting もある完全な文なので、which は置けない。The reason why（または The reason that、The reason だけ）に直す。
  trap: ③was を「理由なら was because にすべき」と考えて選ぶ誤り。The reason … was that S V は「理由は〜ということだった」という正しい形である。
- id: q2210
  sec: s08
  set: 節末
  lv: 3
  kind: 和訳
  min: 3
  inst: 次の英文を日本語に訳しなさい。
  q: The way Mr. Ishii explains history is so clear that even students who don't like the subject listen to him carefully.
  ans: 石井先生の歴史の説明の仕方はとてもわかりやすいので、その教科が好きではない生徒でさえ、先生の話を注意深く聞く。
  alt:
  - 石井先生が歴史を説明するやり方はとても明快なので、歴史が好きではない生徒でも先生の話をしっかり聞く。
  why: The way の後ろに完全な文 Mr. Ishii explains history が続き、「石井先生が歴史を説明するやり方」がこの文の主語になる。動詞は is で、so 〜 that … は「とても〜なので…」。この2点がとれていれば可。
  trap: Mr. Ishii explains を文の主語と動詞と考え、「石井先生は歴史を説明し、それはとてもわかりやすい」と切って訳す誤り。The way から history までが1つの主語で、文の動詞は is である。
- id: q2211
  sec: s09
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: Haruto lives in a house (＿) has a big cherry tree in the garden.
  choices: [where, which, when, what]
  ans: "2"
  why: 節 has a big cherry tree in the garden には、動詞 has の主語がない。欠けた主語の代わりをするのは関係代名詞の which（that でもよい）。
  trap: 先行詞 a house が場所なので①where を選ぶ誤り。where の後ろは主語と動詞のそろった完全な文でなければならないが、この節には主語がない。
- id: q2212
  sec: s09
  set: 節末
  lv: 1
  kind: 補充
  min: 1
  inst: 各文の（　）に where か which のどちらかを入れなさい。
  q: (1) Owen likes the café (＿) he can study quietly after school.<br>(2) Owen likes the café (＿) his sister opened last year.
  ans: (1) where (2) which
  why: (1) の節 he can study quietly after school は完全な文なので、関係副詞の where。(2) の節 his sister opened last year は opened の目的語が欠けた不完全な文なので、関係代名詞の which。
  trap: 先行詞が同じ the café なので、両方に where を入れる誤り。どちらを使うかは先行詞ではなく、後ろの節に欠けた語があるかで決まる。
- id: q2213
  sec: s09
  set: 節末
  lv: 1
  kind: 正誤
  min: 1
  inst: 下線部のうち、誤りを含むものを1つ選びなさい。
  q: We __visited__① Kyoto last week and __stayed__② at a hotel __where__③ my aunt recommended __to__④ us.
  choices: [①, ②, ③, ④]
  ans: "3"
  why: recommend は「〜をすすめる」という意味で目的語が必要な動詞。節 my aunt recommended to us では recommended の目的語が欠けているので、which（または that）に直す。
  trap: 先行詞 a hotel が場所なので③where は正しいと考え、④to を疑う誤り。recommend A to B（A を B にすすめる）の to で、④は正しい。
