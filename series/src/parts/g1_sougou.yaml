  passage: '**A（推敲）**<br>My Summer Volunteer Work<br>Last summer, I __have joined__① a volunteer group at a children''s center near my house. Every Tuesday, I helped first and second graders with their homework. At first, I was nervous because I had never taught anyone before. However, the children were friendly, and soon I enjoyed __to read__② picture books with them.<br>One day, a boy named Kota showed me a drawing of a big ship. He said that he wanted to be a captain like his grandfather, who had worked on ships for forty years. I could see how much he loved his grandfather.<br>Through this work, I learned that teaching is __more harder__③ than it looks. I also learned that children notice small changes in our faces. Smiling at them made them feel safe, so I tried to smile even when I was tired.<br>Next summer, I want to join the group again and become a better helper.'
