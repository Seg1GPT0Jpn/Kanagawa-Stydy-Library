  q: Our bus __reached to__① the airport thirty minutes __later__② than we __had planned__③ __because of__④ the heavy traffic.
  ans: "1"
  why: reach は他動詞なので、後ろに直接 O を置く。reached the airport に直す。④because of の後ろは名詞の the heavy traffic で正しい。
  trap: arrive at・get to と同じように前置詞を付ける誤り。arrive・get は自動詞だが、reach は他動詞。
