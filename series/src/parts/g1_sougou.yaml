  q: Haruka passed the entrance exam, (＿) made her parents very happy.
  choices: [that, what, which, it]
  ans: "3"
  why: コンマの後ろで made の S が欠けている。前の文の内容全体（試験に合格したこと）を受ける非制限用法の which。
  trap: ①that を選ぶ誤り。コンマの後ろの関係詞節（非制限用法）では that を使わない。④it は代名詞なので、2つの文を接続詞なしでつなぐことになる。
