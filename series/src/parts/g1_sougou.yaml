  min: 1
  q: Yuta runs faster than (＿) student in his class.
  choices: [any other, other, all the, any others]
  ans: "1"
  why: 比較級＋than any other＋単数名詞で「ほかのどの〜よりも」。後ろの student が単数なので any other。
  trap: ③all the を選ぶ誤り。all the の後ろは複数名詞になる。②other だけでは単数名詞の前に置けず、ユウタ自身もクラスの生徒なので any の後ろの other は落とせない。
- id: q90098
  part: 4
  sec: s131
  set: 総合演習
  lv: 1
  kind: 4択
  min: 1
  q: We don't have (＿) furniture in our new apartment yet.
  choices: [many, much, a few, few]
  ans: "2"
  why: furniture は数えられない名詞なので、量を表す much を使う。
  trap: ①many を選ぶ誤り。机やいすのように数えられる物を思いうかべてしまう。furniture は家具全体をまとめて言う名詞で、数えられない。
- id: q90099
  part: 4
  sec: s144
  set: 総合演習
  lv: 2
  kind: 4択
  min: 1
  q: I have two bikes, but (＿) of them works well.
  choices: [both, either, neither, none]
  ans: "3"
  why: 2台とも調子が悪いので、2つについて「どちらも〜ない」の neither。neither of them は単数で受けるので works と合う。
  trap: ④none を選ぶ誤り。none は3つ以上について「どれも〜ない」と言うときに使う。2つなら neither。
- id: q90100
  part: 4
  sec: s203
  set: 総合演習
  lv: 2
  kind: 4択
  min: 1
  q: It (＿) me 3,000 yen to have my bike repaired.
  choices: [took, spent, cost, paid]
  ans: "3"
  why: It cost 人 お金 to do で「〜するのに（人に）お金がかかる」。お金のときは cost（過去形も cost）。
  trap: ①took を選ぶ誤り。It takes 人 時間 to do と混同している。take は時間、cost はお金。spend は人が主語になる。
- id: q90101
  part: 4
  sec: s103
  set: 総合演習
  lv: 2
  kind: 4択
  min: 1
  q: The hotel (＿) we stayed at last summer was near the beach.
  choices: [where, which, what, in which]
  ans: "2"
  why: stayed at の後ろに名詞がなく、前置詞 at の後ろが欠けた不完全な文。欠けた位置に The hotel が入るので、関係代名詞 which。
  trap: ①where を選ぶ誤り。先行詞が場所だから where と決めてしまう。where を使うなら at を取って The hotel where we stayed とする。④in which も at と重なる。
- id: q90102
  part: 4
  sec: s173
  set: 総合演習
  lv: 2
  kind: 4択
  min: 1
  q: (＿) all the members of our club live near the school. Some of them come by train.
  choices: ["No", "Not", "None", "Never"]
  ans: "2"
  why: 後ろの文から、電車で来る部員もいる。not all で「全員が〜とは限らない」という部分否定。
  trap: ③None を選ぶ誤り。none は「だれも〜ない」という全体否定で、後ろに all the members を続ける形もない。
# ---- 正誤 ----
- id: q90103
  part: 4
  sec: s074
  set: 総合演習
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部①〜④のうち、誤りをふくむものを1つずつ選びなさい。
  q: Leo __has lived__① in Hokkaido __for__② ten years, so he is used to __walk__③ on snowy roads __in__④ winter.
  ans: "3"
  why: be used to の to は前置詞なので、後ろの動詞は doing にする。walking に直す。①has lived は10年間続いている状態を表す現在完了で正しい。
  trap: used to do（以前は〜したものだ）と混同して、原形を正しいと思う誤り。be 動詞があれば「〜に慣れている」で、to の後ろは doing。
- id: q90104
  part: 4
  sec: s104
  set: 総合演習
  lv: 2
  kind: 正誤
  min: 1
  q: Thank you __for__① everything __what__② you __did__③ for us __during__④ our stay.
  ans: "2"
  why: what は先行詞をふくむので、先行詞 everything の後ろには置けない。that に直す（省略してもよい）。④during の後ろは名詞の our stay で正しい。
  trap: 「〜すること・もの」という訳から what を正しいと思う誤り。前に先行詞があれば that（または which）を使う。
- id: q90105
  part: 4
  sec: s053
  set: 総合演習
  lv: 2
  kind: 正誤
  min: 1
  q: Kanon __was laughed__① by some students when she __made__② a mistake __in__③ her speech, but she __kept__④ going.
  ans: "1"
  why: laugh at（〜を笑う）は群動詞なので、受動態でも at を残す。was laughed at に直す。
  trap: 能動態の laugh at の at を落として、was laughed by とする誤り。群動詞は全体で1つの他動詞として受動態にする。
- id: q90106
  part: 4
  sec: s085
  set: 総合演習
  lv: 2
  kind: 正誤
  min: 1
  q: Mr. Hirano sat on the bench __with__① his legs __crossing__②, __reading__③ a newspaper __quietly__④.
  ans: "2"
  why: 付帯状況の with O doing／done。脚は「組まれる」側なので過去分詞にして crossed に直す。③reading は「新聞を読みながら」という付帯状況の分詞構文で、平野さんが「読む側」なので正しい。
  trap: 後ろの reading と同じように -ing 形を正しいと思う誤り。with の後ろの名詞（his legs）がする側か、される側かで決める。
- id: q90107
  part: 4
  sec: s201
  set: 総合演習
  lv: 2
  kind: 正誤
  min: 1
  q: __After__① dinner, I was __so__② tired __that__③ I __laid__④ down on the sofa.
  ans: "4"
  why: 後ろに O がないので、自動詞 lie（横になる）を使う。lie の過去形は lay なので、lay down に直す。laid は他動詞 lay（〜を置く）の過去形。
  trap: 「横になった」を laid と書く誤り。話し言葉では laid をこの意味で使う人もいるが、入試では O がなければ lie の活用（lie－lay－lain）を使う。
# ---- 整序 ----
- id: q90108
  part: 4
  sec: s063
  set: 総合演習
  lv: 1
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: 父は私に彼の車を運転させてくれなかった。<br>My father ( car / didn't / drive / his / let / me ).
  words: [car, didn't, drive, his, let, me]
  ans: My father didn't let me drive his car.
  why: let O 原形 で「O に（望みどおり）〜させる」。me の後ろに原形 drive を置く。
  trap: My father didn't let me to drive とする誤り（to は与えられていない）。使役の let の後ろは to のない原形。
- id: q90109
  part: 4
  sec: s074
  set: 総合演習
  lv: 1
  kind: 整序
  min: 2
  q: 今日は外出したい気分ではない。<br>I ( don't / feel / going / like / out ) today.
  words: [don't, feel, going, like, out]
  ans: I don't feel like going out today.
  why: feel like doing で「〜したい気がする」。like は前置詞なので、後ろの動詞は going。
  trap: I don't like feel going out とする誤り。feel like は2語で1つの言い方で、feel の直後に like を置く。
- id: q90110
  part: 4
  sec: s115
  set: 総合演習
  lv: 2
  kind: 整序
  min: 2
  q: 祖父は、電車で旅行するよりバスで旅行するほうが好きだ。<br>My grandfather ( bus / by / prefers / to / traveling ) traveling by train.
  words: [bus, by, prefers, to, traveling]
  ans: My grandfather prefers traveling by bus to traveling by train.
  why: prefer A to B で「B より A を好む」。好きな方の traveling by bus を A に置き、比べる相手の前に to を置く。
  trap: prefers traveling by train to … のように A と B を逆にする誤り。好きな方を prefer の直後に置く。than は使わない。
- id: q90111
  part: 4
  sec: s013
  set: 総合演習
  lv: 1
  kind: 整序
  min: 2
  q: 母が私に新しいかばんを買ってくれた。<br>My mother ( a / bag / bought / for / me / new ).
  words: [a, bag, bought, for, me, new]
  ans: My mother bought a new bag for me.
  why: buy は「相手のために自分でする」動作なので、SVO＋for 人 の形にする。bought a new bag for me。
  trap: bought a new bag to me とする混同（この問題では to は与えられていない）。give・send は to、buy・make は for。
- id: q90112
  part: 4
  sec: s043
  set: 総合演習
  lv: 2
  kind: 整序
  min: 2
  q: 彼は昨日そのニュースを聞いたにちがいない。<br>He ( have / heard / must / news / the ) yesterday.
  words: [have, heard, must, news, the]
  ans: He must have heard the news yesterday.
  why: 過去のことの推量「〜したにちがいない」は must have＋過去分詞。
  trap: He must heard the news とする誤り。助動詞の後ろは原形なので、過去のことは have＋過去分詞で表す。
# ---- 補充 ----
- id: q90113
  part: 4
  sec: s022
  set: 総合演習
  lv: 1
  kind: 補充
  min: 1
  inst: （　）内の動詞を適切な形に変えて、2語で答えなさい。
  q: Look! Your dog (＿) (＿) after a cat in the garden.（run）
  ans: is running
  why: Look! から、今まさに動作が途中であることを表す。現在進行形 is running（n を重ねる）。
  trap: runs とする誤り。現在形はいつもの習慣を表し、「今〜している」には使わない。running の n の重ね忘れにも注意。
- id: q90114
  part: 4
  sec: s154
  set: 総合演習
  lv: 1
  kind: 補充
  min: 1
  inst: 日本語の意味になるように、（　）に適切な語を1語入れなさい。
  q: 部屋が暗くて、ほとんど何も見えなかった。<br>The room was so dark that I could (＿) see anything.
  ans: hardly
  alt: [scarcely, barely]
  why: 「ほとんど〜ない」は hardly。否定の意味をふくむので not は付けない。
  trap: hard を入れる誤り。hard は「一生懸命に・激しく」で、hardly とは意味がまったく違う。
- id: q90115
  part: 4
  sec: s192
  set: 総合演習
  lv: 1
  kind: 補充
  min: 1
  inst: 2つの文がほぼ同じ意味になるように、（　）に適切な語を1語ずつ入れなさい。
  q: Mana said to me, "I will lend you my umbrella."<br>＝ Mana told me that she (＿) lend (＿) her umbrella.
  ans: would／me
  why: 伝える文の told が過去形なので、will を would にずらす。マナの言った you は、伝える人（私）から見ると me になる。
  trap: will と you をそのまま残す誤り。間接話法では、時制と代名詞を伝える人の立場から直す。
# ---- 読解 ----
- id: q90116
  part: 4
  sec: s065
  set: 総合演習
  lv: 1
  kind: 読解
  min: 4
  inst: 次の英文を読み、問いの答えとして最も適切なものを1つずつ選びなさい。
  passage: '**A（メール）**<br>Subject: Thank you<br>Dear Ms. Abe,<br>I got home to Vancouver safely last night. The flight was long, and I was too tired to unpack my bag, so I went straight to bed.<br>Thank you again for the two weeks I spent at your school. Before I came to Japan, I was worried that I would not make any friends because I couldn''t speak Japanese. But your students talked to me every day, and some of them even taught me how to write my name in kanji. It was not until I said goodbye at the airport that I realized how much I would miss them.<br>I''m sending you some photos I took during my stay. The one showing the students wearing yukata is my favorite. I wish I had stayed longer.<br>My mother says that if you ever come to Canada, you should stay with us. Our house is near a lake where you can go fishing in summer.<br>Please say hello to everyone in Class 2-B.<br>Best wishes,<br>Nora'
  q: 問　Why did Nora go straight to bed last night?
  choices:
  - Because she had already unpacked her bag.
  - Because she was so tired that she couldn't unpack her bag.
  - Because her bag was too heavy for her to carry.
  - Because she had to get up early the next morning.
  ans: "2"
  why: too tired to unpack は「荷ほどきするには疲れすぎていた」＝「とても疲れていたので荷ほどきできなかった」。so tired that she couldn't unpack と同じ意味。
  trap: ①を選ぶ誤り。too ～ to do を「〜して…した」と肯定の意味に読んでしまう。too ～ to do は「…できない」という否定の意味をふくむ。
- id: q90117
  part: 4
  sec: s181
  ref: [s181, s174]
  set: 総合演習
  lv: 2
  kind: 読解
  min: 1
  q: 問　When did Nora realize how much she would miss the students?
  choices:
  - before she came to Japan
  - when she learned to write her name in kanji
  - when she said goodbye at the airport
  - after she arrived home in Vancouver
  ans: "3"
  why: It was not until I said goodbye at the airport that I realized … は、not until B（B して初めて）を It was と that で強めた強調構文。「空港で別れを告げて初めて、どれほど寂しくなるか気づいた」。
  trap: ④を選ぶ誤り。not until を「〜するまで…なかった」と読んだところで止まり、気づいたのはもっと後だと考えてしまう。気づいたのは空港で別れたその時。
- id: q90118
  part: 4
  sec: s123
  set: 総合演習
  lv: 2
  kind: 読解
  min: 1
  q: 問　What does Nora mean by "I wish I had stayed longer"?
  choices:
  - She is going to stay in Japan longer.
  - She stayed in Japan longer than she had planned.
  - She wanted to stay longer, but she didn't.
  - She hopes Ms. Abe will stay in Canada longer.
  ans: "3"
  why: I wish＋had done は、過去の事実と反対の願い。実際には長くいなかったので「もっと長くいればよかった」。
  trap: ②を選ぶ誤り。had stayed longer を実際に起きたことと読んでしまう。I wish の後ろの仮定法は、事実と反対のことを表す。
- id: q90119
  part: 4
  sec: s081
  set: 総合演習
  lv: 1
  kind: 読解
  min: 1
  q: 問　Which photo does Nora like best?
  choices:
  - a photo of Nora wearing a yukata
  - a photo of the students in yukata
  - a photo that the students took at the airport
  - a photo of the lake near Nora's house
  ans: "2"
  why: The one showing the students wearing yukata is my favorite. の one は photo の代わり。showing … は photo を、wearing yukata は the students を後ろから説明する現在分詞で、「浴衣を着た生徒たちが写っている写真」。
  trap: ①を選ぶ誤り。wearing yukata を写真を撮ったノラのことだと読んでしまう。wearing が説明しているのは直前の the students。
- id: q90120
  part: 4
  sec: s191
  set: 総合演習
  lv: 2
  kind: 読解
  min: 1
  q: 問　What was Nora worried about before she came to Japan?
  choices:
  - She would not be able to make friends.
  - She would not like Japanese food.
  - The students at the school would not speak English.
  - Her flight would be canceled.
  ans: "1"
  why: I was worried that I would not make any friends の would は、主節の was に合わせて will をずらした形（時制の一致）。「友だちが1人もできないだろう」と心配していた。
  trap: ③を選ぶ誤り。because I couldn't speak Japanese の I はノラ自身で、日本語を話せなかったのはノラの方。
