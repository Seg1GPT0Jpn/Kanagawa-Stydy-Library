problems:
# ==== 総合演習 第1回（単元1〜10） ====
# ---- 4択：不定詞か動名詞か（6・7） ----
- id: q90001
  part: 1
  sec: s073
  set: 総合演習
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つずつ選びなさい。
  q: We decided (＿) the science museum by train on Saturday.
  choices: [visiting, to visit, visit, visited]
  ans: "2"
  why: decide は後ろに to do をとる動詞で、「〜することに決める」。これから先のことを決めるので to visit。
  trap: ①visiting を選ぶ誤り。enjoy・finish のように doing をとる動詞と混ざりやすい。decide・hope・want は to do をとる。
- id: q90002
  part: 1
  sec: s073
  set: 総合演習
  lv: 2
  kind: 4択
  min: 1
  q: Kanon, please remember (＿) this book to the library tomorrow.
  choices: [returning, to return, return, returned]
  ans: "2"
  why: please と tomorrow から、これからすることを「忘れずに〜して」と頼んでいる。これからのことなので remember to do。
  trap: ①returning を選ぶ誤り。remember doing は「（前に）〜したことを覚えている」で、明日することには使えない。
- id: q90003
  part: 1
  sec: s074
  set: 総合演習
  lv: 2
  kind: 4択
  min: 1
  q: My grandparents are looking forward to (＿) us in August.
  choices: [see, seeing, saw, seen]
  ans: "2"
  why: look forward to の to は前置詞なので、後ろに動詞を置くときは doing にする。「8月に私たちに会うのを楽しみにしている」。
  trap: ①see を選ぶ誤り。to を不定詞の to と考えて原形を置いてしまう。look forward to the trip のように後ろに名詞を置けるので、この to は前置詞。
# ---- 4択：時制・完了形（2・3） ----
- id: q90004
  part: 1
  sec: s032
  set: 総合演習
  lv: 1
  kind: 4択
  min: 1
  q: My uncle (＿) in Sendai since he finished college.
  choices: [lives, lived, has lived, is living]
  ans: "3"
  why: since＋過去の時点（大学を終えた時）から今まで続いている状態なので、現在完了 has lived。since の後ろの節は過去形 finished。
  trap: ①lives を選ぶ誤り。「住んでいる」という訳につられて現在形にしてしまう。since があれば、今まで続いていることを現在完了で表す。
- id: q90005
  part: 1
  sec: s034
  set: 総合演習
  lv: 1
  kind: 4択
  min: 1
  q: Our class (＿) a trip to Nara two weeks ago, and we are still talking about it.
  choices: [takes, has taken, took, had taken]
  ans: "3"
  why: two weeks ago は今から数えて「2週間前」で、過去の一点を表す。過去形 took。
  trap: ②has taken を選ぶ誤り。今も話題にしているからと現在完了にしてしまう。～ ago のような過去の一点を表す語句は、現在完了と一緒に使わない。
- id: q90006
  part: 1
  sec: s033
  set: 総合演習
  lv: 2
  kind: 4択
  min: 1
  q: Our train is late. The movie (＿) by the time we get to the theater.
  choices: [has started, had started, will have started, starts]
  ans: "3"
  why: by the time we get … は「私たちが着くまでには」で、基準の時は未来。未来のある時までに完了していることは、未来完了 will have started で表す。by the time の節は時の副詞節なので、未来のことでも現在形 get。
  trap: ②had started を選ぶ誤り。過去完了は基準の時が過去のときに使う。電車は今遅れていて、着くのはこれから。
# ---- 4択：能動か受動か（5・8） ----
- id: q90007
  part: 1
  sec: s081
  set: 総合演習
  lv: 1
  kind: 4択
  min: 1
  q: The boy (＿) a big dog over there is my brother.
  choices: [walking, walked, is walking, walks]
  ans: "1"
  why: 文の V は後ろの is。空所から over there までが The boy を後ろから説明している。少年は犬を散歩させる「する側」なので現在分詞 walking。
  trap: ③is walking を選ぶ誤り。文の V はすでに is があるので、空所に V を入れると V が2つになる。
- id: q90008
  part: 1
  sec: s051
  set: 総合演習
  lv: 2
  kind: 4択
  min: 1
  q: The road in front of our school (＿) now, so we have to go around it.
  choices: [is repairing, is being repaired, has repaired, repairs]
  ans: "2"
  why: 道路は「修理される側」なので受動態。now から「今〜されているところ」なので、進行形の受動態 be being＋過去分詞の is being repaired。
  trap: ①is repairing を選ぶ誤り。now につられて進行形だけを考え、道路が修理する側か、される側かを確かめていない。
# ---- 4択：関係代名詞・関係副詞・接続詞の that（9・10） ----
- id: q90009
  part: 1
  sec: s103
  set: 総合演習
  lv: 1
  kind: 4択
  min: 1
  q: This is the park (＿) my brother and I often played baseball when we were little.
  choices: [which, where, what, who]
  ans: "2"
  why: 後ろの my brother and I often played baseball は S・V・O がそろった完全な文。場所を表す先行詞 the park に完全な文が続くので、関係副詞 where。
  trap: ①which を選ぶ誤り。先行詞が物だから which と考えてしまう。which の後ろは O などが欠けた不完全な文になる（in which なら使える）。
- id: q90010
  part: 1
  sec: s103
  set: 総合演習
  lv: 2
  kind: 4択
  min: 1
  q: The park (＿) we visited last Sunday has a big pond with ducks.
  choices: [where, which, what, when]
  ans: "2"
  why: visited は他動詞で、後ろに O がない不完全な文。欠けた O の位置に先行詞 The park が入るので、関係代名詞 which。文の V は has。
  trap: ①where を選ぶ誤り。先行詞が場所だから where と決めてしまう。関係副詞の後ろは完全な文なので、O が欠けた visited ＿ には使えない。
- id: q90011
  part: 1
  sec: s104
  ref: [s104, s092]
  set: 総合演習
  lv: 2
  kind: 4択
  min: 1
  q: We heard the news (＿) the city will build a new library near the station.
  choices: [which, what, that, where]
  ans: "3"
  why: 後ろの the city will build a new library は S・V・O がそろった完全な文で、the news の中身を説明している。名詞の中身を説明する同格の that。
  trap: ①which を選ぶ誤り。名詞の後ろだから関係代名詞と考えてしまう。関係代名詞の後ろは不完全な文になるが、ここでは何も欠けていない。
# ---- 4択：文型（1） ----
- id: q90012
  part: 1
  sec: s012
  set: 総合演習
  lv: 1
  kind: 4択
  min: 1
  q: You look (＿) today. Did something good happen?
  choices: [happily, happy, happiness, more happily]
  ans: "2"
  why: look は SVC をつくる動詞で、空所は C。S＝C の関係（You＝happy）になるので、形容詞 happy。
  trap: ①happily を選ぶ誤り。「うれしそうに」という訳につられて副詞にしてしまう。副詞は C にならない。
# ---- 正誤 ----
- id: q90013
  part: 1
  sec: s023
  set: 総合演習
  lv: 1
  kind: 正誤
  min: 1
  inst: 下線部①〜④のうち、誤りをふくむものを1つずつ選びなさい。
  q: I __will call__① you __when__② I __will arrive__③ at the station __tomorrow__④.
  ans: "3"
  why: when の節は時を表す副詞節なので、明日のことでも現在形にする。will arrive を arrive に直す。①は主節なので will call でよい。
  trap: tomorrow につられて、副詞節の中にも will を入れる誤り。未来を will で表すのは主節の方だけ。
- id: q90014
  part: 1
  sec: s063
  set: 総合演習
  lv: 2
  kind: 正誤
  min: 1
  q: Our coach __made__① us __to practice__② the same pass __for__③ an hour __yesterday__④.
  ans: "2"
  why: 使役の make は make O 原形 の形をとる。to practice を practice に直す。③for an hour は「1時間」で正しい。
  trap: 「〜させる」の意味から、want O to do や tell O to do と同じ形にする誤り。make の後ろで to が現れるのは、受動態の be made to do のとき。
- id: q90015
  part: 1
  sec: s094
  set: 総合演習
  lv: 2
  kind: 正誤
  min: 1
  q: __Despite__① it was raining __hard__②, the players __kept__③ __running__④ on the field.
  ans: "1"
  why: 後ろが it was raining という S＋V なので、前置詞の despite は使えない。接続詞の Though（Although）に直す。④keep doing は「〜し続ける」で正しい。
  trap: 「〜にもかかわらず」という意味だけで despite を正しいと考える誤り。despite の後ろには名詞を置く（despite the heavy rain）。
- id: q90016
  part: 1
  sec: s054
  set: 総合演習
  lv: 2
  kind: 正誤
  min: 1
  q: We __were__① surprised __when__② we heard __that__③ a fire __was happened__④ at the old factory.
  ans: "4"
  why: happen は O をとらない自動詞なので、受動態にできない。聞いた時より前に起きたことなので had happened に直す（happened でもよい）。③は heard の O になる名詞節をつくる that で正しい。
  trap: 「火事が起こされた」と考えて受動態にする誤り。happen・occur は「起こる」という意味の自動詞。
- id: q90017
  part: 1
  sec: s012
  set: 総合演習
  lv: 2
  kind: 正誤
  min: 1
  q: The members __of__① the art club __discussed about__② the poster for an hour __and__③ finally __chose__④ a design.
  ans: "2"
  why: discuss は「〜について話し合う」という意味の他動詞で、後ろに直接 O を置く。about を取って discussed the poster とする。
  trap: 日本語の「〜について」につられて about を付ける誤り。talk about と同じ形だと考えやすい。
# ---- 整序 ----
- id: q90018
  part: 1
  sec: s064
  set: 総合演習
  lv: 1
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: 私たちは、どこでチケットを買えばよいか分からなかった。<br>We didn't know ( buy / the / tickets / to / where ).
  words: [buy, the, tickets, to, where]
  ans: We didn't know where to buy the tickets.
  why: 「どこで〜すればよいか」は where to do。疑問詞＋to do のかたまりが know の O になる。
  trap: We didn't know to buy the tickets where とする誤り。疑問詞は to do の前に置いて、1つのかたまりにする。
- id: q90019
  part: 1
  sec: s014
  set: 総合演習
  lv: 1
  kind: 整序
  min: 2
  q: 私たちは、その映画がとてもおもしろいと思った。<br>We ( found / interesting / movie / the / very ).
  words: [found, interesting, movie, the, very]
  ans: We found the movie very interesting.
  why: find O C で「O が C だと思う（分かる）」。the movie＝very interesting の関係になるように、O の後ろに C を置く。
  trap: We found very interesting the movie とする誤り。SVOC では O を先に、C を後ろに置く。
- id: q90020
  part: 1
  sec: s085
  set: 総合演習
  lv: 2
  kind: 整序
  min: 2
  q: 祖父は目を閉じて音楽を聞いていた。<br>My grandfather was listening to music ( closed / eyes / his / with ).
  words: [closed, eyes, his, with]
  ans: My grandfather was listening to music with his eyes closed.
  why: 付帯状況の with O done。目は「閉じられる側」なので、O の his eyes の後ろに過去分詞 closed を置く。
  trap: with closed his eyes とする誤り。with の直後に O を置き、その後ろに分詞を続ける。
- id: q90021
  part: 1
  sec: s102
  set: 総合演習
  lv: 2
  kind: 整序
  min: 2
  q: 表紙が赤いその本は、私の姉のものだ。<br>The book ( cover / is / red / whose ) is my sister's.
  words: [cover, is, red, whose]
  ans: The book whose cover is red is my sister's.
  why: 「その本の表紙」は whose cover。whose はすぐ後ろの名詞といっしょに動くので、whose cover を節の頭に置き、is red を続ける。文の V は後ろの is。
  trap: The book whose is red cover とする誤り。whose の直後には、それが説明する名詞を置く。
- id: q90022
  part: 1
  sec: s094
  set: 総合演習
  lv: 1
  kind: 整序
  min: 2
  q: その問題はとても難しかったので、だれも答えられなかった。<br>The question was ( difficult / nobody / so / that ) could answer it.
  words: [difficult, nobody, so, that]
  ans: The question was so difficult that nobody could answer it.
  why: so＋形容詞＋that で「とても〜なので…」。so の直後に形容詞 difficult を置き、that の後ろに結果を表す文を続ける。
  trap: The question was difficult so that nobody could answer it とする誤り。so that は「〜できるように」という目的を表し、意味が変わる。
# ---- 補充 ----
- id: q90023
  part: 1
  sec: s032
  set: 総合演習
  lv: 1
  kind: 補充
  min: 1
  inst: （　）内の語を適切な形に変えなさい。
  q: It has (＿) cold and rainy since last Sunday.（be）
  ans: been
  why: has の後ろなので過去分詞 been。since last Sunday（先週の日曜日から）今まで続いている状態を、現在完了で表している。
  trap: is や was を入れる誤り。has の後ろには過去分詞を置く。
- id: q90024
  part: 1
  sec: s023
  set: 総合演習
  lv: 2
  kind: 補充
  min: 1
  inst: （　）内の語を適切な形に変えなさい。2語以上になってもよい。
  q: I don't know if it (＿) sunny tomorrow.（be）
  ans: will be
  alt: [is going to be]
  why: if の節は know の O になる名詞節で、「〜かどうか」の意味。名詞節では、未来のことを will で表す。
  trap: 時・条件の副詞節と同じだと考えて is を入れる誤り。「もし〜なら」の副詞節ではないので、現在形にしない。
- id: q90025
  part: 1
  sec: s044
  set: 総合演習
  lv: 1
  kind: 補充
  min: 1
  inst: 日本語の意味になるように、（　）に適切な語を1語入れなさい。
  q: この水は飲まないほうがいい。きれいではないから。<br>You had better (＿) drink this water. It isn't clean.
  ans: not
  why: had better の否定は had better not do。not は better の後ろ、原形の前に置く。
  trap: don't と書いて had better don't drink とする誤り。had better は助動詞と同じように働くので、否定は not だけを置く。
# ---- 読解 ----
- id: q90026
  part: 1
  sec: s105
  set: 総合演習
  lv: 1
  kind: 読解
  min: 4
  inst: 次の英文を読み、問いの答えとして最も適切なものを1つずつ選びなさい。
  passage: '**A（チャット）**<br>Sota: Hi, everyone. The school festival is on October 14, but we still haven''t decided what to sell at our class stand. Any ideas?<br>Megumi: How about cookies? My aunt, who runs a small bakery, says she will teach us how to make them.<br>Sota: Sounds good. But we need a room where we can bake. The cooking room is used by the cooking club after school on weekdays.<br>Megumi: I talked to Ms. Ford about it. We can use the room on Saturday if we clean it afterward.<br>Daichi: Sorry, I''m late. I must have fallen asleep on the train after practice. Cookies are fine with me. I''ll make the price list.<br>Sota: Thanks, Daichi. Don''t forget to check how much butter and flour cost before you decide the prices.<br>Daichi: OK. By the way, I found the sign we used last year in the storeroom. It''s a little dirty, but we can use it if we paint it again.<br>Megumi: Great. Let''s meet in the cooking room at nine on Saturday. Everyone, please remember to bring an apron.'
  q: 問　Who is going to teach the students how to make cookies?
  choices:
  - Ms. Ford
  - Megumi's aunt
  - the cooking club
  - Daichi
  ans: "2"
  why: My aunt, who runs a small bakery, says she will teach us how to make them. の文の骨組みは My aunt says …。コンマの付いた who の節は、おばについて「小さなパン屋をしている」と情報を付け足している。she はおばを指す。
  trap: ①Ms. Ford を選ぶ誤り。フォード先生は調理室を使うことについて相談した相手で、クッキーの作り方を教える人ではない。
- id: q90027
  part: 1
  sec: s051
  set: 総合演習
  lv: 1
  kind: 読解
  min: 1
  q: 問　Why can't the class use the cooking room after school on weekdays?
  choices:
  - Because the cooking club uses it then.
  - Because Ms. Ford cleans it then.
  - Because the class keeps its sign there.
  - Because the class has to practice then.
  ans: "1"
  why: The cooking room is used by the cooking club after school on weekdays. は受動態で、by の後ろの the cooking club が「使う側」。能動態に直すと The cooking club uses the cooking room ….
  trap: ②を選ぶ誤り。clean が出てくるのは、土曜日に部屋を使った後で生徒たちが掃除をするという話で、フォード先生が掃除をするのではない。
- id: q90028
  part: 1
  sec: s043
  set: 総合演習
  lv: 2
  kind: 読解
  min: 1
  q: '問　What does Daichi mean when he says, "I must have fallen asleep on the train after practice"?'
  choices:
  - He had to sleep on the train after practice.
  - He is sure that he will fall asleep on the train.
  - He thinks that he fell asleep on the train after practice.
  - He should have slept more before practice.
  ans: "3"
  why: must have done は「〜したに違いない」という過去のことの推量。遅れた理由を「練習の後、電車で寝てしまったに違いない」と述べている。
  trap: ①を選ぶ誤り。must を「〜しなければならない」（義務）と読んでしまう。must の後ろが have＋過去分詞なら、過去のことの推量。
- id: q90029
  part: 1
  sec: s073
  set: 総合演習
  lv: 2
  kind: 読解
  min: 1
  q: 問　What does Sota ask Daichi to do?
  choices:
  - To remember that he bought butter and flour.
  - To find out the prices of butter and flour before deciding the prices.
  - To buy butter and flour on Saturday.
  - To bring the price list from last year.
  ans: "2"
  why: Don't forget to check … は「忘れずに〜して」という、これからすることの依頼。forget to do は「〜するのを忘れる」で、まだしていないことに使う。how much butter and flour cost は「バターと小麦粉がいくらするか」。
  trap: ①を選ぶ誤り。forget doing（〜したことを忘れる）と取り違え、すでにしたことの話だと読んでしまう。
- id: q90030
  part: 1
  sec: s101
  set: 総合演習
  lv: 1
  kind: 読解
  min: 1
  q: 問　What did Daichi find in the storeroom?
  choices:
  - a new sign for this year's festival
  - the sign that the class used at last year's festival
  - a sign that someone painted again last year
  - the price list that the class made last year
  ans: "2"
  why: the sign we used last year は、目的格の関係代名詞が省略された形（the sign [that we used ＿ last year]）。「私たちが去年使った看板」。
  trap: ③を選ぶ誤り。we can use it if we paint it again は「塗り直せば使える」というこれからの話で、去年塗り直したのではない。
# ==== 総合演習 第2回（単元11〜20 を7割、単元1〜10 を3割） ====
# ---- 4択：前置詞か接続詞か（9・16） ----
- id: q90031
  part: 2
  sec: s164
  set: 総合演習
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つずつ選びなさい。
  q: We stayed inside (＿) the storm.
  choices: [during, while, when, because]
  ans: "1"
  why: 空所の後ろは the storm という名詞だけで、S＋V がない。名詞の前に置くのは前置詞なので、「〜の間」の during。
  trap: ②while を選ぶ誤り。意味は似ているが、while は接続詞なので後ろに S＋V が要る（while it was stormy）。
- id: q90032
  part: 2
  sec: s094
  set: 総合演習
  lv: 1
  kind: 4択
  min: 1
  q: Mr. Lane fell asleep (＿) he was watching the news on TV.
  choices: [during, while, because of, despite]
