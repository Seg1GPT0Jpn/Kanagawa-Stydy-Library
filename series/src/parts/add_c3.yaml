chapters:
- id: c3
  sections:
  - id: s10
    worked:
    - q: "(＿) Yuma found under the sofa was his grandfather's old watch."
      choices: [Which, What, That, Who]
      steps:
      - 先行詞を確かめる。空所は文の最初にあり、前に名詞がない。先行詞がないので、which・who は入らない。
      - 後ろの文で欠けているものを探す。Yuma found under the sofa では、found（見つけた）の後ろに「何を」にあたる目的語がない。under the sofa は場所を表す語句で、目的語ではない。
      - 先行詞がなく、後ろが不完全な文なので、先行詞をふくむ What を選ぶ。接続詞の That なら後ろは完全な文でなければならない。
      - 文全体の動詞は was。［What Yuma found under the sofa］が主語の名詞節で、「ユウマがソファの下で見つけたものは、祖父の古い腕時計だった」となる。
      ans: "2"
      point: 文の最初の空所には、前に先行詞がない。後ろが不完全な文なら What、完全な文なら接続詞の That と、後ろの文で決める。
    - q: "Iris wrote down everything (＿) the guide said about the old castle."
      choices: [what, that, whose, where]
      steps:
      - 先行詞を確かめる。空所の直前に everything（すべてのこと）という名詞がある。
      - 後ろの文で欠けているものを探す。said の後ろに「何を」にあたる目的語がない。about の後ろには the old castle があるので、前置詞の目的語は欠けていない。
      - 先行詞があり、目的語が欠けている。what は先行詞を自分の中にふくむので、everything の後ろに置くと「こと」が二重になる。関係代名詞の that を選ぶ（省略もできる）。
      ans: "2"
      point: everything・all・anything の後ろに what は置けない。「〜すること全部」という日本語につられて what を選ばず、空所の前に名詞があるかを先に見る。
  - id: s11
    worked:
    - q: "The small shop near our station sells (＿) we call dagashi, cheap snacks for children."
      choices: [which, that, what, it]
      steps:
      - 先行詞を確かめる。sells の後ろに空所があり、空所の前に「売っている物」を表す名詞がない。先行詞はない。
      - 後ろの文で欠けているものを探す。call は call A B（AをBと呼ぶ）の形をとる。we call dagashi では、Bにあたる dagashi はあるが、Aにあたる語がない。
      - 先行詞がなく、後ろが不完全な文なので what を選ぶ。what we call B は「いわゆるB」。
      ans: "3"
      point: what we call B の B は呼び名で、欠けているのは A の位置。sells it we call のように it を入れると、文が2つつながってしまう。
    - q: "This hotel is cheap, and (＿) is better, it is only five minutes from the beach."
      choices: [it, which, what, that]
      steps:
      - 先行詞を確かめる。空所の前は and で、説明される名詞がない。
      - 後ろで欠けているものを探す。(＿) is better の部分では、is の主語がない。
      - 先行詞がなく、主語が欠けているので what を選ぶ。what is better は「さらによいことに」で、コンマではさんで文の途中に入れる。
      - 意味を確かめる。安いことに、海岸まで5分というよいことを付け足しているので、worse ではなく better の形になっている。
      ans: "3"
      point: it を入れると it is better と it is only five minutes … の2つの文がコンマだけでつながり、誤りになる。what is more（そのうえ）、what is better（さらによいことに）、what is worse（さらに悪いことに）は、文と文の間に情報を足す決まった言い方。
  - id: s12
    worked:
    - q: "Yuma told us the good news (＿) his sister had passed her driving test."
      choices: [which, what, that, who]
      steps:
      - 空所の前の名詞を確かめる。the good news（よい知らせ）があり、中身を持つ名詞である。
      - 後ろの文で欠けているものを探す。his sister（主語）、had passed（動詞）、her driving test（目的語）がそろい、欠けている語がない。完全な文である。
      - 前の名詞の中身を説明していて、後ろが完全な文なので、同格の that を選ぶ。which・who は関係代名詞なので後ろが不完全な文でなければならず、what は前に名詞があると使えない。
      ans: "3"
      point: 同格の that は「〜という」と訳せる。「姉が運転免許の試験に合格したというよい知らせ」となる。
    - q: "次の2つの文の that は、関係代名詞か、接続詞（同格の that）か。<br>(1) The fact that Ben found in the old book surprised Mr. Kato.<br>(2) The fact that Ben found the old book surprised Mr. Kato."
      steps:
      - that の前の名詞を確かめる。どちらも The fact で、中身を持つ名詞である。名詞だけでは関係代名詞か同格かは決まらない。
      - that の後ろで、動詞 found の後ろを見る。(1) は found in the old book で、「何を」見つけたかの目的語がない。in the old book は場所を表す語句である。(2) は found the old book で、目的語がそろっている。
      - 後ろが不完全な (1) は関係代名詞、後ろが完全な (2) は同格の that と決める。
      - 訳で確かめる。(1)「ベンが古い本の中で見つけた事実は、加藤先生を驚かせた」、(2)「ベンがその古い本を見つけたという事実は、加藤先生を驚かせた」。
      ans: "(1) 関係代名詞　(2) 接続詞（同格の that）"
      point: fact や news の後ろの that が、いつも同格とは限らない。名詞の種類ではなく、that の後ろが完全な文かどうかで決める。
problems:
- id: q3201
  sec: s10
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: "This is (＿) Aoi made in art class last week."
  choices: [which, what, that, who]
  ans: "2"
  why: is の後ろに先行詞がなく、節の中で made の目的語が欠けている。先行詞をふくむ what が入り、「アオイが先週の美術の授業で作ったもの」という名詞節が is の補語になる。
  trap: ①which を選ぶ誤り。which は関係代名詞なので、前に先行詞が要る。This は文の主語で、空所の前に説明される名詞はない。
- id: q3202
  sec: s10
  set: 節末
  lv: 1
  kind: 補充
  min: 2
  inst: 各文の（　）に which か what のどちらかを入れなさい。文頭に入る語は大文字で書き始めること。
  q: "(1) The jacket (＿) Hana bought at the sale was only 2,000 yen.<br>(2) (＿) Hana bought at the sale was a jacket and a pair of gloves."
  ans: (1) which (2) What
  why: (1) は先行詞 The jacket があり、bought の目的語が欠けているので which。(2) は先行詞がなく bought の目的語が欠けているので、先行詞をふくむ What（文頭なので大文字）。
  trap: (1) で「買ったもの」という日本語につられて what を入れる誤り。The jacket という先行詞があるので what は使えない。
- id: q3203
  sec: s10
  set: 節末
  lv: 1
  kind: 正誤
  min: 1
  inst: 下線部のうち、誤りをふくむものを1つ選びなさい。
  q: "__That__① we need __for__② the camping trip __is__③ a tent __for__④ four people."
  choices: ['1', '2', '3', '4']
  ans: "1"
  why: 文の最初に先行詞がなく、we need の後ろの目的語が欠けている。①を What にすると、「私たちがキャンプ旅行に必要なもの」という主語の名詞節になる。What の節が主語のとき、動詞は単数で受けるので③is は正しい。
  trap: 文頭の That を「〜ということ」の接続詞と考え、正しいとする誤り。接続詞の that の後ろは完全な文でなければならないが、need の目的語が欠けている。
- id: q3204
  sec: s10
  set: 節末
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: これが、いまクラスのみんなが話題にしているものだ。<br>This is ( about / everyone / is / talking / what ) in our class now.
  words: [about, everyone, is, talking, what]
  ans: This is what everyone is talking about in our class now.
  why: 「みんなが話題にしているもの」は what で始まる名詞節で、is の補語になる。talk about ＿ の about の目的語が欠けているので、about は節の最後に残る。
  trap: This is what is everyone talking about のように、疑問文の語順にする誤り。what の節の中は everyone is talking の普通の語順になる。
- id: q3205
  sec: s10
  set: 節末
  lv: 3
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: "(＿) I thought was a stone turned out to be a small frog."
  choices: [That, Which, What, Who]
  ans: "3"
  why: I thought をいったん外すと (＿) was a stone で、was の主語が欠けている。先行詞がないので What が入る。［What I thought was a stone］が主語の名詞節で、動詞は turned out。「石だと思ったものは、小さなカエルだと分かった」。
  trap: ①That を選ぶ誤り。I thought の直後に was が来るので、thought の後ろに接続詞の that が省略されていると考えやすいが、was の主語が欠けているので後ろは不完全な文であり、接続詞の That は入らない。
- id: q3206
  sec: s11
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: 'Ms. Endo is (＿) you call a "born teacher." Her lessons are always easy to understand.'
  choices: [which, what, who, that]
  ans: "2"
  why: is の後ろに先行詞がなく、call A B の A が欠けている。what you call B で「いわゆるB」。「遠藤先生はいわゆる生まれながらの教師だ」。
  trap: Ms. Endo が人なので③who を選ぶ誤り。who を関係代名詞として使うには前に先行詞が要るが、is の後ろには説明される名詞がない。
- id: q3207
  sec: s11
  set: 節末
  lv: 1
  kind: 補充
  min: 2
  inst: 日本語の意味になるように、各文の（　）に適切な1語を入れなさい。
  q: "(1) 雨が降り出し、さらに悪いことに、傘を持っていなかった。<br>It started to rain, and (＿) was (＿), I didn't have an umbrella.<br>(2) アミールはいわゆる努力家だ。<br>Amir is (＿) we (＿) a hard worker."
  ans: (1) what, worse (2) what, call
  why: (1)「さらに悪いことに」は what is worse。過去の話なので was になっている。(2)「いわゆる」は what we call。call A B の A が what になった形。
  trap: (1) の最初の空所に it を入れる誤り。it was worse にすると、it was worse と I didn't have an umbrella の2つの文がコンマだけでつながってしまう。
- id: q3208
  sec: s11
  set: 節末
  lv: 1
  kind: 正誤
  min: 1
  inst: 下線部のうち、誤りをふくむものを1つ選びなさい。
  q: "My grandfather __is__① not __that__② he used to __be__③; he gets tired __easily__④ these days."
  choices: ['1', '2', '3', '4']
  ans: "2"
  why: not の後ろに先行詞がなく、used to be の補語が欠けている。②を what にして what he used to be（昔の祖父の姿）とする。「祖父は昔の祖父ではない」。
  trap: ③be の後ろに何もないので③を誤りと考える誤り。be の後ろの補語は what が代わりをしているので、be で終わってよい。
- id: q3209
  sec: s11
  set: 節末
  lv: 1
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: その映画は長く、さらに悪いことに、とても退屈だった。<br>The movie was long, and ( it / very / was / was / what / worse ) boring.
  words: [it, very, was, was, what, worse]
  ans: The movie was long, and what was worse, it was very boring.
  why: 「さらに悪いことに」は what was worse で、過去の話なので was にする。その後ろに it was very boring を続ける。
  trap: and it was worse, what was very boring のように it と what の位置を入れかえる誤り。付け足しの決まった言い方は what was worse の形で、主語の欠けた what の節になる。
- id: q3210
  sec: s11
  set: 節末
  lv: 2
  kind: 和訳
  min: 3
  inst: 次の英文を日本語に訳しなさい。
  q: Iris is not what she was three years ago. Now she can give a speech in English without looking at any notes.
  ans: アイリスは3年前の彼女ではない。今では、メモを見ないで英語でスピーチができる。
  alt:
  - アイリスは3年前とは違う。今では、メモを一度も見ずに英語のスピーチをすることができる。
  why: what she was three years ago は was の補語が欠けた名詞節で、「3年前の彼女（の姿）」。is not … を「〜ではない」「〜とは違う」と訳せていれば正解。
  trap: what を疑問詞と考えて「3年前に彼女が何だったか」と訳す誤り。is not の補語になる名詞節で、「3年前の彼女の姿」を表す。
- id: q3211
  sec: s12
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: "Nora was glad about the fact (＿) her little brother could now swim 25 meters."
  choices: [which, what, that, whose]
  ans: "3"
  why: 後ろの her little brother could now swim 25 meters は、主語・動詞・目的語がそろった完全な文。the fact の中身を説明する同格の that が入る。「弟が今では25メートル泳げるという事実」。
  trap: ①which を選ぶ誤り。which は関係代名詞なので後ろが不完全な文でなければならないが、ここでは何も欠けていない。
- id: q3212
  sec: s12
  set: 節末
  lv: 1
  kind: 補充
  min: 2
  inst: 各文の（　）に that か what のどちらかを入れなさい。
  q: "(1) Mr. Kato says (＿) the next test will be easy.<br>(2) Mr. Kato hasn't told us (＿) will be on the next test."
  ans: (1) that (2) what
  why: (1) は the next test will be easy が完全な文なので、名詞節をつくる接続詞の that（says の後ろでは省略もできるが、ここでは空所があるので入れる）。(2) は will be の主語が欠けた不完全な文で、先行詞もないので what。
  trap: (2) で told us の後ろだから「〜ということ」と考えて that を入れる誤り。that の後ろは完全な文でなければならないが、will be の主語がない。
- id: q3213
  sec: s12
  set: 節末
  lv: 1
  kind: 正誤
  min: 1
  inst: 下線部のうち、誤りをふくむものを1つ選びなさい。
  q: "Hana __lost__① the pen __that__② her grandfather __gave__③ __it__④ to her last year."
  choices: ['1', '2', '3', '4']
  ans: "4"
  why: that は gave の目的語の代わりをする関係代名詞なので、後ろに目的語の it を残してはいけない。④を取り、the pen that her grandfather gave to her last year とする。
  trap: gave の後ろに目的語が必要だと考えて it を正しいとする誤り。gave の目的語は、すでに関係代名詞の that が代わりをしている。
- id: q3214
  sec: s12
  set: 節末
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: ユウマがひとりでそのケーキを作ったという事実に、みんな驚いた。<br>Everyone was surprised at ( cake / fact / had / made / that / the / the / Yuma ) by himself.
  words: [cake, fact, had, made, that, the, the, Yuma]
  ans: Everyone was surprised at the fact that Yuma had made the cake by himself.
  why: 「〜という事実」は同格の that を使い、the fact that ＋完全な文（Yuma had made the cake）の順に並べる。
  trap: the cake that Yuma had made the fact のように、ケーキを先行詞にして並べる誤り。驚いたのは「作ったという事実」で、that の前に置く名詞は the fact である。
- id: q3215
  sec: s12
  set: 節末
  lv: 3
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: "The fact (＿) the bakery sold all the bread it baked that morning before ten shows how popular it is."
  choices: [which, what, that, where]
  ans: "3"
  why: 空所の後ろは the bakery sold all the bread で、主語・動詞・目的語がそろった完全な文。it baked that morning は the bread を説明する関係詞節で、目的格の関係代名詞が省略されている（the bread［(that) it baked ＿］）。the fact の中身を説明する同格の that が入る。
  trap: baked の後ろに目的語がないのを見て、①which を選ぶ誤り。欠けているのは the bread の後ろの省略された関係詞節の中の目的語で、空所の直後の文（the bakery sold all the bread）は欠けていない。
