# ---- 確認テスト ----
- id: q06034
  sec: s061
  set: 確認テスト
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: It is fun (＿) cards with my family on weekends.
  choices: [play, played, plays, to play]
  ans: "4"
  why: It は形式主語で、本当の主語は「家族とトランプをすること」。名詞の働きの不定詞 to play を後ろに置く。
  trap: ①play を選ぶ誤り。It is fun の後ろに動詞の原形をそのまま置いても主語にならない。
- id: q06035
  sec: s062
  set: 確認テスト
  lv: 2
  kind: 補充
  min: 1
  inst: 上の文とほぼ同じ意味になるように、空所に適切な語を1語ずつ入れなさい。
  q: It seems that he lost his wallet yesterday.<br>He seems (＿) (＿) (＿) his wallet yesterday.
  ans: to have lost
  why: seems は今、財布をなくしたのは昨日。主節の時より前なので完了不定詞 to have lost にする。
  trap: to lose とする誤り。to lose だと今のことになり、yesterday と合わない。
- id: q06036
  sec: s063
  set: 確認テスト
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部①〜④のうち、誤りをふくむものを1つ選びなさい。
  q: __Yesterday__① I __saw Anna to enter__② the library __with__③ her friend __after__④ school.
  ans: "2"
  why: see は知覚動詞で、能動態では see O do の形。saw Anna to enter を saw Anna enter にする。told Anna to enter と動詞を替えても直せるが、どちらの直し方も②の中で決まる。
  trap: be seen to do（受動態）の形と混ぜて、能動態にも to を入れる誤り。to が現れるのは受動態のときだけ。
- id: q06037
  sec: s064
  set: 確認テスト
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: We haven't decided (＿) to stay in Kyoto.
  choices: [where, what, which, why]
  ans: "1"
  why: to stay in Kyoto は欠けた要素のない完全な文なので、M になる疑問詞が入る。意味から「どこに泊まるか」の where。
  trap: ②what を選ぶ誤り。what は名詞なので、後ろに欠けた O などが要るが、stay in Kyoto には欠けた要素がない。
- id: q06038
  sec: s065
  set: 確認テスト
  lv: 1
  kind: 補充
  min: 1
  inst: 日本語の意味になるように、空所に適切な語を1語ずつ入れなさい。
  q: 私は最終バスに乗るためにバス停まで走った。<br>I ran to the bus stop in (＿) (＿) catch the last bus.
  ans: order to
  why: 目的をはっきり示す in order to do（〜するために）。
  trap: in order for と書く誤り。後ろが原形の catch なので to が要る。
- id: q06039
  sec: s061
  set: 確認テスト
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: 何か温かい飲み物がほしい。<br>I'd like ( drink / hot / something / to ).
  words: [drink, hot, something, to]
  ans: I'd like something hot to drink.
  why: -thing の語は形容詞を後ろに置き、さらにその後ろに形容詞の働きの不定詞を置く。something hot to drink の順。
  trap: hot something to drink のように形容詞を前に置く誤り。something・anything に付く形容詞は後ろに置く。
- id: q06040
  sec: s063
  set: 確認テスト
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: The sad movie made me (＿).
  choices: [cry, to cry, crying, cried]
  ans: "1"
  why: 使役の make は make O do の形。「私が泣く」の関係なので原形の cry。
  trap: ②to cry を選ぶ誤り。make の後ろの O に続く動詞は、能動態では to を付けない原形。
- id: q06041
  sec: s064
  set: 確認テスト
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: インターネットのおかげで、私たちが海外の人と話すのが簡単になった。<br>The Internet has ( easy / for / it / made / to / us ) talk with people abroad.
  words: [easy, for, it, made, to, us]
  ans: The Internet has made it easy for us to talk with people abroad.
  why: make it 形容詞 for 人 to do の形。O の位置に形式目的語の it、C の easy、意味上の主語 for us、本当の O の to talk の順。
  trap: has made us easy to talk のように us を O にする誤り。簡単なのは「話すこと」で、私たちではない。
- id: q06042
  sec: s051
  set: 確認テスト
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: Breakfast (＿) in the hotel restaurant from seven to nine every morning.
  choices: [serves, is served, is serving, served]
  ans: "2"
  why: 朝食は「出される側」なので受動態。毎朝のことなので現在形の is served。
  trap: ①serves を選ぶ誤り。朝食は出す側にはなれないので、能動態は主語と動詞の関係が合わない。
- id: q06043
  sec: s033
  set: 確認テスト
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部①〜④のうち、誤りをふくむものを1つ選びなさい。
  q: By the time I got home __from__① school __yesterday__②, my brother __has eaten__③ all the cookies __on__④ the table.
  ans: "3"
  why: 基準の時は「昨日家に着いた」過去の時。その時までに食べてしまっていたので、過去完了 had eaten にする。
  trap: 「全部食べてしまった」の完了の意味から現在完了を正しいと思う誤り。基準の時が過去なら過去完了にする。
