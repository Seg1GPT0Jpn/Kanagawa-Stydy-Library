  q: The bag __in that__① I put my phone __was__② stolen __at__③ the station __yesterday__④.
  ans: "1"
  why: 前置詞の直後に that は置けない。The bag in which I put my phone とする（または The bag that I put my phone in）。
  trap: that は人にも物にも使えるので in that も正しいと思う誤り。前置詞の直後に置けるのは which と whom だけ。
- id: q1029
  sec: s06
  set: 節末
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: 私たちが2泊したホテルは、海岸の近くだった。<br>The hotel at ( nights / stayed / two / we / which ) was near the beach.
  words: [nights, stayed, two, we, which]
  ans: The hotel at which we stayed two nights was near the beach.
  why: at の直後に which を置き、その後ろに完全な文 we stayed two nights を続ける。we stayed two nights at the hotel の at the hotel が at which になって前に出ている。
  trap: at which の後ろに目的語の欠けた形が来ると考え、which we stayed のように which を前に出したまま at を余らせる誤り。
- id: q1030
  sec: s06
