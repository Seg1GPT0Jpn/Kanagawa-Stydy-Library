  inst: 下線部①〜④のうち、誤りをふくむものを1つ選びなさい。
  q: The old dog __after which__① my sister __looks__② every weekend __belongs__③ to __our neighbor__④.
  ans: "1"
  why: look after（世話をする）は句動詞で、after を関係代名詞の前に出せない。The old dog (that) my sister looks after every weekend とする。
