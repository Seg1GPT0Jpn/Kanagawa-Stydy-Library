  inst: 次の英文を読み、問いの答えとして最も適切なものを1つ選びなさい。
  q: "Notice from the School Library<br>The library will be closed on November 3. Students who want to borrow books for the holiday should come before 4:30 p.m. on November 2. Books which are borrowed on that day can be kept until November 10. The study room which is next to the library will be open as usual on November 3, so you can study there. If you have any questions, please ask the teacher who works at the front desk.<br>問　What can students do on November 3?"
  choices:
  - Borrow books from the library.
  - Use the study room next to the library.
  - Return books to the teacher at the front desk.
  - Ask questions at the library's front desk.
  ans: "2"
  why: The study room which is next to the library will be open … on November 3 から、図書館の隣の自習室は11月3日も使える。which is next to the library が the study room を説明している。
  trap: ④を選ぶ誤り。the teacher who works at the front desk は図書館の受付の先生で、図書館は11月3日は閉まっている。
