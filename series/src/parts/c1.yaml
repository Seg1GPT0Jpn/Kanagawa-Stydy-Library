- id: q1036
  sec: s05
  set: 章末
  lv: 2
  kind: 読解
  min: 4
  inst: 次の英文を読み、問いの答えとして最も適切なものを1つ選びなさい。
  q: "Our class held a quiz contest last Friday. There were twenty questions, and my team answered sixteen of them correctly. That was the highest score that any team got that day. The last question was about a river in Africa, and the only student who knew the answer was Daniel. Everything that he said about the river was correct, so our teacher gave him a small prize: a notebook that has a map of the world on its cover.<br>問　Which of the following is true?"
  choices:
  - The writer's team answered all of the twenty questions correctly.
  - No team got a higher score than the writer's team.
  - Daniel's team got a map of the world as a prize.
  - Several students knew the answer to the last question.
  ans: "2"
  why: the highest score that any team got that day（その日どのチームが取った得点よりも高い得点）から、筆者のチームより高い得点のチームはない。
  trap: ③を選ぶ誤り。a notebook that has a map of the world on its cover は「表紙に世界地図がついたノート」で、もらったのは地図そのものではなく、チームでもない。
- id: q1037
  sec: s06
  set: 章末
  lv: 2
