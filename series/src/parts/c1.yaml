  ans: "1"
  why: 「その男性の息子」なので所有格の whose にする。who's は who is または who has の短縮形。
  trap: 発音が同じなので who's を whose と同じだと思う誤り。who's son では「〜の」の意味にならない。
- id: q1015
  sec: s04
  set: 節末
  lv: 2
  kind: 4択
