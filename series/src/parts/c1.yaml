- id: q1020
  sec: s05
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: Ken ate everything (＿) was on his plate.
  choices: [what, that, who, whose]
  ans: "2"
  why: 先行詞 everything の後ろで、was の主語が欠けている。-thing の語が先行詞のときは that が好まれる。
  trap: 「皿にあったもの」という日本語から①what を選ぶ誤り。everything という先行詞があるので what は使えない。
- id: q1021
  sec: s05
  set: 節末
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部①〜④のうち、誤りをふくむものを1つ選びなさい。
  q: My uncle, __that__① __lives__② in Aomori, __sends__③ us apples __every__④ autumn.
  ans: "1"
  why: コンマの後では that は使えない。先行詞 My uncle は人なので、, who lives in Aomori, とする。
  trap: 先行詞が人なので that でもよいと考える誤り。that は人にも物にも使えるが、コンマの後には置けない。
- id: q1022
