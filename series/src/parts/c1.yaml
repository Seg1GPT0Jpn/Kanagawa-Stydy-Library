# ---- s06 ----
- id: q1025
  sec: s06
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: This is the park in (＿) my sister lost her ring.
  choices: [that, which, who, whom]
  ans: "2"
  why: 先行詞 the park は人以外で、前置詞 in の直後に置ける関係代名詞は which。
  trap: ①that を選ぶ誤り。that は前置詞の直後には置けない。
- id: q1026
  sec: s06
  set: 節末
  lv: 1
  kind: 和訳
  min: 3
  inst: 次の英文を日本語に訳しなさい。
  q: This is the box in which my grandfather keeps his old coins.
  ans: これは、祖父が古い硬貨をしまっている箱だ。
  alt: [これが、祖父が古いコインを入れている箱だ。]
  why: in which 以下が the box を説明する。my grandfather keeps his old coins in the box（箱に硬貨をしまう）の関係が訳せていれば正解。
  trap: in which を「その中で」と切って「これは箱だ。その中で祖父は…」と2文に分ける誤り。関係詞節は「箱」の説明として前に回して訳す。
- id: q1027
  sec: s06
  set: 節末
  lv: 2
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: Mr. Ogawa is a neighbor (＿) whom our family can always depend.
  choices: [on, to, for, with]
  ans: "1"
  why: 節の中の動詞 depend は depend on（〜を頼りにする）の形で使う。our family can always depend on him の on が whom の前に出ている。
  trap: 先行詞が人なので「人に」の to や with を選ぶ誤り。前置詞は先行詞ではなく、節の中の動詞 depend で決まる。
