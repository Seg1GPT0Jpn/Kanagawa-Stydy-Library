- id: q1017
  sec: s04
  set: 節末
  lv: 2
  kind: 補充
  min: 1
  inst: 2つの文がほぼ同じ意味になるように、（　）に適切な語を1語ずつ入れなさい。
  q: Look at that house whose windows are all round.<br>＝ Look at that house the windows (＿) (＿) are all round.
  ans: of which
  why: whose windows（その家の窓）は the windows of which で言いかえられる。which は先行詞 that house を受ける。
  trap: the windows whose のように whose をそのまま入れようとする誤り。名詞の後ろに置くときは「of＋which」の形になる。
- id: q1018
  sec: s04
  set: 節末
  lv: 3
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: これは、メイが昨日話していた小説の作者だ。<br>This is the writer ( about / Mei / novel / talking / was / whose ) yesterday.
  words: [about, Mei, novel, talking, was, whose]
  ans: This is the writer whose novel Mei was talking about yesterday.
  alt: [This is the writer about whose novel Mei was talking yesterday.]
  why: whose novel は about の目的語。先行詞 the writer の直後に whose novel を置き、about を節の最後に残す。about を前に出した about whose novel も正しい。
  trap: Mei was talking about whose novel と、whose novel を普通の文の位置に置いたままにする誤り。関係詞のかたまりは節の先頭に出る。
# ---- s05 ----
- id: q1019
  sec: s05
  set: 節末
  lv: 1
