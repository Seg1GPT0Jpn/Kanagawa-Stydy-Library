  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: We stayed at a hotel (＿) rooms all had a view of the sea.
  choices: [who, whose, which, what]
  ans: "2"
  why: 空所の後ろは冠詞のない rooms で始まり、「そのホテルの部屋」という持ち主の関係。先行詞が物でも whose を使う。
  trap: 先行詞が物なので③which を選ぶ誤り。which の後ろには主語か目的語の欠けた形が来るが、rooms all had a view of the sea は欠けていない。
- id: q1016
  sec: s04
  set: 節末
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: 私は昨夜、題名が思い出せない映画を見た。<br>Last night I watched a movie ( can't / I / remember / title / whose ).
  words: [can't, I, remember, title, whose]
  ans: Last night I watched a movie whose title I can't remember.
  why: whose title をかたまりとして先行詞 a movie の直後に置く。whose title は remember の目的語なので、その後ろに I can't remember を続ける。
