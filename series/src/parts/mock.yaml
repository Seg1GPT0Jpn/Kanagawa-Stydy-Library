# 模擬試験（45分・100点）。第1問〜第5問。part＝大問、pts＝配点。
problems:
- id: q9001
  part: 1
  pts: 3
  sec: s07
  set: 模試
  lv: 1
  kind: 読解
  min: 4
  inst: 次の英文A・Bを読み、問いの答えとして最も適切なものを1つずつ選びなさい。
  passage: New Reading Room Opens<br>On November 9, the room where the brass band used to practice opened as a reading room. The idea came from Ms. Wood, who teaches English and also helps in the library. Last spring she noticed that the library was too crowded at lunchtime, which made it hard for students to find a seat.<br>The new room has 24 chairs and three long tables. The books on its shelves are ones that students chose themselves. In June, the library committee asked every class to write down the titles they wanted to read. More than 300 students answered, most of whom asked for comics and travel books. The committee then bought 150 books with the money the PTA had collected at the school festival.<br>The room is open from 12:40 to 1:20 on weekdays. Students whose classes finish early on Wednesdays can also use it after school until 4:30. What the committee needs now is a name for the room. If you have an idea, write it on a card and put it in the box which is next to the library
    door. The winner will get a 1,000-yen book card.
  q: 英文A（学校新聞の記事）について。<br>問　What was the reading room used for before November 9?
  choices:
  - It was a room for the library staff.
  - It was a room where the brass band practiced.
  - It was a classroom for English lessons.
  - It was a room where the PTA held meetings.
  ans: '2'
  why: 第1段落の the room where the brass band used to practice が答え。where 以下の完全な文が the room を説明し、「吹奏楽部が以前練習していた部屋」となる。
  trap: 直後に出てくる Ms. Wood, who teaches English に引かれて③を選ぶ誤り。who 節が説明しているのはウッド先生で、部屋ではない。
- id: q9002
  part: 1
  pts: 3
  sec: s14
  set: 模試
  lv: 2
  kind: 読解
  min: 2
  q: 英文Aについて。<br>問　In the first paragraph, what does "which" in "which made it hard for students to find a seat" refer to?
  choices:
  - the library
  - lunchtime
  - the fact that the library was too crowded at lunchtime
  - the fact that students wanted more books
  ans: '3'
  why: コンマの付いた which が、前の節 the library was too crowded at lunchtime の内容全体を受けている。「混んでいたこと」が席を見つけにくくした、と読めば意味が通る。
  trap: which の直前の名詞 lunchtime や the library を先行詞と考えて①②を選ぶ誤り。図書館や昼休みそのものが席を見つけにくくした、では意味がずれる。
- id: q9003
  part: 1
  pts: 3
  sec: s14
  set: 模試
  lv: 2
  kind: 読解
  min: 1
  q: 英文Aについて。<br>問　Which of the following is true according to the article?
  choices:
  - Most of the students who answered asked for comics and travel books.
  - Students chose all of the 300 books in the new room.
  - Every student can use the room after school on Wednesdays.
  - The committee has already decided the name of the room.
  ans: '1'
  why: More than 300 students answered, most of whom asked for comics and travel books. の most of whom は「回答した生徒のうちの大半」を指す。①はこれの言いかえである。
  trap: ③を選ぶ誤り。放課後に使えるのは Students whose classes finish early on Wednesdays、つまり水曜の授業が早く終わる生徒だけで、全員ではない。whose 節が主語を絞りこんでいる。
- id: q9004
  part: 1
  pts: 3
  sec: s04
  set: 模試
  lv: 1
  kind: 読解
  min: 4
  passage: 'Last Saturday I joined a walking tour of my town, which a group of volunteers holds twice a month. Our guide was Mr. Hayashi, a retired bus driver who has lived here for over sixty years. He showed us places that I had passed many times without noticing them.<br>The first stop was a small shrine behind the post office. He told us the reason why it stands in such a narrow space: it was moved there in 1972 from a hill that was cut down for a new road. Then we walked to the riverside, where a wooden bridge stood until a typhoon broke it in 1959. The stone base that held the bridge is still there, and he said it is what he most wants young people to see.<br>The tour ended at a coffee shop whose owner is an old friend of his. There, we each got a hand-drawn map on which all the stops were marked. I was surprised that the tour cost only 300 yen, including a cup of coffee. Whoever likes local history should try it. The next tour is on December 5, and you can sign up at the information
    desk in the station.'
  q: 英文B（ブログ）について。<br>問　Where did the walking tour end?
  choices:
  - At the post office.
  - At a coffee shop owned by the guide's old friend.
  - At the information desk in the station.
  - At the riverside.
  ans: '2'
  why: 第3段落の a coffee shop whose owner is an old friend of his が答え。whose owner は「その店の持ち主」で、his はガイドを指す。
  trap: 最後の文の the information desk in the station に引かれて③を選ぶ誤り。駅の案内所は次回の申しこみをする場所で、ツアーが終わった場所ではない。
- id: q9005
  part: 1
  pts: 3
  sec: s10
  set: 模試
  lv: 2
  kind: 読解
  min: 2
  q: 英文Bについて。<br>問　According to the guide, what does he most want young people to see?
  choices:
  - the small shrine behind the post office
  - the hill that was cut down for a new road
  - the stone base of the old wooden bridge
  - the map on which all the stops are marked
  ans: '3'
  why: he said it is what he most wants young people to see の it は、同じ文の前半の The stone base that held the bridge を指す。what 節は「彼が若い人に最も見てほしいもの」という名詞節で、is の補語になっている。
  trap: it を第2段落の最初の話題である神社と結びつけて①を選ぶ誤り。it は同じ文の前半の主語 The stone base を受けている。
- id: q9006
  part: 1
  pts: 3
  sec: s06
  set: 模試
  lv: 3
  kind: 読解
  min: 1
  q: 英文Bについて。<br>問　Which is closest in meaning to "we each got a hand-drawn map on which all the stops were marked"?
  choices:
  - Each of us received a map that showed all the places the tour stopped at.
  - Each of us drew a map and marked the stops on it.
  - We got one map, and the guide wrote our names on it.
  - Each of us got a map which was put up at every stop.
  ans: '1'
  why: on which は「その地図の上に」で、もとの文は all the stops were marked on the map。「立ち寄る場所がすべて記された地図を1人1枚もらった」となり、①と同じ意味になる。
  trap: hand-drawn と marked から「自分で描いて印を付けた」と読み、②を選ぶ誤り。were marked は受け身で、地図はもらったもの（got）である。
- id: q9007
  part: 2
  pts: 3
  sec: s02
  set: 模試
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つずつ選びなさい。
  q: The train (＿) leaves Hakata at 7:15 goes straight to Osaka.
  choices:
  - who
  - which
  - what
  - whose
  ans: '2'
  why: 先行詞 The train は人以外で、節の中で leaves の主語が欠けている。人以外・主語が欠ける → which（または that）。
  trap: ③what を選ぶ誤り。what は先行詞をふくむので、The train のような先行詞の後ろには置けない。
- id: q9008
  part: 2
  pts: 3
  sec: s04
  set: 模試
  lv: 1
  kind: 4択
  min: 1
  q: I have a friend (＿) father works as a vet at the city zoo.
  choices:
  - who
  - whom
  - whose
  - which
  ans: '3'
  why: 空所の直後の father に冠詞も所有格もなく、「その友達の父親」という所有の関係になっている。所有者を表すのは whose。
  trap: 先行詞が人なので①who を選ぶ誤り。who を入れると who father works … となり、father の前に何もない形が残る。
- id: q9009
  part: 2
  pts: 3
  sec: s05
  set: 模試
  lv: 1
  kind: 4択
  min: 1
  q: Kenta ate all the cookies (＿) his mother had baked for the guests.
  choices:
  - what
  - who
  - that
  - whose
  ans: '3'
  why: 先行詞 all the cookies は人以外で、baked の目的語が欠けている。all が付いた先行詞の後ろでは that がよく使われる。
  trap: 「〜したもの」という日本語から①what を選ぶ誤り。all the cookies という先行詞があるので what は使えない（all what は誤り）。
- id: q9010
  part: 2
  pts: 3
  sec: s09
  set: 模試
  lv: 2
  kind: 4択
  min: 1
  q: The aquarium (＿) my class visited in May has a glass tunnel under a big tank.
  choices:
  - where
  - when
  - which
  - in which
  ans: '3'
  why: 節 my class visited ＿ in May は、visited の目的語が欠けた不完全な文。目的語の代わりができるのは関係代名詞の which で、関係副詞の where は入らない。
  trap: 先行詞 The aquarium が場所なので①where を選ぶ誤り。where の後ろは完全な文でなければならない。
- id: q9011
  part: 2
  pts: 3
  sec: s06
  set: 模試
  lv: 2
  kind: 4択
  min: 1
  q: The club (＿) Ella belongs has 42 members.
  choices:
  - to which
  - for which
  - of which
  - which
  ans: '1'
  why: もとの文は Ella belongs to the club.。belong to（〜に所属する）の to を関係代名詞の前に出すと to which になる。
  trap: ④which を選ぶ誤り。belongs の後ろに前置詞 to が残っていないので、which だけでは to が足りない。
- id: q9012
  part: 2
  pts: 3
  sec: s10
  set: 模試
  lv: 2
  kind: 4択
  min: 1
  q: Please show me (＿) you bought at the market this morning.
  choices:
  - that
  - what
  - whom
  - where
  ans: '2'
  why: show me の後ろに先行詞がなく、bought の目的語が欠けている。先行詞をふくむ what が入り、「あなたが買ったもの」という名詞節になる。
  trap: ①that を選ぶ誤り。関係代名詞の that には先行詞が要る。接続詞の that なら後ろは完全な文でなければならないが、bought の目的語が欠けている。
- id: q9013
  part: 2
  pts: 3
  sec: s13
  set: 模試
  lv: 2
  kind: 4択
  min: 1
  q: Laura's grandmother, (＿) lives in Bristol, sends her a long letter every March.
  choices:
  - that
  - who
  - whom
  - what
  ans: '2'
  why: コンマの付いた非制限用法で、先行詞は人、lives の主語が欠けている。非制限用法・人・主語 → who。
  trap: ①that を選ぶ誤り。that は非制限用法（コンマの後ろ）では使わない。
- id: q9014
  part: 2
  pts: 3
  sec: s16
  set: 模試
  lv: 2
  kind: 4択
  min: 1
  q: (＿) hard Kenta practiced, he couldn't hit the ball over the fence.
  choices:
  - However
  - Whatever
  - Whenever
  - Although
  ans: '1'
  why: 直後に副詞 hard があり、その後に Kenta practiced が続く。however＋形容詞・副詞＋S＋V で「どんなに〜しても」となる。
  trap: 「〜けれども」の意味から④Although を選ぶ誤り。Although hard Kenta practiced のように although の直後に副詞を置く語順はない。
- id: q9015
  part: 2
  pts: 3
  sec: s17
  set: 模試
  lv: 3
  kind: 4択
  min: 1
  q: The man (＿) I believed was the shop owner turned out to be a customer.
  choices:
  - whom
  - who
  - which
  - whose
  ans: '2'
  why: I believed を外すと The man ＿ was the shop owner となり、was の主語が欠けている。人・主語 → who。
  trap: I believed の目的語だと考えて①whom を選ぶ誤り。believed の目的語は「＿ was the shop owner」という節で、関係代名詞は節の中で主語の働きをしている。
- id: q9016
  part: 2
  pts: 3
  sec: s18
  set: 模試
  lv: 3
  kind: 4択
  min: 1
  q: Don't use more water (＿) is needed when you cook rice.
  choices:
  - as
  - than
  - which
  - that
  ans: '2'
  why: 先行詞に比較級 more が付いている。than が is needed の主語の働きをして「必要な量を超える水」となる。
  trap: is の主語が欠けているので③which や④that を選ぶ誤り。more water which is needed では比較の相手がなく、more が働かない。
- id: q9017
  part: 3
  pts: 4
  sec: s03
  set: 模試
  lv: 1
  kind: 正誤
  min: 1
  inst: 下線部のうち、誤りを含むものを1つずつ選び、正しい形に直しなさい。
  q: The bag __which__① my uncle __gave__② me __it__③ last month is __too__④ heavy to carry to school.
  choices:
  - ①
  - ②
  - ③
  - ④
  ans: '3'
  fix: The bag which my uncle gave me last month（it を取り除く）
  why: which が gave の目的語の代わりをしているので、節の中に it を残すと目的語が2つになる。
  trap: ④too を選ぶ誤り。too heavy to carry は「重すぎて運べない」で正しい。
- id: q9018
  part: 3
  pts: 4
  sec: s19
  set: 模試
  lv: 2
  kind: 正誤
  min: 1
  q: Shun is one of the students who __has__① __already__② finished the report __that__③ Ms. Wood gave __us__④ on Monday.
  choices:
  - ①
  - ②
  - ③
  - ④
  ans: '1'
  fix: who have already finished
  why: who の先行詞は one ではなく the students（複数）。報告書を終えた生徒が何人かいて、シュンはその1人という意味なので、入試では have にする。
  trap: 主語の Shun や one に合わせて has でよいと考える誤り。関係詞節の動詞は先行詞の数に合わせる。
- id: q9019
  part: 3
  pts: 4
  sec: s13
  set: 模試
  lv: 2
  kind: 正誤
  min: 1
  q: My brother, __that__① works at a bank __in__② Sendai, __comes__③ home __only__④ twice a year.
  choices:
  - ①
  - ②
  - ③
  - ④
  ans: '1'
  fix: My brother, who works
  why: コンマではさんだ非制限用法なので that は使えない。先行詞は人で works の主語が欠けているので who にする。
  trap: ③comes を「過去形にすべき」と考えて選ぶ誤り。年に2回帰ってくるという習慣なので現在形で正しい。
- id: q9020
  part: 3
  pts: 4
  sec: s14
  set: 模試
  lv: 2
  kind: 正誤
  min: 1
  q: I bought five postcards in Kyoto, __two of them__① I __sent__② to my friends __who__③ __live__④ abroad.
  choices:
  - ①
  - ②
  - ③
  - ④
  ans: '1'
  fix: two of which I sent
  why: them のままではコンマだけで2つの文をつないでいる。先行詞 five postcards は人以外なので two of which にする（and two of them でも可）。
  trap: ③who を「friends の後ろなので whom」と考えて選ぶ誤り。who は live の主語なので主格でよい。
- id: q9021
  part: 3
  pts: 4
  sec: s15
  set: 模試
  lv: 3
  kind: 正誤
  min: 1
  q: Give these tickets to __whomever__① __wants__② them, because we __can't__③ use them __on__④ Sunday.
  choices:
  - ①
  - ②
  - ③
  - ④
  ans: '1'
  fix: to whoever wants them
  why: 節の中で wants の主語が欠けているので、主格の whoever にする。to の目的語は whoever wants them という節全体である。
  trap: 直前の前置詞 to を見て、目的格の whomever でよいと考える誤り。格は直前の語ではなく、節の中の働きで決まる。
- id: q9022
  part: 4
  pts: 4
  sec: s03
  set: 模試
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。文頭に来る語も小文字で示してある。
  q: ローラが昨日貸してくれた傘を、電車に置き忘れてしまった。<br>I left ( lent / Laura / me / the / umbrella / yesterday ) on the train.
  words:
  - lent
  - Laura
  - me
  - the
  - umbrella
  - yesterday
  ans: I left the umbrella Laura lent me yesterday on the train.
  why: 関係代名詞が与えられていないので、目的格の関係代名詞を省いた the umbrella Laura lent me ＿ の形にする。lent me の後ろの目的語が欠けている。
  trap: I left Laura the umbrella … のように Laura を left の後ろに置く誤り。「ローラが貸してくれた」の主語は Laura なので、the umbrella の直後に Laura lent を続ける。
- id: q9023
  part: 4
  pts: 4
  sec: s14
  set: 模試
  lv: 2
  kind: 整序
  min: 2
  q: 私はTシャツを10枚持っていて、そのうち3枚はイタリアで買ったものだ。<br>I have ten T-shirts, ( bought / I / in / of / three / which ) Italy.
  words:
  - bought
  - I
  - in
  - of
  - three
  - which
  ans: I have ten T-shirts, three of which I bought in Italy.
  why: 「そのうち3枚」は three of which で節の先頭に置き、その後に I bought ＿ in Italy を続ける。先行詞 ten T-shirts は人以外なので which。
  trap: which を先に置いて which three of … と並べようとする誤り。数の表現＋of＋which の順で1つのまとまりになる。
- id: q9024
  part: 4
  pts: 4
  sec: s16
  set: 模試
  lv: 2
  kind: 整序
  min: 2
  q: どんなに疲れていても、ケンタは毎晩30分英語を勉強する。<br>( he / however / is / tired ), Kenta studies English for 30 minutes every night.
  words:
  - he
  - however
  - is
  - tired
  ans: However tired he is, Kenta studies English for 30 minutes every night.
  why: however は形容詞 tired を引き連れて節の先頭に出る。残りは he is の普通の語順にする。
  trap: However he is tired と tired を後ろに残す誤り。「どんなに」の意味は however＋形容詞のまとまりで表す。
- id: q9025
  part: 4
  pts: 4
  sec: s17
  set: 模試
  lv: 2
  kind: 整序
  min: 2
  q: 私が正直だと思っていた店員は、私にうそをついていた。<br>The clerk ( honest / I / thought / was / who ) lied to me.
  words:
  - honest
  - I
  - thought
  - was
  - who
  ans: The clerk who I thought was honest lied to me.
  why: The clerk who was honest に I thought が入りこんだ形。先行詞 → who → I thought → was honest の順に並べる。
  trap: The clerk who was honest I thought … のように I thought を節の後ろに回す誤り。I thought は who の直後に入る。
- id: q9026
  part: 4
  pts: 4
  sec: s11
  set: 模試
  lv: 3
  kind: 整序
  min: 2
  q: 今の私があるのは祖母のおかげだ。<br>I owe ( am / I / my / to / today / what ) grandmother.
  words:
  - am
  - I
  - my
  - to
  - today
  - what
  ans: I owe what I am today to my grandmother.
  why: owe A to B（AはBのおかげだ）の A に what I am today（今日の私）を置く。what S is は「Sの今の姿」を表す。
  trap: 「私が何であるか」と考えて what am I の疑問文の語順にする誤り。what 節の中は I am の普通の語順になる。
- id: q9027
  part: 5
  pts: 6
  sec: s14
  set: 模試
  lv: 2
  kind: 和訳
  min: 3
  inst: 次の英文の下線部を日本語に訳しなさい。
  q: __Ella told her coach that she would quit the tennis club, which surprised all the members.__①
  ans: エラはテニス部をやめるとコーチに伝え、そのことは部員全員を驚かせた。
  alt:
  - エラがテニス部をやめるとコーチに伝えたので、部員全員が驚いた。
  - エラはテニス部をやめるつもりだとコーチに言ったが、それに部員はみな驚いた。
  why: 採点の目安（6点）：, which が前の内容全体（やめると伝えたこと）を受けていることが訳に出ている 3点。told her coach that she would quit the tennis club（やめるとコーチに伝えた）2点。surprised all the members（部員全員を驚かせた）1点。which を「テニス部」と訳したものは which の3点を与えない。
  trap: which を直前の the tennis club と結びつけ「部員全員を驚かせたテニス部をやめる」と訳す誤り。テニス部が部員を驚かせたのでは意味が通らない。
- id: q9028
  part: 5
  pts: 6
  sec: s19
  set: 模試
  lv: 3
  kind: 和訳
  min: 3
  q: __A letter arrived this morning which said that the concert Ms. Wood had planned for March would be held in a larger hall.__①
  ans: ウッド先生が3月に計画していたコンサートは、もっと大きなホールで開かれるという手紙が、今朝届いた。
  alt:
  - 今朝手紙が届き、そこには、ウッド先生が3月に予定していたコンサートがより大きなホールで行われると書いてあった。
  why: 採点の目安（6点）：which の先行詞が離れた A letter であることをとらえ、「〜という手紙」「手紙が届き、そこには〜」と訳す 2点。the concert Ms. Wood had planned for March（ウッド先生が3月に計画していたコンサート。目的格の関係代名詞の省略）2点。would be held in a larger hall（より大きなホールで開かれる。受け身と比較級）2点。
  trap: which の直前の this morning を先行詞と考え「〜と言った今朝」のように訳す誤り。said の主語になれるのは人以外の名詞 A letter で、関係詞節が文の後ろに回っている（外置）。
