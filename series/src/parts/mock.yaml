  q: 今の私があるのは祖母のおかげだ。<br>I owe ( am / I / my / to / today / what ) grandmother.
  words:
  - am
  - I
  - my
  - to
  - today
  - what
  ans: I owe what I am today to my grandmother.
  why: owe A to B（AはBのおかげだ）の A に what I am today（今日の私）を置く。what I am today は am の補語が欠けた不完全な文で、what がその補語の代わりをしている。what S is は「Sの今の姿」を表す。
  trap: 「私が何であるか」と考えて what am I の疑問文の語順にする誤り。what 節の中は I am の普通の語順になる。
- id: q9027
  part: 5
  pts: 6
  sec: s14
  set: 模試
  lv: 2
  kind: 和訳
  min: 3
  inst: 次の英文の下線部を日本語に訳しなさい。
  q: __Ella told her coach that she would quit the tennis club, which surprised all the members.__
  ans: エラはテニス部をやめるとコーチに伝え、そのことは部員全員を驚かせた。
  alt:
  - エラがテニス部をやめるとコーチに伝えたので、部員全員が驚いた。
  - エラはテニス部をやめるつもりだとコーチに言ったが、それに部員はみな驚いた。
  why: ", which は直前の the tennis club ではなく、前の節 Ella told her coach that she would quit the tennis club の内容全体（エラがテニス部をやめるとコーチに伝えたこと）を受ける。「そのこと」は、エラがテニス部をやめるとコーチに伝えたことを指す。採点の目安（6点）：which が前の節の内容を受けていることが訳に出ている（「そのこと」「それ」「〜と伝えたので」など）3点。「エラがやめること」に驚いたと読んだ訳も、驚いた中身は同じなので3点を与える。told her coach that she would quit the tennis club（やめるとコーチに伝えた）2点。surprised all the members（部員全員を驚かせた）1点。which を「テニス部」と訳したものは which の3点を与えない。"
  trap: which を直前の the tennis club と結びつけ「部員全員を驚かせたテニス部をやめる」と訳す誤り。テニス部が部員を驚かせたのでは意味が通らない。
- id: q9028
  part: 5
