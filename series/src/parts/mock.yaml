# 模擬試験（45分・100点）。第1問〜第5問。part＝大問、pts＝配点。
problems:
- id: q9001
  part: 1
  pts: 3
  sec: s07
  set: 模試
  lv: 1
  kind: 読解
  min: 4
  inst: 次の英文A・Bを読み、問いの答えとして最も適切なものを1つずつ選びなさい。
  passage: '**A（学校新聞の記事）**<br>New Reading Room Opens<br>On November 9, the room where the brass band used to practice opened as a reading room. The idea came from Ms. Wood, who teaches English and also helps in the library. Last spring she noticed that the library was too crowded at lunchtime, which made it hard for students to find a seat.<br>The new room has 24 chairs and three long tables. The books on its shelves are ones that students chose themselves. In June, the library committee asked every class to write down the titles they wanted to read. More than 300 students answered, most of whom asked for comics and travel books. The committee then bought 150 books with the money the PTA had collected at the school festival.<br>The room is open from 12:40 to 1:20 on weekdays. Students whose classes finish early on Wednesdays can also use it after school until 4:30. What the committee needs now is a name for the room. If you have an idea, write it on a card and put it in the box which is next to the library door. The winner will get a 1,000-yen book card.'
  q: 英文A（学校新聞の記事）について。<br>問　What was the reading room used for before November 9?
  choices:
  - It was a room where the brass band practiced.
  - It was a room for the library staff.
  - It was a classroom for English lessons.
  - It was a room where the PTA held meetings.
  ans: '1'
  why: 第1段落の the room where the brass band used to practice が答え。where 以下の完全な文が the room を説明し、「吹奏楽部が以前練習していた部屋」となる。
  trap: 直後に出てくる Ms. Wood, who teaches English に引かれて③を選ぶ誤り。who 節が説明しているのはウッド先生で、部屋ではない。
- id: q9002
  part: 1
  pts: 3
  sec: s14
  set: 模試
  lv: 2
  kind: 読解
  min: 2
  q: 英文Aについて。<br>問　In the first paragraph, what does "which" in "which made it hard for students to find a seat" refer to?
  choices:
  - the library
  - lunchtime
  - the fact that the library was too crowded at lunchtime
  - the fact that students wanted more books
  ans: '3'
  why: コンマの付いた which が、前の節 the library was too crowded at lunchtime の内容全体を受けている。「混んでいたこと」が席を見つけにくくした、と読めば意味が通る。
  trap: which の直前の名詞 lunchtime や the library を先行詞と考えて①②を選ぶ誤り。図書館や昼休みそのものが席を見つけにくくした、では意味がずれる。
- id: q9003
  part: 1
  pts: 3
  sec: s14
  set: 模試
  lv: 2
  kind: 読解
  min: 1
  q: 英文Aについて。<br>問　Which of the following is true according to the article?
  choices:
  - The committee has already decided the name of the room.
  - Students chose all of the 300 books in the new room.
  - Every student can use the room after school on Wednesdays.
  - Most of the students who answered asked for comics and travel books.
  ans: '4'
  why: More than 300 students answered, most of whom asked for comics and travel books. の most of whom は「回答した生徒のうちの大半」を指す。④はこれの言いかえである。
  trap: ③を選ぶ誤り。放課後に使えるのは Students whose classes finish early on Wednesdays、つまり水曜の授業が早く終わる生徒だけで、全員ではない。whose 節が主語を絞りこんでいる。
- id: q9004
  part: 1
  pts: 3
  sec: s04
  set: 模試
  lv: 1
  kind: 読解
  min: 4
  passage: '**B（ブログ）**<br>Last Saturday I joined a walking tour of my town, which a group of volunteers holds twice a month. Our guide was Mr. Hayashi, a retired bus driver who has lived here for over sixty years. He showed us places that I had passed many times without noticing them.<br>The first stop was a small shrine behind the post office. He told us the reason why it stands in such a narrow space: it was moved there in 1972 from a hill that was cut down for a new road. Then we walked to the riverside, where a wooden bridge stood until a typhoon broke it in 1959. The stone base that held the bridge is still there, and he said it is what he most wants young people to see.<br>The tour ended at a coffee shop whose owner is an old friend of his. There, we each got a hand-drawn map on which all the stops were marked. I was surprised that the tour cost only 300 yen, including a cup of coffee. Whoever likes local history should try it. The next tour is on December 5, and you can sign up at the information desk in the station.'
  q: 英文B（ブログ）について。<br>問　Where did the walking tour end?
  choices:
  - At the post office.
  - At a coffee shop owned by the guide's old friend.
  - At the information desk in the station.
  - At the riverside.
  ans: '2'
  why: 第3段落の a coffee shop whose owner is an old friend of his が答え。whose owner は「その店の持ち主」で、his はガイドを指す。
  trap: 最後の文の the information desk in the station に引かれて③を選ぶ誤り。駅の案内所は次回の申しこみをする場所で、ツアーが終わった場所ではない。
- id: q9005
  part: 1
  pts: 3
  sec: s10
  set: 模試
  lv: 2
  kind: 読解
  min: 2
  q: 英文Bについて。<br>問　According to the guide, what does he most want young people to see?
  choices:
  - the small shrine behind the post office
  - the hill that was cut down for a new road
  - the map on which all the stops are marked
  - the stone base of the old wooden bridge
  ans: '4'
  why: he said it is what he most wants young people to see の it は、同じ文の前半の The stone base that held the bridge を指す。what 節は「彼が若い人に最も見てほしいもの」という名詞節で、is の補語になっている。
  trap: it を第2段落の最初の話題である神社と結びつけて①を選ぶ誤り。it は同じ文の前半の主語 The stone base を受けている。
- id: q9006
  part: 1
  pts: 3
  sec: s06
  set: 模試
  lv: 2
  kind: 読解
  min: 1
  q: 英文Bについて。<br>問　Which is closest in meaning to "we each got a hand-drawn map on which all the stops were marked"?
  choices:
  - We got one map, and the guide wrote our names on it.
  - Each of us drew a map and marked the stops on it.
  - Each of us received a map that showed all the places the tour stopped at.
  - Each of us got a map which was put up at every stop.
  ans: '3'
  why: on which は「その地図の上に」で、もとの文は all the stops were marked on the map。「立ち寄る場所がすべて記された地図を1人1枚もらった」となり、③と同じ意味になる。
  trap: hand-drawn と marked から「自分で描いて印を付けた」と読み、②を選ぶ誤り。were marked は受け身で、地図はもらったもの（got）である。
- id: q9007
  part: 2
  pts: 3
  sec: s02
  set: 模試
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つずつ選びなさい。
  q: The train (＿) leaves Hakata at 7:15 goes straight to Osaka.
  choices:
  - which
  - who
  - what
  - whose
  ans: '1'
  why: 先行詞 The train は人以外で、節の中で leaves の主語が欠けている。人以外・主語が欠ける → which（または that）。
  trap: ③what を選ぶ誤り。what は先行詞をふくむので、The train のような先行詞の後ろには置けない。
- id: q9008
  part: 2
  pts: 3
  sec: s04
  set: 模試
  lv: 1
  kind: 4択
  min: 1
  q: I have a friend (＿) father works as a vet at the city zoo.
  choices:
  - whose
  - whom
  - who
  - which
  ans: '1'
  why: 空所の直後の father に冠詞も所有格もなく、「その友達の父親」という所有の関係になっている。所有者を表すのは whose。
  trap: 先行詞が人なので③who を選ぶ誤り。who を入れると who father works … となり、father の前に何もない形が残る。
- id: q9009
  part: 2
  pts: 3
  sec: s05
  set: 模試
  lv: 1
  kind: 4択
  min: 1
  q: Kenta ate all the cookies (＿) his mother had baked for the guests.
  choices:
  - what
  - who
  - that
  - whose
  ans: '3'
  why: 先行詞 all the cookies は人以外で、baked の目的語が欠けている。all が付いた先行詞の後ろでは that がよく使われる。
  trap: 「〜したもの」という日本語から①what を選ぶ誤り。all the cookies という先行詞があるので what は使えない（all what は誤り）。
- id: q9010
  part: 2
  pts: 3
  sec: s09
  set: 模試
  lv: 2
  kind: 4択
  min: 1
  q: The aquarium (＿) my class visited in May has a glass tunnel under a big tank.
  choices:
  - where
  - which
  - when
  - in which
  ans: '2'
  why: 節 my class visited ＿ in May は、visited の目的語が欠けた不完全な文。目的語の代わりができるのは関係代名詞の which で、関係副詞の where は入らない。
  trap: 先行詞 The aquarium が場所なので①where を選ぶ誤り。where の後ろは完全な文でなければならない。
- id: q9011
  part: 2
  pts: 3
  sec: s06
  set: 模試
  lv: 2
  kind: 4択
  min: 1
  q: The club (＿) Ella belongs has 42 members.
  choices:
  - which
  - for which
  - of which
  - to which
  ans: '4'
  why: もとの文は Ella belongs to the club.。belong to（〜に所属する）の to を関係代名詞の前に出すと to which になる。
  trap: ①which を選ぶ誤り。belongs の後ろに前置詞 to が残っていないので、which だけでは to が足りない。
- id: q9012
  part: 2
  pts: 3
  sec: s10
  set: 模試
  lv: 2
  kind: 4択
  min: 1
  q: Please show me (＿) you bought at the market this morning.
  choices:
  - that
  - what
  - whom
  - where
  ans: '2'
  why: show me の後ろに先行詞がなく、bought の目的語が欠けている。先行詞をふくむ what が入り、「あなたが買ったもの」という名詞節になる。
  trap: ①that を選ぶ誤り。関係代名詞の that には先行詞が要る。接続詞の that なら後ろは完全な文でなければならないが、bought の目的語が欠けている。
- id: q9013
  part: 2
  pts: 3
  sec: s13
  set: 模試
  lv: 2
  kind: 4択
  min: 1
  q: Our new math teacher, (＿) came from Okinawa in April, plays the guitar in a band.
  choices:
  - that
  - what
  - whom
  - who
  ans: '4'
  why: コンマの付いた非制限用法で、先行詞 Our new math teacher は人、came の主語が欠けている。非制限用法・人・主語 → who。
  trap: ①that を選ぶ誤り。that は非制限用法（コンマの後ろ）では使わない。③whom は目的格で、came の主語にはなれない。
- id: q9014
  part: 2
  pts: 3
  sec: s16
  set: 模試
  lv: 2
  kind: 4択
  min: 1
  q: No matter (＿) late you come home, send me a message before you leave the station.
  choices:
  - however
  - what
  - how
  - when
  ans: '3'
  why: 空所の直後に形容詞 late があり、その後に you come home が続く。no matter how＋形容詞・副詞＋S＋V で「どんなに遅く帰っても」となる（＝However late you come home）。
  trap: ①however を選ぶ誤り。no matter の後ろには疑問詞を置き、-ever の付いた語は置かない。④when では late を引き連れられない。
- id: q9015
  part: 2
  pts: 3
  sec: s17
  set: 模試
  lv: 1
  kind: 4択
  min: 1
  q: "The old painting (＿) the experts believed to be a copy turned out to be real."
  choices:
  - which
  - what
  - whom
  - where
  ans: '1'
  why: "the experts believed の後ろに to be a copy が続き、believed の目的語が欠けている（believe O to be C「OをCだと思う」。もとの文は The experts believed the painting to be a copy.）。先行詞 The old painting は人以外で、節の中で目的語の働きをするので which。文全体の動詞は turned out。"
  trap: "believed の目的語が欠けているので目的格の③whom を選ぶ誤り。目的格を選ぶ考え方は正しいが、whom は先行詞が人のときに使う。先行詞は絵（物）なので which になる。"
- id: q9016
  part: 2
  pts: 3
  sec: s18
  set: 模試
  lv: 2
  kind: 4択
  min: 1
  q: Ella packed more clothes for the three-day trip (＿) were really necessary.
  choices:
  - as
  - but
  - than
  - what
  ans: '3'
  why: 先行詞に比較級 more が付いている。than が were necessary の主語の働きをして「本当に必要な量を超える服」となる。
  trap: ①as を選ぶ誤り。as が関係代名詞の働きをするのは such … as や the same … as のときで、比較級 more と組むのは than。
- id: q9017
  part: 3
  pts: 4
  sec: s03
  set: 模試
  lv: 1
  kind: 正誤
  min: 1
  inst: 下線部のうち、誤りを含むものを1つずつ選び、正しい形に直しなさい。
  q: The bag __which__① my uncle __gave__② me __it__③ last month is __too__④ heavy to carry to school.
  choices:
  - ①
  - ②
  - ③
  - ④
  ans: '3'
  fix: "The bag which my uncle gave me last month（it を削除）"
  why: "which が gave の目的語の代わりをしているので、節の中に it を残すと目的語が2つになる。採点の目安（4点）：誤りの下線部の番号が正しければ2点、訂正が正しければ2点。番号が誤っているときは、訂正にも点を与えない。指示文のとおり、語を取り除く訂正は「it を削除」と書く。「削除」の語がなくても、「it を取り除く」「it は不要」のように it を消すことがはっきり分かれば訂正の2点を与える。"
  trap: ④too を選ぶ誤り。too heavy to carry は「重すぎて運べない」で正しい。
- id: q9018
  part: 3
  pts: 4
  sec: s19
  set: 模試
  lv: 2
  kind: 正誤
  min: 1
  q: The cookies __that__① my grandmother __bakes__② every Sunday __is__③ always gone __by__④ Monday morning.
  choices:
  - ①
  - ②
  - ③
  - ④
  ans: '3'
  fix: The cookies … are always gone
  why: 関係詞節 that my grandmother bakes every Sunday を［ ］でくくって外すと、The cookies is always gone が残る。主語は複数の The cookies なので、is を are にする。②bakes は節の中の主語 my grandmother に合っているので正しい。採点の目安（4点）：誤りの下線部の番号が正しければ2点、訂正が正しければ2点。番号が誤っているときは、訂正にも点を与えない。
  trap: is の直前の Sunday や my grandmother に引かれて、単数の is を正しいと思う誤り。文全体の動詞の数は、関係詞節の外にある文頭の主語に合わせる。
- id: q9019
  part: 3
  pts: 4
  sec: s13
  set: 模試
  lv: 2
  kind: 正誤
  min: 1
  q: We stayed at a small hotel near the station, __that__① had __no__② elevator, so we __had to__③ carry our bags __up__④ to the fourth floor.
  choices:
  - ①
  - ②
  - ③
  - ④
  ans: '1'
  fix: a small hotel near the station, which had no elevator
  why: "コンマの後ろの非制限用法なので that は使えない。先行詞 a small hotel は人以外で、had の主語が欠けているので which にする。採点の目安（4点）：誤りの下線部の番号が正しければ2点、訂正が正しければ2点。番号が誤っているときは、訂正にも点を与えない。①を and it に直した … near the station, and it had no elevator も文法上正しい文になるので、訂正の2点を与える。"
  trap: ③had to を「must にすべき」と考えて選ぶ誤り。過去のことなので must の過去の意味を表す had to で正しい。
- id: q9020
  part: 3
  pts: 4
  sec: s14
  set: 模試
  lv: 2
  kind: 正誤
  min: 1
  q: "Yesterday I __talked__① __with__② the two exchange students __from__③ Brazil, __both of them__④ speak Japanese well."
  choices:
  - ①
  - ②
  - ③
  - ④
  ans: "4"
  fix: "the two exchange students from Brazil, both of whom speak Japanese well"
  why: "both of them のままでは、コンマだけで2つの文（I talked … と both of them speak …）をつないでいることになる。先行詞 the two exchange students は人なので④を both of whom にする。採点の目安（4点）：誤りの下線部の番号が正しければ2点、訂正が正しければ2点。番号が誤っているときは、訂正にも点を与えない。④を and both of them、who both に直したものも文法上正しい文になるので、訂正の2点を与える。"
  trap: "talked with を talked to に直すべきだと考えて、②with を選ぶ誤り。talk with も talk to も正しい。both の後ろの speak が複数形で合っているので④を見落としやすいが、問題は動詞の数ではなく、2つの文がコンマだけでつながっていることにある。"
- id: q9021
  part: 3
  pts: 4
  sec: s15
  set: 模試
  lv: 2
  kind: 正誤
  min: 1
  q: __Whomever__① __finishes__② the test first __may__③ leave the room __quietly__④.
  choices:
  - ①
  - ②
  - ③
  - ④
  ans: '1'
  fix: Whoever finishes the test first
  why: 節の中で finishes の主語が欠けているので、主格の Whoever にする。Whoever finishes the test first が文全体の主語になる名詞節である。採点の目安（4点）：誤りの下線部の番号が正しければ2点、訂正が正しければ2点。番号が誤っているときは、訂正にも点を与えない。
  trap: 文頭なので目的格でも主格でもよいと考え、whomever を正しいとする誤り。格は節の中の働きで決まり、主語の位置に whomever は置けない。
- id: q9022
  part: 4
  pts: 4
  sec: s03
  set: 模試
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。文頭に来る語も小文字で示してある。
  q: 父が私に買ってくれた腕時計は、もう動かない。<br>The ( bought / father / for / me / my / watch ) no longer works.
  words:
  - bought
  - father
  - for
  - me
  - my
  - watch
  ans: The watch my father bought for me no longer works.
  why: "関係代名詞が与えられていないので、目的格の関係代名詞を省いた the watch my father bought ＿ for me の形にする。bought の目的語が欠けている。文全体の動詞は works。"
  trap: "関係代名詞が見当たらないので bought を文の動詞と考え、The watch bought … と並べる誤り。文の動詞は works で、the watch の直後に my father bought を続ける。"
- id: q9023
  part: 4
  pts: 4
  sec: s14
  set: 模試
  lv: 2
  kind: 整序
  min: 2
  q: 私はこの作家の小説を5冊読んだが、そのうち2冊は映画になった。<br>I have read five novels by this writer, ( into / made / of / two / were / which ) films.
  words:
  - into
  - made
  - of
  - two
  - were
  - which
  ans: I have read five novels by this writer, two of which were made into films.
  why: 「そのうち2冊」は two of which で節の先頭に置き、その後に were made into films（映画にされた）を続ける。先行詞 five novels は人以外なので which。two of which は節の中で were の主語になる。
  trap: which を先に置いて which two of … と並べようとする誤り。数の表現＋of＋which の順で1つのまとまりになる。
- id: q9024
  part: 4
  pts: 4
  sec: s16
  set: 模試
  lv: 2
  kind: 整序
  min: 2
  q: どんなに疲れていても、ケンタは毎晩30分英語を勉強する。<br>( is / Kenta / however / tired ), he studies English for 30 minutes every night.
  words:
  - is
  - Kenta
  - however
  - tired
  ans: However tired Kenta is, he studies English for 30 minutes every night.
  why: however は形容詞 tired を引き連れて節の先頭に出る。残りは Kenta is の普通の語順にする。
  trap: However Kenta is tired と tired を後ろに残す誤り。「どんなに」の意味は however＋形容詞のまとまりで表す。
- id: q9025
  part: 4
  pts: 4
  sec: s17
  set: 模試
  lv: 2
  kind: 整序
  min: 2
  q: 私が正直だと思っていた店員は、私にうそをついていた。<br>The clerk ( honest / I / thought / was / who ) lied to me.
  words:
  - honest
  - I
  - thought
  - was
  - who
  ans: The clerk who I thought was honest lied to me.
  why: The clerk who was honest に I thought が入りこんだ形。先行詞 → who → I thought → was honest の順に並べる。
  trap: The clerk who was honest I thought … のように I thought を節の後ろに回す誤り。I thought は who の直後に入る。
