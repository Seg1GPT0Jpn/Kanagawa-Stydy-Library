  min: 3
  q: __A letter arrived this morning which said that the concert Ms. Wood had planned for March would be held in a larger hall.__
  ans: ウッド先生が3月に計画していたコンサートは、もっと大きなホールで開かれるという手紙が、今朝届いた。
  alt:
  - 今朝手紙が届き、そこには、ウッド先生が3月に予定していたコンサートがより大きなホールで行われると書いてあった。
  why: 採点の目安（6点）：which の先行詞が離れた A letter であることをとらえ、「〜という手紙」「手紙が届き、そこには〜」と訳す 2点。the concert Ms. Wood had planned for March（ウッド先生が3月に計画していたコンサート。目的格の関係代名詞の省略）2点。would be held in a larger hall（より大きなホールで開かれる。受け身と比較級）2点。
  trap: which の直前の this morning を先行詞と考え「〜と言った今朝」のように訳す誤り。said の主語になれるのは人以外の名詞 A letter で、関係詞節が文の後ろに回っている（外置）。
