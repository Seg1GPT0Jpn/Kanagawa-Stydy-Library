  ans: I should have closed the window last night. My room is very cold.
  why: 「〜すべきだったのに（しなかった）」は should have done。should の後ろに have＋過去分詞の closed を置く。
  trap: I have should closed … と have を助動詞の前に置く誤り。助動詞が先、その後ろに have＋過去分詞を置く。
