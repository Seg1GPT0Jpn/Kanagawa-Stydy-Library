  ans: we would have gotten lost
  alt: [we would have got lost, we would have been lost, we would have lost our way, we might have gotten lost, we might have got lost, we could have gotten lost, we could have got lost]
  why: 「〜がなかったら…していただろう」は過去の仮定なので、主節は would have done。get の過去分詞は got（アメリカ英語では gotten）。be lost（迷っている状態）を使った we would have been lost も正しい。採点の目安：would（might・could）have＋過去分詞の形で「道に迷う」（get lost・be lost・lose our way）が表せていれば正解。
  trap: we would get lost と書く誤り。これは今の仮定（地図がなければ迷うだろう）になり、「迷っていただろう」の意味にならない。
