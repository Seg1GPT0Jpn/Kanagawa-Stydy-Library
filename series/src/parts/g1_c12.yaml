  alt: [もし外国で暮らすとしたら、あなたはどの国を選ぶだろうか。]
  why: If S were to do は「仮に〜するとしたら」と、仮の話を持ち出す形。採点の目安：「仮に（もし）住むとしたら」と仮の話として訳し、「どの国を選ぶか」がたずねる形になっていれば正解。
