  ans: Were my sister
  why: if を省くと、if 節の were を主語 my sister の前に出す。主語が名詞のかたまりでも、were の後ろにそのまま置く。
  trap: My sister were here と、were を前に出さずに if だけを消す誤り。if を省いたら、語順を入れかえて仮定のしるしにする。
