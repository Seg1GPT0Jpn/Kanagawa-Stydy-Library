  ans: "2"
  why: コンマの後ろの they opened a small café は主語も目的語もそろった完全な文。which ではなく、場所を受ける where にする。
  trap: 先行詞 Nagano が地名なので which も使えると考える誤り。which を使うのは、節の中で主語や目的語などが欠けた不完全な文のときだけである。
- id: q4016
  sec: s14
  set: 章末
  lv: 2
  kind: 正誤
  min: 1
  q: My grandfather, __who__① __is__② 75, started __learning__③ English last year, __that__④ surprised all of us.
  ans: "4"
  why: 驚かせたのは「祖父が去年英語を習い始めたこと」という前の内容全体。前の内容を受けるのはコンマの付いた which で、that は使えない。
  trap: ①who に目が行き、④を見落とす。①は人・主語が欠けた非制限用法なので正しい。
- id: q4017
  sec: s14
  set: 章末
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: 姉はスカーフを3枚持っていて、そのうち2枚は祖母が作ったものだ。<br>My sister has three scarves, two ( by / grandmother / made / of / our / were / which ).
  words: [by, grandmother, made, of, our, were, which]
  ans: My sister has three scarves, two of which were made by our grandmother.
  why: 先行詞 three scarves は人以外なので、two of which で「そのうち2枚は」とする。節の中は受け身の were made by our grandmother。
  trap: of の後ろに whom を考えて迷う誤り。whom は先行詞が人のときだけで、スカーフには which を使う。
- id: q4018
  sec: s14
  set: 章末
  lv: 3
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。ただし、必要なコンマを1つ補うこと。
  q: ガルシア先生には息子が2人いて、2人とも医者になり、先生はそのことをとても誇りに思った。<br>Ms. Garcia has two sons, ( became / both / doctors / her / made / of / proud / very / which / whom ).
  words: [became, both, doctors, her, made, of, proud, very, which, whom]
  ans: Ms. Garcia has two sons, both of whom became doctors, which made her very proud.
  why: 息子2人については both of whom became doctors、それを誇りに思ったことは「2人とも医者になったこと」全体を受ける , which made her very proud で表す。人を受ける whom と、内容を受ける which を使い分ける。
  trap: both of which became doctors と並べる誤り。sons は人なので of の後ろは whom になり、which は後半の「そのこと」を受ける側に回る。
- id: q4019
  sec: s14
  set: 章末
  lv: 2
  kind: 読解
  min: 4
  inst: 次の英文を読み、問いの答えとして最も適切なものを1つ選びなさい。
  q: "Tom joined the cooking club in April. The club has twelve members, most of whom had never cooked before. Their teacher, who runs a restaurant in town, visits every Friday. Last month the club made curry at a care home near the school, where about 40 older people live. Some of the members cut their fingers while they were cutting vegetables, which made the teacher a little worried. However, everyone enjoyed the curry, and the club plans to cook there again in December.<br>問　What made the teacher a little worried?"
  choices:
  - The club cooked for about 40 people.
  - The curry was not very good.
  - Most members had never cooked before.
  - Some members cut their fingers while cooking.
  ans: "4"
  why: ", which made the teacher a little worried の which は、直前の「何人かの部員が野菜を切っていて指を切ったこと」全体を受けている。"
  trap: ③を選ぶ誤り。部員の多くが料理をしたことがなかったのは本文にあるが、先生を心配させた内容として which が受けているのは、すぐ前の指を切った出来事である。
- id: q4020
  sec: s14
  set: 章末
  lv: 2
  kind: 補充
  min: 1
  inst: 2つの文がほぼ同じ意味になるように、空所に1語ずつ入れなさい。
  q: I have two older brothers, and both of them live in Osaka.<br>= I have two older brothers, (＿)(＿)(＿) live in Osaka.
  ans: both of whom
  why: and both of them を関係代名詞で言いかえると both of whom になる。brothers は人で、of の後ろなので目的格の whom。
  trap: 空所の数に合わせて both of who と書く誤り。前置詞 of の直後に主格の who は置かない。
- id: q5001
  sec: s15
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: (＿) wants to use the music room after school must ask Mr. Mori first.
  choices: [Whoever, Whatever, Whomever, Anyone]
  ans: "1"
  why: 空所から school までが must ask の主語になる名詞節で、節の中では wants の主語が欠けている。人を表し主語の働きをするのは Whoever（＝Anyone who）。
  trap: ④Anyone を選ぶ誤り。Anyone は先行詞をふくまないので、Anyone who wants … と who が要る。
- id: q5002
  sec: s15
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  q: Here are four T-shirts from the trip. You can take (＿) you like.
  choices: [whoever, however, whichever, wherever]
