  lv: 2
  kind: 4択
  min: 1
  q: The aquarium (＿) my class visited in May has a glass tunnel under a big tank.
  choices:
  - where
  - which
  - when
  - in which
  ans: '2'
  why: 節 my class visited ＿ in May は、visited の目的語が欠けた不完全な文。目的語の代わりができるのは関係代名詞の which で、関係副詞の where は入らない。
  trap: 先行詞 The aquarium が場所なので①where を選ぶ誤り。where の後ろは完全な文でなければならない。
- id: q9011
  part: 2
  pts: 3
  sec: s06
  set: 模試
  lv: 2
  kind: 4択
  min: 1
  q: The club (＿) Ella belongs has 42 members.
  choices:
  - which
  - for which
  - of which
  - to which
  ans: '4'
  why: もとの文は Ella belongs to the club.。belong to（〜に所属する）の to を関係代名詞の前に出すと to which になる。
  trap: ①which を選ぶ誤り。belongs の後ろに前置詞 to が残っていないので、which だけでは to が足りない。
- id: q9012
  part: 2
  pts: 3
  sec: s10
  set: 模試
  lv: 2
  kind: 4択
  min: 1
  q: Please show me (＿) you bought at the market this morning.
  choices:
  - that
  - what
  - whom
  - where
