book:
  id: eg01
  series: 高校英語シリーズ
  vol: 1
  title: 英文法　関係詞
  edition: 第1版
  date: 2026年12月
  publisher: かながわ教材ライブラリ
  license: CC BY 4.0

aims:
  s01: 関係詞節が先行詞を後ろから説明するしくみを知り、3つの問いで関係代名詞を選べるようになる。
  s02: 先行詞の種類と節の中で欠けた主語から、who・which・that を選べるようになる。
  s03: 目的語が欠けた関係詞節を見抜き、関係代名詞を省略できる場合とできない場合を区別できるようになる。
  s04: whose＋名詞の形を見抜き、先行詞が物のときの whose と of which も使えるようになる。
  s05: that が好まれる先行詞と、that が使えない形を言えるようになる。
  s06: 前置詞＋関係代名詞の形を作り、前置詞を前に出せない場合も判断できるようになる。
  s07: 後ろが完全な文のとき、場所・時の先行詞に where・when を使えるようになる。
  s08: the reason why と the way の正しい使い方を言えるようになる。
  s09: 後ろが完全な文か不完全な文かで、関係副詞と関係代名詞を選び分けられるようになる。
  s10: 先行詞をふくむ what の節を見抜き、what と which・that を選び分けられるようになる。
  s11: what を使った決まった言い方と関係形容詞の what を読み取れるようになる。
  s12: 後ろの文の形から、関係代名詞の that・同格の that・接続詞の that を見分けられるようになる。
  s13: コンマの有無で意味がどう変わるかを説明し、非制限用法を正しく使えるようになる。
  s14: 前の文の内容を受ける which と、some of which などの形を使えるようになる。
  s15: whoever・whatever・whichever の節が名詞節か譲歩の副詞節かを見分けられるようになる。
  s16: however＋形容詞・副詞の語順と、whenever・wherever の2つの意味を使い分けられるようになる。
  s17: I think などがはさまった関係詞節で、主格の関係代名詞を正しく選べるようになる。
  s18: as・than・but が関係代名詞の働きをする形を読み取れるようになる。
  s19: 先行詞に動詞の数を合わせ、先行詞から離れた関係詞節を正しく読み取れるようになる。

chapters:
- id: c1
  title: 関係代名詞の基本
  sections:
  - id: s01
    title: 関係代名詞は「名詞の後ろに付く説明」をつくる
    patterns: [P1]
    body:
    - h: なぜ関係代名詞が必要なのか
    - p: 日本語では、名詞を説明することばを名詞の前に置きます。「私が昨日読んだ本」では、「私が昨日読んだ」が「本」を説明しています。英語は逆で、主語と動詞をふくむ文の形の説明は、必ず名詞の後ろに置きます。そのとき「ここから説明が始まる」と知らせる目印が<<関係代名詞>>です（@e001〜@e003）。
      notes:
      - kind: 用語
        term: 関係代名詞
        yomi: かんけいだいめいし
        text: "先行詞を後ろから説明する節をつくり、その節の中で主語・目的語・所有者（〜の）などの働きもする語。who, which, that, whose など（whose は「whose＋名詞」の形で働く）。"
    - ex: [e001, e002, e003]
    - p: ［ ］で囲んだ部分を<<関係詞節>>、説明される名詞（@e002 の the woman、@e003 の the bus）を<<先行詞>>といいます。先行詞を説明する関係詞節は、外しても文法上は文が成り立ちます。ただし what の節のように、先行詞をもたずに文の主語や目的語になる関係詞節は外せません（@s10）。whoever などの節が「誰が〜しても」という譲歩を表すときは、副詞の働きなので外せます（@s15）。@e002 から［ ］を外すと The woman teaches music at a junior high school. となり、主語と動詞がそろった文が残ります。この「外しても文が残る」ことが、長文で文の骨組みを見抜く手がかりになります。
      notes:
      - kind: 用語
        term: 関係詞節
        yomi: かんけいしせつ
        text: "関係詞から始まり、先行詞を説明するひとまとまり。本書では［ ］で示す。"
      - kind: 用語
        term: 先行詞
        yomi: せんこうし
        text: "関係詞節に説明される名詞。関係詞より「先に行く」ことばなので、こう呼ぶ。"
    - h: 関係代名詞を決める3つの問い
    - p: 先行詞が人なら who、物なら which、と覚えるだけでは入試の問題は解けません。@e001 の that I read yesterday では、節の中の read の目的語がありません。関係代名詞は、この欠けた目的語の代わりをしています。主語・目的語・補語など、文に必要な語が1つ欠けている文を<<不完全な文>>、欠けていない文を完全な文といいます。関係代名詞の後ろは、必ず不完全な文になります。whose の場合は、「whose＋名詞」のかたまりが欠けた語の代わりをします（@s04）。in which のように前置詞が前に出た形では、欠けた「前置詞＋名詞」の代わりを「前置詞＋関係代名詞」のかたまりがするので、かたまりの後ろは完全な文に見えます（@s06）。どの語を使うかは、次の順に問いを立てて決めます。
      notes:
      - kind: 用語
        term: 不完全な文
        yomi: ふかんぜんなぶん
        text: "主語・目的語・補語など、文に必要な語が1つ欠けている文。欠けていない文は完全な文という。関係代名詞の後ろは不完全な文、関係副詞の後ろは完全な文になる。"
    - label: 問い
      steps:
      - 先行詞は人か、人以外か。
      - 関係詞節の中で、何が欠けているか（主語か、目的語か、補語か、それとも欠けていないか）。
      - 先行詞の直後にコンマがあるか（@s13）。
    - p: 問い1と問い2の答えを組み合わせると、使える語が決まります。赤シートで隠して、表のどのマスも言えるようにしておきます。
      notes:
      - kind: 注意
        text: "目的語が欠けているときの whom は、会話や普通の文では who を使うことが多い。入試の4択では whom も正解になる。"
    - table:
        head: ["", 主語が欠けている, 目的語が欠けている, 所有者（〜の）を表す]
        rows:
        - [人, "{{who / that}}", "{{who(m) / that}}", "{{whose}}"]
        - [人以外, "{{which / that}}", "{{which / that}}", "{{whose}}"]
    - check:
      - {q: "I have a friend [＿] lives in Osaka.", a: who／that}
      - {q: "This is the photo [＿] my sister took.", a: which／that（省略も可）}
    examples:
    - id: e001
      en: the book [*that* I read ＿ yesterday]
      ja: 私が昨日読んだ本
    - id: e002
      en: The woman [*who* ＿ lives next door] teaches music at a junior high school.
      ja: 隣に住んでいる女性は、中学校で音楽を教えている。
      gloss: [[next door, 隣に]]
    - id: e003
      en: The bus [*which* ＿ goes to the station] leaves every fifteen minutes.
      ja: 駅へ行くバスは15分おきに出る。
      gloss: [[every fifteen minutes, 15分ごとに]]
    summary:
    - 先行詞を説明する関係詞節は先行詞の{{後ろ}}に置き、外しても文法上は文が{{成り立つ}}。
    - 関係代名詞を決める問い：①先行詞は{{人}}か人以外か　②節の中で{{何が欠けているか}}　③先行詞の直後に{{コンマ}}があるか
    - 人・主語が欠ける → {{who／that}}　人・目的語が欠ける → {{who(m)／that}}
    - 人以外・主語または目的語が欠ける → {{which／that}}　所有者 → {{whose}}
