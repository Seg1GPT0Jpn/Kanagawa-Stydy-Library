book:
  id: eg01
  series: 高校英語シリーズ
  vol: 1
  title: 英文法　関係詞
  edition: 第1版
  date: 2026年12月
  publisher: かながわ教材ライブラリ
  license: CC BY 4.0

aims:
  s01: 関係詞節が先行詞を後ろから説明するしくみを知り、3つの問いで関係代名詞を選べるようになる。
  s02: 先行詞の種類と節の中で欠けた主語から、who・which・that を選べるようになる。
  s03: 目的語が欠けた関係詞節を見抜き、関係代名詞を省略できる場合とできない場合を区別できるようになる。
  s04: whose＋名詞の形を見抜き、先行詞が物のときの whose と of which も使えるようになる。
  s05: that が好まれる先行詞と、that が使えない形を言えるようになる。
  s06: 前置詞＋関係代名詞の形を作り、前置詞を前に出せない場合も判断できるようになる。
  s07: 後ろが完全な文のとき、場所・時の先行詞に where・when を使えるようになる。
  s08: the reason why と the way の正しい使い方を言えるようになる。
  s09: 後ろが完全な文か不完全な文かで、関係副詞と関係代名詞を選び分けられるようになる。
  s10: 先行詞をふくむ what の節を見抜き、what と which・that を選び分けられるようになる。
  s11: what を使った決まった言い方と関係形容詞の what を読み取れるようになる。
  s12: 後ろの文の形から、関係代名詞の that・同格の that・接続詞の that を見分けられるようになる。
  s13: コンマの有無で意味がどう変わるかを説明し、非制限用法を正しく使えるようになる。
  s14: 前の文の内容を受ける which と、some of which などの形を使えるようになる。
  s15: whoever・whatever・whichever の節が名詞節か譲歩の副詞節かを見分けられるようになる。
  s16: however＋形容詞・副詞の語順と、whenever・wherever の2つの意味を使い分けられるようになる。
  s17: I think などがはさまった関係詞節で、主格の関係代名詞を正しく選べるようになる。
  s18: as・than・but が関係代名詞の働きをする形を読み取れるようになる。
  s19: 先行詞に動詞の数を合わせ、先行詞から離れた関係詞節を正しく読み取れるようになる。

chapters:
- id: c1
  title: 関係代名詞の基本
  lead: この章では、who・which・that・whose の使い分けと、前置詞と組み合わせた形を学びます。どの節でも、第1節の3つの問い（@s01）で関係代名詞を決め、後ろが完全な文か不完全な文かを確かめます。
  sections:
  - id: s01
    title: 関係代名詞は「名詞の後ろに付く説明」をつくる
    patterns: [P1]
    body:
    - h: なぜ関係代名詞が必要なのか
    - p: 日本語では、名詞を説明することばを名詞の前に置きます。「私が昨日読んだ本」では、「私が昨日読んだ」が「本」を説明しています。英語は逆で、主語と動詞をふくむ文の形の説明は、必ず名詞の後ろに置きます。そのとき「ここから説明が始まる」と知らせる目印が<<関係代名詞>>です（@e001〜@e003）。
      notes:
      - kind: 用語
        term: 関係代名詞
        yomi: かんけいだいめいし
        text: "先行詞を後ろから説明する節をつくり、その節の中で主語・目的語・所有者（〜の）などの働きもする語。who, which, that, whose など（whose は「whose＋名詞」の形で働く）。"
    - ex: [e001, e002, e003]
    - p: ［ ］で囲んだ部分を<<関係詞節>>、説明される名詞（@e002 の the woman、@e003 の the bus）を<<先行詞>>といいます。先行詞を説明する関係詞節は、外しても文法上は文が成り立ちます。ただし what の節のように、先行詞をもたずに文の主語や目的語になる関係詞節は外せません（@s10）。whoever などの節が「誰が〜しても」という譲歩を表すときは、副詞の働きなので外せます（@s15）。@e002 から［ ］を外すと The woman teaches music at a junior high school. となり、主語と動詞がそろった文が残ります。この「外しても文が残る」ことが、長文で文の骨組みを見抜く手がかりになります。
      notes:
      - kind: 用語
        term: 関係詞節
        yomi: かんけいしせつ
        text: "関係詞から始まり、先行詞を説明するひとまとまり。本書では［ ］で示す。"
      - kind: 用語
        term: 先行詞
        yomi: せんこうし
        text: "関係詞節に説明される名詞。関係詞より「先に行く」ことばなので、こう呼ぶ。"
    - h: 関係代名詞を決める3つの問い
    - p: 先行詞が人なら who、物なら which、と覚えるだけでは入試の問題は解けません。@e001 の that I read yesterday では、節の中の read の目的語がありません。関係代名詞は、この欠けた目的語の代わりをしています。主語・目的語・補語など、文に必要な語が1つ欠けている文を<<不完全な文>>、欠けていない文を完全な文といいます。関係代名詞の後ろは、必ず不完全な文になります。whose の場合は、「whose＋名詞」のかたまりが欠けた語の代わりをします（@s04）。in which のように前置詞が前に出た形では、欠けた「前置詞＋名詞」の代わりを「前置詞＋関係代名詞」のかたまりがするので、かたまりの後ろは完全な文に見えます（@s06）。どの語を使うかは、次の順に問いを立てて決めます。
      notes:
      - kind: 用語
        term: 不完全な文
        yomi: ふかんぜんなぶん
        text: "主語・目的語・補語など、文に必要な語が1つ欠けている文。欠けていない文は完全な文という。関係代名詞の後ろは不完全な文、関係副詞の後ろは完全な文になる。"
    - label: 問い
      steps:
      - 先行詞は人か、人以外か。
      - 関係詞節の中で、何が欠けているか（主語か、目的語か、補語か、それとも欠けていないか）。
      - 先行詞の直後にコンマがあるか（@s13）。
    - p: 問い1と問い2の答えを組み合わせると、使える語が決まります。赤シートで隠して、表のどのマスも言えるようにしておきます。
      notes:
      - kind: 注意
        text: "目的語が欠けているときの whom は、会話や普通の文では who を使うことが多い。入試の4択では whom も正解になる。"
    - table:
        head: ["", 主語が欠けている, 目的語が欠けている, 所有者（〜の）を表す]
        rows:
        - [人, "{{who / that}}", "{{who(m) / that}}", "{{whose}}"]
        - [人以外, "{{which / that}}", "{{which / that}}", "{{whose}}"]
    - check:
      - {q: "I have a friend [＿] lives in Osaka.", a: who／that}
      - {q: "This is the photo [＿] my sister took.", a: which／that（省略も可）}
    examples:
    - id: e001
      en: the book [*that* I read ＿ yesterday]
      ja: 私が昨日読んだ本
    - id: e002
      en: The woman [*who* ＿ lives next door] teaches music at a junior high school.
      ja: 隣に住んでいる女性は、中学校で音楽を教えている。
      gloss: [[next door, 隣に]]
    - id: e003
      en: The bus [*which* ＿ goes to the station] leaves every fifteen minutes.
      ja: 駅へ行くバスは15分おきに出る。
      gloss: [[every fifteen minutes, 15分ごとに]]
    summary:
    - 先行詞を説明する関係詞節は先行詞の{{後ろ}}に置き、外しても文法上は文が{{成り立つ}}。
    - 関係代名詞を決める問い：①先行詞は{{人}}か人以外か　②節の中で{{何が欠けているか}}　③先行詞の直後に{{コンマ}}があるか
    - 人・主語が欠ける → {{who／that}}　人・目的語が欠ける → {{who(m)／that}}
    - 人以外・主語または目的語が欠ける → {{which／that}}　所有者 → {{whose}}
  - id: s02
    title: 主格の関係代名詞 who・which・that
    patterns: [P1]
    body:
    - h: 主語が欠けた関係詞節
    - p: The girl is from Hokkaido. と She sits next to me in math class. の2つの文を、1つにすることを考えます。2つ目の文の She を who に変えて、先行詞 The girl の直後に置くと @e101 ができます。who は節の中で sits の主語の働きをしているので、この who を<<主格>>の関係代名詞と呼びます。
      notes:
      - kind: 用語
        term: 主格
        yomi: しゅかく
        text: "関係代名詞が、関係詞節の中で主語の働きをしていること。主格の関係代名詞は who, which, that。"
    - p: 主格の関係代名詞の後ろには、主語のない形が続きます。@e101 の［ ］の中では、sits の前に主語がありません。文に欠かせない語が抜けたこの形が、第1節（@s01）で見た不完全な文です。who・which・that の後ろは不完全な文になり、何が欠けているかで使う語が決まるのです（whose と、前置詞が前に出る形は @s04・@s06 で扱います）。
    - ex: [e101, e102]
    - h: who・which・that の使い分け
    - p: 主格で使う語は、第1節の問い1「先行詞は人か」で決まります。人なら who（@e101）、人以外なら which（@e102）。that は人にも人以外にも使えます（@e103、@e104）。ただし書き言葉では、先行詞が人のときは that より who のほうがよく使われます。
    - ex: [e103, e104, e105]
    - p: 動物は人以外として扱うので、@e105 のように which か that を使います。ペットのように名前で呼び、家族の一員として話す動物には who を使うこともありますが、入試の4択で先行詞が動物なら、which か that を選ぶのが基本です。
    - h: 節の中の動詞と、よくある書きまちがい
    - p: 主格の関係代名詞の後ろの動詞は、先行詞に形を合わせます。@e106 では先行詞 The students が複数なので are、@e107 では Anyone が単数あつかいなので wants です。who そのものには単数・複数の区別がありません。動詞の形を決めるときは、先行詞までもどって確かめます（@s19）。
    - ex: [e106, e107]
    - p: 書くときに多い誤りの1つは、be 動詞を落とすことです。the students who in the art club や a girl who playing tennis は誤りで、who are in the art club、who is playing tennis としなければなりません。関係詞節も文の一種なので、主語の働きをする who の後ろには動詞が要ります。
      notes:
      - kind: 注意
        text: "主語を二重にしない。the girl who she sits next to me は誤り。who がすでに主語の働きをしているので、she は要らない。"
    - p: 主格の関係代名詞は、原則として省略できません。@e101 から who を外すと The girl sits next to me in math class is from Hokkaido. となり、sits と is のどちらが文の動詞なのか分からなくなります。省略できる場合とできない場合は、次の節（@s03）の終わりの表にまとめます。
    - check:
      - {q: "The woman [＿] runs this café used to be a nurse.", a: who／that}
      - {q: "Take the bus [＿] stops in front of the city hall.", a: which／that}
      - {q: "Students [who (want／wants) to join the chorus] should talk to the coach.", a: want}
    examples:
    - id: e101
      en: The girl [*who* ＿ sits next to me in math class] is from Hokkaido.
      ja: 数学の授業で私の隣に座っている女の子は、北海道の出身だ。
    - id: e102
      en: I bought an alarm clock [*which* ＿ plays a song at 6:30].
      ja: 私は、6時半に歌が流れる目覚まし時計を買った。
      gloss: [[alarm clock, 目覚まし時計]]
    - id: e103
      en: Mei has an uncle [*that* ＿ drives a taxi in Osaka].
      ja: メイには、大阪でタクシーを運転しているおじがいる。
    - id: e104
      en: The shop [*that* ＿ sold these shoes] has closed.
      ja: この靴を売っていた店は、もう閉店してしまった。
    - id: e105
      en: My grandmother has a dog [*which* ＿ barks at the delivery truck every morning].
      ja: 祖母は、毎朝配達のトラックに向かってほえる犬を飼っている。
      gloss: [[bark, ほえる], [delivery, 配達]]
    - id: e106
      en: The students [*who* ＿ are in the art club] stay at school until six on weekdays.
      ja: 美術部に入っている生徒たちは、平日は6時まで学校に残る。
    - id: e107
      en: Anyone [*who* ＿ wants to use the music room after school] has to write their name on this list.
      ja: 放課後に音楽室を使いたい人はだれでも、この表に名前を書かなければならない。
    summary:
    - 関係詞節の中で主語の働きをする関係代名詞を{{主格}}の関係代名詞という。
    - 主格：先行詞が人 → {{who}}／that　人以外（動物をふくむ） → {{which}}／that
    - 主格の関係代名詞の後ろの動詞は、{{先行詞}}の数に合わせる。
    - 主格の関係代名詞の後ろには{{動詞}}が要る（who in the club は誤り）。主格は原則として{{省略できない}}。

  - id: s03
    title: 目的格の関係代名詞と省略
    patterns: [P2, P14]
    body:
    - h: 目的語が欠けた関係詞節
    - p: 今度は、関係詞節の中で目的語が欠けている場合です。@e108 の［ ］の中では、bought の後ろにあるはずの「何を」がありません。I bought it last spring の it が which に変わり、先行詞 The bike の直後に移ったと考えます。この which のように、節の中で目的語の働きをするものを<<目的格>>の関係代名詞といいます。
      notes:
      - kind: 用語
        term: 目的格
        yomi: もくてきかく
        text: "関係代名詞が、関係詞節の中で動詞や前置詞の目的語の働きをしていること。目的格の関係代名詞は who(m), which, that。"
    - ex: [e108, e109, e110]
    - p: 使う語は第1節の表のとおりで、人なら whom か who（@e109）、人以外なら which（@e108）、どちらにも that（@e110）が使えます。whom は改まった書き言葉の形です。会話や普通の文章では who や that を使うか、関係代名詞そのものを省きます。入試の4択で、人が先行詞の目的格の位置に whom を選んで、間違いになることはありません。
    - p: 目的格の関係詞節では、関係代名詞のすぐ後ろに主語が来ます。which I bought、whom Ken helped がその例で、主格の who sits（@e101）とはちがい「関係代名詞＋主語＋動詞」の並びになります。後ろの動詞の目的語の位置が空いているかを確かめれば、主格と取りちがえることはありません。
      notes:
      - kind: 注意
        text: "目的語の位置に it や her を残さない。the bike which I bought it は誤り。which がすでに目的語の働きをしている。"
    - h: 目的格の関係代名詞は省略できる
    - p: 目的格の関係代名詞は、よく省略されます。@e111 では、The sandwiches の後ろに my mother makes がすぐ続いています。名詞の後ろに「主語＋動詞」がいきなり来たら、その間に which や that が省かれていると考えて読みます。この形の関係詞節を<<接触節>>と呼ぶことがあり、会話ではむしろ省略した形のほうが普通です。
      notes:
      - kind: 用語
        term: 接触節
        yomi: せっしょくせつ
        text: "目的格の関係代名詞が省略され、先行詞の直後に「主語＋動詞」が続く関係詞節。the cake my mother made の my mother made など。"
    - ex: [e111, e112]
    - p: 前置詞の目的語が欠けている場合も、前置詞を節の最後に残しておけば、関係代名詞を省略できます（@e112）。読むときは、文の途中の to の後ろに何もないことに気づくのが手がかりです。the girl が「to の相手」だと分かれば、正しく訳せます。前置詞を関係代名詞の前に出す形は @s06 で扱います。
    - h: 主格は原則として省略できない
    - p: 主格の関係代名詞は、原則として省略できません。@e113 から who を外すと The man called you this morning left a message for you. となり、called と left のどちらが文の動詞なのか分からなくなります。目的格を省いても「名詞＋主語＋動詞」の並びが目印として残るのに対し、主格を省くと目印が何も残らないからです。
    - ex: [e113]
    - p: ただし、例外もあります。I think などが関係詞節の中にはさまる場合は、the man I think lives next door のように主格が省かれることがあります（@s17）。
    - p: くだけた話し言葉では、There's a man wants to see you.（あなたに会いたいという男の人が来ている）のように、there is や here is の後で主格が省かれることもあります。とはいえ、これは書き言葉では誤りとされる形です。入試の整序や正誤では、There is a man who wants to see you. のように主格を入れた形を正解とします。
      notes:
      - kind: 注意
        text: "there is の文でも、関係代名詞が目的格なら普通に省略できる。There is something I want to tell you.（話したいことがある）"
    - h: 補語の働きをする関係代名詞は普通省く
    - p: 関係代名詞が be 動詞の後ろの補語の働きをすることもあります。@e114 の［ ］の中では、was の後ろの「どんな場所だったか」にあたる補語が欠けていて、これも不完全な文です。この関係代名詞は主格でも目的格でもありません。実際の英語ではほとんどの場合省かれ、入れるときは that を使うのが普通です。
    - ex: [e114]
    - table:
        head: ["", 省略, 例]
        rows:
        - [目的格（動詞の目的語）, "{{できる}}", "the sandwiches (that) my mother makes"]
        - [目的格（前置詞を後ろに残す）, "{{できる}}", "the girl (who) I was talking to"]
        - [主格, "{{原則できない}}", "the man who called you"]
        - [補語（be 動詞の後ろ）, "{{普通は省く}}", "the quiet place (that) it was"]
        - [前置詞の直後, "{{できない}}", "the town in which he grew up"]
        - [コンマの後（@s13）, "{{できない}}", "my aunt, whom you met last year"]
    - check:
      - {q: "The cake [＿] my sister baked was too sweet.", a: which／that（目的格なので省略も可）}
      - {q: "The boy [＿] won the race is my cousin.", a: who／that（主格なので省略できない）}
      - {q: "The bench [＿] we sat on was wet from the rain.", a: which／that（前置詞の目的語なので省略も可）}
    examples:
    - id: e108
      en: The bike [*which* I bought ＿ last spring] already has a flat tire.
      ja: 去年の春に買った自転車は、もうタイヤがパンクしている。
      gloss: [[flat tire, パンクしたタイヤ]]
    - id: e109
      en: The woman [*whom* Ken helped ＿ at the station] sent a thank-you letter to our school.
      ja: 駅でケンが手助けした女性が、学校にお礼の手紙を送ってきた。
    - id: e110
      en: The songs [*that* our band played ＿ at the school festival last October] were all written by Yui, our drummer.
      ja: 去年の10月の文化祭で私たちのバンドが演奏した曲は、すべてドラム担当のユイが書いたものだ。
    - id: e111
      en: The sandwiches [my mother makes ＿] are better than the ones at the station café.
      ja: 母が作るサンドイッチは、駅のカフェのものよりおいしい。
    - id: e112
      en: The girl [I was talking to ＿] is a new student from Australia.
      ja: 私が話していた女の子は、オーストラリアから来た新しい生徒だ。
    - id: e113
      en: The man [*who* ＿ called you this morning] left a message for you.
      ja: 今朝あなたに電話してきた男性が、あなたへの伝言を残していった。
    - id: e114
      en: My town is not the quiet place [it was ＿ twenty years ago].
      ja: 私の町は、20年前のような静かな場所ではない。
    summary:
    - 関係詞節の中で目的語の働きをする関係代名詞を{{目的格}}という。人 → {{whom}}／who／that　人以外 → {{which}}／that
    - 目的格の関係代名詞は{{省略できる}}。名詞の直後に「{{主語＋動詞}}」が続いたら、省略を疑う。
    - 主格の関係代名詞は原則として{{省略できない}}。there is の後の省略は{{くだけた話し言葉}}に限られる。
    - 前置詞の{{直後}}の関係代名詞と、コンマの後の関係代名詞は省略できない。
    - be 動詞の後ろの{{補語}}の働きをする関係代名詞は、普通は{{省く}}。

  - id: s04
    title: 所有格の whose
    patterns: [P3]
    body:
    - h: 「その人の〜」を表す whose
    - p: 「母親が横浜で花屋をしている友人」では、友人と母親が「友人の母親」という持ち主の関係でつながっています。I have a friend. と His mother runs a flower shop in Yokohama. を1つにすると、His が whose に変わって @e115 ができます。whose は「その人の」「その物の」を表す<<所有格>>の関係代名詞で、すぐ後ろの名詞といっしょに動きます。
      notes:
      - kind: 用語
        term: 所有格
        yomi: しょゆうかく
        text: "「〜の」という持ち主を表す形。関係代名詞では whose がこれに当たる。"
    - ex: [e115, e116, e117]
    - p: whose かどうかを見分けるには、「whose＋名詞」を「his＋名詞」「its＋名詞」などに置きかえて、節の中の欠けた位置に戻してみます。@e116 なら His bike was stolen.、@e117 なら I took her umbrella by mistake. となり、完全な文がもどります。whose の節も、who や which の節（@s02、@s03）と同じく不完全な文です。違うのは、欠けた主語や目的語の代わりをするのが whose 1語ではなく、「whose＋名詞」のかたまりだという点です。
    - p: 「whose＋名詞」は1つのかたまりとして、節の中で主語にも目的語にもなります。@e115 の whose mother、@e116 の whose bike は主語です。一方、@e117 の whose umbrella は took の目的語で、もとは took の後ろにあったかたまりが前に出ています。本書の例文では、かたまりがもとあった位置を ＿ で示しています。
    - p: whose の直後の名詞には、a、the、my などを付けません（whose two sons、whose older brother のように、数や形容詞が付くことはあります）。whose がすでに「その人の」という意味をもっているので、whose the bike とすると「〜の」が二重になるからです。発音が同じ who's と書きまちがえる誤りにも気をつけます。
      notes:
      - kind: 注意
        text: "who's は who is または who has の短縮形。a man who's son is a doctor は誤りで、a man whose son is a doctor とする。"
    - h: 先行詞が物のときの whose と of which
    - p: whose は、先行詞が人以外でも使えます。@e118 では a house が先行詞で、whose roof は「その家の屋根」です。後ろの名詞は複数形でもよく、@e120 の whose uniforms では、動詞も uniforms に合わせて are になっています。物に whose を使うのはやや硬い言い方なので、会話では a house with a green roof のように with を使うことも多くあります。
    - ex: [e118, e119, e120]
    - p: 同じ意味を of which で表すこともできます。@e119 の the roof of which は「その家の屋根」で、whose roof と同じ働きです。of which the roof の語順もありますが、どちらも改まった書き言葉の形です。whose roof を書きかえるときは、the roof of which と、名詞の前の the を落とさないようにします。
    - check:
      - {q: "I know a girl [＿] brother plays in a rock band.", a: whose}
      - {q: "We stayed at a hotel [＿] garden was full of roses.", a: whose}
      - {q: "a house whose roof is green ＝ a house the roof [＿] [＿] is green", a: of which}
    examples:
    - id: e115
      en: I have a friend [*whose* mother ＿ runs a flower shop in Yokohama].
      ja: 私には、母親が横浜で花屋を営んでいる友人がいる。
      gloss: [[run, 経営する]]
    - id: e116
      en: The boy [*whose* bike ＿ was stolen] went to the police box near the station.
      ja: 自転車を盗まれた少年は、駅の近くの交番へ行った。
      gloss: [[police box, 交番]]
    - id: e117
      en: This is the girl [*whose* umbrella I took ＿ by mistake].
      ja: これが、私がまちがえて傘を持っていってしまった女の子だ。
      gloss: [[by mistake, まちがえて]]
    - id: e118
      en: We live in a house [*whose* roof ＿ is painted green].
      ja: 私たちは、屋根が緑色にぬられた家に住んでいる。
    - id: e119
      en: We live in a house [the roof of *which* ＿ is painted green].
      ja: 私たちは、屋根が緑色にぬられた家に住んでいる。
    - id: e120
      en: The team [*whose* uniforms ＿ are dark blue] won the final 3-1.
      ja: 紺色のユニフォームのチームが、決勝で3対1で勝った。
    summary:
    - whose は「その人の・その物の」を表す{{所有格}}の関係代名詞で、すぐ後ろの{{名詞}}といっしょに動く。
    - whose の直後の名詞には {{a・the・my}} などを付けない。
    - 「whose＋名詞」を「{{his／its}}＋名詞」などに置きかえて欠けた{{位置}}に戻すと、完全な文がもどる。
    - 先行詞が物でも whose を使える。a house whose roof ＝ a house {{the roof of which}}

  - id: s05
    title: that が好まれる場合・使えない場合
    patterns: [P1]
    body:
    - h: that が好まれる先行詞
    - p: 先行詞に「ただ1つに決まる」ことを表す語が付いていると、関係代名詞は that がよく使われます。@e121 の the most interesting book は、今年読んだ本の中の1冊を「いちばん」で指し示しています。強く範囲をしぼる先行詞には、しぼる働きだけをもつ that がなじむと説明されます。最上級、the first、the last、the only、the same などが付いた先行詞が、その代表です。
    - p: 同じように、all、every、any、no の付いた先行詞や、everything、anything、nothing などの語にも that が好まれます（@e123、@e124）。which も文法上は誤りではありませんが、all which のような形はあまり使われません。@e124 の All that we need は「必要なのは〜だけだ」という意味になる言い方です。
    - ex: [e121, e123, e124]
    - p: 気をつけたいのは、「好まれる」は「that でなければならない」という意味ではないことです。先行詞が人なら、@e122 のように the only person who とするのも普通の英語です。the best movie which I have seen の which も、文法上は誤りではありません。**そのため入試では、which だけを誤りとする問題は普通出ません。**
      notes:
      - kind: 注意
        text: "4択で that と which が並んでいたら、コンマの後か、前置詞の直後か、先行詞が「人＋人以外」かを確かめる。どちらか一方だけが正解になるのは、こうした理由でもう一方が使えないときである。最上級や all が付くだけでは which は誤りにならない。"
    - ex: [e122]
    - p: 先行詞が「人と、人以外のもの」の組み合わせのときも that を使います。@e125 の a boy and his dog は、少年（人）と犬（人以外）です。who では犬に合わず、which では少年に合わないので、両方に使える that が選ばれます。節の中の動詞は、先行詞が2つなので were になっています。
    - ex: [e125]
    - table:
        head: [先行詞の特徴, 例, that 以外]
        rows:
        - [最上級・the first・the last, "the best song that …", which・who も誤りではない]
        - [the only・the same, "the only person that …", 人なら who もよく使う]
        - [all・every・any・no、-thing の語, "everything that …", which はあまり使わない]
        - [人＋人以外, "a boy and his dog that …", who・which は一方にしか合わない]
    - h: that が使えない場所
    - p: 反対に、that を使えない場所が2つあります。1つ目はコンマの後です。@e126 の My grandmother は1人に決まっている人なので、コンマを付けて説明を足す形になります（@s13）。この形では that は使えず、who か which にします。My grandmother, that is eighty, … は誤りです。
    - ex: [e126]
    - p: 2つ目は前置詞の直後です。「コンサートが開かれるホール」と言うとき、in を関係代名詞の前に出すなら in which とし、in that とは言えません。that を使いたいなら、@e127 のように in を節の最後に残します。前置詞と関係代名詞の組み合わせは次の節（@s06）でくわしく見ます。
      notes:
      - kind: 注意
        text: "in that S V（〜という点で）という言い方があるが、この that は接続詞で、関係代名詞ではない。"
    - ex: [e127]
    - check:
      - {q: "This is the tallest building [＿] I have ever seen.", a: that（which も可）}
      - {q: "Look at the girl and the horse [＿] are running along the beach.", a: that}
      - {q: "My aunt, [＿] works in Nagoya, called me last night.", a: who（that は不可）}
    examples:
    - id: e121
      en: This is the most interesting book [*that* I have read ＿ this year], and I finished it in just two days.
      ja: これは今年私が読んだ中でいちばんおもしろい本で、私はたった2日で読み終えた。
    - id: e122
      en: Yui is the only person in our class [*who* ＿ can speak Korean].
      ja: ユイは、私たちのクラスでただ1人、韓国語を話せる人だ。
    - id: e123
      en: Is there anything [*that* I can do ＿ to help]?
      ja: 何か私に手伝えることはあるか。
    - id: e124
      en: All [*that* we need ＿ now] is a little more time.
      ja: 今私たちに必要なのは、もう少しの時間だけだ。
    - id: e125
      en: We watched a boy and his dog [*that* ＿ were playing in the snow].
      ja: 私たちは、雪の中で遊んでいる少年と犬をながめていた。
    - id: e126
      en: My grandmother, [*who* ＿ is eighty], still goes swimming twice a week.
      ja: 祖母は80歳だが、今でも週に2回泳ぎに行く。
    - id: e127
      en: This is the hall [*that* the concert will be held in ＿].
      ja: ここが、コンサートが開かれるホールだ。
    summary:
    - 先行詞に{{最上級}}・the first・{{the only}}・all・-thing の語などが付くと、関係代名詞は {{that}} が好まれる。
    - 「好まれる」は「必須」ではない。先行詞が人なら the only person {{who}} も普通に使う。
    - 先行詞が「{{人＋人以外}}」なら that を使う。
    - "{{コンマの後}}と{{前置詞の直後}}では that を使えない。"

  - id: s06
    title: 前置詞＋関係代名詞
    patterns: [P10]
    body:
    - h: 前置詞の置き場所は2つある
    - p: 「父が育った町」のもとの文は My father grew up in the town. です。the town は前置詞 in の目的語なので、関係代名詞は目的格になります。このとき in を置ける場所は2つあります。節の最後に残す形（@e128）と、関係代名詞の前に出す形（@e129）で、意味は同じです。
    - ex: [e128, e129, e130]
    - p: 前置詞を後ろに残す形は会話で普通に使われ、関係代名詞を省略することもできます（@e130）。in which のように前に出す形は、改まった書き言葉で多く見られます。前に出した場合、in which の後ろの my father grew up は完全な文になります。欠けていた in the town が、in which としてまるごと前に移ったからです。
    - p: 関係代名詞のうち、that と who は前置詞の直後に置けません。前置詞の直後に置けるのは which・whom と、the painter about whose life a movie was made（その生涯について映画が作られた画家）のような「whose＋名詞」です。that を使いたいときは前置詞を節の最後に残し（@e127）、人を受けるときは who ではなく whom の形にします。in that や with who は、標準的な英語では誤りとされます。前置詞の直後の関係代名詞は、省略もできません。
      notes:
      - kind: 注意
        text: "前置詞を後ろに残すときは who も that も使える。the girl who I talked with ／ the girl that I talked with"
    - h: 前置詞は節の中の語で決まる
    - p: どの前置詞を使うかは、先行詞ではなく、節の中の動詞や名詞との結びつきで決まります。@e131 は「棚の上に置く」なので put the cups on the shelf の on、@e132 は「友だちに送る」なので send the photos to a friend の to です。迷ったら、先行詞をもとの位置にもどして文を作ってみると、前置詞が見えてきます。
    - ex: [e131, e132]
    - p: 動詞と前置詞が決まった組み合わせになっている場合もあります。@e133 の depend on（〜を頼りにする）では on が depend と結びついているので、on which になります。@e134 の at which は、at a speed（〜の速さで）の at です。こうした問題は語法の知識で解くので、動詞や名詞を覚えるときに前置詞もいっしょに覚えておきます。
    - ex: [e133, e134]
    - h: 前置詞を前に出せない場合
    - p: 動詞と前置詞が結びついて、1つの動詞のような意味になるものを<<句動詞>>といいます。look after（世話をする）や put up with（我慢する）では、前置詞を動詞から切りはなすと意味のまとまりがこわれます。そのため、前置詞は動詞の後ろに残します（@e135）。the dog after which my brother looks は不自然で、入試では誤りとされます。
      notes:
      - kind: 用語
        term: 句動詞
        yomi: くどうし
        text: "動詞と前置詞・副詞が結びついて、1つの動詞のような意味になるもの。look after（世話をする）、turn off（消す）など。"
    - ex: [e135]
    - p: turn off（消す）や pick up（拾う）の off や up は前置詞ではなく副詞なので、関係代名詞の前に出すことはできません。the light off which I turned は誤りで、the light (that) I turned off とします。逆に @e134 のように、前置詞を後ろに残すと不自然になる言い方もあります（the speed which the typhoon was moving at とはあまり言わない）。
    - check:
      - {q: "This is the box in [＿] I keep my old letters.", a: which}
      - {q: "The man to [＿] I gave my seat on the train thanked me twice.", a: whom}
      - {q: "The children [＿] my aunt looks after are four and six.", a: who(m)／that（省略も可）}
    examples:
    - id: e128
      en: This is the town [*which* my father grew up in ＿].
      ja: ここは、父が育った町だ。
    - id: e129
      en: This is the town [in *which* my father grew up].
      ja: ここは、父が育った町だ。
    - id: e130
      en: This is the town [my father grew up in ＿].
      ja: ここは、父が育った町だ。
    - id: e131
      en: The shelf [on *which* Ken put the cups] was not strong enough.
      ja: ケンがカップを置いた棚は、十分な強さがなかった。
    - id: e132
      en: Mei is the friend [to *whom* I sent the photos from the trip].
      ja: メイは、私が旅行の写真を送った友だちだ。
    - id: e133
      en: The bus [on *which* many students from the next town depend] runs only once an hour, so it is always full.
      ja: 隣町から通う多くの生徒が頼りにしているバスは、1時間に1本しか走らないので、いつも満員だ。
      gloss: [[depend on, 〜を頼りにする]]
    - id: e134
      en: The speed [at *which* the typhoon was moving toward the island last night] surprised even the weather experts on TV.
      ja: 昨夜、台風が島に向かって進んだ速さには、テレビに出ていた気象の専門家でさえ驚いた。
      gloss: [[typhoon, 台風], [expert, 専門家]]
    - id: e135
      en: The dog [*that* my brother looks after ＿] is fourteen years old.
      ja: 兄が世話をしている犬は14歳だ。
      gloss: [[look after, 世話をする]]
    summary:
    - 前置詞の目的語が欠けた関係詞節では、前置詞を{{節の最後}}に残すか、関係代名詞の{{前}}に出す。
    - 前置詞の直後に {{that}} と {{who}} は置けない（which・whom・whose＋名詞は置ける）。in that、with who は誤り。
    - 前置詞を前に出すと、後ろは{{完全な文}}になる。
    - 前置詞は先行詞ではなく、節の中の{{動詞}}や名詞との結びつきで決まる。
    - look after などの{{句動詞}}では、前置詞を前に出さない。

- id: c2
  title: 関係副詞
  lead: 第1章の関係代名詞は、関係詞節の中で主語・目的語・補語などの代わりをしました。この章で学ぶ関係副詞は、節の中で「そこで」「その時に」のような副詞の代わりをします。どちらを使うかは先行詞の意味ではなく、後ろの節が完全な文か不完全な文かで決まる、というのがこの章の軸です。
  sections:
  - id: s07
    title: 場所・時を表す where と when
    patterns: [P5]
    body:
    - h: 場所や時を説明する関係副詞
    - p: 「祖母がパン屋を営んでいる町」を英語にするとき、the town の後ろに説明の節を置くところまでは関係代名詞と同じです。違うのは節の中身で、もとの文 His grandmother runs a bakery in the town. の in the town は、主語でも目的語でもなく「その町で」という場所を表す副詞のまとまりです。このまとまりの代わりをして節を始める語を<<関係副詞>>といい、場所なら where を使います（@e201）。
      notes:
      - kind: 用語
        term: 関係副詞
        yomi: かんけいふくし
        text: "先行詞を後ろから説明する節をつくり、その節の中で場所・時・理由・方法を表す副詞の働きをする語。where, when, why, how の4つ。"
    - ex: [e201, e202]
    - p: 時を表す名詞の後ろでは when を使います。@e202 の節 we moved to Kobe は、主語 we と動詞 moved がそろっていて、何も欠けていません。もとの文の in that month（その月に）にあたる副詞の部分を、when が受け持っているからです。関係副詞の節は、関係代名詞の節と違って欠けた位置がなく、そのままで文として成り立ちます。本書で関係副詞の節に ＿ を書かないのは、このためです。
    - h: 関係副詞は「前置詞＋which」で言いかえられる
    - p: where と when は副詞のまとまりを丸ごと受けるので、前置詞と which の組み合わせ（@s06）で言いかえられます。@e203 の where は in which、@e204 の when は on which と同じ意味です。どの前置詞を使うかは、もとの文で先行詞の前に付く前置詞で決まります。in the park なら in which、on Friday なら on which になります。
      notes:
      - kind: 注意
        text: "時を表す先行詞の後ろでは、when の代わりに that を使うこともある（the day that we met）。"
    - ex: [e203, e204]
    - table:
        head: ["", 先行詞の例, 関係副詞, 前置詞＋which]
        rows:
        - [場所, "the town, the room, the park", "{{where}}", "{{in / at / on which}}"]
        - [時, "the day, the year, the time", "{{when}}", "{{on / in / at which}}"]
    - h: 先行詞や関係副詞が省かれる形
    - p: 関係副詞の文では、先行詞か関係副詞のどちらかが省かれることがよくあります。@e205 では先行詞の the place が省かれ、where から始まる節が「〜する場所」という意味で is の後ろに置かれています。when も同じ使い方ができ、@e206 の when 節は「〜する時」を表します。先行詞 the time を補って読めば、意味はすぐにとれるはずです。
      notes:
      - kind: 参照
        text: "コンマの付いた「, where」「, when」は第13節（@s13）で扱う。"
    - ex: [e205, e206]
    - p: 反対に、先行詞を残して関係副詞を省くこともあります。@e207 は the day の後ろの when が省かれた形で、名詞の直後に主語と動詞がいきなり続きます。the day, the year, the time などの時の名詞の後ろでは、この省略がよく起こります。where の省略はそれより少なく、the place や somewhere などの後ろでおもに見られます。
    - ex: [e207]
    - check:
      - {q: "the café [＿] my sister works on weekends", a: where}
      - {q: "the month [＿] the new station opened", a: when}
      - {q: "the room in [＿] we practice the piano", a: which}
    examples:
    - id: e201
      en: Haruto visited the small town [*where* his grandmother runs a bakery].
      ja: ハルトは、祖母がパン屋を営んでいる小さな町を訪れた。
      gloss: [[run, （店を）営む]]
    - id: e202
      en: March 2019 was the month [*when* we moved to Kobe].
      ja: 2019年3月は、私たちが神戸に引っ越した月だ。
    - id: e203
      en: The park [*where* we play soccer after school] has two new benches and a water fountain near the gate.
      ja: 放課後に私たちがサッカーをする公園には、新しいベンチが2つと、門の近くに水飲み場がある。
      gloss: [[water fountain, 水飲み場]]
    - id: e204
      en: Friday is the day [*when* the school library stays open until seven].
      ja: 金曜日は、学校の図書館が7時まで開いている日だ。
    - id: e205
      en: This bench is [*where* Sofia waits for her bus every morning].
      ja: このベンチは、ソフィアが毎朝バスを待つ場所だ。
    - id: e206
      en: Lunchtime is [*when* the school store gets most crowded].
      ja: 昼休みは、学校の売店がいちばん混む時間だ。
      gloss: [[crowded, 混んだ]]
    - id: e207
      en: I still remember the day [we got our first dog].
      ja: 私は、うちで初めて犬を飼った日を今でも覚えている。
    summary:
    - 場所を表す先行詞の後ろで、節の中の「そこで」にあたる副詞の代わりをする → {{where}}
    - 時を表す先行詞の後ろで、「その時に」にあたる副詞の代わりをする → {{when}}
    - 関係副詞の後ろの節は、主語・目的語・補語などが欠けていない{{完全な文}}になる。
    - where は{{in / at / on which}}、when は{{on / in / at which}}で言いかえられる。
    - 先行詞が省かれると、where 節は「{{〜する場所}}」、when 節は「{{〜する時}}」という意味になる。
  - id: s08
    title: 理由・方法を表す why と how
    patterns: [P5]
    body:
    - h: 理由を表す why
    - p: 関係副詞 why の先行詞になるのは、ほぼ the reason に限られます。@e208 の節 Riku missed the first train today は主語・動詞・目的語がそろった完全な文で、もとの文の for that reason（その理由で）にあたる部分を why が受けています。そのため why は for which でも言いかえられます。where や when と同じく、副詞のまとまりを受ける語だからです。
    - ex: [e208]
    - p: the reason why の形では、the reason と why のどちらか一方がよく省かれます。@e209 は why を省いた形、@e210 は the reason を省いた形です。why の代わりに that を使った the reason that … も使われます。@e210 の That's why … は、先行詞が省かれた why 節が is の後ろに置かれた形で、「だから〜」という意味になります。
    - ex: [e209, e210]
    - p: That's why … と That's because … は、理由と結果の向きが逆になります。@e210 では「バスの故障」が理由で、why 節の「30分遅れた」が結果です。That's because … なら、because の後ろに理由がきます。前の文が理由なのか結果なのかを確かめてから訳すと、取り違えずにすみます。
      notes:
      - kind: 注意
        text: "That's why A. は「だから A」（前の内容が理由、A が結果）。That's because A. は「それは A だからだ」（A が理由）。"
    - h: 方法を表す how と the way
    - p: 「〜するやり方」を表すときは、関係副詞 how を使います。ただし、先行詞 the way と how を並べた the way how という形は、古い英語には見られるものの、今の英語では使いません。入試の正誤問題でも誤りとして扱われます。the way か how のどちらか一方だけを使う、と覚えておけば迷いません（@e211、@e212）。
    - ex: [e211, e212]
    - p: the way の後ろには、that や in which を置くこともできます。@e213 の the way in which はやや改まった書き言葉で、the way that は話し言葉でも使われます。言いかえの形を並べると次の表のようになり、このうち使えないのは the way how の1つだけです。
    - ex: [e213]
    - table:
        head: [形, 使えるか, 例]
        rows:
        - [the way S V, "{{○}}", the way she talks]
        - [how S V, "{{○}}", how she talks]
        - [the way that S V／the way in which S V, "{{○}}", the way in which she talks]
        - [the way how S V, "{{×}}", 使わない]
    - check:
      - {q: "I don't know the reason [＿] the shop closed early today.", a: why（that も可。省略もできる）}
      - {q: "Please tell me [＿] you made this cake so soft.（1語）", a: how}
      - {q: "This is the way [＿] [＿] he fixed the bike.（2語）", a: in which}
    examples:
    - id: e208
      en: Nobody knows the reason [*why* Riku missed the first train today].
      ja: 今日リクが始発電車に乗り遅れた理由は、だれも知らない。
    - id: e209
      en: The reason [the soccer game was canceled] was the heavy rain.
      ja: サッカーの試合が中止になった理由は、大雨だった。
    - id: e210
      en: The bus broke down near the bridge. That's [*why* we were thirty minutes late].
      ja: バスが橋の近くで故障した。だから私たちは30分遅れたのだ。
      gloss: [[break down, 故障する]]
    - id: e211
      en: This is [*how* Mr. Sato makes curry for forty students in one hour].
      ja: これが、佐藤さんが1時間で40人分のカレーを作る方法だ。
    - id: e212
      en: I like the way [Ms. Brown explains grammar with simple pictures].
      ja: 私は、ブラウン先生が簡単な絵を使って文法を説明するやり方が好きだ。
    - id: e213
      en: After the first test in April, Grace changed the way [*in which* she studies at home].
      ja: 4月の最初のテストの後、グレースは家での勉強のやり方を変えた。
    summary:
    - 理由を表す the reason の後ろ → {{why}}（{{for which}} や that でも言いかえられる）
    - the reason why は、{{the reason}}か{{why}}のどちらかを省くことが多い。
    - 方法は{{the way}} S V か{{how}} S V で表し、{{the way how}}とは言わない。
    - the way の後ろには{{that}}や{{in which}}も置ける。
    - That's why … は「{{だから}}〜」、That's because … は「それは〜{{だからだ}}」。
  - id: s09
    title: 関係副詞か、関係代名詞か
    patterns: [P4]
    body:
    - h: 先行詞の意味だけでは決まらない
    - p: 「先行詞が場所なら where」と覚えていると、@e214 で間違えます。先行詞 the museum は場所ですが、節の中を見ると visited の目的語がありません。visit は「〜を訪れる」という意味で、後ろに目的語が必要な動詞です。欠けた目的語の代わりになれるのは関係代名詞の which（または that）で、副詞の働きしかしない where には無理です。@e215 も、stands の主語が欠けているので which が入ります。
    - ex: [e214, e215]
    - p: 反対に、場所や時の名詞でなくても where が入ることがあります。@e216 の先行詞 a situation は「状況」で、場所ではありません。それでも節 you have to choose between two friends は完全な文なので、関係副詞の where が入ります。situation（状況）、case（場合）、point（段階）なども、「その中で」という意味の where で説明されることがある名詞です。
    - ex: [e216]
    - h: 後ろが完全な文か、不完全な文か
    - p: 関係副詞か関係代名詞かは、先行詞ではなく、関係詞の後ろの節で決めます。これは第1節（@s01）の2つ目の問い「節の中で何が欠けているか」と同じ考え方です。節の中で主語・目的語（前置詞の目的語もふくむ）・補語などのどれも欠けていなければ完全な文、どれかが欠けていれば不完全な文と考え、次の順に確かめます。
    - steps:
      - 関係詞の後ろの節だけを取り出す。
      - 動詞が目的語を必要とする動詞か、be 動詞などの後ろに補語があるか、前置詞の後ろに名詞があるかを確かめる。
      - 主語・目的語・補語などのどれも欠けていなければ（完全な文）→ where / when / why / how、または前置詞＋which。
      - 主語・目的語・補語などのどれかが欠けていれば（不完全な文）→ which / that（先行詞が人なら who / whom / that）。
    - ex: [e217, e218, e219]
    - p: 同じ the house でも、@e217 と @e218 では入る語が違います。@e217 の節 my uncle lived until he was twenty は、live が目的語をとらない動詞なので完全な文で、where が入ります。@e218 の節 my uncle built ＿ by himself は built の目的語が欠けているので which です。
      notes:
      - kind: 注意
        text: "the place where we stayed を which で書くなら、前置詞が必要になる（the place which we stayed at ＿／the place at which we stayed）。"
    - p: 前置詞が節の最後に残る形にも気をつけます。@e219 の節 Grace comes from ＿ は、from の後ろの名詞が欠けた不完全な文です。この from の目的語の代わりをしているのが which です。前置詞を前に出して from which Grace comes にすると、後ろは完全な文になります（@s06）。
    - h: 時や理由の名詞でも同じ手順で決める
    - p: 時や理由の先行詞でも、判断の手順は変わりません。@e220 の先行詞 the three days は時を表しますが、spent の目的語が欠けているので which（または that）が入ります。@e221 の the reason も、gave の目的語が欠けているので why ではなく that か which です。正誤問題で場所・時・理由の名詞の後ろに where・when・why を見つけたら、後ろの節に欠けた語がないかを確かめます。
    - ex: [e220, e221]
    - check:
      - {q: "the restaurant [＿] we had dinner last night", a: where（in which / at which も可）}
      - {q: "the restaurant [＿] my aunt told me about", a: which／that（省略も可）}
      - {q: "the year [＿] I will never forget", a: which／that（省略も可）}
      - {q: "the year [＿] I started high school", a: when（in which も可）}
    examples:
    - id: e214
      en: The museum [*which* we visited ＿ on our school trip] had a real train from 1872.
      ja: 修学旅行で私たちが訪れた博物館には、1872年の本物の列車があった。
    - id: e215
      en: We stayed at a hotel [*which* ＿ stands right next to the station].
      ja: 私たちは、駅のすぐ隣に建っているホテルに泊まった。
    - id: e216
      en: Sometimes you are in a situation [*where* you have to choose between two friends].
      ja: 2人の友達のどちらかを選ばなければならない状況になることもある。
      gloss: [[situation, 状況]]
    - id: e217
      en: That is the house [*where* my uncle lived until he was twenty].
      ja: あれは、おじが20歳になるまで住んでいた家だ。
    - id: e218
      en: That is the house [*which* my uncle built ＿ by himself].
      ja: あれは、おじが自分で建てた家だ。
    - id: e219
      en: The town [*which* Grace comes from ＿] is famous for its apples.
      ja: グレースの出身の町は、リンゴで有名だ。
    - id: e220
      en: We will never forget the three days [*which* we spent ＿ at the camp in Nagano last August].
      ja: 私たちは、去年の8月に長野のキャンプで過ごした3日間を決して忘れないだろう。
    - id: e221
      en: The reason [*that* Riku gave ＿ for being late on Monday morning] sounded a little strange to our teacher, so she called his mother after school.
      ja: リクが月曜の朝の遅刻について述べた理由は先生には少し妙に聞こえたので、先生は放課後に彼の母親に電話をした。
    summary:
    - 関係副詞か関係代名詞かは、先行詞ではなく関係詞の{{後ろの節}}で決める。
    - 後ろが{{完全な文}} → where / when / why / how、または{{前置詞＋which}}
    - 後ろが{{不完全な文}}（主語・目的語・補語などが欠ける） → {{which／that}}（先行詞が人なら {{who(m)／that}}）
    - 場所の名詞でも、節の中で visit などの{{目的語}}が欠けていれば where ではなく which になる。
    - the town which she comes from では、節の最後の{{from}}の目的語が欠けている。

- id: c3
  title: what と that
  lead: 第1章と第2章では、先行詞の後ろに置く関係詞を学びました。この章では、先行詞を自分の中にふくむ what と、what を使った決まった言い方を扱います。最後に、関係代名詞の that と接続詞の that を「後ろが完全な文か不完全な文か」で見分け、what もふくめた4つの形を1つの表で整理します。
  sections:
  - id: s10
    title: 先行詞をふくむ関係代名詞 what
    patterns: [P6]
    body:
    - h: what は先行詞を自分の中にふくむ
    - p: 第1節（@s01）では、関係代名詞は先行詞の後ろに置くと学びました。ところが what の前には先行詞がありません。what 自体が「もの」「こと」という名詞を中にふくんでいるからです。そのため what は the thing(s) which と置きかえられます。@e301 の What Ben said は「ベンが言ったこと」で、The thing which Ben said と同じ意味です。
    - ex: [e301, e302]
    - p: what から始まるまとまりは、文の中で1つの名詞として働きます。このように名詞の働きをする節が<<名詞節>>です。名詞と同じ働きなので、主語（@e301）、目的語（@e302）、補語（@e303）、前置詞の目的語（@e304）のどこにでも置けます。訳は「〜すること」「〜するもの」とまとめるのが基本です。本書では what の節も［ ］で示しますが、第1節（@s01）で見た「外しても文が成り立つ」関係詞節とは違います。what の節は名詞節で、それ自体が文の主語や目的語なので、［ ］を外すと文が成り立ちません。@e301 から［ ］を外すと surprised everyone しか残らないのです。
      notes:
      - kind: 用語
        term: 名詞節
        yomi: めいしせつ
        text: "主語と動詞をふくむまとまりで、文の中で名詞と同じ働き（主語・目的語・補語など）をするもの。what 節や接続詞 that の節がこれにあたる。"
    - ex: [e303, e304]
    - h: what の後ろは不完全な文
    - p: what も関係代名詞なので、節の中で主語・目的語（前置詞の目的語もふくむ）・補語のどれかの代わりをします。だから what の後ろには、文に必要な語が1つ欠けた不完全な文が続くのです。@e301 では said の目的語が、@e302 では looking for の後ろの目的語が、@e303 では gave の目的語が欠けています。第1節（@s01）の問い2「節の中で何が欠けているか」は、what にもそのまま使えるわけです。欠けている語のない完全な文が後ろに来るなら、what は入りません。補語が欠ける what S is などの形は第11節（@s11）で扱います。
      notes:
      - kind: 注意
        text: "前置詞の目的語が欠けることもある。@e302 の looking for ＿ のように、前置詞が節の最後に残っている文を見落とさない。"
    - h: 先行詞があれば what は使えない
    - p: what はすでに先行詞をふくんでいるので、前に先行詞を置くと「もの」が二重になります。@e305 のように the cups という先行詞があれば that（または which）、@e306 のように先行詞がなければ what です。the things what … や all what … は誤りです。「〜するすべてのこと」なら all that … や everything that … を使います。
      notes:
      - kind: 注意
        text: "everything, all, anything の後ろに what は置けない。that を使うか、目的格なら that を省略する（everything he said）。"
    - ex: [e305, e306]
    - check:
      - {q: "I'll tell you [＿] I saw at the zoo.", a: what}
      - {q: "This is the key [＿] opens the back door.", a: which／that}
      - {q: "Everything [＿] he said was true.", a: that（省略も可。which はあまり使わない）}
    - h: 疑問詞の what との見分け方
    - p: what には「何」という疑問詞の働きもあります。@e307 の what I wanted for lunch は「昼食に何が欲しいか」で、ask（たずねる）の目的語です。ask や wonder、I'm not sure のように「分からないこと」を表す語の後ろでは、疑問詞として「何を〜か」と訳すのが自然です。
    - p: 一方、know, tell, remember などの後ろでは、どちらにも読める場合があります。@e308 は「加藤先生が何と言ったか」とも「加藤先生が言ったこと」とも訳せ、意味はほとんど変わりません。和訳では文脈に合う方を選べば十分です。buy や find のように物を相手にする動詞の後ろなら、関係代名詞として「〜するもの」と読むことが多くなります（@e302）。
    - ex: [e307, e308]
    examples:
    - id: e301
      en: "[*What* Ben said ＿ at the meeting] surprised everyone."
      ja: ベンが会議で言ったことは、全員を驚かせた。
    - id: e302
      en: "I couldn't find [*what* I was looking for ＿] at the shop near the station."
      ja: 駅の近くの店では、探していたものが見つからなかった。
    - id: e303
      en: "This bag is [*what* my grandmother gave ＿ to me on my sixteenth birthday]."
      ja: このかばんは、16歳の誕生日に祖母がくれたものだ。
    - id: e304
      en: "Thank you for [*what* you did ＿ for our club last week]."
      ja: 先週、私たちの部のためにしてくれたことに感謝している。
    - id: e305
      en: "Amir showed me the cups [*that* he had bought ＿ in Kyoto]."
      ja: アミールは、京都で買ったカップを私に見せてくれた。
    - id: e306
      en: "Amir showed me [*what* he had bought ＿ in Kyoto]."
      ja: アミールは、京都で買ったものを私に見せてくれた。
    - id: e307
      en: Nora asked me what I wanted for lunch.
      ja: ノーラは私に、昼食に何が欲しいかとたずねた。
    - id: e308
      en: Do you remember what Mr. Kato told us in class yesterday?
      ja: 昨日の授業で加藤先生が私たちに何と言ったか（言ったこと）を覚えているか。
    summary:
    - "what は先行詞を{{ふくむ}}関係代名詞で、{{the thing(s) which}} と同じ意味になる。"
    - "what 節は{{名詞節}}で、主語・目的語・補語・前置詞の目的語になる。訳は「〜{{すること}}」「〜するもの」。"
    - "what の後ろは{{不完全な}}文。前に先行詞があれば what は使えず、{{which／that}} を使う（all what、everything what は誤り）。"
    - "ask や wonder の後ろの what は{{疑問詞}}で、「{{何を〜か}}」と訳す。"
  - id: s11
    title: what を使った決まった言い方
    patterns: [P16, P17]
    body:
    - h: いわゆる：what we call / what is called
    - p: what we call … と what is called … は、どちらも「いわゆる…」と訳す決まった言い方です。形を分けて見ると、なぜそう訳すのかが分かります。call A B（AをBと呼ぶ）のAが what になったのが what we call B（私たちがBと呼ぶもの）で、受け身の A is called B のAが what になったのが what is called B です（@e309、@e310）。
      notes:
      - kind: 注意
        text: "we の代わりに you や they を使った what you call、what they call も同じ意味になる。"
    - ex: [e309, e310]
    - h: 今の姿と昔の姿：what S is / what S was
    - p: what S is は「Sの今の姿」を表します。be 動詞の後ろの補語が what になって欠けている形です。@e311 の what it was ten years ago は「10年前の駅の姿」で、was の後ろの補語が欠けています。昔の姿は what S was のほかに what S used to be でも表せ、意味はほぼ同じです。
    - p: 人について使うと、その人の人柄や、努力して手に入れた今の立場を指すことが多くなります。@e312 の what he is today は「今日の加藤先生」、つまり教師として今ある姿全体です。what he has（その人が持っているもの、財産）と対比して使われることもあります。
    - ex: [e311, e312]
    - h: 情報を付け足す what is more / what is worse
    - p: what is more は「そのうえ、さらに」、what is worse は「さらに悪いことに」という意味で、2つの文の間に入れて情報を付け足します（@e313、@e314）。文の中ではコンマではさんで置くのが普通です。過去の出来事を話すときは、@e314 のように what was worse と過去形にすることが多くあります。よいことを足すなら what is better（さらによいことに）を使います。
    - ex: [e313, e314]
    - check:
      - {q: "My brother is [＿] we call a bookworm.", a: what}
      - {q: "The town is not [＿] it used to be.", a: what}
      - {q: "We got lost, and [＿] was worse, my phone died.", a: what}
    - h: 発展：A is to B what C is to D と関係形容詞の what
    - p: A is to B what C is to D は「AとBの関係は、CとDの関係と同じだ」という意味です（@e315）。what a map is to a traveler は「地図が旅行者にとってそうであるもの」という名詞節で、最初の is の補語になっています。訳すときは、分かりやすい後半のCとDの関係を先に考え、それを前半に当てはめます。What C is to D, A is to B. と前後を入れかえた形も使われます。
    - p: what の直後に名詞を置くと、what は「〜するすべての（名詞）」という意味でその名詞を修飾します。このような what が<<関係形容詞>>です。what money I had は all the money that I had と同じ意味。@e316 では little が加わり、「少ないながらも持っていたお金を全部」となります。数えられる名詞なら what few books のように few を使います。
      notes:
      - kind: 用語
        term: 関係形容詞
        yomi: かんけいけいようし
        text: "後ろの名詞を修飾しながら、関係詞節をつくる what。what ＋名詞は「〜するすべての（名詞）」の意味になる。"
    - ex: [e315, e316]
    examples:
    - id: e309
      en: "Hana is [*what* we call ＿ a morning person]."
      ja: ハナは、いわゆる朝型の人間だ。
      gloss: [[morning person, 朝型の人]]
    - id: e310
      en: 'My uncle lives in [*what* ＿ is called a "smart house,"] so he can turn on the lights with his voice.'
      ja: おじはいわゆる「スマートハウス」に住んでいるので、声で明かりをつけられる。
    - id: e311
      en: "The station is very different from [*what* it was ＿ ten years ago]."
      ja: その駅は、10年前の姿とはずいぶん違っている。
    - id: e312
      en: "Mr. Kato owes [*what* he is ＿ today] to the coach he met in high school."
      ja: 加藤先生が今日あるのは、高校時代に出会ったコーチのおかげだ。
      gloss: [[owe, 〜のおかげである]]
    - id: e313
      en: "This phone is light, and [*what* ＿ is more], its battery lasts for two days."
      ja: この電話は軽く、そのうえ電池が2日もつ。
      gloss: [[battery, 電池]]
    - id: e314
      en: "We missed the last bus, and [*what* ＿ was worse], it started to rain."
      ja: 私たちは最終バスに乗り遅れ、さらに悪いことに雨が降り出した。
    - id: e315
      en: "A dictionary is to a language learner [*what* a map is ＿ to a traveler]."
      ja: 辞書と語学の学習者の関係は、地図と旅行者の関係と同じだ。
      gloss: [[language learner, 語学の学習者]]
    - id: e316
      en: "Nora spent [*what* little money she had ＿] on a birthday present for her brother."
      ja: ノーラは、少ないながらも持っていたお金を全部、弟の誕生日プレゼントに使った。
    summary:
    - "what we call B／what is called B ＝「{{いわゆる}}B」"
    - "what S is ＝「Sの{{今の姿}}」、what S was／what S {{used to be}} ＝「Sの昔の姿」"
    - "what is more ＝「{{そのうえ}}」、what is worse ＝「{{さらに悪いことに}}」。過去の話では what {{was}} worse にすることが多い。"
    - "A is to B what C is to D ＝「AとBの関係は、{{CとD}}の関係と同じ」"
    - "what (little) ＋名詞＋S＋V ＝「（少ないながらも）Sが〜する{{すべての}}名詞」。この what を{{関係形容詞}}という。"
  - id: s12
    title: 関係代名詞の that と接続詞の that
    patterns: [P7]
    body:
    - h: 見た目は同じでも働きが違う
    - p: that には、関係代名詞の that と接続詞の that があります。見た目が同じなので、手がかりは後ろの文です。関係代名詞の that は節の中で主語・目的語（前置詞の目的語もふくむ）・補語のどれかの代わりをするため、後ろは不完全な文になります。接続詞の that は「〜ということ」というまとまりをつくるだけで、節の中では何の役もしません。だから後ろは完全な文です。
    - p: "@e317 では、told us の後ろに「何を」伝えたかが欠けていて、that がその代わりをしています。これは関係代名詞です。@e318 の that 以下は our team had won the final で、主語も目的語もそろい、欠けている語がありません。同じ the news の後ろでも、that の後ろを見れば働きが決まるのです。"
    - ex: [e317, e318]
    - h: 同格の that：名詞の中身を説明する
    - p: "@e318 のように、名詞の後ろに接続詞の that を置き、その名詞の中身を説明する使い方が<<同格>>の that です。訳は「〜という知らせ」「〜という事実」（@e319）のようになります。前に来る名詞は fact, news, idea, hope, rumor, possibility など、中身を持つ名詞に限られます。book や bag のような物の名詞の後ろには来ません。"
      notes:
      - kind: 用語
        term: 同格
        yomi: どうかく
        text: "前の名詞と後ろの語句が同じものを指し、後ろが前の名詞の中身を説明する関係。the fact that … は「…という事実」。"
      - kind: 注意
        text: "同格の that は接続詞なので、which に置きかえられない。the idea which we should start early は誤り。"
    - p: 関係詞節も同格の that 節も、前の名詞を説明する点は似ています。ただし訳し方には差が出ます。@e317 は「ベンが伝えた知らせ」、@e318 は「チームが勝ったという知らせ」です。「という」を付けて自然に訳せるかどうかは手がかりになりますが、迷ったときは後ろが完全な文かどうかで決めます。
      notes:
      - {kind: 語注, items: [[nail, くぎ]]}
    - ex: [e319]
    - h: 名詞節をつくる that と、that の省略
    - p: 名詞の後ろではなく、動詞の後ろや主語の位置に置かれた that 節は、名詞節をつくる接続詞です（@e320）。この that の後ろも完全な文です。think, know, say などの後ろでは、この that はよく省略されます。
    - p: 省略できるかどうかは、that の種類によって違います。目的格の関係代名詞 that は省略できます（@e321）。主格の関係代名詞は、原則として省略できません（@s03）。同格の that は、書き言葉では省略しないのが普通で、the fact that の that も省きません。ただし話し言葉では、I have a feeling (that) … のように、一部の名詞の後ろで省かれることがあります。
    - ex: [e320, e321]
    - h: 4つの形を1つの表で見分ける
    - p: 第10節（@s10）の what と合わせると、2つの問いで4つの形が決まります。1つは「前の名詞を説明しているか」、もう1つは「後ろが完全な文か」です。後ろが完全な文で前の名詞を説明しているときは、同格の that のほかに関係副詞（@s09）の可能性もあるので、名詞の意味も確かめます。
    - table:
        head: ["", 後ろが不完全な文, 後ろが完全な文]
        rows:
        - [前の名詞を説明する, "{{関係代名詞}} which／who／that（@e317）", "{{同格の that}}（@e318）"]
        - [前の名詞を説明しない（名詞節）, "{{what}}（@e301）", "{{接続詞の that}}（@e320）"]
    - check:
      - {q: "The rumor [＿] the shop will close is not true.", a: that（同格）}
      - {q: "I agree with [＿] you said.", a: what}
      - {q: "Is this the bike [＿] you bought last week?", a: which／that（省略も可）}
    examples:
    - id: e317
      en: "The news [*that* Ben told us ＿] was not true."
      ja: ベンが私たちに伝えた知らせは、本当ではなかった。
    - id: e318
      en: The news that our team had won the final reached the school before noon.
      ja: 私たちのチームが決勝で勝ったという知らせは、正午前に学校に届いた。
      gloss: [[final, 決勝]]
    - id: e319
      en: We were surprised by the fact that the old bridge was built without a single nail.
      ja: その古い橋がくぎを1本も使わずに造られたという事実に、私たちは驚いた。
    - id: e320
      en: Aoi knows that the library closes at five on Saturdays.
      ja: アオイは、土曜日は図書館が5時に閉まることを知っている。
    - id: e321
      en: "The shirt [I bought ＿ online] was too small for my brother."
      ja: 私がネットで買ったシャツは、弟には小さすぎた。
    summary:
    - "関係代名詞の that の後ろは{{不完全な}}文、接続詞の that の後ろは{{完全な}}文。"
    - "名詞＋that＋完全な文で名詞の中身を説明する that を{{同格}}の that といい、「〜{{という}}」と訳す。fact, news, idea などの後ろに来る。"
    - "目的格の関係代名詞 that は省略{{できる}}。同格の that は書き言葉では{{省略しない}}。"
    - "名詞を説明・不完全 → {{関係代名詞}}　名詞節・不完全 → {{what}}　名詞を説明・完全 → {{同格の that}}　名詞節・完全 → {{接続詞の that}}"

- id: c4
  title: 非制限用法
  lead: これまでの章で見てきた関係詞節は、主に先行詞が「どの〜か」を絞りこむ働きをしていました。この章では、先行詞の後ろにコンマを置いて、すでに決まっているものに情報を付け足す使い方を学びます。コンマ1つで文の意味も使える語も変わるため、入試では正誤問題と和訳でくり返し問われます。
  sections:
  - id: s13
    title: コンマの付いた関係詞節
    patterns: [P8]
    body:
    - h: コンマ1つで意味が変わる
    - p: "第1節（@s01）では、関係代名詞を決める3つ目の問いとして「先行詞の直後にコンマがあるか」を挙げました。@e401 と @e402 は、コンマがあるかないかだけが違う文です。コンマのない @e401 の関係詞節は、おばの娘たちの中から「病院で働いている娘」を選び出しています。病院で働いていない娘が、ほかにいるかもしれません。"
    - ex: [e401, e402]
    - p: 一方、コンマのある @e402 は、まず「おばには娘が2人いる」と言い切り、その2人について「病院で働いている」という情報を付け足しています。娘は2人だけで、2人とも病院で働いているという意味です。@e401 のように先行詞を絞りこむ使い方を<<制限用法>>、@e402 のように絞りこまずに説明を付け足す使い方を<<非制限用法>>といいます。
      notes:
      - kind: 用語
        term: 制限用法
        yomi: せいげんようほう
        text: "コンマを付けずに関係詞節を置き、先行詞が「どの〜か」を絞りこむ使い方。限定用法ともいう。"
      - kind: 用語
        term: 非制限用法
        yomi: ひせいげんようほう
        text: "先行詞の後ろにコンマを置き、すでに決まっている先行詞に情報を付け足す使い方。継続用法ともいう。"
    - p: 非制限用法の関係詞節は、前から順に「〜で、その人は…」「〜が、それは…」と訳すと、付け足しの感じが出ます。@e402 を「病院で働いている2人の娘がいる」と後ろから訳すと、@e401 と区別がつきません。入試の和訳では、娘がほかにもいると読める訳は減点されます。
    - h: 先行詞が1つに決まっているとき
    - p: 固有名詞や my father のように、聞き手にとって指すものが1つに決まっている名詞は、関係詞節で絞りこむ余地がありません。だから、関係詞節を付けるときは非制限用法にします（@e403〜@e405）。金沢という町は1つしかないので、@e403 のコンマを外して Kanazawa which … とすると誤りです。
      notes:
      - kind: 注意
        text: "固有名詞でも、同じものの「ある時期の姿」を選び出すときは the を付けて制限用法にできる。例：the Kanazawa that my grandmother knew as a child（祖母が子どものころに知っていた金沢）。"
    - ex: [e403, e404, e405]
    - p: "@e404 と @e405 のように関係詞節が文の途中に入るときは、節の前と後ろの両方にコンマを打つのが決まりです。節を外すと Ms. Garcia comes from Mexico. という文が残り、主語と動詞の骨組みが見えます。和訳では、@e404 のように「私たちに英語を教えているガルシア先生は」と名詞の前に置いたほうが自然な場合もあります。先行詞が1つに決まっているので、こう訳しても意味は変わりません。"
    - h: 非制限用法で使えない形
    - p: 非制限用法では that を使いません。×Ms. Garcia, that teaches us English, comes from Mexico. は誤りです。that は先行詞を絞りこむ制限用法のための語、と考えると覚えやすくなります。what は先行詞をふくむ語なので（@s10）、そもそも先行詞の後ろのコンマに続けることはできません。入試の正誤問題では、コンマの直後の that がよく誤りの箇所になります。
      notes:
      - kind: 注意
        text: "古い文学作品には、コンマの後ろに that を置いた例がまれにある。現代の英語では使わず、入試では誤りになる。"
    - p: 目的格の関係代名詞は、制限用法なら省略できました（@s03）。非制限用法では省略できません。@e406 から which を消すと Sota's bike, he bought in April, … となり、コンマの間にいきなり「主語＋動詞」が現れて、前の名詞とのつながりが分からなくなります。非制限用法では、関係代名詞が「ここから先行詞の説明が始まる」と知らせるただ1つの目印なのです。
    - ex: [e406]
    - table:
        head: ["", 制限用法, 非制限用法]
        rows:
        - [先行詞の後ろのコンマ, なし, "{{あり}}"]
        - [働き, 先行詞を絞りこむ, "{{情報を付け足す}}"]
        - [that, 使える, "{{使えない}}"]
        - [目的格の省略, できる（@s03）, "{{できない}}"]
        - [訳し方, 後ろから「〜する…」, "{{前から}}「…で、それは〜」"]
    - h: ", where と , when"
    - p: 関係副詞の where と when にも非制限用法があります（@e407、@e408）。which との使い分けは @s09 と同じで、コンマの後ろの形で決まります。欠けたところのない完全な文なら where / when、目的語などが欠けた不完全な文なら which です。
      notes:
      - kind: 注意
        text: "関係副詞のうち why と how には非制限用法がない。コンマの後ろに続けられる関係副詞は where と when だけである。"
    - ex: [e407, e408]
    - p: "@e407 の his mother opened a small bakery は完全な文なので where を使います。一方、@e403 の we had never visited before は visited の目的語が欠けているので、同じ地名の後ろでも which でした。@e408 の , when は「そしてそのときには」と前から訳すと、時間の流れどおりに読めます。"
    - check:
      - {q: "My grandfather, [＿] lives alone in Akita, sends us rice every fall.", a: who}
      - {q: "This bag, [＿] I bought in Kobe, is already broken.", a: which（省略できない）}
      - {q: "We went to Ueno Zoo, [＿] we saw two baby pandas.", a: where}
    examples:
    - id: e401
      en: My aunt has two daughters [*who* ＿ work at a hospital].
      ja: おばには病院で働いている娘が2人いる。
    - id: e402
      en: My aunt has two daughters, [*who* ＿ work at a hospital].
      ja: おばには娘が2人いて、2人とも病院で働いている。
    - id: e403
      en: Last summer my family went to Kanazawa, [*which* we had never visited ＿ before].
      ja: 去年の夏、家族で金沢へ行ったが、そこはそれまで一度も訪れたことのない町だった。
    - id: e404
      en: Ms. Garcia, [*who* ＿ teaches us English], comes from Mexico.
      ja: 私たちに英語を教えているガルシア先生は、メキシコの出身だ。
    - id: e405
      en: My father, [*who* ＿ usually takes the 7:10 train], missed it this morning because of the heavy snow.
      ja: 父はいつも7時10分の電車に乗るのだが、今朝は大雪のせいで乗り遅れた。
    - id: e406
      en: Sota's bike, [*which* he bought ＿ in April], already has a flat tire.
      ja: ソウタの自転車は4月に買ったものだが、もうタイヤがパンクしている。
      gloss: [[flat tire, パンクしたタイヤ]]
    - id: e407
      en: Kaito's family moved to Sendai, [*where* his mother opened a small bakery].
      ja: カイトの家族は仙台に引っ越し、そこで母親が小さなパン屋を開いた。
    - id: e408
      en: We finally got to the hotel at 11:30 at night, [*when* the restaurant on the first floor had already closed].
      ja: 私たちがやっとホテルに着いたのは夜の11時半で、そのときには1階のレストランはもう閉まっていた。
    summary:
    - コンマのない関係詞節は先行詞を{{絞りこみ}}（制限用法）、コンマのある関係詞節は決まっている先行詞に情報を{{付け足す}}（非制限用法）。
    - My aunt has two daughters, who … は、娘が{{2人だけ}}いることを表す。コンマがなければ、ほかにも娘がいる可能性が残る。
    - 固有名詞や my father のように1つに決まる先行詞には、{{非制限用法}}で関係詞節を付ける（原則）。
    - 非制限用法では{{that}}を使わず、目的格の関係代名詞も{{省略できない}}。
    - コンマの後ろが完全な文なら{{, where／, when}}、不完全な文なら{{, which}}を使う。
  - id: s14
    title: 前の文の内容を受ける which と、数の表現＋of which
    patterns: [P9, P11]
    body:
    - h: ", which が前の内容全体を受ける"
    - p: 非制限用法の which の先行詞は、名詞とは限りません。@e409 の which が受けているのは、直前の his report ではなく、「トムがレポートを書き終えたと言った」という前の部分全体です。レポートそのものが「本当ではない」というのはおかしいので、意味から考えても、先行詞は名詞ではないと分かります。
    - ex: [e409, e410]
    - p: 前の内容をひとまとまりの「こと」として受けるので、which の後ろの動詞は単数の形になります（@e409 の was、@e410 の meant）。@e409 は Tom said he had finished his report, but that was not true. と言いかえられ、「それは」「そのため」と前から訳します。関係代名詞のうち、この使い方ができるのはコンマの付いた which で、that や what にはこの使い方がありません。
      notes:
      - kind: 参照
        text: "前の文の内容を受ける語には、as もある（@s18）。"
    - h: 直前の名詞か、前の内容全体か
    - p: "@e411 と @e412 は、前半がまったく同じ文です。違いは関係詞節の中身にあります。@e411 では used の目的語が欠けていて、which は「辞書」を指します。"
    - ex: [e411, e412]
    - p: "@e412 の was very kind of her は「彼女は親切だった」という意味です。辞書が親切だというのはおかしいので、which は「辞書を貸してくれたこと」を指しています。which の先行詞は、候補を節の中に戻して意味が通るかで確かめるのが確実です。入試の和訳や内容一致では、前の内容を受ける which を直前の名詞と取り違える誤りがよく狙われます。"
    - h: 数の表現＋of whom / of which
    - p: 「いとこが3人いて、そのうち2人は」のように、先行詞の一部や全部について説明を付け足すときは、two of whom のように「数の表現＋of＋関係代名詞」を節の先頭に置きます（@e413〜@e415）。先行詞が人なら whom、人以外なら which を使います。前置詞 of の直後なので、主格の who ではなく目的格の whom になります（@s06）。
    - ex: [e413, e414, e415]
    - p: of の前に置ける主な語を表にしました。数を表す語なら、two や three のほかに half（半分）や one も使えます。節の中の動詞の数は、@e414 の come のように、指している人や物の数に合わせます。one of which の後ろなら動詞は単数になる、という具合です。
    - table:
        head: ["", 人, 人以外]
        rows:
        - [いくつか, "some of {{whom}}", "some of {{which}}"]
        - [ほとんど, most of whom, most of which]
        - [2つとも・2人とも, both of whom, both of which]
        - [どれも〜ない, none of whom, none of which]
        - [数（2つ・3人など）, two of whom, three of which]
    - p: よくある誤りは、whom や which の代わりに them を入れることです。×I have three cousins, two of them live in Canada. では、コンマの前後の2つの文が、接続詞なしでコンマだけでつながっています。英語で2つの文を1つにするには、and などの接続詞か関係詞が要ります。them を使うなら、@e416 のように and を入れれば正しい文になり、@e413 と同じ意味です。
      notes:
      - kind: 注意
        text: "コンマだけで2つの文をつなぐ書き方は、くだけた文章で見かけることもある。入試の正誤問題や英作文では誤りとされる。"
    - ex: [e416]
    - check:
      - {q: "The bus was 30 minutes late, [＿] made us late for class.", a: which}
      - {q: "I have four uncles, two of [＿] are teachers.", a: whom}
      - {q: "We picked 50 apples, some of [＿] were too small to eat.", a: which}
    examples:
    - id: e409
      en: Tom said he had finished his report, [*which* ＿ was not true].
      ja: トムはレポートを書き終えたと言ったが、それは本当ではなかった。
    - id: e410
      en: It rained hard all day on Sunday, [*which* ＿ meant that our baseball game was put off until the next weekend].
      ja: 日曜日は一日中強い雨が降り、そのため野球の試合は次の週末に延期になった。
      gloss: [[put off, 延期する]]
    - id: e411
      en: Ayaka lent me her dictionary, [*which* I used ＿ for my English homework].
      ja: アヤカが辞書を貸してくれて、私はその辞書を英語の宿題に使った。
    - id: e412
      en: Ayaka lent me her dictionary, [*which* ＿ was very kind of her].
      ja: アヤカは私に辞書を貸してくれたが、それはとても親切なことだった。
    - id: e413
      en: I have three cousins, [two of *whom* ＿ live in Canada].
      ja: 私にはいとこが3人いて、そのうち2人はカナダに住んでいる。
    - id: e414
      en: There are 32 students in our class, [most of *whom* ＿ come to school by bike].
      ja: 私たちのクラスには生徒が32人いて、そのほとんどが自転車で通学している。
    - id: e415
      en: Kaito bought two used guitars last year, [both of *which* ＿ need new strings now].
      ja: カイトは去年中古のギターを2本買ったが、今はどちらも新しい弦に替える必要がある。
      gloss: [[used, 中古の], [string, 弦]]
    - id: e416
      en: I have three cousins, and two of them live in Canada.
      ja: 私にはいとこが3人いて、そのうち2人はカナダに住んでいる。
    summary:
    - 非制限用法の which は、名詞だけでなく前の{{文・節の内容全体}}を受けることができる。このとき後ろの動詞は{{単数}}の形になる。
    - which が何を指すかは、節の中の{{意味}}から決める。直前の名詞を指すとは限らない。
    - 数の表現＋of＋関係代名詞：先行詞が人なら{{whom}}、人以外なら{{which}}（some of which、most of whom、both of which）。
    - "×three cousins, two of them live … はコンマだけで2文をつないでいるので誤り。{{and}} two of them … か、two of {{whom}} … にする。"

- id: c5
  title: 複合関係詞
  lead: who・what・which・when・where・how に -ever が付いた語は、先行詞を自分の中にふくみ、「〜する人は誰でも」のような名詞節と、「誰が〜しても」という譲歩の節の両方をつくります。この章では、同じ whoever や whatever がどちらの働きをしているかを、節を外して文が残るかどうかで見分けます。however の後の語順と no matter＋疑問詞への言い換えは、GMARCH の4択と整序でくり返し問われる点です。
  sections:
  - id: s15
    title: whoever・whatever・whichever
    patterns: [P12]
    body:
    - h: 先行詞をふくむ whoever・whatever・whichever
    - p: what が「もの・こと」という先行詞をふくんでいたように（@s10）、who・what・which に -ever を付けた語も先行詞をふくみます。whoever は anyone who（〜する人は誰でも）、whatever は anything that（〜するものは何でも）と同じ意味です。@e501 では Whoever から Saturday までが文の主語です。こうした -ever の付いた関係詞を<<複合関係詞>>といいます。
      notes:
      - kind: 用語
        term: 複合関係詞
        yomi: ふくごうかんけいし
        text: "who, what, which, when, where, how に -ever が付いた語。先行詞をふくみ、名詞節（〜する人は誰でも）や譲歩の副詞節（誰が〜しても）をつくる。"
    - ex: [e501, e502]
    - p: 先行詞をふくんでいるので、前に名詞を置くことはありません（× anyone whoever wants them）。欠けている語を探す手順は第1節（@s01）と同じで、@e502 の whoever wants them では wants の主語が欠けています。whichever は「いくつかある中のどれでも」の意味で、選ぶ範囲が決まっているときに使います（Take whichever you like.）。
    - h: whoever か whomever か
    - p: whoever と whomever のどちらを使うかは、直前の語ではなく、節の中での働きで決まります。@e502 では直前に前置詞 to があるので、目的格の whomever を選びたくなるはずです。しかし節の中で whoever は wants の主語です。to の目的語になっているのは whoever wants them という節全体なので、主格の whoever を使います。
    - p: 一方、@e503 の whomever you like では、like の目的語が欠けています。節の中で目的語の働きをしているので whomever になります。第1節（@s01）の「節の中で何が欠けているか」という問いをそのまま当てはめれば、前置詞があってもなくても迷いません。
      notes:
      - kind: 注意
        text: "whomever はかたい書き言葉。話し言葉では目的語の位置でも whoever を使うことが多い（You can bring whoever you like.）。4択で両方が並んだら節の中の働きで選ぶ。主語の位置に whomever を置くのは、書き言葉でも誤り。"
    - ex: [e503]
    - h: 名詞節か、譲歩の副詞節か
    - p: 複合関係詞の節には、もう1つの使い方があります。@e505 の Whoever comes to the door は、文の主語にも目的語にもなっていません。この節を外しても、don't open it until I get home at five という命令文が残ります。外せる節は、文の中で副詞と同じ働きをする<<副詞節>>です。ここでは「誰が来ても」と、どんな場合でも主節が変わらないことを表します。この言い方を<<譲歩>>といいます。
      notes:
      - kind: 用語
        term: 副詞節
        yomi: ふくしせつ
        text: "文の中で副詞の働きをする節。時・条件・理由・譲歩などを表し、外しても残りの部分で文が成り立つ。"
      - kind: 用語
        term: 譲歩
        yomi: じょうほ
        text: "「たとえ〜でも」「誰が〜しても」のように、ある場合を認めたうえで、それでも主節の内容は変わらないと述べる言い方。"
      - kind: 注意
        text: "譲歩の副詞節では、未来のことでも will を使わず現在形で表すのが普通（@e505 の comes）。かたい書き言葉では may を使う形もある（@e516）。"
    - ex: [e504, e505, e506]
    - p: 見分けるには、節を外してみます。@e504 から Whatever you decide を外すと is fine with me しか残らず、主語がありません。だからこの節は名詞節で、「あなたが決めることなら何でも」と訳します。@e506 は外しても Rina won't change her plan for the summer が残るので副詞節です。訳は「ジャックが何と言っても」となります。
    - p: 譲歩の副詞節は no matter who／what／which で言い換えられます（@e505 → No matter who comes to the door）。名詞節は言い換えられません。× No matter what you decide is fine with me. が誤りなのは、no matter what の節は文の主語になれないからです。
    - table:
        head: ["", 名詞節（外すと文が欠ける）, 譲歩の副詞節（外しても文が残る）]
        rows:
        - [whoever, "{{〜する人は誰でも}}（＝anyone who）", "{{誰が〜しても}}（＝no matter who）"]
        - [whatever, "{{〜するものは何でも}}（＝anything that）", "{{何が・何を〜しても}}（＝no matter what）"]
        - [whichever, "{{〜するものはどれでも}}（＝any one that）", "{{どれが・どれを〜しても}}（＝no matter which）"]
    - h: whatever・whichever＋名詞
    - p: whatever と whichever は、直後に名詞を置いて形容詞のように使うこともできます。これを<<複合関係形容詞>>といいます。@e507 の whatever books you need は「必要な本なら何でも」で、lend の目的語になる名詞節です。@e508 の Whichever から stop までは外しても文が残るので、譲歩の副詞節です。whichever＋名詞は、選ぶ範囲が限られているときに使います。
      notes:
      - kind: 用語
        term: 複合関係形容詞
        yomi: ふくごうかんけいけいようし
        text: "直後の名詞と結びついて節をつくる whatever・whichever。whatever＋名詞＝どんな〜でも、whichever＋名詞＝（限られた中の）どの〜でも。"
    - ex: [e507, e508]
    - check:
      - {q: "[＿] arrives last has to lock the door.", a: Whoever（arrives の主語）}
      - {q: "I'll give this ticket to [＿] wants it.", a: whoever（wants の主語なので whomever は不可）}
      - {q: "[＿] happens tomorrow, I'll call you at nine.", a: Whatever（＝No matter what）}
    examples:
    - id: e501
      en: "[*Whoever* ＿ wants to join the trip on Saturday] must sign up by Thursday."
      ja: 土曜日の遠足に参加したい人は誰でも、木曜日までに申し込まなければならない。
      gloss: [[sign up, 申し込む]]
    - id: e502
      en: "You can give these old comics to [*whoever* ＿ wants them]."
      ja: この古いマンガは、欲しい人なら誰にあげてもよい。
    - id: e503
      en: "You may bring [*whomever* you like ＿] to the school festival in October."
      ja: 10月の学園祭には、好きな人を誰でも連れてきてよい。
    - id: e504
      en: "[*Whatever* you decide ＿] is fine with me."
      ja: あなたが決めることなら何でも、私はかまわない。
    - id: e505
      en: "[*Whoever* ＿ comes to the door], don't open it until I get home at five."
      ja: 誰が玄関に来ても、私が5時に帰るまでドアを開けてはいけない。
    - id: e506
      en: "[*Whatever* Jack says ＿], Rina won't change her plan for the summer."
      ja: ジャックが何と言っても、リナは夏の計画を変えないだろう。
    - id: e507
      en: "Chloe will lend you [*whatever* books you need ＿] for your history report."
      ja: クロエは、あなたの歴史のレポートに必要な本なら何でも貸してくれるだろう。
    - id: e508
      en: "[*Whichever* bus you take ＿ from this stop], you'll reach the stadium before noon."
      ja: このバス停からどのバスに乗っても、正午前にはスタジアムに着く。
    summary:
    - "whoever＝{{anyone who}}、whatever＝{{anything that}}。先行詞を{{ふくむ}}ので、前に名詞を置かない。"
    - "whoever と whomever は{{節の中の働き}}で選ぶ。主語なら {{whoever}}（Give it to whoever wants it.）。"
    - "節を外して文が残れば{{譲歩の副詞節}}で、{{no matter who／what／which}} に言い換えられる。名詞節は no matter で言い換え{{られない}}。"
    - "whatever／whichever の直後に名詞を置く形を{{複合関係形容詞}}という。whichever は選ぶ範囲が{{限られている}}ときに使う。"
  - id: s16
    title: however・whenever・wherever と譲歩
    patterns: [P12]
    body:
    - h: however＋形容詞・副詞＋S＋V
    - p: however を複合関係詞として使うと、「どんなに〜でも」という譲歩の意味になります。このとき however は直後に形容詞や副詞（much／many＋名詞のこともあります）を引き連れて、節の先頭に出ます。@e509 は Yuto is tired という文の tired が however の直後に移った形です。残りの Yuto is は、主語・動詞の普通の語順のままです。
    - steps:
      - 元の文を考える。Yuto is tired.／I tried hard.
      - 程度を表す形容詞・副詞（tired, hard）を however の直後に出す。However tired／However hard
      - 残りを主語＋動詞の語順で続ける。However tired Yuto is／However hard I tried
    - ex: [e509, e510]
    - p: 入試でねらわれるのは語順です。@e509 を × However Yuto is tired とすると、tired が however から離れるので誤りになります。疑問文のような倒置もしません（× However tired is Yuto）。量を言うときは however much／many＋名詞の形にし、数えられない名詞には much を使います（However much homework I have, …）。
      notes:
      - kind: 注意
        text: "however の直後に形容詞・副詞を置かない形もある。However you travel to the airport, leave home by eight.（どんな方法で行くにしても、8時までに家を出なさい）。この however は「どんな方法で」の意味。"
    - h: 「しかし」の however との違い
    - p: 文頭の However の直後にコンマがあり、すぐ主語が続くときは、「しかし」という意味の副詞です。@e511 の However, は前の文と逆の内容をつないでいるだけで、節をつくっていません。複合関係詞の however は直後に形容詞・副詞があり、コンマは節が終わったところに来ます（@e509）。コンマの位置と however の直後の語を見れば、区別がつきます。
    - ex: [e511]
    - h: whenever と wherever の2つの意味
    - p: whenever と wherever の後ろには、主語と動詞のそろった完全な文が続きます。関係副詞の when・where と同じで、節の中に欠けた語はありません（@s07）。意味の1つ目は「〜するときはいつでも」「〜するところならどこでも」です。@e512 は every time と同じく「京都に行くたびに」、@e513 は「空いているところならどこにでも」の意味になります。
    - ex: [e512, e513]
    - p: 2つ目は譲歩で、「いつ〜しても」「どこで〜しても」となります。@e514 は「日本のどこにいても」、@e515 は「今夜何時に着いても」の意味で、no matter where／no matter when に言い換えられます。2つの意味は形では区別できないので、主節との関係から決めます。「そのたびに〜する」と言っていれば1つ目、「どんな場合でも結果は変わらない」と言っていれば譲歩です。
    - ex: [e514, e515]
    - h: no matter＋疑問詞と、譲歩の節の may
    - p: 譲歩の意味の複合関係詞は、no matter＋疑問詞で言い換えられます。however は no matter how になり、語順も同じく no matter how＋形容詞・副詞＋S＋V です（@e510 → No matter how hard I tried）。整序問題では no matter how が2語分になるので、並べる語が1つ増えます。この言い換えは副詞節だけのもので、名詞節には使えません（第15節の「名詞節か、譲歩の副詞節か」。@e504 と @e505 を比べる）。
    - table:
        head: [複合関係詞, 譲歩の意味での言い換え]
        rows:
        - [whoever, "{{no matter who}}"]
        - [whatever, "{{no matter what}}"]
        - [whichever, "{{no matter which}}"]
        - [however, "{{no matter how}}（＋形容詞・副詞＋S＋V）"]
        - [whenever, "{{no matter when}}"]
        - [wherever, "{{no matter where}}"]
    - p: 譲歩の節に may を入れることがあります。@e516 の However busy he may be は「どんなに忙しくても」で、この may は「かもしれない」と訳しません。かたい書き言葉の言い方で、ふだんの英語では However busy he is のように現在形を使うほうが普通です。未来のことを言うときも、will は使わず現在形で表すのが普通です。入試には may を使う形も現在形だけの形も出るので、may があっても意味は同じだと分かれば足ります。
      notes:
      - kind: 注意
        text: "no matter how busy he may be のように、no matter＋疑問詞の節でも may を使うことがある。意味は may のない形と同じ。"
    - ex: [e516]
    - check:
      - {q: "[＿] tired you are, brush your teeth before bed.", a: However（＝No matter how）}
      - {q: "[＿] I hear this song, I remember our trip to Okinawa.", a: Whenever（＝Every time）}
      - {q: "Sit [＿] you like. There are plenty of seats.", a: wherever}
    examples:
    - id: e509
      en: "[*However* tired Yuto is ＿], he walks his dog every morning at six."
      ja: どんなに疲れていても、ユウトは毎朝6時に犬を散歩させる。
    - id: e510
      en: "[*However* hard I tried ＿], I couldn't open the jar of jam."
      ja: どんなに頑張っても、私はジャムのびんのふたを開けられなかった。
      gloss: [[jar, （ガラスの）びん]]
    - id: e511
      en: "The café on the third floor was crowded. However, we found two seats by the window."
      ja: 3階のカフェは混んでいた。しかし、私たちは窓際に席を2つ見つけた。
      gloss: [[crowded, 混んでいる]]
    - id: e512
      en: "[*Whenever* Olivia visits Kyoto with her parents], she buys green tea at the same small shop near the station and sends some to her friends in London."
      ja: オリビアは両親と京都に行くたびに、駅の近くの同じ小さな店で緑茶を買い、ロンドンの友人に送る。
    - id: e513
      en: "You can put your bag [*wherever* there is space]."
      ja: かばんは、空いているところならどこに置いてもよい。
    - id: e514
      en: "[*Wherever* you are in Japan], you can watch the final on TV at seven tonight."
      ja: 日本のどこにいても、今夜7時にテレビで決勝戦を見ることができる。
      gloss: [[final, 決勝戦]]
    - id: e515
      en: "[*Whenever* you arrive tonight], I'll still be awake, so just ring the bell."
      ja: 今夜何時に着いても私はまだ起きているから、呼び鈴を鳴らしてくれればいい。
    - id: e516
      en: "[*However* busy he may be ＿], my father reads to my little sister before bed."
      ja: どんなに忙しくても、父は寝る前に妹に本を読んでやる。
    summary:
    - "however は {{however＋形容詞・副詞＋S＋V}} の語順にする。× However Yuto is tired"
    - "文頭の However の直後に{{コンマ}}があれば「しかし」の副詞で、節をつくらない。"
    - "whenever／wherever の後ろは{{完全な文}}。意味は「〜するときはいつでも」と、譲歩の「{{いつ〜しても}}」の2つ。"
    - "譲歩の複合関係詞は {{no matter＋疑問詞}} で言い換えられる（however → {{no matter how}}）。"
    - "譲歩の節の may は{{かたい}}言い方で、「かもしれない」と訳さ{{ない}}。"

- id: c6
  title: 入試で差がつく関係詞
  lead: この章では、形は見慣れていても入試で正答率に差がつく関係詞を扱います。I think が入りこんだ関係詞節、関係代名詞のように働く as・than・but、関係詞節の中の動詞の数、先行詞から離れた関係詞節です。どれも @s01 の3つの問いと「後ろが不完全な文か」の判断で解けるので、見た目に惑わされずに欠けた位置を探します。
  sections:
  - id: s17
    title: I think などが入りこむ関係詞節
    patterns: [P13]
    body:
    - h: I think が間に入ると何が起きるか
    - p: "@e601 は、Takumi is the player. と I think he is the fastest runner on our team. の2つの文を1つにしたものです。he を who に変えて前に出すと、I think は who と is の間に取り残されます。このように、関係詞のすぐ後ろに I think や they say などの「主語＋動詞」が入りこんだ関係詞節を<<連鎖関係詞節>>といいます。"
      notes:
      - kind: 用語
        term: 連鎖関係詞節
        yomi: れんさかんけいしせつ
        text: "関係詞の直後に I think・they say・she believes などが入りこみ、その後ろに節の動詞が続く関係詞節。"
    - ex: [e601, e602, e603]
    - p: 入りこんだ I think を指でかくしてみます。@e601 から I think を外すと @e602 の the player who is the fastest runner となり、who の後ろに is が直接続きます。主語が欠けているので、who は主格です。
    - p: "@e603 も the guidebook says を外すと which is the oldest となり、which は is の主語だと分かります。入りこむのは think のほか、believe, say, suppose, be sure, hear など「〜と思う・〜と言う」を表す動詞です。"
    - h: whom を選ぶ誤り
    - p: 空所の後ろに I think があると、「think の目的語だから whom」と考えたくなります。けれども think の目的語は人ではなく、「＿ is the fastest runner」という節のほうです。関係代名詞の格は、I think を外したあとに残る節で決めます。外したときに動詞がすぐ続けば主語が欠けているので、人なら who です。
      notes:
      - kind: 注意
        text: "英米の新聞などでも whom I think is … と書かれた例は見られるが、規範的な文法では誤りとされ、入試の4択・正誤では who が正解になる。"
    - p: これと区別したいのが @e604 です。believe ＋ 人 ＋ to be ～ の形では、人は believed の目的語になります。外したあとに to be が続けば目的格の whom（話し言葉では who も）、is や was が続けば主格の who です。@e605 では which は dropped の目的語で、この場合は I think の後に that を入れても正しい文です。
    - ex: [e604, e605]
    - h: 整序での並べ方と、関係代名詞の省略
    - p: 整序問題では、語を次の順に置きます。主語の欠けた連鎖関係詞節では、I think の後に接続詞の that を入れません。the player who I think that is … は誤りです。
      notes:
      - kind: 注意
        text: "that を入れてよいのは、@e605 のように節の中で目的語が欠けているときだけ。主語が欠けているときは think の直後に動詞を続ける。"
    - steps:
      - 先行詞の直後に関係代名詞を置く。
      - その直後に I think・everyone says などの「主語＋動詞」を置く。
      - 主語を書かずに、節の動詞（is, was, will win など）を続ける。
    - p: 主格の関係代名詞は普通省略できません（@s03）。ところが連鎖関係詞節では、@e606 のように主格の who が省略されることがあります。the man I thought was … のように「名詞＋S＋V＋動詞」が並んでいたら、名詞の直後に who が隠れていると考えて読みます。
    - ex: [e606]
    - check:
      - {q: "She is the singer [＿] I think will win the contest.（who／whom）", a: who}
      - {q: "He is the boy [＿] everyone says is the best cook in our class.（who／whom）", a: who}
      - {q: "We chose a leader [＿] we believed to be fair.（who／whom）", a: whom（話し言葉では who も使う）}
    examples:
    - id: e601
      en: Takumi is the player [*who* I think ＿ is the fastest runner on our team].
      ja: タクミは、チームでいちばん足が速いと私が思う選手だ。
    - id: e602
      en: Takumi is the player [*who* ＿ is the fastest runner on our team].
      ja: タクミは、チームでいちばん足が速い選手だ。
    - id: e603
      en: The small restaurant [*which* the guidebook says ＿ is the oldest in this town] closes at eight on Sundays and does not open on Mondays.
      ja: 町でいちばん古いと案内書に書いてある小さなレストランは、日曜日は8時に閉まり、月曜日は休みだ。
      gloss: [[guidebook, 旅行案内書]]
    - id: e604
      en: Ms. Kimura hired a high school student [*whom* she believed ＿ to be honest] for her bakery.
      ja: キムラさんは、正直だと信じた高校生を自分のパン屋で雇った。
      gloss: [[hire, 雇う]]
    - id: e605
      en: Here is the key [*which* I think you dropped ＿].
      ja: ここに、あなたが落としたのだと思うかぎがある。
    - id: e606
      en: The man [I thought ＿ was Saki's father] turned out to be her uncle.
      ja: サキのお父さんだと私が思った男の人は、実は彼女のおじだった。
      gloss: [[turn out to be ～, 実は～だとわかる]]
    summary:
    - 先行詞＋who＋I think＋動詞 の文で I think を外すと、who は節の{{主語}}の働きをしている。
    - I think の後に動詞が続くときは、whom ではなく{{who}}を選ぶ。
    - believe ＋ 人 ＋ to be の形なら、関係代名詞は believe の{{目的語}}なので whom（who）を使う。
    - 主語が欠けた連鎖関係詞節では、think の後に接続詞の{{that}}を入れない。
    - 整序：先行詞 → 関係代名詞 → {{主語＋think}} → 節の動詞 の順に並べる。
  - id: s18
    title: 関係代名詞のように働く as・than・but
    patterns: [P15]
    body:
    - h: なぜ as・than・but が関係代名詞になるのか
    - p: as・than・but は、普通は接続詞や前置詞です。ところが such・the same・比較級・否定語の付いた名詞の後ろでは、主語や目的語の欠けた節を導き、関係代名詞と同じ働きをします。これを<<擬似関係代名詞>>といいます。見分け方は who や which と同じで、後ろの節が不完全な文かどうかを確かめます。ただし使える場所は決まった相手の後ろに限られ、who や which の代わりに自由に使えるわけではありません。
      notes:
      - kind: 用語
        term: 擬似関係代名詞
        yomi: ぎじかんけいだいめいし
        text: "such・the same・比較級・否定語などと組になり、関係代名詞のように後ろの節の主語や目的語の働きをする as・than・but。"
    - h: such … as と the same … as
    - p: "@e607 の as の後ろは are written in easy English で、are の主語がありません。as が主語の働きです。@e608 では had の目的語が欠けていて、as は目的語の働きです。この such … as は改まった書き言葉で、少し古い感じがします。会話なら books that are written in easy English のように言うのが普通です。"
      notes:
      - kind: 注意
        text: "books such as dictionaries（辞書のような本）の such as は「たとえば」の意味で、後ろには名詞だけが来る。後ろに欠けのある節が続く such … as とは別のもの。"
    - ex: [e607, e608]
    - p: the same の後ろでも as が使われます。@e609 の as の後ろは her sister has で has の目的語が欠けており、@e610 では went to の後ろの名詞が欠けています。@e609 は「同じ種類のかばん」、@e610 は「まさにその学校」を指しています。どちらの意味かは文の内容から決まります。
      notes:
      - kind: 注意
        text: "「the same … as は同じ種類、the same … that は同一のもの」と区別する説明があるが、現代英語ではこの区別は厳密ではない。@e610 のように as で同一のものを指すことも多い。"
    - ex: [e609, e610]
    - h: as is often the case with
    - p: "@e611 の As is often the case with Takumi は「タクミにはよくあることだが」という意味の決まった言い方です。as が受けているのは名詞ではなく、後ろの主節の内容（弁当を家に忘れたこと）で、as は is の主語になっています。前の文の内容を受ける , which（@s14）と似ていますが、which は文の先頭に置けないのに対し、as は文頭にも文の後ろにも置けます。"
    - ex: [e611]
    - h: 比較級＋than、否定語＋but
    - p: "@e612 では、than の後ろの are needed for the cake に主語がありません。than が主語の働きをしているので、than it is needed のように it を入れると誤りです。@e613 では expected の目的語が欠けていて、than はその代わりをしています。比較級の後ろの than に動詞が直接続いていたら、than が主語の働きをしていると考えます。"
      notes:
      - kind: 参照
        text: "more … than is necessary は、is を省いて more … than necessary とも言う。"
    - ex: [e612, e613]
    - p: 否定語の付いた名詞の後ろの but は、that … not の意味の関係代名詞になります。@e614 は There is no rule that does not have exceptions.（例外をもたない規則はない）と同じ意味で、今の英語なら Every rule has exceptions. と言います。この but はことわざや古い文章で見る古風な表現なので、読んで意味が取れれば十分で、英作文で使う必要はありません。
      notes:
      - kind: 注意
        text: "no one but Mia（ミア以外はだれも〜ない）の but は「〜以外」を表す前置詞で、後ろは名詞だけ。後ろに動詞が続くかどうかで区別する。"
    - ex: [e614]
    - check:
      - {q: "Take such clothes [＿] are warm enough for the mountains.", a: as}
      - {q: "There were more people at the station [＿] we expected.", a: than}
      - {q: "[＿] is often the case with my brother, he slept through his alarm.", a: As}
    examples:
    - id: e607
      en: Our teacher told us to read such books [*as* ＿ are written in easy English].
      ja: 先生は、やさしい英語で書かれた本を読むようにと私たちに言った。
    - id: e608
      en: Noah's grandmother served us such food [*as* she had ＿ in the house].
      ja: ノアの祖母は、家にあるだけの食べ物を出してくれた。
      gloss: [[serve, 料理を出す]]
    - id: e609
      en: Mia bought the same bag [*as* her sister has ＿].
      ja: ミアは、姉が持っているのと同じかばんを買った。
    - id: e610
      en: Saki goes to the same school [*as* her mother went to ＿] thirty years ago.
      ja: サキは、母親が30年前に通っていたのと同じ学校に通っている。
    - id: e611
      en: "[*As* ＿ is often the case with Takumi], he left his lunch at home on the first day of the trip."
      ja: タクミにはよくあることだが、彼は旅行の初日に弁当を家に忘れた。
    - id: e612
      en: Don't buy more eggs [*than* ＿ are needed for the cake].
      ja: 卵は、ケーキに必要な数より多く買ってはいけない。
    - id: e613
      en: The summer festival had more visitors [*than* the city had expected ＿].
      ja: 夏祭りには、市の予想を上回る数の人が来た。
    - id: e614
      en: There is no rule [*but* ＿ has exceptions].
      ja: 例外のない規則はない。
      gloss: [[exception, 例外]]
    summary:
    - such … as ／ the same … as の{{as}}は、後ろの節で主語や目的語の働きをする。
    - As is often the case with A ＝ A には{{よくあることだが}}。as は{{主節の内容}}を受け、文頭にも置ける。
    - 比較級の後の than が節の主語になる形：more … than {{is needed}}（it を入れない）。
    - 否定語＋but の but は{{that … not}}の意味。There is no rule but has exceptions. は{{古風}}な言い方で、読んで分かればよい。
  - id: s19
    title: 先行詞と動詞の数の一致、離れた関係詞節
    patterns: [P18, P19]
    body:
    - h: 関係代名詞の後の動詞は先行詞に合わせる
    - p: who や which そのものには、単数・複数の区別がありません。関係詞節の動詞の形は、先行詞の数で決まります。@e615 と @e616 はどちらも the mother of the twins who … ですが、lives なら先行詞は単数の the mother、live なら複数の the twins です。動詞の -s が、どの名詞を説明しているかを教えてくれます。
      notes:
      - {kind: 語注, items: [[twins, 双子]]}
    - ex: [e615, e616]
    - h: one of the students who … と the only one of …
    - p: "@e617 で who が説明しているのは、one ではなく the students です。放課後に韓国語を学んでいる生徒が何人かいて、ミアはその1人だという意味なので、伝統的な文法では動詞を複数形の are にします。"
    - p: 実際の英語では、one of the students who is … と単数形を使う人も少なくありません。話し言葉に多く、書き言葉にも見られ、これを認める語法書もあります。入試では伝統的な文法に従って複数形を正解とするのが一般的ですが、単数形も実際に使われているので、本書では単数形と複数形のどちらか一方だけを正解にする問題は出しません。自分で書くときは複数形にしておきます。
    - p: "@e618 のように the only one of the students who … となると話が変わります。ブラジルに行ったことがあるのはノア1人で、who が説明しているのは the only one です。そのため動詞は単数形の has になります。the only が付いたら、先行詞は1人に絞られると考えます。"
    - ex: [e617, e618]
    - h: 先行詞から離れた関係詞節
    - p: "@e619 では、主語の A man と関係詞節 who was carrying … の間に came into the shop が入っています。主語が長く、述語が短いとき、英語は重い部分を文の後ろに回す傾向があります。これを関係詞節の<<外置>>といいます。who の直前の the shop を先行詞と思うと意味が通りません。人を表す名詞で、was に合う単数のものを前にさかのぼって探します。"
      notes:
      - kind: 用語
        term: 外置
        yomi: がいち
        text: "関係詞節などを先行詞から離して、文の後ろに置くこと。主語が長く、述語が短い文で起きやすい。"
    - ex: [e619, e620]
    - p: "@e620 の which も、直前の this morning や Ms. Kimura を説明してはいません。which は人以外の名詞を受け、節の中に had no stamp on it とあるので、先行詞は A letter です。外置された関係詞節は、和訳のときに先行詞の前に戻して「切手の貼られていない手紙」と訳すと自然な日本語になります。"
    - h: 長い主語の文の骨組み
    - p: "@e621 の主語は The bike から station まで続き、その中に関係詞節が2つ入っています。文全体の動詞を見つけるには、関係詞節を［ ］でくくって外します。残るのは The bike was stolen on Friday night. です。"
    - steps:
      - 名詞の後ろに関係詞（または「名詞＋S＋V」の並び）を見つけたら、［ を開く。
      - 節の中の動詞と、その後ろの語句まで読んで ］ を閉じる。
      - ［ ］の外に残った動詞が文全体の動詞になる。その数を文頭の主語に合わせて確かめる。
    - p: "@e622 では、class の直後の were を見て「class は単数なのに」と迷うかもしれません。in the last class までが関係詞節なので、were の主語は文頭の The questions です。正誤問題では、主語と本動詞の間に長い関係詞節をはさみ、動詞の数を問う形がよく出ます。"
    - ex: [e621, e622]
    - check:
      - {q: "The two girls who [＿] next to me in class are sisters.（sit／sits）", a: sit（先行詞 the two girls は複数）}
      - {q: "He is the only one of the boys who [＿] a driver's license.（have／has）", a: has}
      - {q: "The keys that I found under the desks [＿] mine.（is／are）", a: are}
    examples:
    - id: e615
      en: The mother of the twins [*who* ＿ lives next door] works at the city library.
      ja: 隣に住んでいる、その双子の母親は、市立図書館で働いている。（隣に住んでいるのは母親）
    - id: e616
      en: I know the mother of the twins [*who* ＿ live next door].
      ja: 私は、隣に住んでいる双子の母親を知っている。（隣に住んでいるのは双子）
    - id: e617
      en: Mia is one of the students [*who* ＿ are learning Korean after school].
      ja: ミアは、放課後に韓国語を学んでいる生徒の1人だ。
    - id: e618
      en: Noah is the only one of the students [*who* ＿ has been to Brazil].
      ja: その生徒たちの中で、ブラジルに行ったことがあるのはノアだけだ。
    - id: e619
      en: A man came into the shop [*who* ＿ was carrying three large boxes].
      ja: 大きな箱を3つ抱えた男の人が、店に入ってきた。
    - id: e620
      en: A letter arrived for Ms. Kimura this morning [*which* ＿ had no stamp on it].
      ja: 切手の貼られていない手紙が、今朝キムラさんあてに届いた。
      gloss: [[stamp, 切手]]
    - id: e621
      en: The bike [*that* my brother borrowed ＿ from a friend [*who* ＿ lives near the station]] was stolen on Friday night.
      ja: 兄が駅の近くに住む友人から借りた自転車が、金曜日の夜に盗まれた。
    - id: e622
      en: The questions [*that* Dr. Patel asked ＿ in the last class] were harder than the ones in the textbook.
      ja: パテル先生が前回の授業で出した問題は、教科書の問題より難しかった。
    summary:
    - 関係詞節の動詞の数は{{先行詞}}に合わせる。who・which そのものに単数・複数の区別はない。
    - one of the students who … の先行詞は{{the students}}なので、入試では動詞を{{複数形}}にする。
    - the only one of the students who … の先行詞は{{the only one}}なので、動詞は{{単数形}}。
    - 主語が長く述語が短いとき、関係詞節が文の後ろに回ることがある。これを{{外置}}という。
    - 長い主語の文は、関係詞節を［ ］でくくり、外に残った{{動詞}}を見つける。


problems:
- id: q0001
  sec: s01
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: The man (＿) car was stolen went to the police station.
  choices: [who, which, whose, whom]
  ans: "3"
  why: 空所の直後の car に冠詞がなく、「その男性の車」という所有の関係になっている。所有者を表すのは whose。
  trap: 先行詞が人なので①who を選びやすい。しかし who を入れると who car was stolen となり、car の前に冠詞も所有者もない形になってしまう。
- id: q0002
  sec: s01
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  q: I need a box (＿) is big enough for these books.
  choices: [which, who, what, whose]
  ans: "1"
  why: 先行詞 a box は人以外で、節の中で is の主語が欠けている。人以外・主語が欠ける場合は which（または that）。
  trap: ③what は先行詞をふくむ関係代名詞なので、a box のような先行詞があるときは使えない（@s10）。
- id: q0003
  sec: s01
  set: 節末
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: 私が先週会った少年はピアノがとても上手だ。<br>The boy ( I / last / met / week / who ) plays the piano very well.
  words: [I, last, met, week, who]
  ans: The boy who I met last week plays the piano very well.
  why: 先行詞 The boy の直後に関係詞節 who I met ＿ last week を置く。met の目的語が欠けているので、who は目的格の働きをしている。
  trap: The boy who met I last week の語順にしてしまう誤り。関係詞節の中は「主語＋動詞」の普通の語順になる。
- id: q1001
  sec: s02
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: I have a cousin (＿) works at a bakery near Ueno Station.
  choices: [which, who, whose, what]
  ans: "2"
  why: 先行詞 a cousin は人で、節の中で works の主語が欠けている。人・主語が欠ける場合は who。
  trap: 空所の後ろの a bakery（物）につられて①which を選ぶ誤り。先行詞は空所の直前にある a cousin である。
- id: q1002
  sec: s02
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: The train (＿) leaves at 7:10 is usually crowded.
  choices: [who, whom, whose, which]
  ans: "4"
  why: 先行詞 The train は人以外で、節の中で leaves の主語が欠けている。人以外・主語が欠ける場合は which。
  trap: ②whom を選ぶ誤り。whom は目的格で、しかも先行詞が人のときの語なので、主語の欠けた節にも物の先行詞にも合わない。
- id: q1003
  sec: s02
  set: 節末
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部①〜④のうち、誤りをふくむものを1つ選びなさい。
  q: __The students__① who __joining__② the brass band __practice__③ in the music room __every morning__④.
  ans: "2"
  why: 主格の who の後ろには動詞が要る。joining だけでは動詞にならないので、who join（または who have joined）とする。③practice は主語 The students に対する文の動詞で正しい。
