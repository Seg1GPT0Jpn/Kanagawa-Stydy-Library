  why: 4枚のTシャツという限られた中から「好きなものをどれでも」と言っている。take の目的語になり、節の中で like の目的語が欠けているので whichever。
  trap: ②however を選ぶ誤り。however you like は「好きなやり方で」という副詞の節で、take の目的語にならない。
- id: q5003
  sec: s15
  set: 節末
  lv: 2
  kind: 4択
  min: 1
  q: I'll give this extra concert ticket to (＿) asks me first.
  choices: [whomever, whoever, who, whatever]
  ans: "2"
  why: 節の中で asks の主語が欠けているので主格の whoever。to の目的語は whoever asks me first という節全体である。
  trap: 直前の前置詞 to を見て①whomever を選ぶ誤り。whoever／whomever は直前の語ではなく、節の中の働きで決まる。
