  why: 先行詞 500 old photos は人以外で、前置詞 of の後ろなので which。many of which で「そのうちの多くは」。
  trap: ①them を選ぶと、The museum has … と many of them were … の2文が接続詞なしでつながる。意味が通っても文の形として誤り。
- id: q4015
  sec: s13
  set: 章末
  lv: 2
