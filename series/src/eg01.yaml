  - watch
  ans: The watch my father bought for me no longer works.
  why: "関係代名詞が与えられていないので、目的格の関係代名詞を省いた the watch my father bought ＿ for me の形にする。bought の目的語が欠けている。文全体の動詞は works。"
  trap: "関係代名詞が見当たらないので bought を文の動詞と考え、The watch bought … と並べる誤り。文の動詞は works で、the watch の直後に my father bought を続ける。"
- id: q9023
  part: 4
  pts: 4
  sec: s14
  set: 模試
  lv: 2
  kind: 整序
  min: 2
  q: 私はこの作家の小説を5冊読んだが、そのうち2冊は映画になった。<br>I have read five novels by this writer, ( into / made / of / two / were / which ) films.
  words:
  - into
  - made
  - of
  - two
  - were
  - which
  ans: I have read five novels by this writer, two of which were made into films.
  why: 「そのうち2冊」は two of which で節の先頭に置き、その後に were made into films（映画にされた）を続ける。先行詞 five novels は人以外なので which。two of which は節の中で were の主語になる。
  trap: which を先に置いて which two of … と並べようとする誤り。数の表現＋of＋which の順で1つのまとまりになる。
- id: q9024
  part: 4
  pts: 4
  sec: s16
  set: 模試
  lv: 2
  kind: 整序
  min: 2
  q: どんなに疲れていても、ケンタは毎晩30分英語を勉強する。<br>( is / Kenta / however / tired ), he studies English for 30 minutes every night.
  words:
  - is
