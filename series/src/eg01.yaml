  why: choose は目的語が必要な動詞で、節 my grandparents chose for their party では chose の目的語が欠けている。目的語の代わりをするのは which。
  trap: 先行詞 the day が時なので①when や②on which を選ぶ誤り。どちらも後ろに完全な文が必要で、chose の目的語が欠けたこの節には合わない。
- id: q2016
  sec: s09
  set: 節末
  lv: 2
  kind: 4択
  min: 1
  q: The village (＿) my grandmother often talks about is in the mountains of Nagano.
  choices: [where, about which, which, when]
  ans: "3"
  why: 節の最後の about の後ろに名詞がなく、前置詞の目的語が欠けた不完全な文になっている。欠けた目的語の代わりをするのは which。
  trap: ②about which を選ぶ誤り。about which にすると about が節の最後にも残り、about が2回になってしまう。
- id: q2017
  sec: s09
  set: 節末
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部のうち、誤りを含むものを1つ選びなさい。
  q: The beach __where__① we swam every morning was near the hotel __where__② we chose for our trip, so we __walked__③ there __in five minutes__④.
  choices: [①, ②, ③, ④]
  ans: "2"
  why: 節 we chose for our trip では chose の目的語が欠けている。目的語の代わりになる which（または that）に直す。
  trap: ①where も同じ形なので両方を疑い、①を選ぶ誤り。swim は目的語をとらないので、we swam every morning は完全な文で where が正しい。
- id: q2018
  sec: s09
  set: 節末
  lv: 3
  kind: 正誤
  min: 1
  q: When you are in a situation __which__① you cannot find your bag on a train, you should __tell__② a station worker __about__③ it soon. The reason __that__④ I know this is that it happened to me last year.
  choices: [①, ②, ③, ④]
  ans: "1"
  why: 節 you cannot find your bag on a train は完全な文なので、which ではなく where（または in which）を使う。situation は場所ではないが、「その状況の中で」という意味の where で説明できる。
  trap: ④that を「reason の後ろは why」と考えて選ぶ誤り。the reason that I know this の that は why の代わりに使える形で正しい。
- id: q2019
  sec: s09
  set: 節末
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: これは、私の父が若いころに働いていた工場だ。<br>This is the factory ( father / in / my / when / which / worked ) he was young.
  words: [father, in, my, when, which, worked]
  ans: This is the factory in which my father worked when he was young.
  alt: [This is the factory which my father worked in when he was young.]
  why: work は目的語をとらないので、関係代名詞を使うなら前置詞 in が必要になる。in which を前に出せば後ろは完全な文 my father worked。when は「若いころに」をつくる接続詞として使う。
  trap: when を関係副詞と考えて the factory when my father worked … と並べる誤り。factory は時を表さず、when の後ろに he was young を置く場所がなくなる。
- id: q2020
  sec: s09
  set: 節末
  lv: 3
  kind: 和訳
  min: 3
  inst: 次の英文を日本語に訳しなさい。
  q: The hall where the concert was held was much smaller than the one which we had seen in the photos on the website.
  ans: コンサートが開かれたホールは、私たちがウェブサイトの写真で見たホールよりもずっと小さかった。
  alt: [そのコンサートが行われた会場は、私たちがウェブサイトの写真で見ていたものよりずっと小さかった。]
  why: where 節（コンサートが開かれた）は The hall を、which 節（私たちが写真で見た）は the one（＝the hall）を説明する。主語 The hall … held に対する動詞が2つ目の was であることがとれていれば可。
  trap: was held was の was が2つ続くところで迷い、「コンサートはホールで開かれ、それは小さかった」と2つの文に分けて訳す誤り。where から held までが The hall を説明する関係詞節である。

# ---------- 章末 ----------
- id: q2021
  sec: s08
  set: 章末
  lv: 2
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: I don't like (＿) my brother talks to his friends on the phone late at night.
  choices: [the way how, the way, the way which, what]
  ans: "2"
  why: talks to his friends … は完全な文で、「兄が電話で友達と話す、その話し方」を表す。the way S V の形にする。
  trap: ③the way which を選ぶ誤り。which は節の中で主語や目的語などの代わりをするが、この節には欠けている語がない。
- id: q2022
  sec: s09
  set: 章末
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部のうち、誤りを含むものを1つ選びなさい。
  q: My sister __works__① at a hotel __which__② stands near the lake. She often __talks__③ about the days __which__④ she first worked there.
  choices: [①, ②, ③, ④]
  ans: "4"
  why: 節 she first worked there は完全な文なので、時の副詞の代わりをする when（または on which）に直す。
  trap: ②which を「場所の名詞の後ろは where」と考えて選ぶ誤り。stands の主語が欠けているので、②は which で正しい。
- id: q2023
  sec: s08
  set: 章末
  lv: 2
  kind: 正誤
  min: 1
  q: __The way how__① Mr. Sato teaches math is different from __the way__② other teachers do, and that is __why__③ his classes are __popular__④.
  choices: [①, ②, ③, ④]
  ans: "1"
  why: the way how は使わない。The way Mr. Sato teaches math か How Mr. Sato teaches math に直す。
  trap: ③why を「理由なら because」と考えて選ぶ誤り。that is why … は「だから〜」の意味で正しい。
- id: q2024
  sec: s07
  set: 章末
  lv: 1
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: ここは、私が去年の夏に自転車をなくした場所だ。<br>This is ( bike / I / lost / my / where ) last summer.
  words: [bike, I, lost, my, where]
  ans: This is where I lost my bike last summer.
  why: 先行詞 the place が省かれた形。This is の後ろに where 節を置くと「〜した場所」の意味になる。
  trap: This is my bike where I lost … のように my bike を先行詞にしてしまう誤り。lost の目的語がなくなり、日本語の意味とも合わない。
- id: q2025
  sec: s09
  set: 章末
  lv: 3
  kind: 整序
  min: 2
  q: 家族でよく行く公園には、父が子どものころに植えた木がある。<br>The park ( has / my / often / tree / where / a / family / goes / which ) my father planted as a child.
  words: [has, my, often, tree, where, a, family, goes, which]
  ans: The park where my family often goes has a tree which my father planted as a child.
  alt: [The park where my family goes often has a tree which my father planted as a child.]
  why: go は目的語をとらないので my family often goes は完全な文で、The park の後ろは where。planted は目的語が欠けているので、a tree の後ろは which。文の動詞は has。
  trap: 場所の名詞 The park に which、木の後ろに where を置く逆の並べ方。where か which かは名詞の意味ではなく、後ろの節で目的語が欠けているかで決まる。
- id: q2026
  sec: s09
  set: 章末
  lv: 2
  kind: 読解
  min: 4
  inst: 次の英文を読んで、問いの答えとして最も適切なものを1つ選びなさい。
  q: "Sofia moved to Japan from Spain two years ago. The apartment where she lives now is on the fifth floor, and from her window she can see a river which runs through the city. Her favorite place is a small bookstore which her neighbor told her about. It is the place where she bought her first Japanese picture book. April is when she likes the city best, because the cherry trees along the river turn pink.<br>問　Which of the following is true about Sofia?"
  choices: [She learned about the bookstore from her neighbor., She lives in a house next to the river., She found the bookstore by herself., She likes the city best in the fall.]
  ans: "1"
  why: a small bookstore which her neighbor told her about は「隣人が彼女に教えてくれた小さな本屋」。told her about の about の目的語が which で、本屋のことは隣人から聞いた。
  trap: 「川が見える」から②を選ぶ誤り。彼女が住んでいるのは5階のアパートで、川は窓から見えるだけである。
- id: q2027
  sec: s08
  set: 章末
  lv: 2
  kind: 読解
  min: 4
  q: "Grace's grandmother lives alone in a small town, three hours from Grace's home by train. Last spring, Grace gave her a tablet and taught her how to make video calls. At first, her grandmother kept pressing the wrong button, so Grace wrote each step on a card in large letters. Now they talk every Sunday evening. Her grandmother says, “Sunday is when I wait for the tablet to ring. I can see Grace's face, and that's why I have stopped writing letters.”<br>問　Why has Grace's grandmother stopped writing letters?"
  choices: [Because the post office in her town is far away., Because Grace asked her to use the cards instead., Because she can see Grace's face during video calls., Because she is busy every Sunday evening.]
  ans: "3"
  why: I can see Grace's face, and that's why I have stopped writing letters. の that は「グレースの顔が見えること」を指し、それが手紙をやめた理由になっている。
  trap: Sunday is when I wait for the tablet to ring の Sunday に引かれて④を選ぶ誤り。日曜の夜は電話を待つ時間で、忙しいとは書かれていない。
- id: q2028
  sec: s08
  set: 章末
  lv: 2
  kind: 和訳
  min: 3
  inst: 次の英文の下線部を日本語に訳しなさい。
  q: The trains often stop in strong winds. __That is why Haruto leaves home thirty minutes early on stormy days.__
  ans: だから、嵐の日にはハルトは30分早く家を出る。
  alt: [それが、嵐の日にハルトが30分早く家を出る理由だ。]
  why: That is why S V は「だから S V」。前の文（強風で電車が止まる）が理由で、why 節が結果になる。「だから」か「それが〜する理由だ」と訳せていれば可。
  trap: That is because と取り違え、「それはハルトが30分早く家を出るからだ」と理由と結果を逆に訳す誤り。
- id: q3001
  sec: s10
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: (＿) Nora made for us last night was delicious.
  choices: [That, Who, Which, What]
  ans: "4"
  why: 空所の前に先行詞がなく、節の中で made の目的語が欠けている。先行詞をふくみ「〜するもの」を表す What が入る。
  trap: ①That を選ぶ誤り。文頭の That 節は接続詞なので後ろに完全な文が必要だが、made の目的語が欠けている。
- id: q3002
  sec: s10
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  q: Excuse me, but this is not (＿) I ordered. I asked for iced tea.
  choices: [which, that, what, who]
  ans: "3"
  why: is not の後ろに先行詞がなく、ordered の目的語が欠けている。「私が注文したもの」は what I ordered。
  trap: ②that を選ぶ誤り。関係代名詞の that は先行詞が必要で、接続詞の that なら後ろは完全な文でなければならない。
- id: q3003
  sec: s10
  set: 節末
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部のうち、誤りをふくむものを1つ選びなさい。
  q: "My cousin __lent__① me the novels __she had__② at home, and __they__③ were just the ones __what__④ I wanted to read."
  choices: ["1", "2", "3", "4"]
  ans: "4"
  why: "the ones という先行詞があるので what は使えない。④を that（または which）にするか、省略して the ones I wanted to read とする。②の she had は、the novels の後ろで目的格の関係代名詞が省略された形（the novels she had ＿ at home）で正しい。"
  trap: "②she had の前に関係代名詞がないので②を選ぶ誤り。名詞の直後に「主語＋動詞」が続く目的格の省略で、正しい。④は「〜するもの」という日本語につられて what を正しいと考えやすいが、what はすでに先行詞をふくんでいる。"
- id: q3004
  sec: s10
  set: 節末
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。ただし文頭に来る語も小文字にしてある。
  q: ベンが昨日私に話したことは本当だった。<br>( Ben / me / told / what / yesterday ) was true.
  words: [Ben, me, told, what, yesterday]
  ans: What Ben told me yesterday was true.
  why: 「ベンが昨日私に話したこと」は what で始まる名詞節で、文の主語になる。what の後ろは told me ＿ と目的語が欠けた形。
  trap: Ben told me what yesterday のように what を節の中に残す誤り。what は欠けた目的語の位置ではなく節の先頭に出る。
- id: q3005
  sec: s10
  set: 節末
  lv: 2
  kind: 和訳
  min: 3
  inst: 次の英文を日本語に訳しなさい。
  q: What surprised me most on the trip was the size of the trains.
  ans: 旅行でいちばん驚いたのは、列車の大きさだった。
  alt: [旅行で私をいちばん驚かせたものは、列車の大きさだった。]
  why: What surprised me most on the trip が主語の名詞節で、「旅行で私をいちばん驚かせたもの（こと）」。was の後ろの補語を「列車の大きさ」と訳せていれば正解。
  trap: What を疑問詞と考えて「何が驚かせたか」と訳す誤り。文の主語になっていて was で受けるので、「〜したもの」と訳す。
- id: q3006
  sec: s10
  set: 節末
  lv: 3
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: The guide at the museum explained (＿) the old tools had been used for.
  choices: [which, what, that, how]
  ans: "2"
  why: explained の後ろに先行詞がなく、節の最後の for の目的語が欠けている。先行詞なし・不完全な文なので what が入る。explained の後ろでは、関係代名詞（「使われていた目的」）とも疑問詞（「何のために使われていたか」）とも読めるが（第10節（@s10）の「疑問詞の what との見分け方」）、どちらに読んでも what が入る。
  trap: ④how を選ぶ誤り。how の後ろは完全な文が必要だが、used for で前置詞の目的語が欠けている。
- id: q3007
  sec: s11
  set: 節末
  lv: 2
  kind: 4択
  min: 1
  q: My cousin is (＿) is called a "night owl." He usually goes to bed at three in the morning.
  choices: [which, that, who, what]
  ans: "4"
  why: what is called … で「いわゆる…」。is の補語の位置に先行詞がなく、節の中の主語が欠けているので what が入る。
  trap: 主語が人なので③who を選ぶ誤り。who も関係代名詞として使うには先行詞が必要で、ここには先行詞がない。
- id: q3008
  sec: s11
  set: 節末
  lv: 2
  kind: 4択
  min: 1
  q: Since the new mall opened, our town has become very different from (＿) it used to be.
  choices: [what, that, which, who]
  ans: "1"
  why: what S used to be で「Sの昔の姿」。from の後ろに先行詞がなく、used to be の補語が欠けているので what が入る。
  trap: different from の後ろだから②that を選ぶ誤り。that には先行詞が必要で、接続詞なら後ろは完全な文でなければならない。
- id: q3009
  sec: s11
  set: 節末
  lv: 2
  kind: 4択
  min: 1
  q: I left my umbrella on the train, and (＿) was worse, it began to rain hard.
  choices: [it, that, what, this]
  ans: "3"
  why: what is worse は「さらに悪いことに」。過去の話なので was になっている。
  trap: ①it を選んで「それはもっと悪かった」と読む誤り。it was worse を入れると、コンマだけで2つの文がつながる誤った形になる。
- id: q3010
  sec: s11
  set: 節末
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: ハナはいわゆる天才だ。<br>Hana is ( what / call / a / we / genius ).
  words: [what, call, a, we, genius]
  ans: Hana is what we call a genius.
  why: we call A B（AをBと呼ぶ）のAが what になった what we call B で「いわゆるB」。
  trap: what a genius we call と並べる誤り。call の後ろにはBにあたる a genius を置く。
- id: q3011
  sec: s11
  set: 節末
  lv: 3
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: Leaves are to a tree (＿) lungs are to a human.
  choices: [how, which, that, what]
  ans: "4"
  why: A is to B what C is to D で「AとBの関係はCとDの関係と同じ」。what lungs are to a human は are の補語が欠けた名詞節。
  trap: ③that を選ぶ誤り。接続詞の that なら後ろに完全な文が必要だが、are の補語が欠けている。
- id: q3012
  sec: s11
  set: 節末
  lv: 3
  kind: 和訳
  min: 3
  inst: 次の英文を日本語に訳しなさい。
  q: Amir gave the hungry cat what little food he had in his bag.
  ans: アミールは、かばんに入っていたわずかな食べ物を全部、おなかをすかせたネコにあげた。
  alt: [アミールは、空腹のネコに、少ないながらもかばんに持っていた食べ物をすべて与えた。]
  why: what little food he had は関係形容詞の what で、all the little food that he had と同じ。「少ないながら持っていた食べ物を全部」の意味が出ていれば正解。
  trap: what を疑問詞と考えて「何の食べ物を持っていたか」と訳す誤り。what little food he had は gave の2つ目の目的語になる名詞節なので、「何を持っていたか」ではなく「持っていた（わずかな）食べ物を全部」と訳す。
- id: q3013
  sec: s12
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: Hana heard the news (＿) the concert was canceled.
  choices: [that, what, which, who]
  ans: "1"
  why: 後ろの the concert was canceled は主語も動詞もそろった完全な文。the news の中身を説明する同格の that が入る。
  trap: ③which を選ぶ誤り。which は関係代名詞なので後ろが不完全な文でなければならないが、ここでは何も欠けていない。
- id: q3014
  sec: s12
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  q: The cake (＿) my father baked for my birthday was too sweet.
  choices: [what, that, who, whose]
  ans: "2"
  why: 先行詞 The cake は人以外で、節の中で baked の目的語が欠けている。関係代名詞の that が入る（which も可）。
  trap: 「〜したもの」と考えて①what を選ぶ誤り。The cake という先行詞があるので what は使えない。
- id: q3015
  sec: s12
  set: 節末
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部のうち、誤りをふくむものを1つ選びなさい。
  q: __The__① idea __which__② we should __share__③ the cost __was__④ suggested by Aoi.
  choices: ["1", "2", "3", "4"]
  ans: "2"
  why: we should share the cost は完全な文で、idea の中身を説明している。同格の that にする。
  trap: idea が物の名詞なので which を正しいと考える誤り。which の後ろは不完全な文でなければならない。
- id: q3016
  sec: s12
  set: 節末
  lv: 2
  kind: 正誤
  min: 1
  q: The photos __that__① Mr. Kato __took__② __them__③ in Hokkaido __were__④ beautiful.
  choices: ["1", "2", "3", "4"]
  ans: "3"
  why: that は took の目的語の代わりをする関係代名詞なので、節の中に目的語 them を残してはいけない。them を取る。
  trap: 「写真を撮った」と考えて took の後ろに目的語が必要だと思う誤り。目的語はすでに that が代わりをしている。
- id: q3017
  sec: s12
  set: 節末
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: その歌手が日本に来るという知らせに、私たちはわくわくした。<br>We were excited by ( singer / the / coming / news / that / was / the ) to Japan.
  words: [singer, the, coming, news, that, was, the]
  ans: We were excited by the news that the singer was coming to Japan.
  why: 「〜という知らせ」は同格の that を使い、the news that ＋完全な文（the singer was coming）の順に並べる。
  trap: the singer news that … のように名詞を並べてしまう誤り。that の前は中身を説明される名詞 the news だけを置く。
- id: q3018
  sec: s12
  set: 節末
  lv: 3
  kind: 和訳
  min: 3
  inst: 次の英文を日本語に訳しなさい。
  q: The rumor that the team that won last year would not join the tournament turned out to be false.
  ans: 去年優勝したチームが大会に出ないといううわさは、うそだと分かった。
  alt: [昨年勝ったチームが今回の大会に参加しないといううわさは、事実ではないと判明した。]
  why: 1つ目の that は rumor の中身を説明する同格の that（後ろが完全な文）、2つ目の that は won の主語が欠けた関係代名詞。「〜したチームが…しないといううわさ」と組み立てられていれば正解。
  trap: 1つ目の that も関係代名詞と考え、「チームが広めたうわさ」のように訳す誤り。the team … would not join the tournament は何も欠けていない完全な文である。
- id: q3019
  sec: s10
  set: 章末
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部のうち、誤りをふくむものを1つ選びなさい。
  q: I'm sorry, but I can't __remember__① __everything__② __what__③ you told me __on__④ the phone.
  choices: ["1", "2", "3", "4"]
  ans: "3"
  why: everything が先行詞なので what は使えない。that にするか、省略して everything you told me とする。
  trap: 「〜したことすべて」の「こと」に引かれて what を選ぶ誤り。everything がすでに「こと」にあたる。
- id: q3020
  sec: s12
  set: 章末
  lv: 2
  kind: 正誤
  min: 1
  q: We were all happy __to hear__① the news __what__② our coach __had__③ recovered __from__④ his illness.
  choices: ["1", "2", "3", "4"]
  ans: "2"
  why: our coach had recovered from his illness は完全な文で、the news の中身を説明している。同格の that にする。
  trap: what を「〜ということ」の意味と考える誤り。what の後ろは不完全な文で、前に名詞を置くこともできない。
- id: q3021
  sec: s11
  set: 章末
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: この町は30年前とはまったく違う。<br>This town is ( was / different / it / from / what / quite ) thirty years ago.
  words: [was, different, it, from, what, quite]
  ans: This town is quite different from what it was thirty years ago.
  why: 「30年前の町の姿」は what it was thirty years ago。be different from の後ろに置く。
  trap: different from it was … のように what を落とす誤り。from の後ろには名詞（名詞節）が必要で、was の補語も欠けている。
- id: q3022
  sec: s11
  set: 章末
  lv: 3
  kind: 整序
  min: 2
  q: アオイは、少ないながらためたお金を全部、新しいギターに使った。<br>Aoi spent ( had / little / what / she / money / saved ) on a new guitar.
  words: [had, little, what, she, money, saved]
  ans: Aoi spent what little money she had saved on a new guitar.
  why: 関係形容詞の what を使い、what little money ＋ she had saved の順にする。「少ないながら〜したすべてのお金」。
  trap: what she had saved little money と並べる誤り。関係形容詞の what は直後に（little ＋）名詞を連れてくる。
- id: q3023
  sec: s12
  set: 章末
  lv: 2
  kind: 補充
  min: 2
  inst: 各文の（　）に that か what のどちらかを入れなさい。文頭に入る語は大文字で書き始めること。
  q: (1) (＿) I need now is a cup of hot tea.<br>(2) My sister told me (＿) she would be late for dinner.
  ans: (1) What (2) that
  why: (1) は先行詞がなく need の目的語が欠けているので What（文頭なので大文字）。(2) は she would be late for dinner が完全な文なので接続詞の that。told me の後ろの that は省略もできるが、ここでは空所があるので that を入れる。
  trap: (2) で told me の後ろだから「言ったこと」と考え what を入れる誤り。what なら後ろが不完全でなければならない。
- id: q3024
  sec: s12
  set: 章末
  lv: 2
  kind: 読解
  min: 4
  inst: 次の英文を読み、問いの答えとして最も適切なものを1つ選びなさい。
  q: Last spring, our class planted twenty small trees along the river near our school. Many people in town believed the story that the river water was too salty for trees. However, the trees that we planted are now taller than our teacher. Last week a reporter from a local newspaper came to see them. The fact that every tree is still alive surprised her. She wrote an article that was printed on the front page, and now younger students want to plant more trees next year.<br>問　What surprised the reporter?
  choices: [The river water was too salty for trees., The trees were taller than the reporter., The students wrote an article for the newspaper., All of the trees were still alive.]
  ans: "4"
  why: The fact that every tree is still alive surprised her. の that は同格で、fact の中身が「どの木もまだ生きていること」。これが記者を驚かせた。
  trap: ①を選ぶ誤り。the story that the river water was too salty の that も同格だが、これは町の人々が信じていた話で、記者が驚いたことではない。
- id: q3025
  sec: s10
  set: 章末
  lv: 2
  kind: 読解
  min: 4
  q: On Sunday my family had a stall at the flea market in the park. We sold old books and children's clothes. What sold fastest was a box of picture books that my brother no longer reads. A woman bought all twelve books for 600 yen. In the afternoon, it got cloudy, and what was worse, a strong wind blew some of our clothes off the table. Still, we made 4,800 yen in total. We will use what we earned to buy a new tent for our summer camping trip.<br>問　Which of the following is true according to the passage?
  choices: [The family sold all of their clothes., A woman paid 600 yen for twelve picture books., The weather was bad all day., "The family earned 6,000 yen."]
  ans: "2"
  why: What sold fastest was a box of picture books と A woman bought all twelve books for 600 yen から、②が正しい。
  trap: ③を選ぶ誤り。what was worse は午後の出来事を付け足しているだけで、天気が悪くなったのは午後からである。
- id: q3026
  sec: s11
  set: 章末
  lv: 3
  kind: 読解
  min: 4
  q: My grandfather runs a small bakery near the station. He says he owes what he is today to an old baker in Osaka who taught him for five years. When he was young, he was what you call a slow learner, and he often burned the bread. "Flour is to a baker what paint is to an artist," the old baker told him. "Learn how it changes." Now my grandfather can tell how dry the flour is just by touching it. What is more, he still bakes every morning at four.<br>問　What did the old baker mean by his words about flour?
  choices: [A baker works with flour in the same way an artist works with paint., A baker should also learn to paint., Bakers and artists need the same tools., Flour is more expensive than paint.]
  ans: "1"
  why: A is to B what C is to D は「AとBの関係はCとDの関係と同じ」。小麦粉とパン職人の関係は、絵の具と画家の関係と同じだと言っている。
  trap: ③を選ぶ誤り。この形は2つの「関係」が同じだと言っており、パン職人と画家が同じ道具を使うという意味ではない。
- id: q4001
  sec: s13
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: My grandmother, (＿) is 82 years old, still swims twice a week.
  choices: [that, which, who, whose]
  ans: "3"
  why: 先行詞 My grandmother は人で、節の中で is の主語が欠けている。コンマがあるので非制限用法になり、that は使えない。残るのは who。
  trap: 人・主語の欠けた関係詞節なので①that も入ると考えやすい。しかし that は非制限用法では使わない。
- id: q4002
  sec: s13
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  q: Last year Lucy stayed in Okinawa, (＿) she learned to dive.
  choices: [which, where, when, that]
  ans: "2"
  why: コンマの後ろの she learned to dive は主語も目的語もそろった完全な文。場所の Okinawa を受けて「そしてそこで」とつなぐ where が入る。
  trap: 先行詞が地名なので①which を選ぶ誤り。which は節の中で主語や目的語などが欠けた不完全な文のときにしか使えない（@e403 と比べる）。
- id: q4003
  sec: s13
  set: 節末
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部①〜④のうち、誤りを含むものを1つ選びなさい。
  q: "Last week we __visited__① our uncle __in__② Hakodate, and he __took__③ us to see his best friend, __that__④ runs a sushi restaurant near the port."
  ans: "4"
  why: "先行詞 his best friend の後ろにコンマがある非制限用法なので that は使えない。先行詞は人で、runs の主語が欠けているので④を who にする。"
  trap: "「人の先行詞には that も使える」という第1節の表（@s01）だけで判断し、④を正しいと見てしまう誤り。第1節の3つ目の問い（コンマがあるか）を落としている。"
- id: q4004
  sec: s13
  set: 節末
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: 私は傘を電車に置き忘れた。その傘は先月母が買ってくれたものだ。<br>I left my umbrella, ( bought / for / me / mother / my / which ) last month, on the train.
  words: [bought, for, me, mother, my, which]
  ans: I left my umbrella, which my mother bought for me last month, on the train.
  why: 先行詞 my umbrella の後ろにコンマがあるので、非制限用法の which で節を始める。節の中は my mother bought ＿ for me で、bought の目的語が欠けている。
  trap: 制限用法と同じつもりで which を省き、語群の which を使わずに余らせてしまう誤り。非制限用法では目的格の関係代名詞も省略できないので、which は my umbrella, の直後に置く。
- id: q4005
  sec: s13
  set: 節末
  lv: 2
  kind: 和訳
  min: 3
  inst: 次の英文を日本語に訳しなさい。
  q: My uncle has two sons, who both play soccer for their high school team.
  ans: おじには息子が2人いて、2人とも高校のチームでサッカーをしている。
  alt: [おじには息子が2人おり、その2人はどちらも高校のサッカー部でプレーしている。]
  why: コンマがあるので、息子は2人だけで、その2人について情報を付け足していると読む。「息子が2人いて、2人とも〜」と前から訳せているかが採点の要点。
  trap: 「高校のチームでサッカーをしている息子が2人いる」と後ろから訳すと、ほかにも息子がいるように読める。コンマのない文の訳になってしまう。
- id: q4006
  sec: s13
  set: 節末
  lv: 3
  kind: 読解
  min: 4
  inst: 次の英文を読み、内容に合うものを1つ選びなさい。
  q: "Hi Mom,<br>I arrived in Matsumoto on Friday. My host family, the Itos, live near the station. Mr. Ito, who works at a bank, drives me to school every morning. The Itos have two daughters, who both study in Tokyo, so their rooms are empty during the week. Yesterday we went to the castle, where I took a lot of pictures. In the evening we had dinner at a soba restaurant, which Mrs. Ito's brother runs. I'll write again soon.<br>Love,<br>Lucy"
  choices:
  - The Itos have another daughter who lives with them in Matsumoto.
  - Mr. Ito took Lucy to a bank on Friday.
  - Neither of the Itos' daughters lives at home during the week.
  - Mrs. Ito runs a soba restaurant.
  ans: "3"
  why: The Itos have two daughters, who both study in Tokyo はコンマのある非制限用法なので、娘は2人だけで、その2人とも東京で学んでいる。続く so their rooms are empty during the week から、平日はどちらの娘も家にいないと分かる。
  trap: コンマを読み落として「東京で学ぶ娘が2人いる（ほかにもいるかもしれない）」と考え、①を選ぶ。コンマがあるので娘は2人だけである。④は which Mrs. Ito's brother runs の主語を取り違えている（店を営むのは伊藤夫人の兄弟）。
# 第14節（@s14）節末
- id: q4007
  sec: s14
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: Ayaka didn't come to practice yesterday, (＿) surprised everyone on the team.
  choices: [which, what, that, who]
  ans: "1"
  why: チームのみんなを驚かせたのは「アヤカが昨日練習に来なかったこと」という前の内容全体。前の内容を受けられるのはコンマの付いた which。
  trap: 文の主語の Ayaka を先行詞と考え、④who を選ぶ誤り。驚かせたのは人ではなく、来なかったという出来事である。
- id: q4008
  sec: s14
  set: 節末
  lv: 2
  kind: 4択
  min: 1
  q: Our club has 18 members, most of (＿) are first-year students.
  choices: [them, who, which, whom]
  ans: "4"
  why: 先行詞 18 members は人で、前置詞 of の直後なので目的格の whom。most of whom で「そのほとんどは」となる。
  trap: ①them を選ぶ誤り。them にすると Our club has 18 members と most of them are … の2文が接続詞なしでつながり、文として成り立たない。
- id: q4009
  sec: s14
  set: 節末
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部①〜④のうち、誤りを含むものを1つ選びなさい。
  q: Ms. Garcia __gave__① us four handouts __for__② the test, __two of them__③ __were__④ about the history of Yokohama.
  ans: "3"
  why: two of them のままだと、前の文と後ろの文がコンマだけでつながってしまう。関係代名詞を使って two of which にする（and two of them でもよいが、下線部だけでは and を足せない）。
  trap: two of them は「そのうち2枚」という意味が通るので正しいと思いこむ。意味ではなく、2つの文をつなぐ語があるかで判断する。
- id: q4010
  sec: s14
  set: 節末
  lv: 1
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: トムは電車に乗り遅れ、そのせいで会議に遅刻した。<br>Tom missed the train, ( for / him / late / made / which ) the meeting.
  words: [for, him, late, made, which]
  ans: Tom missed the train, which made him late for the meeting.
  why: which は「電車に乗り遅れたこと」という前の内容全体を受け、made の主語になる。make ＋人＋形容詞で「人を〜にする」。
  trap: which を the train だけを指すと考えると、「電車が彼を遅刻させた」と読んでしまう。遅刻の原因は電車ではなく、乗り遅れたことである。
- id: q4011
  sec: s14
  set: 節末
  lv: 2
  kind: 和訳
  min: 3
  inst: 次の英文を日本語に訳しなさい。
  q: My sister passed her driving test on the first try, which made my parents very happy.
  ans: 姉は運転免許の試験に一度で合格し、そのことで両親はとても喜んだ。
  alt: [妹は運転免許の試験に1回目で受かり、それを両親はとても喜んだ。]
  why: which は「一度で試験に合格したこと」を受けている。「そのことで」「それで」のように前の内容全体を指す訳になっていれば正解。sister は姉・妹のどちらでもよい。
  trap: which を直前の the first try や her driving test と考え、「その試験が両親を喜ばせた」と訳す誤り。
- id: q4012
  sec: s14
  set: 節末
  lv: 3
  kind: 読解
  min: 4
  inst: 次の英文を読み、内容に合うものを1つ選びなさい。
  q: In May, Sota's school started a new rule. Students put their phones in a box before lunch and get them back after lunch, which many students did not like at first. Sota's class has 35 students, about half of whom now say they talk with their friends more. Sota found that he finished lunch much faster, which gave him time to practice the guitar. He also borrowed six books from the library, three of which he has already read.
  choices:
  - Most students liked the new rule from the beginning.
  - About half of Sota's class still do not like the rule.
  - Eating lunch more quickly gave Sota time to practice the guitar.
  - Sota has read all six books from the library.
  ans: "3"
  why: he finished lunch much faster, which gave him time to practice the guitar の which は「昼食を早く食べ終えたこと」を受ける。それがギターを練習する時間を生んだ、という内容が③と合う。
  trap: about half of whom の後ろを読み飛ばし、②を選ぶ。半数が言っているのは「友だちと話すことが増えた」で、ルールが嫌いだとは書かれていない。
# 章末
- id: q4013
  sec: s13
