  why: show me の後ろに先行詞がなく、bought の目的語が欠けている。先行詞をふくむ what が入り、「あなたが買ったもの」という名詞節になる。
  trap: ①that を選ぶ誤り。関係代名詞の that には先行詞が要る。接続詞の that なら後ろは完全な文でなければならないが、bought の目的語が欠けている。
- id: q9013
  part: 2
  pts: 3
  sec: s13
  set: 模試
  lv: 2
  kind: 4択
  min: 1
  q: Our new math teacher, (＿) came from Okinawa in April, plays the guitar in a band.
  choices:
  - that
  - what
  - whom
  - who
  ans: '4'
  why: コンマの付いた非制限用法で、先行詞 Our new math teacher は人、came の主語が欠けている。非制限用法・人・主語 → who。
  trap: ①that を選ぶ誤り。that は非制限用法（コンマの後ろ）では使わない。③whom は目的格で、came の主語にはなれない。
- id: q9014
  part: 2
  pts: 3
  sec: s16
  set: 模試
  lv: 2
  kind: 4択
  min: 1
  q: No matter (＿) late you come home, send me a message before you leave the station.
  choices:
  - however
  - what
  - how
  - when
  ans: '3'
  why: 空所の直後に形容詞 late があり、その後に you come home が続く。no matter how＋形容詞・副詞＋S＋V で「どんなに遅く帰っても」となる（＝However late you come home）。
  trap: ①however を選ぶ誤り。no matter の後ろには疑問詞を置き、-ever の付いた語は置かない。④when では late を引き連れられない。
- id: q9015
  part: 2
  pts: 3
  sec: s17
  set: 模試
  lv: 1
  kind: 4択
  min: 1
  q: "The old painting (＿) the experts believed to be a copy turned out to be real."
  choices:
  - which
  - what
  - whom
  - where
  ans: '1'
  why: "the experts believed の後ろに to be a copy が続き、believed の目的語が欠けている（believe O to be C「OをCだと思う」。もとの文は The experts believed the painting to be a copy.）。先行詞 The old painting は人以外で、節の中で目的語の働きをするので which。文全体の動詞は turned out。"
  trap: "believed の目的語が欠けているので目的格の③whom を選ぶ誤り。目的格を選ぶ考え方は正しいが、whom は先行詞が人のときに使う。先行詞は絵（物）なので which になる。"
- id: q9016
  part: 2
  pts: 3
  sec: s18
  set: 模試
  lv: 2
  kind: 4択
  min: 1
  q: Ella packed more clothes for the three-day trip (＿) were really necessary.
  choices:
  - as
  - but
  - than
  - what
  ans: '3'
  why: 先行詞に比較級 more が付いている。than が were necessary の主語の働きをして「本当に必要な量を超える服」となる。
  trap: ①as を選ぶ誤り。as が関係代名詞の働きをするのは such … as や the same … as のときで、比較級 more と組むのは than。
- id: q9017
  part: 3
  pts: 4
  sec: s03
  set: 模試
  lv: 1
  kind: 正誤
  min: 1
  inst: 下線部のうち、誤りを含むものを1つずつ選び、正しい形に直しなさい。
  q: The bag __which__① my uncle __gave__② me __it__③ last month is __too__④ heavy to carry to school.
  choices:
  - ①
  - ②
  - ③
  - ④
  ans: '3'
  fix: "The bag which my uncle gave me last month（it を削除）"
  why: "which が gave の目的語の代わりをしているので、節の中に it を残すと目的語が2つになる。採点の目安（4点）：誤りの下線部の番号が正しければ2点、訂正が正しければ2点。番号が誤っているときは、訂正にも点を与えない。指示文のとおり、語を取り除く訂正は「it を削除」と書く。「削除」の語がなくても、「it を取り除く」「it は不要」のように it を消すことがはっきり分かれば訂正の2点を与える。"
  trap: ④too を選ぶ誤り。too heavy to carry は「重すぎて運べない」で正しい。
- id: q9018
  part: 3
  pts: 4
  sec: s19
  set: 模試
  lv: 2
  kind: 正誤
  min: 1
  q: The cookies __that__① my grandmother __bakes__② every Sunday __is__③ always gone __by__④ Monday morning.
  choices:
  - ①
  - ②
  - ③
  - ④
  ans: '3'
  fix: The cookies … are always gone
  why: 関係詞節 that my grandmother bakes every Sunday を［ ］でくくって外すと、The cookies is always gone が残る。主語は複数の The cookies なので、is を are にする。②bakes は節の中の主語 my grandmother に合っているので正しい。採点の目安（4点）：誤りの下線部の番号が正しければ2点、訂正が正しければ2点。番号が誤っているときは、訂正にも点を与えない。
  trap: is の直前の Sunday や my grandmother に引かれて、単数の is を正しいと思う誤り。文全体の動詞の数は、関係詞節の外にある文頭の主語に合わせる。
- id: q9019
  part: 3
  pts: 4
  sec: s13
  set: 模試
  lv: 2
  kind: 正誤
  min: 1
  q: We stayed at a small hotel near the station, __that__① had __no__② elevator, so we __had to__③ carry our bags __up__④ to the fourth floor.
  choices:
  - ①
  - ②
  - ③
  - ④
  ans: '1'
  fix: a small hotel near the station, which had no elevator
  why: "コンマの後ろの非制限用法なので that は使えない。先行詞 a small hotel は人以外で、had の主語が欠けているので which にする。採点の目安（4点）：誤りの下線部の番号が正しければ2点、訂正が正しければ2点。番号が誤っているときは、訂正にも点を与えない。①を and it に直した … near the station, and it had no elevator も文法上正しい文になるので、訂正の2点を与える。"
  trap: ③had to を「must にすべき」と考えて選ぶ誤り。過去のことなので must の過去の意味を表す had to で正しい。
- id: q9020
  part: 3
  pts: 4
  sec: s14
  set: 模試
  lv: 2
  kind: 正誤
  min: 1
  q: "Yesterday I __talked__① __with__② the two exchange students __from__③ Brazil, __both of them__④ speak Japanese well."
  choices:
  - ①
  - ②
  - ③
  - ④
  ans: "4"
  fix: "the two exchange students from Brazil, both of whom speak Japanese well"
  why: "both of them のままでは、コンマだけで2つの文（I talked … と both of them speak …）をつないでいることになる。先行詞 the two exchange students は人なので④を both of whom にする。採点の目安（4点）：誤りの下線部の番号が正しければ2点、訂正が正しければ2点。番号が誤っているときは、訂正にも点を与えない。④を and both of them、who both に直したものも文法上正しい文になるので、訂正の2点を与える。"
  trap: "talked with を talked to に直すべきだと考えて、②with を選ぶ誤り。talk with も talk to も正しい。both の後ろの speak が複数形で合っているので④を見落としやすいが、問題は動詞の数ではなく、2つの文がコンマだけでつながっていることにある。"
- id: q9021
  part: 3
  pts: 4
  sec: s15
  set: 模試
  lv: 2
  kind: 正誤
  min: 1
  q: __Whomever__① __finishes__② the test first __may__③ leave the room __quietly__④.
  choices:
  - ①
  - ②
  - ③
  - ④
  ans: '1'
  fix: Whoever finishes the test first
  why: 節の中で finishes の主語が欠けているので、主格の Whoever にする。Whoever finishes the test first が文全体の主語になる名詞節である。採点の目安（4点）：誤りの下線部の番号が正しければ2点、訂正が正しければ2点。番号が誤っているときは、訂正にも点を与えない。
  trap: 文頭なので目的格でも主格でもよいと考え、whomever を正しいとする誤り。格は節の中の働きで決まり、主語の位置に whomever は置けない。
- id: q9022
  part: 4
  pts: 4
  sec: s03
  set: 模試
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。文頭に来る語も小文字で示してある。
  q: 父が私に買ってくれた腕時計は、もう動かない。<br>The ( bought / father / for / me / my / watch ) no longer works.
