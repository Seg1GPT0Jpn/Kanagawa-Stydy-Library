  sec: s05
  set: 章末
  lv: 1
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: これが、私が持っているお金のすべてだ。<br>This is ( all / have / I / money / that / the ).
  words: [all, have, I, money, that, the]
  ans: This is all the money that I have.
  why: 先行詞 all the money の後ろに that I have を続ける。all の付いた先行詞なので that が使われている。have の目的語が欠けた形。
  trap: the all money と all を the の後ろに置く誤り。all は the の前に置く。
- id: q1034
  sec: s06
  set: 章末
  lv: 3
  kind: 和訳
  min: 3
  inst: 次の英文を日本語に訳しなさい。
  q: The house in which my grandfather was born, and which he left at the age of fifteen, is now a small museum.
  ans: 祖父が生まれ、15歳で離れた家は、今では小さな博物館になっている。
  alt: [祖父が生まれて15歳のときに出ていった家は、今は小さな博物館だ。]
  why: The house を2つの関係詞節（in which my grandfather was born と which he left at the age of fifteen）が説明し、文の動詞は is。2つ目の which は left の目的語。
  trap: and の後ろを文の続きと読み「祖父はそこで生まれ、15歳で家を出て、今は博物館にいる」のように主語を取りちがえる誤り。
- id: q1035
  sec: s04
  set: 章末
  lv: 2
  kind: 英作
  min: 3
  inst: 下線部の日本語を、関係代名詞を使って英語にし、空所に入れなさい。
  q: 私のおばは、__屋根が赤い家__に住んでいる。<br>My aunt lives in ＿＿＿＿.
  ans: My aunt lives in a house whose roof is red.
  alt: [My aunt lives in a house the roof of which is red., My aunt lives in a house which has a red roof., My aunt lives in a house that has a red roof.]
  why: 「その家の屋根」の持ち主の関係を whose roof で表す。whose の直後の roof には the を付けない。採点の目安：関係代名詞を使って「屋根が赤い家」が表せていれば正解とし、a house the roof of which is red、a house which［that］has a red roof も正解とする。関係代名詞を使わない a house with a red roof は、意味は合っていても指示に合わないので不可。a house whose the roof is red のように whose の後ろに the を付けたものも不可。
  trap: a house which roof is red のように which を使う誤り。which の後ろには欠けた語が要るが、roof is red は欠けていない。
- id: q1036
  sec: s05
  set: 章末
  lv: 2
  kind: 読解
  min: 4
  inst: 次の英文を読み、問いの答えとして最も適切なものを1つ選びなさい。
  q: "Our class held a quiz contest last Friday. There were twenty questions, and my team answered sixteen of them correctly. That was the highest score that any team got that day. The last question was about a river in Africa, and the only student who knew the answer was Daniel. Everything that he said about the river was correct, so our teacher gave him a small prize: a notebook that has a map of the world on its cover.<br>問　Which of the following is true?"
  choices:
  - The writer's team answered all of the twenty questions correctly.
  - Several students knew the answer to the last question.
  - Daniel's team got a map of the world as a prize.
  - No team got a higher score than the writer's team.
  ans: "4"
  why: the highest score that any team got that day（その日に各チームが取った得点の中で最も高い得点）から、筆者のチームより高い得点のチームはない。
  trap: ③を選ぶ誤り。a notebook that has a map of the world on its cover は「表紙に世界地図がついたノート」で、もらったのは地図そのものではなく、チームでもない。
- id: q1037
  sec: s06
  set: 章末
  lv: 2
  kind: 読解
  min: 4
  inst: 次の英文を読み、問いの答えとして最も適切なものを1つ選びなさい。
  q: "Last summer, I stayed with a host family in Canada for three weeks. The house in which they lived stood on a hill near the sea. My room was small, but it had a large window from which I could see boats every morning. The person with whom I talked most was the family's ten-year-old son. He showed me the beach on which he had learned to swim, and we played there almost every evening.<br>問　Which of the following is true?"
  choices:
  - The host family's house was in the center of a busy city.
  - The son learned to swim in a pool near the house.
  - The writer talked most with the mother of the family.
  - The writer could see boats from the window of the room.
  ans: "4"
  why: a large window from which I could see boats every morning は「毎朝ボートが見える大きな窓」。I could see boats from the window の from が which の前に出ている。
  trap: ②を選ぶ誤り。the beach on which he had learned to swim は「彼が泳ぎを覚えた浜辺」で、プールではない。
- id: q1038
  sec: s04
  set: 章末
  lv: 2
  kind: 読解
  min: 4
  inst: 次の英文を読み、問いの答えとして最も適切なものを1つ選びなさい。
  q: "There is a small bike shop near our station. The man who runs it is over seventy, and the shop is full of tools his father used. Customers whose bikes are more than ten years old can get a free check once a year. He says that old bikes people bring him are often better than new ones, because their parts were made to last. Last month, my sister took him the bike she had used for twelve years. He checked it, fixed the brakes in twenty minutes, and did not ask for any money.<br>問　Which of the following is true?"
  choices:
  - The man believes that old bikes are often better than new ones.
  - Only bikes that are less than ten years old can get a free check.
  - The writer's sister bought a new bike at the shop last month.
  - It took the man two hours to fix the brakes on the bike.
  ans: "1"
  why: He says that old bikes people bring him are often better than new ones の old bikes people bring him は接触節で「人々が持ってくる古い自転車」。店主は古い自転車のほうがよいことが多いと言っている。
  ref: s03
  trap: ②を選ぶ誤り。Customers whose bikes are more than ten years old は「自転車が10年より古いお客」で（whose は @s04）、無料点検の対象は古い自転車のほうである。
- id: q2001
  sec: s07
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: The library (＿) I study on Saturdays opens at nine.
  choices: [which, where, when, what]
  ans: "2"
  why: 節 I study on Saturdays は主語と動詞がそろった完全な文で、「その図書館で」という場所の副詞が抜けている。場所の副詞の代わりをするのは where。
  trap: 先行詞 the library が物なので①which を選びやすい。しかし which は節の中で主語や目的語などの代わりをするので、何も欠けていない I study on Saturdays の前には置けない。
- id: q2002
  sec: s07
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  q: I'll never forget the summer (＿) we went camping by the lake with our grandfather.
  choices: [where, which, when, who]
  ans: "3"
  why: 先行詞 the summer は時を表し、節 we went camping … は完全な文。「その夏に」という時の副詞の代わりをするのは when。
  trap: by the lake という場所の語句に目が行き①where を選ぶ誤り。まず後ろが完全な文なので関係副詞だと決め、そのうえで場所か時かを先行詞で決める。by the lake は節の中の語句で、先行詞ではない。先行詞 the summer は時を表すので when になる。
- id: q2003
  sec: s07
  set: 節末
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: 私たちがこの町に引っ越してきた年を覚えていますか。<br>Do you remember ( moved / the / to / we / when / year ) this town?
  words: [moved, the, to, we, when, year]
  ans: Do you remember the year when we moved to this town?
  why: 先行詞 the year の直後に when を置き、その後に完全な文 we moved to this town を続ける。when は in that year の代わりをしている。
  trap: Do you remember when we moved to the year … のように、when を remember の直後に置いてしまう誤り。year が余り、文が成り立たなくなる。
- id: q2004
  sec: s07
  set: 節末
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部のうち、誤りを含むものを1つ選びなさい。
  q: "It was __already__① dark __when__② we __got__③ to Nikko, so we went straight to the inn __when__④ my parents had stayed twenty years before."
  choices: [①, ②, ③, ④]
  ans: "4"
  why: "先行詞 the inn は場所を表す。節 my parents had stayed twenty years before は、stay が目的語をとらない動詞なので、主語と動詞がそろえば何も欠けていない完全な文になる。後ろが完全な文なので関係副詞を使い、先行詞が場所なので where（または at which）にする。④の when を where に直す。②の when は「〜したとき」の接続詞で、It was already dark when we got to Nikko は正しい。"
  trap: "when が2つあるので②を疑い、④は twenty years before という時の語句に引かれて when でよいと考える誤り。関係副詞を使うかどうかは後ろの文が完全かで決まり、where か when かは先行詞の意味で決まる。節の中の時の語句では決まらない。"
- id: q2005
  sec: s07
  set: 節末
  lv: 3
  kind: 和訳
  min: 3
  inst: 次の英文を日本語に訳しなさい。
  q: The year I spent in Canada was when I first became interested in foreign languages.
  ans: 私がカナダで過ごした1年は、私が初めて外国語に興味を持った時期だった。
  alt: [カナダで過ごした1年間は、私が初めて外国語に興味を持ったときだった。]
  why: The year の後ろには which／that が省かれ、spent の目的語が欠けている（「過ごした1年」）。was の後ろの when 節は先行詞 the time が省かれた形で「〜した時期」と訳す。この2点がとれていれば可。
  trap: The year の後ろに when が省かれたと考えて「私がカナダで過ごした年に」と副詞のように訳す誤り。spent の目的語がないので、The year は節の中で目的語の位置にある。
- id: q2006
  sec: s07
  set: 節末
  lv: 2
  kind: 読解
  min: 4
  inst: 次の英文を読んで、問いの答えとして最も適切なものを1つ選びなさい。
  q: "Last October, Haruto's class went on a three-day trip to Nagasaki. On the first day, they visited a hill where an old church stands. Haruto liked the second day best. That was the day when they took a small boat around the bay. The guide showed them the place where ships from other countries arrived long ago. On the last day, it rained, so they spent the morning in a museum. In his diary, Haruto wrote, “The second day was when I learned the most.”<br>問　What did Haruto's class do on the day Haruto liked best?"
  choices: [They visited an old church on a hill., They stayed in a museum because of the rain., They went around the bay by boat., They went to Nagasaki Station to meet the guide.]
  ans: "3"
  why: Haruto liked the second day best. That was the day when they took a small boat around the bay. とあり、2日目に船で湾を回った。the day when … が「〜した日」を表す。
  trap: 本文の最初に出てくる a hill where an old church stands に引かれて①を選ぶ誤り。教会を訪れたのは1日目で、ハルトがいちばん気に入ったのは2日目である。

# ---------- s08 節末 ----------
- id: q2007
  sec: s08
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
  q: Can you tell me the reason (＿) you didn't come to practice yesterday?
  choices: [why, how, where, which]
  ans: "1"
  why: 先行詞 the reason の後ろに完全な文 you didn't come to practice yesterday が続く。理由を表す関係副詞は why。
  trap: 先行詞が物（the reason）なので④which を選ぶ誤り。which は節の中で主語や目的語などの代わりをするが、この節には欠けている語がない。
- id: q2008
  sec: s08
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  q: This is (＿) I make rice balls in only five minutes.
  choices: [the way how, what, which, how]
  ans: "4"
  why: 「これが〜するやり方だ」は This is how S V。how の後ろの I make rice balls … は完全な文。
  trap: ①the way how を選ぶ誤り。今の英語では the way と how を並べず、the way か how の一方だけを使う。
- id: q2009
  sec: s08
  set: 節末
  lv: 2
  kind: 整序
  min: 2
  inst: 日本語の意味になるように（　）内の語を並べかえなさい。
  q: 母のカレーの作り方は、祖母の作り方とは違う。<br>( curry / makes / mother / my / the / way ) is different from my grandmother's.
  words: [curry, makes, mother, my, the, way]
  ans: The way my mother makes curry is different from my grandmother's.
  why: 「母がカレーを作るやり方」は the way の後ろに完全な文 my mother makes curry を続ける。how がないので the way S V の形にする。
  trap: 「やり方」に how が必要だと考え、語が足りないと迷う誤り。the way の後ろの how は使わないので、与えられた語だけで文ができる。
- id: q2010
  sec: s08
  set: 節末
  lv: 2
  kind: 正誤
  min: 1
  inst: 下線部のうち、誤りを含むものを1つ選びなさい。
  q: My grandfather __grows__① such sweet tomatoes __in__② his small garden, and I want to learn __the way how__③ he __does__④ it.
  choices: [①, ②, ③, ④]
  ans: "3"
  why: the way how は使わない。the way he does it か how he does it に直す。
  trap: ④does を「grows でなければおかしい」と考えて選ぶ誤り。does it は前の grows such sweet tomatoes を言いかえた代動詞で正しい。
- id: q2011
  sec: s08
  set: 節末
  lv: 2
  kind: 英作
  min: 3
  inst: 次の日本語を英語にしなさい。ただし why を使うこと。
  q: バスが来なかった。だから私たちは駅まで歩いた。
  ans: The bus didn't come. That's why we walked to the station.
  alt: [The bus did not come. That is why we walked to the station., The bus didn't come. This is why we walked to the station.]
  why: 「だから〜」は That's why S V で表す。前の文（バスが来なかった）が理由、why 節（駅まで歩いた）が結果になる向きで書けていれば可。
  trap: That's because we walked to the station. と書く誤り。because の後ろには理由がくるので、「それは駅まで歩いたからだ」と逆の意味になる。
- id: q2012
  sec: s08
  set: 節末
  lv: 2
  kind: 読解
  min: 4
  inst: 次の英文を読んで、問いの答えとして最も適切なものを1つ選びなさい。
  q: "Ms. Brown, an English teacher, made a new rule this year. Before each lesson, students put their phones in a box by the door. Many students asked her the reason why she made the rule. She said that students cannot focus well when their phones are on their desks. At first, nobody liked it. But after a month, Riku said, “I like the way we talk in class now. We really listen to each other.” That is why Ms. Brown plans to keep the rule next year.<br>問　Why does Ms. Brown plan to keep the rule next year?"
  choices:
  - Because many students asked her to explain the rule.
  - Because the rule has changed the way students talk to each other in class.
  - Because nobody liked the rule at first.
  - Because students can focus well with their phones on their desks.
  ans: "2"
  why: 最後の That is why … の That は、直前のリクの発言（I like the way we talk in class now. We really listen to each other.）を指す。授業での話し方が変わったことがルールを続ける理由で、②はそれを言いかえている。
  trap: 本文の asked her the reason why she made the rule に引かれて①を選ぶ誤り。生徒がたずねたのはルールを作った理由で、ルールを続ける理由ではない。①と③は本文にある事実だが、That is why の That が指す内容ではない。

# ---------- s09 節末 ----------
- id: q2013
  sec: s09
  set: 節末
  lv: 1
  kind: 4択
  min: 1
  inst: （　）に入る最も適切なものを1つ選びなさい。
